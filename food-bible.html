<style>
/* ─────────────────────────────────────────────────────────────────────────
   ONE DISH = ONE A4. Everything the floor needs is on the page at once: no
   tabs, no scrolling to find the allergens, nothing that opens. It is sized in
   millimetres so what is on screen is exactly what comes out of the printer.
   Georgia and the system sans stand in for Cormorant Garamond and DM Sans,
   which cannot load on a hosted page.
   ───────────────────────────────────────────────────────────────────────── */
:root{
  --sabbia:#e1d3c2;--sabbia-light:#ede5d8;--sabbia-dark:#cfc0ad;
  --vino:#410207;--vino-mid:#5e0a10;--vino-deep:#2b0104;--vino-light:#7a1218;
  --oliva:#4b5128;--oro:#ba9b02;--oro-light:#d9bd3f;--ink:#2a1a10;--cream:#f5ede0;
  --paper:#fbf7f0;
  --serif:Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"],:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#cdbba6;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--oro);outline-offset:2px}
img{display:block;max-width:100%}

/* the desk the page sits on — screen only */
.desk{padding:22px 16px 60px;display:flex;flex-direction:column;align-items:center;gap:16px}
.stale{color:var(--oro)}
/* inside the Recipes module the shell picks the dish, so the walk-through goes */
.embed #prev,.embed #next{display:none}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;width:100%;max-width:210mm}
.tools .btn{background:var(--vino);color:var(--cream);border:none;border-radius:3px;font-family:var(--sans);
  font-size:10.5px;letter-spacing:2px;text-transform:uppercase;font-weight:700;padding:0 18px;height:44px;cursor:pointer}
.tools .btn.ghost{background:rgba(255,255,255,.5);color:var(--vino);border:1px solid var(--sabbia-dark)}
.tools .lab{font-size:11px;letter-spacing:2.2px;text-transform:uppercase;color:var(--vino);opacity:.75;margin-right:auto}

/* ══════════════ THE A4 PAGE ══════════════ */
.sheet{
  width:210mm;min-height:297mm;background:var(--paper);color:var(--ink);
  /* 7mm at the foot, not 8. Written out full, the page came to 297.37mm — a third of
     a millimetre past the paper, all of it empty padding, which Chrome still pays for
     with a second almost-blank sheet in every binder. Measured, not guessed. */
  padding:10mm 12mm 7mm;display:flex;flex-direction:column;gap:3.8mm;
  box-shadow:0 3mm 12mm rgba(43,1,4,.28);position:relative
}
/* the running head: where this page lives in the book */
.rh{display:flex;align-items:baseline;gap:4mm;border-bottom:.4mm solid var(--vino);padding-bottom:2mm}
.rh .code{font-size:8pt;letter-spacing:2.6px;font-weight:700;color:var(--oro)}
.rh .cat{font-size:8pt;letter-spacing:2.6px;text-transform:uppercase;font-weight:600;color:var(--vino-light)}
.rh .house{margin-left:auto;font-family:var(--serif);font-size:9pt;font-style:italic;color:var(--vino-light)}

/* photograph — the pitch, before a single word */
.shot{position:relative;height:58mm;overflow:hidden;background:var(--vino-deep);flex:0 0 auto}
.shot img{width:100%;height:100%;object-fit:cover}
.shot .none{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2mm;
  color:rgba(245,237,224,.62);text-align:center;padding:6mm}
.shot .none b{font-family:var(--serif);font-weight:400;font-size:14pt;color:rgba(245,237,224,.8)}
.shot .none span{font-size:7.5pt;letter-spacing:2.4px;text-transform:uppercase}
.shot .cred{position:absolute;right:2.5mm;bottom:2mm;font-size:6.5pt;letter-spacing:1.6px;text-transform:uppercase;
  color:rgba(245,237,224,.8);text-shadow:0 0 3mm rgba(43,1,4,.9)}

/* the name, and the menu line exactly as a guest reads it */
.title{display:flex;flex-direction:column;gap:1.5mm}
.title h1{font-family:var(--serif);font-weight:400;margin:0;font-size:27pt;line-height:.96;color:var(--vino)}
.title .desc{font-family:var(--serif);font-style:italic;font-size:11.5pt;line-height:1.3;color:var(--ink);max-width:150mm}

/* the middle: what he says, and what it is */
.mid{display:grid;grid-template-columns:1fr 62mm;gap:6mm;flex:1 1 auto;align-items:start}
.say{background:var(--vino);color:var(--cream);padding:5mm 5.5mm;display:flex;flex-direction:column;gap:2.5mm}
.say .lab{font-size:7.5pt;letter-spacing:2.8px;text-transform:uppercase;font-weight:700;color:var(--oro-light)}
.say q{font-family:var(--serif);font-size:13.5pt;line-height:1.4;quotes:'“' '”';display:block}
.story{margin-top:4mm}
.lab{font-size:7.5pt;letter-spacing:2.8px;text-transform:uppercase;font-weight:700;color:var(--vino-light);
  display:block;margin-bottom:1.8mm}
.prose{font-family:var(--serif);font-size:10pt;line-height:1.5;max-width:96mm}
.side{border-left:.3mm solid var(--sabbia-dark);padding-left:5mm;display:flex;flex-direction:column;gap:4mm}
.lst{list-style:none;margin:0;padding:0}
.lst li{font-size:9.5pt;line-height:1.35;padding:1.4mm 0;border-bottom:.2mm solid rgba(207,192,173,.7)}
.lst li:last-child{border-bottom:none}
.todo{font-family:var(--serif);font-style:italic;font-size:9.5pt;line-height:1.5;color:#93826c}

/* the two strips that must never be hunted for */
.strips{display:flex;flex-direction:column;gap:3.5mm;flex:0 0 auto}
.strip{border-top:.4mm solid var(--vino);padding-top:2.5mm}
.chips{display:flex;flex-wrap:wrap;gap:1.5mm}
.chip{font-size:8.5pt;line-height:1;padding:2mm 3mm;border:.25mm solid var(--sabbia-dark);border-radius:1mm;
  color:#93826c;background:none}
.chip.hit{background:var(--vino);border-color:var(--vino);color:var(--cream);font-weight:700}
.cut .c{font-size:8.5pt;line-height:1;padding:2mm 3mm;border:.25mm solid var(--sabbia-dark);border-radius:1mm;color:#93826c}
.cut .c.set{border-color:var(--oliva);background:var(--oliva);color:var(--cream);font-weight:600}
.unknown{font-family:var(--serif);font-style:italic;font-size:10pt;line-height:1.45;color:var(--vino);
  border-left:1mm solid var(--vino);padding-left:3mm}
.foot{display:flex;align-items:baseline;gap:3mm;font-size:7pt;letter-spacing:1.8px;text-transform:uppercase;
  color:#a3907a;border-top:.2mm solid var(--sabbia-dark);padding-top:2mm;flex:0 0 auto}
.foot .r{margin-left:auto}
.sample{font-size:6.5pt;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--oro);
  border:.25mm solid var(--oro);border-radius:.8mm;padding:.8mm 1.6mm;margin-left:2mm;white-space:nowrap}
.say .sample{color:var(--oro-light);border-color:var(--oro-light)}

/* ══ small screens: the same page, same order, reflowed so it stays readable.

/* Opened from the restaurant this is the live database. Opened from a hosted link —
   where a page is not allowed to call an outside host — the same code answers out of
   the snapshot built into the file, and the page says so at the top. Never a silent
   fallback: a Food Bible quietly showing last week's allergens is the worst page in
   the building. */
function sb(path){
  if (frozen) return Promise.resolve(local(path));
  return fetch(SB_URL + '/rest/v1/' + path, {
    headers:{ apikey:SB_KEY, Authorization:'Bearer ' + SB_KEY }
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){ throw new Error(t || ('HTTP ' + r.status)); });
    return r.json();
  }).catch(function(e){
    if (!SNAP) throw e;
    frozen = true;
    return local(path);
  });
}
/* Answers exactly the handful of queries this page asks, and nothing else. */
function local(path){
  var q = path.split('?'), table = q[0], p = {};
  (q[1] || '').split('&').forEach(function(kv){
    var i = kv.indexOf('='); if (i > 0) p[kv.slice(0,i)] = kv.slice(i+1);
  });
  var rows = (table === 'recipes' ? SNAP.recipes : SNAP.lines).slice();
  if (p.kind === 'eq.main') rows = rows.filter(function(r){ return r.kind === 'main'; });
  if (p.archived === 'is.false') rows = rows.filter(function(r){ return !r.archived; });
  if (p.order === 'section,name') rows.sort(function(a,b){
    return (a.section||'').localeCompare(b.section||'') || (a.name||'').localeCompare(b.name||''); });
  return rows;
}

/* When the page is reading a snapshot it has to say when that snapshot was taken —
   in plain words, not an ISO string nobody parses at a service briefing. */
function stamp(){
  if (!SNAP || !SNAP.at) return 'at build time';
  var d = new Date(SNAP.at);
  if (isNaN(d)) return 'at build time';
  return d.toLocaleDateString(undefined, { day:'numeric', month:'long' }) + ', ' +
         d.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
}

function lines(v){
  return String(v || '').split(/\r?\n/).map(function(x){ return x.trim(); }).filter(Boolean);
}

/* A dish carries what its batches carry. The chef ticks fish on the stock, not on
   every dish the stock goes into, so a page that showed only the dish's own ticks
   would tell a guest a tuna sauce is fish-free. Walked all the way down, with a
   guard against a batch that somehow contains itself. */
function withInherited(dishId, own, LINKS, ALL){
  var out = (own || []).slice(), seen = {};
  (function walk(id){
    if (!id || seen[id]) return;
    seen[id] = 1;
    ((ALL[id] && ALL[id].allergens) || []).forEach(function(k){
      if (out.indexOf(k) < 0) out.push(k);
    });
    (LINKS[id] || []).forEach(walk);
  })(dishId);
  return out;
}

function fromRecipe(rec, allergens){
  var m = rec.method || {};
  return {
    id:rec.id,
    code:(m.code || '').trim(),
    cat:rec.section || '',
    name:rec.name || 'Untitled',
    desc:(m.foh || '').trim(),
    photo:(rec.photos && rec.photos[0] && (rec.photos[0].u || rec.photos[0])) || null,
    cred:'',
    say:(m.say || '').trim(),
    story:(m.story || '').trim(),
    ing:lines(m.ing),
    garnish:lines(m.garnish),
    more:(m.more || '').trim(),
    allergens:allergens,
    cutlery:Array.isArray(m.cutlery) ? m.cutlery : [],
    sample:{}
  };
}

/* the one page written out in full, so the template can still be judged full
   rather than empty. Every word of it is mine, and it says so on the page. */
var SAMPLE = { code:'CR01', cat:'Starter / Crudo', name:'Ricciola',
  desc:'Yellow tail carpaccio, purple cabbage dressing, dill oil',
  photo:'crudo', cred:'The crudo counter, Roberto’s DIFC — a stand-in, not the plate', isSample:true,
  say:'Yellowtail sliced thin and dressed at the crudo counter — sweet from the purple cabbage, then the dill lifts it. The lightest way to start.',
  sample:{all:true},
  story:'Ricciola is the fish southern Italy eats raw before it does anything else with it. Ours comes in whole and is broken down at the counter each morning, so what you see on the marble is what goes on the plate. The purple cabbage is pressed for its juice rather than pickled, which keeps the sweetness without the sharpness, and the dill oil is made in house. It is the first dish on the menu because it is how a Roberto’s dinner is meant to begin: cold, clean, and unmistakably from the sea.',
  ing:['Yellow tail (ricciola)','Purple cabbage dressing','Dill oil','Amalfi lemon','Maldon salt','Extra virgin olive oil'],
  garnish:['Dill tips','Cabbage shoots','Lemon zest'],
  more:'Dressed to order, so it goes out within two minutes of the ticket — do not hold it. If a guest asks for it without the dressing, it comes with lemon and oil instead. Best with a glass of Fiano or a dry Franciacorta.',
  allergens:['fish'],
  cutlery:['Starter fork','Starter knife'] };

var DISHES = [], loadErr = null, busy = true;

function load(){
  return Promise.all([
    sb('recipes?kind=eq.main&archived=is.false&select=id,name,section,method,allergens,photos&order=section,name'),
    sb('recipes?select=id,allergens'),
    sb('recipe_lines?select=recipe_id,child_recipe_id')
  ]).then(function(res){
    var ALL = {}, LINKS = {};
    res[1].forEach(function(r){ ALL[r.id] = r; });
    res[2].forEach(function(l){
      if (l.child_recipe_id) (LINKS[l.recipe_id] = LINKS[l.recipe_id] || []).push(l.child_recipe_id);
    });
    DISHES = res[0].map(function(rec){
      return fromRecipe(rec, withInherited(rec.id, rec.allergens, LINKS, ALL));
    });
    DISHES.push(SAMPLE);           /* always last: what a finished page looks like */
    busy = false;
  }).catch(function(e){
    loadErr = e.message; busy = false;
    DISHES = [SAMPLE];
  });
}

var idx = 0;

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function mark(on){ return on ? '<span class="sample">Sample</span>' : ''; }
function sm(d,k){ return !!(d.sample && (d.sample.all || d.sample[k])); }
function todo(t){ return '<div class="todo">'+esc(t)+'</div>'; }

function sheet(d){
  /* A real dish carries its own photograph, taken on the create screen and stored
     with the recipe. The written-out sample still borrows a venue picture, because
     no dish has been photographed yet — and it says SAMPLE on the page so nobody
     mistakes the crudo counter for the plate. */
  var img = !d.photo ? null
          : (/^data:/.test(d.photo) ? d.photo : PH[d.photo] || null);
  return '<div class="sheet">' +

    '<div class="rh">' +
      (d.code?'<span class="code">'+esc(d.code)+'</span>':'') +
      '<span class="cat">'+esc(d.cat)+'</span>' +
      '<span class="house">Roberto’s DIFC &nbsp;·&nbsp; Food Bible 2026</span>' +
    '</div>' +

    '<div class="shot">' +
      (img ? '<img src="'+img+'" alt="'+esc(d.name)+'"><span class="cred">'+esc(d.cred||'')+'</span>'
           : '<div class="none"><b>No photograph yet</b><span>the dish photo goes here</span></div>') +
    '</div>' +

    '<div class="title"><h1>'+esc(d.name)+'</h1>' +
      (d.desc ? '<div class="desc">'+esc(d.desc)+'</div>'
              : '<div class="desc" style="color:#93826c">The menu line is not written yet.</div>') +
    '</div>' +

    '<div class="mid">' +
      '<div>' +
        '<div class="say"><span class="lab">Say it like this'+mark(sm(d,'say'))+'</span>' +
          (d.say ? '<q>'+esc(d.say)+'</q>'
                 : '<q style="opacity:.55">One sentence, in his own words, that sells the dish at the table.</q>') +
        '</div>' +
        '<div class="story"><span class="lab">The story</span>' +
          (d.story ? '<div class="prose">'+esc(d.story)+'</div>'
                   : todo('Where it comes from, why it is on the menu, what makes it ours. Not written yet.')) +
        '</div>' +
      '</div>' +
      '<div class="side">' +
        '<div><span class="lab">What is in it'+mark(sm(d,'ing'))+'</span>' +
          (d.ing.length ? '<ul class="lst">'+d.ing.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>'
                        : todo('Not written yet.')) + '</div>' +
        '<div><span class="lab">Garnish</span>' +
          (d.garnish.length ? '<ul class="lst">'+d.garnish.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>'
                            : todo('Not written yet.')) + '</div>' +
        '<div><span class="lab">More information</span>' +
          (d.more ? '<div class="prose" style="font-size:9.5pt">'+esc(d.more)+'</div>'
                  : todo('Not written yet.')) + '</div>' +
      '</div>' +
    '</div>' +

    '<div class="strips">' +
      /* An untouched allergen row and a genuinely allergen-free dish look identical,
         and this is the one field on the page that can hurt somebody. So when
         nothing has been ticked the page refuses to imply an answer: the chips go,
         and it says plainly that it does not know yet. */
      '<div class="strip"><span class="lab">Allergens'+mark(sm(d,'allergens'))+'</span>' +
        (d.allergens.length
          ? '<div class="chips">' + ALLERGENS.map(function(a){
              return '<span class="chip'+(d.allergens.indexOf(a.k)>=0?' hit':'')+'">'+esc(a.t)+'</span>'; }).join('') + '</div>'
          : '<div class="unknown">Not ticked yet — this page cannot answer an allergy question. ' +
            'Ask the kitchen before you serve it.</div>') + '</div>' +
      '<div class="strip"><span class="lab">Mise en place — what to set'+mark(sm(d,'cutlery'))+'</span>' +
        '<div class="chips cut">' + CUTLERY.map(function(c){
          return '<span class="c'+(d.cutlery.indexOf(c)>=0?' set':'')+'">'+esc(c)+'</span>'; }).join('') + '</div></div>' +
    '</div>' +

    '<div class="foot"><span>' +
      (d.allergens.length ? 'Filled in = the dish contains it' : 'No allergens ticked on this recipe yet') +
      '</span><span class="r">Ticked by the chef on the recipe — never guessed</span></div>' +
  '</div>';
}

function render(){
  var root = document.getElementById('root');
  if (busy){
    root.innerHTML = '<div class="desk"><div class="tools noprint">' +
      '<span class="lab">Reading the recipes…</span></div></div>';
    return;
  }
  if (idx >= DISHES.length) idx = 0;
  var d = DISHES[idx];
  root.innerHTML =
    '<div class="desk">' +
      '<div class="tools noprint">' +
        '<span class="lab" style="margin:0 auto 0 0">' +
          (loadErr ? 'Could not read the recipes — ' + esc(loadErr)
                   : 'One dish, one A4' +
                     /* the counter belongs to the walk-through; inside the Recipes
                        module the walk is gone, so "1 of 3" would count nothing */
                     (embedded ? '' : ' &nbsp;·&nbsp; ' + (idx+1) + ' of ' + DISHES.length) +
                     (d.isSample ? ' &nbsp;·&nbsp; a finished page, written by me' : '') +
                     (frozen && SNAP ? ' &nbsp;·&nbsp; <b class="stale">as the recipes stood ' + esc(stamp()) + '</b>' : '')) +
        '</span>' +
        '<button class="btn ghost" id="prev">&larr;</button>' +
        '<button class="btn ghost" id="next">' + esc(DISHES[(idx+1)%DISHES.length].name) + ' &rarr;</button>' +
        '<button class="btn" id="print">Print this page</button>' +
      '</div>' +
      sheet(d) +
    '</div>';
}

document.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('button') : null;
  if (!b) return;
  if (b.id==='print'){ window.print(); return; }
  if (b.id==='next'){ idx = (idx+1) % DISHES.length; render(); window.scrollTo(0,0); return; }
  if (b.id==='prev'){ idx = (idx-1+DISHES.length) % DISHES.length; render(); window.scrollTo(0,0); return; }
});

/* ── opened from the Recipes module ──
   `?id=` opens that dish's page; `&embed=1` drops the prev/next walk because the
   module already owns which dish you are looking at. Print always stays. */
var Q = new URLSearchParams(location.search);
var embedded = Q.get('embed') === '1';
if (embedded) document.documentElement.classList.add('embed');

render();
load().then(function(){
  var want = Q.get('id');
  if (want){
    var i = DISHES.findIndex(function(d){ return d.id === want; });
    if (i > -1) idx = i;
    else { loadErr = 'that dish is not on the menu any more'; }
  }
  render();
});
</script>
