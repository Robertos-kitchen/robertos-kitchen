<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Learning — Roberto's Kitchen</title>
<!-- Before any code below can call fetch(): on the DEV host this blocks every write. -->
<script src="dev-guard.js?v=1789747927"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=DM+Sans:wght@400;500;700&display=swap');
:root{
  --sabbia:#e1d3c2;--sabbia-light:#ede5d8;--sabbia-dark:#cfc0ad;
  --vino:#410207;--vino-mid:#5e0a10;--terra:#c0481f;--oliva:#4b5128;
  --ink:#2a1a10;--cream:#f5ede0;--paper:#fbf7f1;--door:#f4ede2;--muted:#4e4037;
  --ok:#2f5d1e;--ok-bg:#e4ecd9;--below:#7a4200;--below-bg:#f6e6cc;--err:#8f1d12;--err-bg:#fbe9e6;
  --display:'Bodoni Moda',Didot,'Times New Roman',serif;
  --sans:'DM Sans',-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px}
body{background:linear-gradient(90deg,rgba(196,168,133,.28) 1px,transparent 1px) 0 0/80px 100%,
  radial-gradient(circle at 86% 0,rgba(217,118,63,.12),transparent 520px),var(--paper);min-height:100vh}
button,input,select,textarea{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--terra);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 48px;display:grid;gap:16px}
h2{font-family:var(--display);font-weight:400;color:var(--vino);font-size:28px;margin:0;line-height:1.15}
h3{font-family:var(--display);font-weight:400;color:var(--vino);font-size:22px;margin:0;line-height:1.2}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.me{font-size:13.5px;color:var(--muted)}
.me b{color:var(--ink)}
.link{background:none;border:none;color:var(--vino);text-decoration:underline;cursor:pointer;font-size:13.5px;padding:8px 4px;min-height:40px}
.back{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--vino);background:var(--sabbia-light);
  border:1px solid var(--sabbia-dark);border-radius:3px;padding:9px 12px;cursor:pointer;min-height:40px;justify-self:start}
.card{background:#fff;border:1px solid rgba(66,1,7,.13);border-radius:10px;padding:16px;display:grid;gap:12px}
.sign{max-width:420px}
.sign label{font-weight:700;color:var(--vino)}
.sign input{font-size:22px;letter-spacing:4px;padding:12px;border:1px solid var(--sabbia-dark);border-radius:6px;width:100%;background:var(--paper)}
.btn{border:none;border-radius:6px;padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer;background:var(--vino);color:var(--cream);min-height:48px}
.btn.ghost{background:transparent;color:var(--vino);border:1px solid var(--sabbia-dark)}
.btn.go{background:var(--ok);color:#fff}
.btn.sm{padding:9px 13px;font-size:13.5px;min-height:40px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.msg{font-size:14px;font-weight:500;line-height:1.5}
.msg.bad{color:var(--err)} .msg.ok{color:var(--ok)}
.topics{display:grid;gap:10px}
.topic{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;text-align:left;width:100%;
  background:#fff;border:1px solid rgba(66,1,7,.13);border-radius:10px;padding:14px;cursor:pointer;min-height:64px}
.topic:hover{border-color:var(--terra)}
.topic[disabled]{cursor:default;background:var(--door)}
.topic[disabled]:hover{border-color:rgba(66,1,7,.13)}
.num{font-family:var(--display);font-size:24px;color:var(--vino);width:34px;text-align:center}
.tname{font-family:var(--display);font-size:19px;color:var(--vino);line-height:1.2}
.tsum{font-size:13px;color:var(--muted);line-height:1.45;grid-column:2}
.pill{font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;border-radius:3px;padding:5px 8px;white-space:nowrap;grid-row:1/span 2;grid-column:3}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-below{background:var(--below-bg);color:var(--below)}
.p-none{background:var(--sabbia-light);color:var(--muted)} .p-exp{background:var(--err-bg);color:var(--err)}
.page{background:#fff;border:1px solid rgba(66,1,7,.13);border-radius:10px;padding:18px;display:grid;gap:12px}
.page img{width:100%;max-height:360px;object-fit:cover;border-radius:6px}
.body{white-space:pre-wrap;line-height:1.65;font-size:15.5px;max-width:68ch}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dots{font-size:13px;color:var(--muted)}
.qcard{background:#fff;border:1px solid rgba(66,1,7,.13);border-radius:10px;padding:18px;display:grid;gap:12px}
.qtext{font-size:19px;line-height:1.4;font-weight:500}
.choice{display:block;width:100%;text-align:left;padding:14px;border:1px solid var(--sabbia-dark);border-radius:8px;background:var(--paper);cursor:pointer;font-size:15.5px;line-height:1.4;min-height:52px}
.choice.on{background:var(--vino);color:var(--cream);border-color:var(--vino)}
/* Photographs of the plate beside its name: nobody on the team knows "CMS Cera Flat
   rectangular plate 320x120 mm", everybody knows it when they see it (Chef Andrea, 22 Sep 2026). */
.choice.pic{display:flex;align-items:center;gap:14px;padding:10px 14px}
.shots{display:flex;gap:6px;flex:none}
.shots img{width:84px;height:84px;object-fit:contain;background:#fff;border:1px solid var(--sabbia-light);border-radius:6px;display:block}
.res .shots img,.item .shots img{width:64px;height:64px}
.pline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nopic{font-size:12.5px;color:var(--below);background:var(--below-bg);border-radius:4px;padding:2px 7px}
@media (max-width:480px){.shots img{width:64px;height:64px}}
.bar{height:6px;background:var(--sabbia-light);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--oliva)}
.score{font-family:var(--display);font-size:44px;color:var(--vino);line-height:1}
.res{border-left:4px solid var(--err);background:#fff;border-radius:6px;padding:12px 14px;display:grid;gap:6px}
.res.right{border-left-color:var(--ok)}
.res .q{font-weight:500}
.res .you{color:var(--err)} .res .ans{color:var(--ok);font-weight:700} .res .why{color:var(--muted);font-size:13.5px}
details{font-size:13.5px;color:var(--muted)} details summary{cursor:pointer;color:var(--vino);min-height:36px;padding-top:8px}
details p{line-height:1.6;max-width:65ch}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--sabbia-dark);background:#fff;border-radius:18px;padding:9px 14px;cursor:pointer;font-size:13.5px;min-height:40px}
.tab.on{background:var(--vino);color:var(--cream);border-color:var(--vino)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,.in,textarea{border:1px solid var(--sabbia-dark);border-radius:6px;padding:10px;font-size:14.5px;background:#fff}
textarea{width:100%;min-height:80px;line-height:1.5}
.in{width:100%}
.item{background:#fff;border:1px solid rgba(66,1,7,.13);border-radius:10px;padding:14px;display:grid;gap:8px}
.meta{font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.meta b{color:var(--vino)}
.iq{font-weight:500;font-size:16px;line-height:1.4}
.ia{color:var(--ok);font-weight:700}
.iw{color:var(--muted);font-size:14px}
.note{background:var(--below-bg);color:var(--below);border-radius:6px;padding:8px 10px;font-size:13.5px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;gap:8px}
.lbl{font-size:12px;font-weight:700;color:var(--vino);letter-spacing:.5px}
.gap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;border-bottom:1px solid var(--sabbia-light);padding:8px 0;font-size:14px}
.gap small{color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{border-bottom:1px solid var(--sabbia-light);padding:8px 6px;text-align:left;vertical-align:top}
.tbl th{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--vino)}
.scroll{overflow-x:auto}
.empty{background:#fff;border:1px dashed var(--sabbia-dark);border-radius:8px;padding:16px;color:var(--muted);line-height:1.6}
[hidden]{display:none!important}
@media (max-width:520px){.topic{grid-template-columns:minmax(0,1fr)}.num{display:none}.tname,.tsum{grid-column:1}.pill{grid-column:1;grid-row:auto;justify-self:start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root" class="wrap"><div class="me">Loading…</div></div>
<script>
/* ════════════════════════════════════════════════════════════════════════════
   LEARNING — Chef Andrea's learning section, built 22 Sep 2026 to his answers in the
   feedback round `learning-andrea`.

   · Sign in with your employee ID (Andrea: "a login to start the test"). What you see
     depends on your job title in the staff list: commis, CDP, or senior (sous chef and
     above). Senior-only topics are hidden from the rest.
   · A topic is one or two short pages, then a test: 5 questions picked at random from the
     topic's bank, 4 choices each, shuffled every time. 4 of 5 passes, retakes unlimited,
     best score kept. Food Safety expires after 12 months.
   · The test is marked in the database (learn_finish), never on the phone: the right
     answers are not sent until the test is handed in.
   · Nothing reaches the team until Chef Danilo, Chef Antonio or Chef Andrea has checked it AND Chef
     Francesco has approved it (Chef's corner). Recipe questions come from what is actually
     written in the Recipe book; a recipe that changes sends its question back for checking.
   Schema: learning-schema.sql.
   ════════════════════════════════════════════════════════════════════════════ */
var SB_URL = 'https://zrpglswalgjbtghudmhu.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpycGdsc3dhbGdqYnRnaHVkbWh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MTIyMjQsImV4cCI6MjA5NjQ4ODIyNH0.pfABN-so4xINK7nHxXUlVeTO4g0h0l6ILHVwpoKrbds';

var EMPLS = 'learnEmp', EMPFOR = 12*60*60*1000;
var S = { view:'home', emp:null, me:null, topics:null, topic:null, pages:[], pi:0, test:null, qi:0, picks:[], result:null,
          err:'', busy:false, chef:null, code:'', ctab:'check', ctopic:'', cshow:30, cq:null, gaps:null, scores:null, cmsg:'', edit:null };

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function $(id){ return document.getElementById(id); }
// shots = [{name, thumb}] from the database, one per piece of crockery in the answer.
function shotsHtml(sh){
  if (!sh || !sh.length) return '';
  return '<span class="shots">' + sh.map(function(x){
    return '<img src="' + esc(x.thumb) + '" alt="' + esc(x.name) + '" title="' + esc(x.name) + '" loading="lazy">'; }).join('') + '</span>';
}

function api(path, opts){
  opts = opts || {};
  var h = { apikey:SB_KEY, Authorization:'Bearer '+SB_KEY, 'Content-Type':'application/json' };
  return fetch(SB_URL + '/rest/v1/' + path, { method:opts.method||'GET', headers:h,
      body: opts.body ? JSON.stringify(opts.body) : undefined, cache:'no-store' })
    .then(function(r){ return r.text().then(function(t){
      var j = null; try { j = t ? JSON.parse(t) : null; } catch(e){}
      if (!r.ok) { var e = new Error((j && (j.message || j.error)) || ('HTTP ' + r.status)); e.status = r.status; throw e; }
      return j; }); });
}
/* Reads that only carry the employee ID go as GET, so the team side also browses on the
   DEV site (dev-guard blocks every POST there). Anything with the approver code, and every
   write, is a POST — the code never goes in a URL. */
function get(fn, args){
  var q = Object.keys(args).map(function(k){ return k + '=' + encodeURIComponent(args[k] == null ? '' : args[k]); }).join('&');
  return api('rpc/' + fn + '?' + q);
}
function post(fn, args){ return api('rpc/' + fn, { method:'POST', body:args }); }
function say(err){
  var m = String(err && err.message || err);
  if (/no_emp/.test(m)) return 'That employee ID is not in the kitchen staff list. Check it, or ask Chef Francesco to add it.';
  if (/not_ready/.test(m)) return 'This test is not open yet: it needs at least 5 checked and approved questions.';
  if (/wrong_code/.test(m)) return 'That code is not right.';
  if (/not_allowed/.test(m)) return 'Your employee ID cannot do this here.';
  if (/not_draft/.test(m)) return 'Someone has already checked this one. Reload to see it.';
  if (/not_checked/.test(m)) return 'This one has not been checked by Chef Danilo, Chef Antonio or Chef Andrea yet.';
  if (/already_finished/.test(m)) return 'This test was already handed in.';
  if (/read-only/i.test(m)) return 'This is the DEV site, which cannot save anything. Use the live Kitchen app.';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'No connection. Nothing was saved. Try again when the signal is back.';
  return 'Something went wrong: ' + m;
}
function setBusy(b){ S.busy = b; document.querySelectorAll('button[data-busy]').forEach(function(x){ x.disabled = b; }); }

/* ── signing in ── */
function remembered(){
  try { var v = JSON.parse(localStorage.getItem(EMPLS) || 'null');
        if (v && v.emp && (Date.now() - v.at) < EMPFOR) return v.emp; } catch(e){}
  return null;
}
function signIn(emp){
  emp = String(emp || '').trim(); S.tryEmp = emp;
  if (!emp) { S.err = 'Type your employee ID.'; return draw(); }
  S.err = ''; setBusy(true);
  return get('learn_me', { p_emp:emp }).then(function(me){
    S.emp = emp; S.me = me;
    try { localStorage.setItem(EMPLS, JSON.stringify({ emp:emp, at:Date.now() })); } catch(e){}
    return loadHome();
  }).catch(function(e){ S.err = say(e); S.me = null; }).then(function(){ setBusy(false); draw(); });
}
function signOut(){
  try { localStorage.removeItem(EMPLS); } catch(e){}
  S.emp = null; S.me = null; S.topics = null; S.view = 'home'; S.chef = null; S.code = ''; draw();
}
function loadHome(){
  return get('learn_home', { p_emp:S.emp }).then(function(t){ S.topics = t || []; });
}

/* ── the team's side ── */
var LEVEL = { commis:'Commis', cdp:'Chef de partie', senior:'Senior' };
function passState(t){
  if (t.passed_at) {
    var at = new Date(t.passed_at);
    if (t.expires_months) {
      var until = new Date(at); until.setMonth(until.getMonth() + t.expires_months);
      if (until < new Date()) return { cls:'p-exp', txt:'Expired — take it again' };
      return { cls:'p-ok', txt:'Passed · until ' + until.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }) };
    }
    return { cls:'p-ok', txt:'Passed · best ' + t.best + '/5' };
  }
  if (t.tries) return { cls:'p-below', txt:'Best ' + t.best + '/5 · not passed yet' };
  if (!t.pages && t.questions < 5) return { cls:'p-none', txt:'Coming soon' };
  return { cls:'p-none', txt:'Not taken' };
}
function drawHome(){
  if (!S.me) {
    return '<h2>Learning</h2>' +
      '<form class="card sign" id="fsign"><label for="emp">Your employee ID</label>' +
      '<input id="emp" inputmode="numeric" autocomplete="off" enterkeyhint="go" value="' + esc(S.tryEmp || '') + '">' +
      '<button class="btn" data-busy id="go" type="submit">Start</button>' +
      (S.err ? '<div class="msg bad" role="alert">' + esc(S.err) + '</div>' : '') +
      '<details><summary>What is this?</summary><p>Short pages to read and a 5-question test for each topic. ' +
      'Everything here has been checked by Chef Danilo, Chef Antonio or Chef Andrea and approved by Chef Francesco. ' +
      'Your employee ID is how the app knows your level and keeps your score.</p></details></form>' +
      '<button class="link" id="chef">Chef’s corner — check and approve questions</button>';
  }
  var open = (S.topics || []);
  return '<div class="top"><h2>Learning</h2><div class="me"><b>' + esc(S.me.name) + '</b> · ' + esc(LEVEL[S.me.level] || '') +
    ' <button class="link" id="out">Not you?</button></div></div>' +
    (S.err ? '<div class="msg bad" role="alert">' + esc(S.err) + '</div>' : '') +
    '<div class="topics">' + open.map(function(t, i){
      var st = passState(t), ready = t.pages > 0 || t.questions >= 5;
      return '<button class="topic" data-topic="' + esc(t.id) + '"' + (ready ? '' : ' disabled') + '>' +
        '<span class="num">' + (i + 1) + '</span><span class="tname">' + esc(t.title) + '</span>' +
        '<span class="pill ' + st.cls + '">' + esc(st.txt) + '</span>' +
        '<span class="tsum">' + esc(t.summary) + '</span></button>';
    }).join('') + '</div>' +
    (S.me.viewer ? '<button class="link" id="myscores">Team scores</button>' : '') +
    '<button class="link" id="chef">Chef’s corner — check and approve questions</button>';
}
function openTopic(id){
  S.topic = (S.topics || []).filter(function(t){ return t.id === id; })[0];
  if (!S.topic) return;
  S.err = ''; S.pi = 0; S.pages = []; S.view = 'topic'; draw();
  get('learn_pages_for', { p_emp:S.emp, p_topic:id }).then(function(p){ S.pages = p || []; })
    .catch(function(e){ S.err = say(e); }).then(draw);
}
function drawTopic(){
  var t = S.topic, p = S.pages[S.pi], last = S.pi >= S.pages.length - 1;
  var testLine = t.questions >= 5
    ? '<button class="btn go" data-busy id="start">Take the test — 5 questions</button>'
    : '<div class="empty">The test opens once 5 questions are checked and approved' +
      (t.questions ? ' — ' + t.questions + ' so far.' : '.') + '</div>';
  return '<button class="back" id="home">‹ Topics</button><h2>' + esc(t.title) + '</h2>' +
    (S.err ? '<div class="msg bad" role="alert">' + esc(S.err) + '</div>' : '') +
    (p ? '<div class="page">' + (p.photo ? '<img src="' + esc(p.photo) + '" alt="">' : '') +
      '<h3>' + esc(p.title) + '</h3><div class="body">' + esc(p.body) + '</div>' +
      '<div class="pager"><span class="dots">Page ' + (S.pi + 1) + ' of ' + S.pages.length + '</span>' +
      '<span>' + (S.pi > 0 ? '<button class="btn ghost sm" id="prev">‹ Back</button> ' : '') +
      (!last ? '<button class="btn sm" id="next">Next page ›</button>' : '') + '</span></div></div>'
      : (S.pages.length === 0 && t.pages === 0 ? '' : '<div class="me">Loading…</div>')) +
    ((last || !S.pages.length) ? testLine : '');
}
function startTest(){
  setBusy(true); S.err = '';
  post('learn_start', { p_emp:S.emp, p_topic:S.topic.id }).then(function(r){
    S.test = r; S.qi = 0; S.picks = []; S.view = 'test';
  }).catch(function(e){ S.err = say(e); }).then(function(){ setBusy(false); draw(); window.scrollTo(0,0); });
}
function drawTest(){
  var qs = S.test.questions, q = qs[S.qi], n = qs.length, pick = S.picks[S.qi];
  return '<h2>' + esc(S.test.title) + '</h2>' +
    '<div class="bar" aria-hidden="true"><i style="width:' + Math.round(100 * S.qi / n) + '%"></i></div>' +
    '<div class="qcard"><div class="dots">Question ' + (S.qi + 1) + ' of ' + n + '</div>' +
    '<div class="qtext">' + esc(q.q) + '</div>' +
    q.choices.map(function(c, i){
      var sh = q.shots && q.shots[c];
      return '<button class="choice' + (sh ? ' pic' : '') + (pick === c ? ' on' : '') + '" data-pick="' + i + '" aria-pressed="' + (pick === c) + '">' +
        shotsHtml(sh) + '<span>' + esc(c) + '</span></button>';
    }).join('') +
    (S.err ? '<div class="msg bad" role="alert">' + esc(S.err) + '</div>' : '') +
    '<div class="pager"><span>' + (S.qi > 0 ? '<button class="btn ghost sm" id="qprev">‹ Back</button>' : '') + '</span>' +
    (S.qi < n - 1
      ? '<button class="btn" id="qnext"' + (pick == null ? ' disabled' : '') + '>Next ›</button>'
      : '<button class="btn go" data-busy id="finish"' + (pick == null ? ' disabled' : '') + '>Hand it in</button>') +
    '</div></div>';
}
function finish(){
  setBusy(true); S.err = '';
  post('learn_finish', { p_emp:S.emp, p_attempt:S.test.attempt, p_answers:S.picks }).then(function(r){
    S.result = r; S.view = 'result'; return loadHome();
  }).catch(function(e){ S.err = say(e); }).then(function(){ setBusy(false); draw(); window.scrollTo(0,0); });
}
function drawResult(){
  var r = S.result, wrong = r.results.filter(function(x){ return !x.right; }), right = r.results.filter(function(x){ return x.right; });
  return '<h2>' + esc(S.test.title) + '</h2>' +
    '<div class="card"><div class="score">' + r.score + ' / ' + r.total + '</div>' +
    '<div class="msg ' + (r.passed ? 'ok' : 'bad') + '">' + (r.passed ? 'Passed.' : 'Not passed this time — 4 right answers are needed. You can take it again: the questions change.') + '</div></div>' +
    (wrong.length ? '<h3>What to learn from this</h3>' + wrong.map(function(x){
      return '<div class="res"><div class="q">' + esc(x.q) + '</div>' +
        '<div class="you pline">' + shotsHtml(x.pshot) + '<span>You answered: ' + esc(x.picked || '—') + '</span></div>' +
        '<div class="ans pline">' + shotsHtml(x.shot) + '<span>Right answer: ' + esc(x.answer) + '</span></div>' +

// The same rule as learn_plate_key()/learn_plate_shot() in the database: split on commas,

function plateShots(t){

function readPhoto(file){
  return new Promise(function(res, rej){
    if (!file) return res(null);
    var fr = new FileReader();
    fr.onload = function(){ var img = new Image(); img.onload = function(){
      var k = Math.min(1, 1200 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .82)); };
      img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

document.addEventListener('click', function(ev){

  var id = b.id;

  if (id === 'home') {

    if (S.view === 'chef' || S.view === 'scores') { S.cq = null; S.chef = null; S.code = ''; S.tryCemp = null; S.edit = null; }
    S.view = 'home'; S.err = ''; S.cmsg = ''; draw(); window.scrollTo(0,0); return; }
  if (b.dataset.topic) return openTopic(b.dataset.topic);
  if (id === 'next') { S.pi++; draw(); window.scrollTo(0,0); return; }
  if (id === 'prev') { S.pi--; draw(); window.scrollTo(0,0); return; }
  if (id === 'start' || id === 'again') return startTest();
  if (b.dataset.pick != null) { S.picks[S.qi] = S.test.questions[S.qi].choices[+b.dataset.pick]; draw(); return; }
  if (id === 'qnext') { S.qi++; draw(); window.scrollTo(0,0); return; }

  if (id === 'finish') return finish();
  if (id === 'chef') { S.view = 'chef'; S.cmsg = ''; draw(); return; }
  /* A shared kitchen screen: the next chef must not inherit the last one's corner. */
  if (id === 'cout') { S.cq = null; S.chef = null; S.code = ''; S.tryCemp = null; S.cmsg = ''; S.edit = null; draw(); return; }
  if (id === 'myscores') { S.view = 'scores'; S.cmsg = ''; S.chef = { emp:S.emp, code:null }; S.cq = null; draw(); loadScores(); return; }
  if (b.dataset.ctab) { S.ctab = b.dataset.ctab; S.cmsg = ''; S.cshow = 30; draw();
    if (S.ctab === 'recipes') loadGaps(); if (S.ctab === 'scores') loadScores(); return; }
  if (id === 'more') { S.cshow += 30; draw(); return; }
  if (id === 'wsave') return saveWrite();
  if (id === 'mkrec') return makeRecipeQs();
  if (b.dataset.viewer) {
    var on = b.checked;
    post('learn_set_viewer', { p_code:S.chef.code, p_staff:b.dataset.viewer, p_on:on })
      .then(function(){ S.cmsg = '✓ Saved.'; return loadScores(); })
      .catch(function(e){ S.cmsg = say(e); draw(); });
    return;
  }
  var act = b.dataset.act;
  if (act === 'ok' || act === 'approve') return step(b.dataset.k, b.dataset.id, act);
  if (act === 'edit') { S.edit = b.dataset.id; S.rejecting = null; S.cmsg = ''; draw(); var el = $('it-' + b.dataset.id); if (el) el.scrollIntoView({ block:'start' }); return; }
  if (act === 'cancel') { S.edit = null; S.rejecting = null; draw(); return; }
  if (act === 'rejask') { S.rejecting = b.dataset.id; S.edit = null; draw(); return; }
  if (act === 'reject') return step(b.dataset.k, b.dataset.id, 'reject', null, ($('rj-' + b.dataset.id) || {}).value);
  if (act === 'saveok' || act === 'saveonly') {
    var k = b.dataset.k, qid = b.dataset.id;
    return editFields(k).then(function(f){
      var bad = fieldsOk(k, f); if (bad) { S.cmsg = bad; return draw(); }
      /* A fix by a checker counts as the check. A fix by Chef Francesco goes back to the
         checkers: his rule is that they check first and he approves second. */
      return step(k, qid, act === 'saveok' ? 'ok' : 'edit', f);
    });
  }
});
document.addEventListener('change', function(ev){
  if (ev.target.id === 'ctopic') { S.ctopic = ev.target.value; S.cshow = 30; draw(); }
  if (ev.target.id === 'wk') { $('wq').hidden = ev.target.value !== 'q'; $('wp').hidden = ev.target.value !== 'p'; }
});
/* Real forms, so Enter on a keyboard and Go on a phone keypad both submit. */
document.addEventListener('submit', function(ev){
  ev.preventDefault();
  if (ev.target.id === 'fsign') signIn($('emp').value);
  if (ev.target.id === 'fchef') chefSignIn();
});

(function boot(){
  var emp = remembered();
  if (emp) signIn(emp); else draw();
})();
</script>
