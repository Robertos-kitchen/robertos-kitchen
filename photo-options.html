<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dish photos — the plate, and nothing else</title>
<style>
:root{--vino:#400207;--vino-light:#7a4a50;--cream:#FBF7F2;--sabbia:#E8D9C7;--sabbia-dark:#d5c2aa}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--vino);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.55}
.in{max-width:1240px;margin:0 auto;padding:20px 15px 70px}
h1{font-family:Georgia,serif;font-weight:400;font-size:26px;margin:0 0 4px}
.sub{color:var(--vino-light);font-size:13.5px;margin:0 0 18px;max-width:64ch}
.drop{border:1.5px dashed var(--sabbia-dark);border-radius:9px;background:#fff;
  padding:24px 16px;text-align:center;cursor:pointer;display:block}
.drop.on{border-color:var(--vino);background:#fff8f2}
.drop b{display:block;font-size:16px;margin-bottom:2px}
.drop span{color:var(--vino-light);font-size:13px}
input[type=file]{display:none}
.note{margin-top:11px;font-size:13px;color:var(--vino-light);min-height:20px}
.warn{background:#fff3f3;border:1px solid #e8c4c4;color:#7a1218;border-radius:7px;padding:10px 13px;font-size:13px;margin-top:13px}
.ok{background:#f2f7f0;border:1px solid #c9dcc2;color:#2f5127;border-radius:7px;padding:10px 13px;font-size:13px;margin-top:13px}
.grid{display:grid;gap:15px;margin-top:20px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:#fff;border:1px solid var(--sabbia-dark);border-radius:9px;overflow:hidden;display:flex;flex-direction:column}
.card h2{margin:0;padding:11px 13px 2px;font-size:14px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.card p{margin:0;padding:0 13px 10px;font-size:12.5px;color:var(--vino-light)}
.shot{background:#efe7dc;display:flex;align-items:center;justify-content:center}
.shot img{display:block;width:100%;height:auto}
.meta{padding:9px 13px;font-size:12px;color:var(--vino-light);border-top:1px solid #f0e6d9;
  display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.meta b{color:var(--vino);font-weight:600}
.pick{margin:0 13px 13px;padding:9px;border:1px solid var(--sabbia-dark);background:var(--sabbia);
  color:var(--vino);border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
.sizes{margin-top:26px;background:#fff;border:1px solid var(--sabbia-dark);border-radius:9px;padding:15px}
.sizes h2{margin:0 0 4px;font-size:14px;letter-spacing:.3px;text-transform:uppercase}
table{border-collapse:collapse;width:100%;margin-top:9px;font-size:13px}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid #f0e6d9}
th{font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--vino-light);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tr.best td{background:#f7f2ea;font-weight:600}
.orig{margin-top:22px}
.orig img{max-width:280px;width:100%;border:1px solid var(--sabbia-dark);border-radius:7px}
</style>

<div class="in">
<h1>Dish photos — the plate, and nothing else</h1>
<p class="sub">Drop a photo in. It finds the plate, lifts it off whatever it was standing on,
and gives it back whole on a clean ground. Everything happens on this device — nothing is
uploaded and nothing is kept. Every picture below is a real file at its real weight.</p>

<label class="drop" id="drop">
  <b>Take or choose a photo</b>
  <span>Drag one in, or tap to pick</span>
  <input type="file" id="file" accept="image/*">
</label>
<div class="note" id="note"></div>
<div id="warn"></div>
<div class="grid" id="grid"></div>
<div id="sizes"></div>
<div class="orig" id="orig"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════════
   Taking the plate off the table.

   Cropping a square around a plate is not the job — the table, the pass, the
   notebook and the crisp packet come with it, and no two photos ever match. What
   makes a book of a thousand dishes look like one book is that the plate is the
   only thing in the frame.

   So: find the plate as a shape, not a box. A plate photographed from above at an
   angle is an ellipse, tilted. Fit that ellipse, cut along it, and stand the result
   on a clean ground at the same size every time.

   Why it can be fitted at all: the plate is pale and almost colourless, and the food
   sits inside it. Mark the pale pixels, fill each row between its outermost marks so
   the food is enclosed rather than punched out, and the second moments of what is
   left give the centre, the two axes and the tilt — the whole ellipse, in one pass.
   ═══════════════════════════════════════════════════════════════════════════════ */

function el(id){ return document.getElementById(id); }
var WORK = 1000;                    /* detection runs on a small copy — plenty, and fast */

function loadImage(file){
  return new Promise(function(res,rej){
    var u=URL.createObjectURL(file), im=new Image();
    im.onload=function(){ URL.revokeObjectURL(u); res(im); };
    im.onerror=function(){ URL.revokeObjectURL(u); rej(new Error('that image could not be read')); };
    im.src=u;
  });
}
function canvasOf(im, max){
  var sc=Math.min(1, max/Math.max(im.naturalWidth||im.width, im.naturalHeight||im.height));
  var c=document.createElement('canvas');
  c.width=Math.max(1,Math.round((im.naturalWidth||im.width)*sc));
  c.height=Math.max(1,Math.round((im.naturalHeight||im.height)*sc));
  var g=c.getContext('2d'); g.imageSmoothingQuality='high';
  g.drawImage(im,0,0,c.width,c.height);
  return c;
}

/* ── the plate, as an ellipse ─────────────────────────────────────────────── */
function findPlate(data, w, h){
  var mask=new Uint8Array(w*h), any=0;
  for (var y=0;y<h;y++) for (var x=0;x<w;x++){
    var i=(y*w+x)*4, r=data[i], g=data[i+1], b=data[i+2];
    var mx=Math.max(r,g,b), mn=Math.min(r,g,b);
    var lum=r*0.299+g*0.587+b*0.114;
    if (lum>128 && (mx-mn)<60){ mask[y*w+x]=1; any++; }
  }
  if (any < w*h*0.02) return null;             /* nothing pale enough to be a plate */

  /* fill each row between its outermost pale pixels — a plate is convex, so this
     encloses the food instead of leaving a hole where the sauce is */
  var filled=new Uint8Array(w*h), rowsHit=0;
  for (var yy=0;yy<h;yy++){
    var lo=-1, hi=-1;
    for (var xx=0;xx<w;xx++) if (mask[yy*w+xx]){ if(lo<0) lo=xx; hi=xx; }
    if (lo<0 || hi-lo < w*0.06) continue;      /* a few stray pale pixels are not a plate */
    rowsHit++;
    for (var k=lo;k<=hi;k++) filled[yy*w+k]=1;
  }
  if (rowsHit < h*0.05) return null;

  /* second moments → centre, axes, tilt */
  var n=0, sx=0, sy=0;
  for (var p=0;p<filled.length;p++) if (filled[p]){ var px=p%w, py=(p-px)/w; n++; sx+=px; sy+=py; }
  if (!n) return null;
  var cx=sx/n, cy=sy/n, xx2=0, yy2=0, xy2=0;
  for (var q=0;q<filled.length;q++) if (filled[q]){
    var qx=q%w, qy=(q-qx)/w, dx=qx-cx, dy=qy-cy;
    xx2+=dx*dx; yy2+=dy*dy; xy2+=dx*dy;
  }
  xx2/=n; yy2/=n; xy2/=n;
  var tr=xx2+yy2, det=xx2*yy2-xy2*xy2;
  var disc=Math.sqrt(Math.max(0, tr*tr/4-det));
  var l1=tr/2+disc, l2=tr/2-disc;
  /* for a uniformly filled ellipse the variance along a semi-axis a is a²/4 */
  var a=2*Math.sqrt(Math.max(l1,0.0001)), b=2*Math.sqrt(Math.max(l2,0.0001));
  var ang=0.5*Math.atan2(2*xy2, xx2-yy2);

  var edge=Math.max(2, Math.round(Math.min(w,h)*0.012));
  var cut=false, touch=0;
  for (var e=0;e<w;e++){ if (filled[e]) touch++; if (filled[(h-1)*w+e]) touch++; }
  for (var f=0;f<h;f++){ if (filled[f*w]) touch++; if (filled[f*w+w-1]) touch++; }
  cut = touch > (w+h)*0.06;
  return { cx:cx, cy:cy, a:a, b:b, ang:ang, cut:cut, cover:(Math.PI*a*b)/(w*h) };
}

/* ── colour: the plate is white, so the light can be read off it ───────────── */
function correct(data, w, h, pl){
  var sr=0,sg=0,sb=0,n=0;
  for (var y=0;y<h;y+=2) for (var x=0;x<w;x+=2){
    if (pl && !inside(pl,x,y,0.98)) continue;
    var i=(y*w+x)*4, r=data[i], g=data[i+1], b=data[i+2];
    var mx=Math.max(r,g,b), mn=Math.min(r,g,b);
    if (r*0.299+g*0.587+b*0.114>150 && (mx-mn)<60){ sr+=r; sg+=g; sb+=b; n++; }
  }
  var gr=1,gg=1,gb=1, balanced=false;
  if (n>80){
    var ar=sr/n, ag=sg/n, ab=sb/n, av=(ar+ag+ab)/3;
    var cap=function(v){ return Math.max(0.7, Math.min(1.3, v)); };
    gr=cap(av/ar); gg=cap(av/ag); gb=cap(av/ab); balanced=true;
  }
  var hist=new Uint32Array(256), tot=0;
  for (var p=0;p<data.length;p+=16){ hist[(data[p]*0.299+data[p+1]*0.587+data[p+2]*0.114)|0]++; tot++; }
  var lo=0,hi=255,acc=0;
  for (var v=0;v<256;v++){ acc+=hist[v]; if(acc>tot*0.015){ lo=v; break; } }
  acc=0;
  for (var v2=255;v2>=0;v2--){ acc+=hist[v2]; if(acc>tot*0.015){ hi=v2; break; } }
  if (hi-lo<45){ lo=0; hi=255; }
  var lut=new Uint8Array(256);
  for (var t=0;t<256;t++){
    var u=Math.max(0,Math.min(1,(t-lo)/(hi-lo)));
    lut[t]=Math.round(Math.max(0,Math.min(1, u+0.06*Math.sin(Math.PI*2*u)))*255);
  }
  var SAT=1.12;
  for (var j=0;j<data.length;j+=4){
    var R=lut[Math.min(255,Math.round(data[j]*gr))],
        G=lut[Math.min(255,Math.round(data[j+1]*gg))],
        B=lut[Math.min(255,Math.round(data[j+2]*gb))];
    var L=R*0.299+G*0.587+B*0.114;
    data[j]  =Math.max(0,Math.min(255,Math.round(L+(R-L)*SAT)));
    data[j+1]=Math.max(0,Math.min(255,Math.round(L+(G-L)*SAT)));
    data[j+2]=Math.max(0,Math.min(255,Math.round(L+(B-L)*SAT)));
  }
  return balanced;
}
function inside(pl,x,y,k){
  var co=Math.cos(-pl.ang), si=Math.sin(-pl.ang);
  var dx=x-pl.cx, dy=y-pl.cy;
  var u=(dx*co-dy*si)/(pl.a*k), v=(dx*si+dy*co)/(pl.b*k);
  return u*u+v*v<=1;
}

/* ── cut the plate out and stand it on a ground ────────────────────────────── */
function plateOn(src, pl, size, bg, shadow){
  var out=document.createElement('canvas'); out.width=size; out.height=size;
  var g=out.getContext('2d');
  g.fillStyle=bg; g.fillRect(0,0,size,size);

  /* the plate drawn to fill the frame, with a little air so it is not jammed in */
  var pad=0.93;
  var R=Math.max(pl.a,pl.b);
  var sc=(size*pad/2)/R;
  var cx=size/2, cy=size/2;

  if (shadow){
    g.save();
    g.translate(cx, cy+size*0.018);
    g.rotate(pl.ang);
    g.scale(pl.a*sc, pl.b*sc);
    var sg=g.createRadialGradient(0,0,0.82,0,0,1.06);
    sg.addColorStop(0,'rgba(64,2,7,0.20)');
    sg.addColorStop(1,'rgba(64,2,7,0)');
    g.fillStyle=sg; g.beginPath(); g.arc(0,0,1.06,0,6.2832); g.fill();
    g.restore();
  }

  /* the photo, kept only where the plate is. Drawn on its own first so the edge can
     be softened without eating into the ground underneath. */
  var lay=document.createElement('canvas'); lay.width=size; lay.height=size;
  var lg=lay.getContext('2d'); lg.imageSmoothingQuality='high';
  lg.save();
  lg.translate(cx,cy); lg.scale(sc,sc); lg.translate(-pl.cx,-pl.cy);
  lg.drawImage(src,0,0);
  lg.restore();

  lg.globalCompositeOperation='destination-in';
  lg.save();
  lg.translate(cx,cy); lg.rotate(pl.ang); lg.scale(pl.a*sc, pl.b*sc);
  var mg=lg.createRadialGradient(0,0,0.965,0,0,1.0);   /* a hair of feather, no halo */
  mg.addColorStop(0,'rgba(0,0,0,1)');
  mg.addColorStop(1,'rgba(0,0,0,0)');
  lg.fillStyle=mg; lg.beginPath(); lg.arc(0,0,1,0,6.2832); lg.fill();
  lg.restore();

  g.drawImage(lay,0,0);
  return out;
}

function bytesOf(u){ return Math.round(u.length*0.75); }
function kb(u){ return Math.round(bytesOf(u)/1024); }
function webpOK(){
  var c=document.createElement('canvas'); c.width=c.height=1;
  return c.toDataURL('image/webp').indexOf('image/webp')>0;
}

function card(t, why, u, size, id){
  return '<div class="card"><h2>'+t+'</h2><p>'+why+'</p>'+
    '<div class="shot"><img src="'+u+'" alt="'+t+'"></div>'+
    '<div class="meta"><span><b>'+size+' × '+size+'</b></span><span><b>'+kb(u)+' KB</b></span></div>'+
    '<button class="pick" data-pick="'+id+'">Use this on every photo</button></div>';
}

function run(file){
  el('note').textContent='Finding the plate…';
  el('grid').innerHTML=''; el('warn').innerHTML=''; el('sizes').innerHTML=''; el('orig').innerHTML='';
  loadImage(file).then(function(im){
    var work=canvasOf(im, WORK), w=work.width, h=work.height;
    var wg=work.getContext('2d'), id=wg.getImageData(0,0,w,h);
    var pl=findPlate(id.data,w,h);
    var balanced=correct(id.data,w,h,pl);
    wg.putImageData(id,0,0);

    if (!pl){
      el('warn').innerHTML='<div class="warn"><b>No plate could be found in this one.</b> '+
        'It needs a pale plate that stands out from what it is on. Nothing below would be '+
        'trustworthy, so nothing is shown — try one where the whole plate is in the picture.</div>';
      el('note').textContent='';
      return;
    }
    var msg=[];
    if (pl.cut) msg.push('<b>This plate runs off the edge of the photo.</b> The missing part '+
      'cannot be invented, so the plate below is whole only as far as the photograph goes. '+
      'A step back when shooting is the only fix for that one.');
    if (!balanced) msg.push('Not enough clean white to read the light off, so the colour cast was left as it is.');
    if (msg.length) el('warn').innerHTML='<div class="'+(pl.cut?'warn':'ok')+'">'+msg.join(' ')+'</div>';

    var SIZE=900;
    var A=plateOn(work,pl,SIZE,'#FBF7F2',true);
    var B=plateOn(work,pl,SIZE,'#FFFFFF',false);
    var C=plateOn(work,pl,SIZE,'#E8D9C7',true);
    var D=plateOn(work,pl,SIZE,'#400207',true);

    var wp=webpOK(), type=wp?'image/webp':'image/jpeg', q=wp?0.80:0.84;
    var uA=A.toDataURL(type,q), uB=B.toDataURL(type,q),
        uC=C.toDataURL(type,q), uD=D.toDataURL(type,q);

    el('grid').innerHTML =
      card('1 · Cream, with a shadow','The house paper. The plate lifted off the table and stood '+
        'on it, with just enough shadow to sit rather than float.', uA, SIZE, 'cream-shadow') +
      card('2 · Plain white','Nothing at all behind it. The flattest to print and the smallest '+
        'to keep — a catalogue look.', uB, SIZE, 'white-flat') +
      card('3 · Sabbia','The brand sand. Warmer against a white plate, and it stops a white rim '+
        'disappearing into the page.', uC, SIZE, 'sabbia') +
      card('4 · Vino','Deep and dark. The strongest on a screen at the pass; heaviest to print.',
        uD, SIZE, 'vino');

    /* ── the number that actually decides this: a thousand photos ── */
    var rows=[], sizes=[600,760,900,1100];
    sizes.forEach(function(s){
      var c=plateOn(work,pl,s,'#FBF7F2',true);
      var jj=c.toDataURL('image/jpeg',0.84), ww=wp?c.toDataURL('image/webp',0.80):null;
      rows.push({ s:s, jpg:bytesOf(jj), webp:ww?bytesOf(ww):null });
    });
    var best=rows[2];
    el('sizes').innerHTML='<div class="sizes"><h2>What a thousand of them weigh</h2>'+
      '<p style="margin:0;font-size:12.5px;color:#7a4a50">Cutting the table away is also what makes '+
      'these small: what is left is a plate on one flat colour, and a flat colour costs almost nothing '+
      'to store. Every figure below is measured from this photograph, not estimated.</p>'+
      '<table><tr><th>Square</th><th class="n">JPEG</th><th class="n">WebP</th>'+
      '<th class="n">1,000 photos (WebP)</th></tr>'+
      rows.map(function(r){
        return '<tr'+(r.s===best.s?' class="best"':'')+'><td>'+r.s+' × '+r.s+'</td>'+
          '<td class="n">'+Math.round(r.jpg/1024)+' KB</td>'+
          '<td class="n">'+(r.webp?Math.round(r.webp/1024)+' KB':'—')+'</td>'+
          '<td class="n">'+(r.webp?(r.webp*1000/1048576).toFixed(0)+' MB':'—')+'</td></tr>';
      }).join('')+'</table>'+
      '<p style="margin:11px 0 0;font-size:12.5px;color:#7a4a50">'+
      (wp?'WebP is what this device makes and every phone and browser in the restaurant reads it. ':
          'This browser cannot write WebP, so only the JPEG column is real here. ')+
      '<b>Today each photo is kept as text inside the recipe row itself</b>, which costs a further third '+
      'on top of these figures and is read back every single time the recipe is opened. At a thousand '+
      'photos that is the wrong place for them — they belong in file storage with the recipe holding '+
      'only a link. That is a change worth making before the thousand, not after.</p></div>';

    var o=canvasOf(im,520);
    el('orig').innerHTML='<h2 style="font-size:13.5px;letter-spacing:.3px;text-transform:uppercase">What went in</h2>'+
      '<p style="font-size:12.5px;color:#7a4a50;margin:2px 0 8px">'+(im.naturalWidth)+' × '+(im.naturalHeight)+
      ' · '+Math.round(file.size/1024)+' KB</p><img src="'+o.toDataURL('image/jpeg',0.8)+'" alt="what went in">';
    el('note').textContent='Tap the one you want used every time.';
  }).catch(function(e){ el('note').textContent='Could not read that — '+e.message; });
}

var fi=el('file'), dz=el('drop');
fi.addEventListener('change', function(){ if(this.files&&this.files[0]) run(this.files[0]); });
['dragenter','dragover'].forEach(function(k){ dz.addEventListener(k,function(e){ e.preventDefault(); dz.classList.add('on'); }); });
['dragleave','drop'].forEach(function(k){ dz.addEventListener(k,function(e){ e.preventDefault(); dz.classList.remove('on'); }); });
dz.addEventListener('drop', function(e){
  var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) run(f);
});
el('grid').addEventListener('click', function(e){
  var b=e.target.closest('[data-pick]'); if(!b) return;
  el('note').textContent='Noted — tell me “'+b.dataset.pick+'” and I will put it on every upload.';
  b.textContent='Chosen · tell me “'+b.dataset.pick+'”';
});
</script>
