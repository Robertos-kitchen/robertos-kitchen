<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dish photos — four ways</title>
<style>
:root{--vino:#400207;--vino-light:#7a4a50;--cream:#FBF7F2;--sabbia:#E8D9C7;--sabbia-dark:#d5c2aa}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--vino);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.55}
.in{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:27px;margin:0 0 4px;letter-spacing:.2px}
.sub{color:var(--vino-light);font-size:13.5px;margin:0 0 20px;max-width:60ch}
.drop{border:1.5px dashed var(--sabbia-dark);border-radius:9px;background:#fff;
  padding:26px 18px;text-align:center;cursor:pointer;transition:.15s}
.drop.on{border-color:var(--vino);background:#fff8f2}
.drop b{display:block;font-size:16px;margin-bottom:3px}
.drop span{color:var(--vino-light);font-size:13px}
input[type=file]{display:none}
.note{margin-top:12px;font-size:13px;color:var(--vino-light);min-height:20px}
.grid{display:grid;gap:16px;margin-top:22px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.card{background:#fff;border:1px solid var(--sabbia-dark);border-radius:9px;overflow:hidden;display:flex;flex-direction:column}
.card h2{margin:0;padding:12px 14px 3px;font-size:14.5px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.card p{margin:0;padding:0 14px 11px;font-size:12.5px;color:var(--vino-light);line-height:1.5}
.shot{background:#efe7dc;display:flex;align-items:center;justify-content:center;min-height:150px}
.shot img{display:block;max-width:100%;height:auto}
.meta{padding:10px 14px 13px;font-size:12px;color:var(--vino-light);border-top:1px solid #f0e6d9;
  display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.meta b{color:var(--vino);font-weight:600}
.pick{margin:0 14px 14px;padding:9px;border:1px solid var(--sabbia-dark);background:var(--sabbia);
  color:var(--vino);border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
.orig{margin-top:24px}
.orig img{max-width:320px;width:100%;border:1px solid var(--sabbia-dark);border-radius:7px}
.warn{background:#fff3f3;border:1px solid #e8c4c4;color:#7a1218;border-radius:7px;
  padding:10px 13px;font-size:13px;margin-top:14px}
.foot{margin-top:30px;font-size:12.5px;color:var(--vino-light);border-top:1px solid var(--sabbia-dark);padding-top:14px}
</style>

<div class="in">
<h1>Dish photos — four ways</h1>
<p class="sub">Drop one of the photos you are unhappy with. It is worked on here on this
device — nothing is uploaded anywhere and nothing is saved. Each option below is the real
output, at the real size and weight, so pick on what you can see rather than on a description.</p>

<label class="drop" id="drop">
  <b>Take or choose a photo</b>
  <span>Drag one in, or tap to pick — phone photos welcome, sideways ones too</span>
  <input type="file" id="file" accept="image/*">
</label>
<div class="note" id="note"></div>

<div id="warn"></div>
<div class="grid" id="grid"></div>
<div class="orig" id="orig"></div>
<div class="foot" id="foot"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Standardising a dish photo.

   Every one of these photos has the same thing in it: a white plate. That is a
   known-neutral reference, which is what makes a real white balance possible
   instead of a guess — find the plate, ask what colour the app is being told
   white is, and put it back to white. The warm cast of a service light comes
   off, and two dishes shot four hours apart end up the same colour.

   Nothing here needs a library or a server. Canvas only, on the device.
   ═══════════════════════════════════════════════════════════════════════════ */

var OUT = 1400;          /* the square each standard photo becomes */
var Q   = 0.82;          /* jpeg quality — measured against weight below */

function el(id){ return document.getElementById(id); }

/* ── find the plate ────────────────────────────────────────────────────────
   A coarse grid, not per-pixel: a plate is a big pale low-colour area, and
   working in cells shrugs off basil leaves, highlights and table grain that
   would break a pixel-level threshold. Largest connected run of pale cells
   wins, and its bounding box is the plate. */
function findPlate(d, w, h){
  var CW = 56, cw = Math.max(1, Math.floor(w/CW)), ch = Math.max(1, Math.floor(h/CW));
  var cols = Math.ceil(w/cw), rows = Math.ceil(h/ch);
  var pale = new Uint8Array(cols*rows);
  for (var cy=0; cy<rows; cy++) for (var cx=0; cx<cols; cx++){
    var n=0, pass=0;
    for (var y=cy*ch; y<Math.min(h,(cy+1)*ch); y+=2)
      for (var x=cx*cw; x<Math.min(w,(cx+1)*cw); x+=2){
        var i=(y*w+x)*4, r=d[i], g=d[i+1], b=d[i+2];
        var mx=Math.max(r,g,b), mn=Math.min(r,g,b);
        var lum=(r*0.299+g*0.587+b*0.114);
        /* pale = bright and not strongly coloured. A tomato sauce is bright too,
           so brightness alone would swallow the food. */
        if (lum>120 && (mx-mn) < 58) pass++;
        n++;
      }
    pale[cy*cols+cx] = (n && pass/n > 0.55) ? 1 : 0;
  }
  /* largest connected blob of pale cells */
  var seen = new Uint8Array(cols*rows), best=null;
  for (var s=0; s<cols*rows; s++){
    if (!pale[s] || seen[s]) continue;
    var stack=[s], cells=[], minx=1e9,maxx=-1,miny=1e9,maxy=-1;
    seen[s]=1;
    while(stack.length){
      var k=stack.pop(); cells.push(k);
      var kx=k%cols, ky=(k-kx)/cols;
      if(kx<minx)minx=kx; if(kx>maxx)maxx=kx; if(ky<miny)miny=ky; if(ky>maxy)maxy=ky;
      var nb=[k-1,k+1,k-cols,k+cols];
      for (var q=0;q<4;q++){
        var m=nb[q];
        if (m<0||m>=cols*rows||seen[m]||!pale[m]) continue;
        if (q<2 && Math.floor(m/cols)!==ky) continue;   /* no wrapping round a row */
        seen[m]=1; stack.push(m);
      }
    }
    if (!best || cells.length>best.n) best={n:cells.length,minx:minx,maxx:maxx,miny:miny,maxy:maxy};
  }
  if (!best || best.n < 6) return null;                  /* no plate we can trust */
  var box = { x:best.minx*cw, y:best.miny*ch,
              w:(best.maxx-best.minx+1)*cw, h:(best.maxy-best.miny+1)*ch };
  /* a plate touching an edge is a plate that has been cut off by the framing */
  box.cut = (box.x<=cw) || (box.y<=ch) || (box.x+box.w>=w-cw) || (box.y+box.h>=h-ch);
  box.share = (box.w*box.h)/(w*h);
  return box;
}

/* ── white balance off the plate, then levels ──────────────────────────────
   The plate's pale pixels are white in life. Whatever the camera made of them
   is the cast, and dividing it out is the correction. Held to ±35% a channel
   so an odd photo cannot be turned into a colour nobody cooked. */
function correct(d, w, h, plate){
  var sr=0,sg=0,sb=0,n=0;
  var x0=plate?plate.x:0, y0=plate?plate.y:0,
      x1=plate?plate.x+plate.w:w, y1=plate?plate.y+plate.h:h;
  for (var y=y0;y<y1;y+=2) for (var x=x0;x<x1;x+=2){
    var i=(y*w+x)*4, r=d[i],g=d[i+1],b=d[i+2];
    var mx=Math.max(r,g,b), mn=Math.min(r,g,b);
    if (r*0.299+g*0.587+b*0.114 > 150 && (mx-mn)<58){ sr+=r; sg+=g; sb+=b; n++; }
  }
  var gr=1,gg=1,gb=1;
  if (n > 60){
    var ar=sr/n, ag=sg/n, ab=sb/n, avg=(ar+ag+ab)/3;
    var cap=function(v){ return Math.max(0.65, Math.min(1.35, v)); };
    gr=cap(avg/ar); gg=cap(avg/ag); gb=cap(avg/ab);
  }
  /* levels: stretch between the 1st and 99th percentile of brightness so a dim
     service light is lifted without blowing the highlights off the plate */
  var hist=new Uint32Array(256), tot=0;
  for (var p=0;p<d.length;p+=16){
    hist[(d[p]*0.299+d[p+1]*0.587+d[p+2]*0.114)|0]++; tot++;
  }
  var lo=0,hi=255,acc=0;
  for (var v=0;v<256;v++){ acc+=hist[v]; if (acc>tot*0.01){ lo=v; break; } }
  acc=0;
  for (var v2=255;v2>=0;v2--){ acc+=hist[v2]; if (acc>tot*0.01){ hi=v2; break; } }
  if (hi-lo < 40){ lo=0; hi=255; }
  var span=hi-lo;
  var lut=new Uint8Array(256);
  for (var t=0;t<256;t++){
    var u=Math.max(0,Math.min(1,(t-lo)/span));
    u = u + 0.12*Math.sin(Math.PI*2*u)/6.283*3;      /* the gentlest S-curve */
    lut[t]=Math.max(0,Math.min(255, Math.round(u*255)));
  }
  var SAT=1.10;
  for (var j=0;j<d.length;j+=4){
    var R=lut[Math.max(0,Math.min(255,Math.round(d[j]*gr)))],
        G=lut[Math.max(0,Math.min(255,Math.round(d[j+1]*gg)))],
        B=lut[Math.max(0,Math.min(255,Math.round(d[j+2]*gb)))];
    var L=R*0.299+G*0.587+B*0.114;
    d[j]  =Math.max(0,Math.min(255,Math.round(L+(R-L)*SAT)));
    d[j+1]=Math.max(0,Math.min(255,Math.round(L+(G-L)*SAT)));
    d[j+2]=Math.max(0,Math.min(255,Math.round(L+(B-L)*SAT)));
  }
  return { balanced:(n>60), lo:lo, hi:hi };
}

function loadImage(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file), im=new Image();
    im.onload=function(){ URL.revokeObjectURL(url); res(im); };
    im.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('that image could not be read')); };
    im.src=url;
  });
}
function toCanvas(im){
  var c=document.createElement('canvas');
  c.width=im.naturalWidth; c.height=im.naturalHeight;
  c.getContext('2d').drawImage(im,0,0);
  return c;
}
/* a square crop, clamped so it never runs off the picture */
function squareFrom(src, cx, cy, side){
  side=Math.min(side, Math.min(src.width, src.height));
  var x=Math.round(cx-side/2), y=Math.round(cy-side/2);
  x=Math.max(0,Math.min(src.width-side,x)); y=Math.max(0,Math.min(src.height-side,y));
  var c=document.createElement('canvas'); c.width=OUT; c.height=OUT;
  var g=c.getContext('2d'); g.imageSmoothingQuality='high';
  g.drawImage(src, x, y, side, side, 0, 0, OUT, OUT);
  return c;
}
function fitLong(src, max){
  var sc=Math.min(1, max/Math.max(src.width,src.height));
  var c=document.createElement('canvas');
  c.width=Math.round(src.width*sc); c.height=Math.round(src.height*sc);
  var g=c.getContext('2d'); g.imageSmoothingQuality='high';
  g.drawImage(src,0,0,c.width,c.height);
  return c;
}
function kb(dataUrl){ return Math.round(dataUrl.length*0.75/1024); }

function card(title, why, dataUrl, w, h, id){
  return '<div class="card"><h2>'+title+'</h2><p>'+why+'</p>'+
    '<div class="shot"><img src="'+dataUrl+'" alt="'+title+'"></div>'+
    '<div class="meta"><span><b>'+w+' × '+h+'</b> pixels</span>'+
      '<span><b>'+kb(dataUrl)+' KB</b> stored</span></div>'+
    '<button class="pick" data-pick="'+id+'">This is the one — apply it to every photo</button></div>';
}

function run(file){
  el('note').textContent='Working on it…';
  el('grid').innerHTML=''; el('warn').innerHTML=''; el('foot').textContent='';
  loadImage(file).then(function(im){
    var src=toCanvas(im), w=src.width, h=src.height;
    var g=src.getContext('2d');
    var img=g.getImageData(0,0,w,h);
    var plate=findPlate(img.data,w,h);
    var info=correct(img.data,w,h,plate);
    g.putImageData(img,0,0);                       /* src is now the corrected picture */

    var msgs=[];
    if (!plate) msgs.push('No plate could be picked out of this one, so the colour was '+
      'corrected off the whole picture and the square crops are centred rather than on the food.');
    else {
      if (plate.cut) msgs.push('The plate runs off the edge of this photo, so the tight crop '+
        'can only work with what is there — the missing side cannot be invented.');
      if (!info.balanced) msgs.push('Not enough clean white on the plate to read the light off, '+
        'so the colour cast was left alone rather than guessed at.');
    }
    if (msgs.length) el('warn').innerHTML='<div class="warn">'+msgs.join(' ')+'</div>';

    var cx = plate ? plate.x+plate.w/2 : w/2,
        cy = plate ? plate.y+plate.h/2 : h/2,
        pd = plate ? Math.max(plate.w,plate.h) : Math.min(w,h);

    var a=fitLong(src,1600),
        b=squareFrom(src,cx,cy,pd*1.35),
        c=squareFrom(src,cx,cy,pd*1.02),
        d=squareFrom(src,cx,cy,pd*1.35);

    /* option 4 — the table taken away. Everything outside the plate goes to the
       house cream, feathered so it is a backdrop and not a cut-out. */
    (function(){
      var g4=d.getContext('2d'), r=OUT/2, rad=OUT*0.5*(pd/(pd*1.35));
      var grd=g4.createRadialGradient(r,r,rad*0.94,r,r,rad*1.06);
      grd.addColorStop(0,'rgba(232,217,199,0)');
      grd.addColorStop(1,'rgba(232,217,199,1)');
      g4.fillStyle=grd; g4.fillRect(0,0,OUT,OUT);
      g4.globalCompositeOperation='destination-over';
      g4.fillStyle='#E8D9C7'; g4.fillRect(0,0,OUT,OUT);
      g4.globalCompositeOperation='source-over';
    })();

    var A=a.toDataURL('image/jpeg',Q), B=b.toDataURL('image/jpeg',Q),
        C=c.toDataURL('image/jpeg',Q), D=d.toDataURL('image/jpeg',Q);

    el('grid').innerHTML =
      card('1 · As shot, corrected',
        'Your framing kept exactly as taken — portrait stays portrait. Only the colour, '+
        'the exposure and the size are standardised. The safest of the four: nothing is ever cut off.',
        A, a.width, a.height, 'asshot') +
      card('2 · Square, plate centred',
        'A square built around the plate with the table still around it. Every dish the same '+
        'shape and the same size on the card, whichever way the phone was held.',
        B, OUT, OUT, 'square') +
      card('3 · Tight on the food',
        'The plate fills the frame. Strongest on a phone and on the printed card, where the '+
        'picture is small — but a plate shot off-centre loses its far rim.',
        C, OUT, OUT, 'tight') +
      card('4 · Studio',
        'The table taken away and replaced with the house cream, so a photo taken on a service '+
        'pass and one taken on a wooden table look like they belong to the same book.',
        D, OUT, OUT, 'studio');

    var o=fitLong(src,600);
    el('orig').innerHTML='<h2 style="font-size:14px;letter-spacing:.3px;text-transform:uppercase">'+
      'What went in</h2><p style="font-size:12.5px;color:#7a4a50;margin:2px 0 9px">'+
      w+' × '+h+' · '+Math.round(file.size/1024)+' KB · colour corrected here for comparison</p>'+
      '<img src="'+o.toDataURL('image/jpeg',0.85)+'" alt="the photo as it went in">';

    el('foot').textContent='Every option above is a real JPEG made on this device at '+
      Math.round(Q*100)+'% quality. The KB figure is what each one would actually take up on '+
      'the recipe. Today a photo is stored at up to 1400px on its longest side at 75%, with no '+
      'crop and no colour correction at all.';
    el('note').textContent='Four options below — tap the one you want used every time.';
  }).catch(function(e){
    el('note').textContent = 'Could not read that — ' + e.message;
  });
}

var fi=el('file'), dz=el('drop');
fi.addEventListener('change', function(){ if (this.files && this.files[0]) run(this.files[0]); });
['dragenter','dragover'].forEach(function(k){
  dz.addEventListener(k, function(e){ e.preventDefault(); dz.classList.add('on'); }); });
['dragleave','drop'].forEach(function(k){
  dz.addEventListener(k, function(e){ e.preventDefault(); dz.classList.remove('on'); }); });
dz.addEventListener('drop', function(e){
  var f=e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) run(f);
});
el('grid').addEventListener('click', function(e){
  var b=e.target.closest('[data-pick]'); if(!b) return;
  el('note').textContent='Noted — tell me “'+b.dataset.pick+'” and I will wire that into every upload.';
  b.textContent='Chosen · tell me “'+b.dataset.pick+'”';
});
</script>
