/* Make this line a batch recipe of its own — empty for now, linked straight away.
   It costs nothing until you fill it in, and it says so on the row. */
/* If the file we imported already holds this sub-recipe, build the batch WITH its
   ingredients and what it makes — retyping them would throw away work we already have. */
function foundSub(name){
  var want = disp(String(name||'')).toLowerCase().trim();
  var list = (S.found && S.found.recipes) || [];
  return list.filter(function(f){ return disp(f.name||'').toLowerCase().trim() === want; })[0] || null;
}
function rowsFromFound(f){
  var keep = S.hints;
  S.hints = f.hints || null;
  try {
    return f.lines.map(function(line){
      var q = parseQty(line);
      return mkRow({ raw:line, name:q.name || line, qty:q.qty, unit:q.unit });
    });
  } finally { S.hints = keep; }
}

function makeBatchFor(i){
  var r = S.rows[i], nm = (r.word||'').trim();
  if (!nm) return;
  var f = foundSub(nm);
  if (f){
    var built = rowsFromFound(f);
    return sb('recipes', { method:'POST', body: signed({
        kind:'batch', name:disp(f.name), section:'Prep',
        makes_qty:f.makesQty==null?null:f.makesQty, makes_unit:f.makesUnit||null }) })
      .then(function(out){
        var id = out[0].id;
        return (built.length ? sb('recipe_lines', { method:'POST', prefer:'return=minimal',
                                                    body:linesFor(id, built) }) : Promise.resolve())
          .then(function(){ return loadBatches(); })
          .then(function(){
            var it = MYB.filter(function(b){ return b.code === 'R:'+id; })[0];
            if (it) r.opts = [it].concat(r.opts.filter(function(o){ return o.code !== it.code; }));
            r.code = 'R:'+id; r.wantBatch = false;
            if (unitsFor(itemOf(r)).indexOf(r.unit) < 0) r.unit = defUnit(itemOf(r));
            rows(); foot();
          });
      })
      .catch(function(){ return makeEmptyBatch(i); });   /* name already taken — fall through */
  }
  return makeEmptyBatch(i);
}

function makeEmptyBatch(i){
  var r = S.rows[i], nm = (r.word||'').trim();
  if (!nm) return;
  var link = function(id){
    return loadBatches().then(function(){
      var it = MYB.filter(function(b){ return b.code === 'R:'+id; })[0];
      if (it) r.opts = [it].concat(r.opts.filter(function(o){ return o.code !== it.code; }));
      r.code = 'R:'+id;
      if (unitsFor(itemOf(r)).indexOf(r.unit) < 0) r.unit = defUnit(itemOf(r));
      rows(); foot();
    });
  };
  sb('recipes', { method:'POST', body: signed({ kind:'batch', name:nm, section:'Prep' }) })
    .then(function(out){ return link(out[0].id); })
    .catch(function(){                                  /* one already has that name — use it */
      return sb('recipes?kind=eq.batch&archived=is.false&name=eq.'+encodeURIComponent(nm)+'&select=id')
        .then(function(rs){ if (rs && rs[0]) return link(rs[0].id); throw new Error('could not make that batch'); });
    })
    .catch(function(err){ r.addErr = plain(err.message); rows(); });
}

function redrawRow(i){                      /* only this row — never blow away the sheet mid-pass */
  var tb = $('tb'), tr = tb.querySelectorAll('tr.main')[i];
  if (!tr) return;
  var nxt = tr.nextElementSibling;
  var tmp = document.createElement('tbody'); tmp.innerHTML = rowHTML(S.rows[i], i);
  var frag = document.createDocumentFragment();
  while (tmp.rows.length) frag.appendChild(tmp.rows[0]);
  if (nxt && nxt.classList.contains('drop')) tb.removeChild(nxt);
  tb.replaceChild(frag, tr);
}

/* ═════════ how it is made — four boxes and the photos, on the same sheet ═════════

/* ───── plating ─────
   Plating is not one line, it is several — mousse, then glaze, then the coin — so it gets

   just above, and the three of them come back together as three boxes on the card, which

/* ═════════ Menus — where they live, what is on them, and turning them off ═════════
   A menu made from inside a recipe has to be findable afterwards, or it is a thing
   that exists only in a dropdown. This screen is where they live: what is on each
   one, rename it, turn it off, put it away.

   The reason "turn it off" matters more than "delete": a menu for a single night is
   a real thing, and in a year there will be dozens of them. An OFF menu keeps
   everything that was on it and stops appearing in the picker — so the picker stays
   the four or five menus actually in use, not every night since last Christmas.

   Putting one away (archived) is the only kind of delete there is. The table allows
   no real delete, and it should not: a menu is what a card and a Food Bible filter
   by, and deleting one would quietly empty screens people are cooking from. */
var MENUADM = { ready:false, err:null, counts:{}, dishes:{}, all:[], showOff:false,
                open:null, busy:'', ask:null, rename:null };
var MENUSALL = false;      /* the bar picker: show every menu, not just the live ones */

function loadMenuAdmin(){
  MENUADM.ready = false; MENUADM.err = null;
  return Promise.all([
    sb('menus?venue_id=eq.robertos-difc&select=*&order=archived,position,name'),
    sb('recipe_menus?select=menu_id,recipe_id'),
    sb('recipes?kind=eq.main&select=id,name,section,archived')
  ]).then(function(res){
    MENUADM.all = res[0] || [];
    var byId = {}; (res[2]||[]).forEach(function(r){ byId[r.id] = r; });
    var counts = {}, dishes = {};
    (res[1]||[]).forEach(function(rm){
      var r = byId[rm.recipe_id];
      if (!r || r.archived) return;                 /* an archived recipe is not on anything */
      counts[rm.menu_id] = (counts[rm.menu_id] || 0) + 1;
      (dishes[rm.menu_id] = dishes[rm.menu_id] || []).push(r);
    });
    Object.keys(dishes).forEach(function(k){
      dishes[k].sort(function(a,b){ return String(a.section||'').localeCompare(String(b.section||'')) ||
                                           String(a.name).localeCompare(String(b.name)); });
    });
    MENUADM.counts = counts; MENUADM.dishes = dishes; MENUADM.ready = true;
  }).catch(function(e){ MENUADM.err = e.message; MENUADM.ready = true; });
}

/* Exactly one menu runs at a time, and the database enforces it — so the one that is
   running has to be stood down BEFORE the new one stands up, or the write is refused. */
function setRunning(id){
  var was = MENUADM.all.filter(function(m){ return m.running && !m.archived && m.id !== id; });
  var stand = was.length
    ? sb('menus?id=eq.'+was[0].id, { method:'PATCH', prefer:'return=minimal',
        body:{ running:false, updated_at:new Date().toISOString() } })
    : Promise.resolve();
  return stand.then(function(){
    return sb('menus?id=eq.'+id, { method:'PATCH', prefer:'return=minimal',
      body:{ running:true, active:true, updated_at:new Date().toISOString() } });
  });
}
function patchMenu(id, body){
  body.updated_at = new Date().toISOString();
  return sb('menus?id=eq.'+id, { method:'PATCH', prefer:'return=minimal', body:body });
}
function menuRow(id){ return MENUADM.all.filter(function(m){ return m.id === id; })[0]; }

function menusInner(){
  if (MENUADM.err)
    return '<div class="pane"><div class="q">Menus</div>' +
      '<div class="todo"><b>The menus cannot be read.</b> ' + esc(menuPlain(MENUADM.err)) + '</div></div>';
  if (!MENUADM.ready)
    return '<div class="pane"><div class="q">Menus</div><div class="tip">Reading the menus…</div></div>';

  /* one menu opened — what is on it */
  if (MENUADM.open){
    var m = menuRow(MENUADM.open);

    var on = MENUADM.dishes[m.id] || [];
    var sec = null;
    return '<div class="pane">' +
      '<div class="q">' + esc(m.name) + '</div>' +
      '<div class="sub">' + (on.length ? on.length + ' dish' + (on.length===1?'':'es') + ' on this menu. ' +
          'Tap one to open it. Taking a dish off changes only this menu — the recipe stays exactly where it is.'
        : 'Nothing is on this menu yet. Open a recipe and put it on from the bar at the top.') + '</div>' +
      (m.note ? '<div class="tip" style="margin:0 0 12px">' + esc(m.note) + '</div>' : '') +
      '<button class="newr" id="mabk" style="margin:0 0 14px">‹ All menus</button>' +
      on.map(function(r){
        var hd = (r.section !== sec) ? (sec = r.section, '<div class="shd">' + esc(r.section || 'No section') + '</div>') : '';
        return hd + '<div class="marow">' +
          '<span class="manm" data-maopen="' + r.id + '">' + esc(r.name) + '</span>' +
          '<button class="maoff" data-matake="' + r.id + '">Take off this menu</button>' +
        '</div>';
      }).join('') +
      '</div>';
  }

  var live = MENUADM.all.filter(function(m){ return !m.archived; });
  var off  = MENUADM.all.filter(function(m){ return m.archived; });
  var card = function(m){
    var n = MENUADM.counts[m.id] || 0;
    var asking = MENUADM.ask === m.id;
    var ren    = MENUADM.rename === m.id;
    return '<div class="macard' + (m.archived ? ' away' : '') + (m.running ? ' run' : '') + '">' +
      '<div class="matop">' +
        (ren
          ? '<input class="maren" id="maren" value="' + esc(m.name) + '">' +
            '<button class="okb" data-marensave="' + m.id + '">Save the name</button>' +
            '<button class="newr" style="margin:0" data-marencx="1">Cancel</button>'
          : '<span class="mahd">' + esc(m.name) + '</span>' +
            (m.running ? '<span class="mabadge run">running now</span>' : '') +
            (!m.archived && !m.active ? '<span class="mabadge off">off</span>' : '') +
            (m.archived ? '<span class="mabadge away">put away</span>' : '')) +
        '<span class="macount">' + n + ' dish' + (n===1?'':'es') + '</span>' +
      '</div>' +
      (asking
        ? '<div class="maask"><b>Put ' + esc(m.name) + ' away?</b> ' +
            (n ? 'The ' + n + ' dish' + (n===1?'':'es') + ' on it stay exactly as they are — ' +
                 (n===1?'it is':'they are') + ' simply no longer on this menu. ' : '') +
            'It stops appearing anywhere, and it can be brought back from below.' +
            '<div class="maaskb"><button class="okb" data-maaway="' + m.id + '">Yes, put it away</button>' +
            '<button class="newr" style="margin:0" data-manoaway="1">Keep it</button></div></div>'
        : '<div class="maacts">' +
            (m.archived
              ? '<button class="newr" style="margin:0" data-maback="' + m.id + '">Bring it back</button>'
              : '<button class="newr" style="margin:0" data-maopenm="' + m.id + '">See what is on it</button>' +
                '<button class="newr" style="margin:0" data-marename="' + m.id + '">Rename</button>' +
                (m.running ? '' : '<button class="newr" style="margin:0" data-marun="' + m.id + '">Make it the one running</button>') +
                (m.running ? '<span class="matip">The cards open on this one, so it cannot be turned off or put away until another one is running.</span>'
                  : '<button class="newr" style="margin:0" data-maact="' + m.id + '">' +
                      (m.active ? 'Turn it off' : 'Turn it back on') + '</button>' +
                    '<button class="newr" style="margin:0" data-maaskaway="' + m.id + '">Put it away</button>')) +
          '</div>') +
    '</div>';
  };

  return '<div class="pane">' +
    '<div class="q">Menus</div>' +
    howto('menuadm', 'Every menu the kitchen has, and what is on each one. This is what the recipe ' +
      'card and the Food Bible filter by — a dish on no menu shows on no card at all.<br>' +
      '<b>A menu for one night is normal.</b> When the night is over <b>turn it off</b>: everything on it ' +
      'is kept and it stops filling up the picker on the recipe. That is what stops this list becoming ' +
      'a hundred menus nobody can choose between.', 'Turning menus off') +
    '<div class="mnew" style="margin:0 0 18px"><input id="manew" placeholder="A new menu — New Year’s Eve 2026">' +
      '<button class="okb" id="manewok">Make this menu</button><span class="err" id="manewe"></span></div>' +
    (live.length ? live.map(card).join('') : '<div class="tip">No menus yet.</div>') +
    (off.length
      ? '<button class="newr" id="mashow">' + (MENUADM.showOff ? 'Hide' : 'Show') + ' the ' + off.length +
          ' put away</button>' + (MENUADM.showOff ? off.map(card).join('') : '')
      : '') +
    '</div>';
}

/* ── the menu control in the bar ──
   Same question as the box further down the sheet, asked where the section is asked.
   A dish can be on more than one menu, so picking a name TOGGLES it rather than
   replacing what is there — and the closed control says how many are on, because a
   select that shows one name while three are ticked is a select that lies.
   Batches never get it: a batch belongs to the dishes that use it. */
function barMenuLabel(){
  var on = (S.menus || []).filter(function(id){
    return MENUS.some(function(m){ return m.id === id; }); });
  if (!on.length) return 'Which menu?';
  if (on.length === 1) return menuName(on[0]);
  return on.length + ' menus';
}
function drawBarMenu(){
  var bm = $('bmn'); if (!bm) return;
  var show = S.kind === 'main' && (S.step === 'write' || S.step === 'sheet');
  bm.style.display = show ? 'inline-block' : 'none';
  if (!show){ var p = $('bmnew'); if (p) p.classList.remove('on'); return; }
  var on = S.menus || [];
  /* Only the menus in use, plus any this dish is already on. A menu for one night is
     turned off when the night is over, and an off menu has no business in a picker a
     chef uses every day — that is what keeps this list five long instead of a hundred. */
  var live = MENUS.filter(function(m){ return MENUSALL || m.active || on.indexOf(m.id) > -1; });
  var hidden = MENUS.length - live.length;
  bm.innerHTML =
    '<option value="">' + esc(barMenuLabel()) + '</option>' +
    live.map(function(m){
      var yes = on.indexOf(m.id) > -1;
      return '<option value="' + m.id + '">' + (yes ? '✓ ' : '＋ ') + esc(m.name) +
             (m.running ? ' — running now' : (m.active ? '' : ' — off')) + '</option>';
    }).join('') +
    (hidden ? '<option value="__all">… and ' + hidden + ' turned off — show ' +
              (hidden===1?'it':'them')+' too</option>' : '') +
    '<option value="__new">＋ A menu that is not here yet…</option>' +
    '<option value="__manage">⚙ Menus — see, rename, turn off…</option>';
  bm.className = 'bsec' + (on.length ? '' : ' none');
  bm.title = on.length ? 'On ' + on.map(menuName).join(', ') : 'This dish is on no menu — it will show on no card';
}
/* Under the last thing pinned to the top, whatever that is today — the costing sits
   between this strip and the bar now, so measuring off the bar alone would put the
   new-menu box straight on top of the cost. */
function fitBarMenu(){
  var p = $('bmnew'); if (!p) return;
  var f = document.getElementById('foot');
  var last = (f && f.style.display !== 'none' && f.classList.contains('shut'))
           ? f : document.querySelector('.bar');
  if (last) p.style.top = Math.round(last.getBoundingClientRect().bottom) + 'px';
}
function openNewMenu(){
  var p = $('bmnew'); if (!p) return;
  fitBarMenu(); p.classList.add('on');
  var e = $('bmne'); if (e) e.textContent = '';
  var i = $('bmnn'); if (i){ i.value = ''; i.focus(); }
}
function closeNewMenu(){ var p = $('bmnew'); if (p) p.classList.remove('on'); }
/* the way in to the menus screen, from anywhere that offers it */
function openMenus(){
  guard(function(){
    closeNewMenu();
    if (S.step !== 'menus') S.back = S.step;
    MENUADM.open = null; MENUADM.ask = null; MENUADM.rename = null; MENUADM.ready = false;
    S.step = 'menus'; render(); window.scrollTo(0,0);
    loadMenuAdmin().then(function(){ if (S.step === 'menus') render(); });
  });
}
/* the screen and the picker read two different lists — refresh both, always together,
   or the bar goes on offering a menu that has just been put away */
function menusChanged(){
  return Promise.all([loadMenuAdmin(), loadMenus()]).then(function(){
    if (S.step === 'menus') render();
    drawBarMenu();
    var box = $('mnubox'); if (box) box.innerHTML = menuInner();
  });
}
/* Made AND the dish put on it. Making a menu from inside a recipe means you want this
   recipe on it; anything else is two taps for one thought. */
function makeMenuFromBar(){
  var inp = $('bmnn'), err = $('bmne'), btn = $('bmnok');
  var nm = inp ? inp.value.trim() : '';
  if (!nm){ if (err) err.textContent = 'Give the menu a name.'; if (inp) inp.focus(); return; }
  if (MENUS.some(function(m){ return m.name.toLowerCase() === nm.toLowerCase(); })){
    if (err) err.textContent = 'There is already a menu called that — pick it from the list instead.';
    return;
  }
  var was = btn.textContent; btn.disabled = true; btn.textContent = 'Making…';
  if (err) err.textContent = '';
  newMenu(nm).then(function(m){
    if (!m) throw new Error('the menu came back empty');
    (S.menus = S.menus || []).push(m.id);
    closeNewMenu();
    return persistMenus('On ' + m.name + ' ✓');
  }).catch(function(ex){
    if (err) err.textContent = 'Not made — ' + menuPlain(ex.message);
  }).then(function(){
    btn.disabled = false; btn.textContent = was;
    drawBarMenu(); drawSaveBar();
    var box = $('mnubox'); if (box) box.innerHTML = menuInner();
  });
}
/* An unsaved recipe carries its menus to Save with everything else. A saved one is
   written now, and says so — the same as changing the section does. */
function persistMenus(msg){
  var sel = $('bmn');
  if (!S.id) { if (sel) flag(sel, msg.replace(/ ✓$/, '') + ' — saves with the recipe', false); return Promise.resolve(); }
  return saveRecipeMenus()
    .then(function(){ if (sel) flag(sel, msg, false); })
    .catch(function(e){ if (sel) flag(sel, 'Not changed — ' + menuPlain(e.message), true); });
}

/* ── which menus this dish is on ──
   Batches never get this box: a batch belongs to the dishes that use it. */
function menuInner(){
  var on = S.menus || [];
  if (MENU_ERR)
    return '<div class="mhd">On which menus</div>' +
      '<div class="msub bad">The menus cannot be read right now — ' + esc(menuPlain(MENU_ERR)) + ' ' +

      '<div class="msub">No menus yet. <b>Make the first one</b> and every dish can go on it.</div>' +
      '<div class="mnew"><input id="mnn" placeholder="À la carte 2026"><button class="okb" id="mnadd">Make this menu</button>' +
      '<span class="err" id="mne"></span></div>';

  return '<div class="mhd">On which menus</div>' +
    howto('menus', 'A dish can be on more than one — Burrata is on the à la carte and on Christmas. ' +
      'This is what the recipe card and the Food Bible filter by, so a waiter training on one menu ' +
      'sees only its dishes. <b>A dish on no menu shows on no card at all.</b>', 'What menus do') +
    '<div class="mchips">' + MENUS.map(function(m){
      var yes = on.indexOf(m.id) > -1;
      return '<button class="mchip'+(yes?' on':'')+'" data-menu="'+m.id+'">' +
        (yes ? '✓ ' : '') + esc(m.name) +
        (m.running ? '<span class="mrun">running now</span>' : (m.active ? '' : '<span class="moff">off</span>')) +
      '</button>'; }).join('') + '</div>' +
    (!on.length
      ? '<div class="msub bad">This dish is on no menu, so nobody will find it on the pass card or in the Food Bible. Tap one above.</div>'
      : '') +
    '<div class="mnew"><input id="mnn" placeholder="A new menu — Christmas 2026"><button class="newr" id="mnadd">＋ Make this menu</button>' +
      '<span class="err" id="mne"></span></div>';
}

/* ── the floor's half of the same recipe ──
   One record, two readers. The kitchen gets the method and the cost; the floor gets
   what to SAY. Never a second recipe to keep in step — a description that lives
   somewhere else is a description that goes stale the day the dish changes. */
function fohInner(){
  var m = S.method || {};
  return '<div class="mhd">For the floor</div>' +
    '<div class="msub">The dish in guest words.</div>' +
    howto('foh', 'The floor never sees the method or what it costs — it sees this, the allergens ' +
      'above, and the photo. Written here once, by you, because a dish described in two places ends ' +
      'up saying two different things.', 'What the floor sees') +

    FSEC.map(function(s){
      var v = m[s.k] || '';
      return '<div class="msec">' +
        '<label class="ml" for="m-'+s.k+'">'+esc(s.t)+'</label>' +
        '<textarea class="mbox" id="m-'+s.k+'" data-m="'+s.k+'" rows="1" ' +
          'placeholder="'+esc(s.p)+'">'+esc(v)+'</textarea>' +
        '<div class="mhint">'+esc(s.h)+' <span class="wc" id="wc-'+s.k+'">'+budget(s,v)+'</span></div>' +
        '<div class="whwrap" id="wh-'+s.k+'"></div>' +
        /* only the story gets the helper: it is the one box that is prose rather
           than instruction, so it is the one box where putting his Italian into
           English cannot change what anybody DOES. */
        (s.k === 'story' ? '<div id="whstory">' + whStoryHTML() + '</div>' : '') +
      '</div>';
    }).join('') +

    '<div class="msec" id="cutwrap">' + cutInner() + '</div>' +

    fohState(m) +
    '<button class="newr" id="seefoh">See exactly what the floor sees</button>';
}
/* Paper does not negotiate. The bible page was measured with every field written out
   and it closes at 297mm with nothing to spare, so these are the real lengths — said
   here, while it can still be shortened, instead of in the printed binder. */
function budget(s, v){
  if (s.lmax){
    var n = linesIn(v);
    if (!n) return '';
    return n > s.lmax
      ? '<b class="over">'+n+' lines — the page holds '+s.lmax+'</b>'
      : n + ' of ' + s.lmax + ' lines';
  }
  var w = wordsIn(v);
  if (!w) return '';
  return w > s.wmax
    ? '<b class="over">'+w+' words — past about '+s.wmax+' this runs onto a second sheet</b>'
    : w + ' of about ' + s.wmax + ' words';
}
function cutInner(){
  var set = (S.method && S.method.cutlery) || [];
  return '<label class="ml">Mise en place — what to set</label>' +
    '<div class="mhint" style="margin:0 0 8px">What this dish is eaten with.</div>' +
    '<div class="achips">' + CUTLERY.map(function(c){
      return '<button class="ach'+(set.indexOf(c)>-1?' on':'')+'" data-cut="'+esc(c)+'">'+esc(c)+'</button>';
    }).join('') + '</div>';
}
/* Blank fields are the phase we are in, not a fault — so this counts, once, quietly,
   and never marks the recipe as unfinished. */
/* Written and "fits on the page" are two different questions, and this line used to
   answer only the first — it said everything was written while four of its own word
   budgets were in the red underneath it, and the field that gets pushed onto the
   second sheet is the allergen strip. Answer both. */
function fohOver(m){
  return FSEC.filter(function(s){
    var v = (m && m[s.k]) || '';
    if (!String(v).trim()) return false;
    return s.lmax ? linesIn(v) > s.lmax : wordsIn(v) > s.wmax;
  }).map(function(s){ return s.t; });
}
function fohState(m){
  var miss = fohMissing(m), over = fohOver(m);
  var overLine = over.length
    ? ' <b class="over">Too long for one A4: ' + over.map(esc).join(', ') + '</b> — ' +
      'the page runs onto a second sheet and the allergens go with it.'
    : '';
  if (!miss.length)
    return '<div class="fstate' + (over.length ? '' : ' done') + '">' +
      (over.length ? 'Every part of the floor’s page is written.' + overLine
                   : 'Every part of the floor’s page is written.') + '</div>';
  return '<div class="fstate">Not written yet: <b>' + miss.map(esc).join('</b>, <b>') + '</b>. ' +
    'The page prints without them — each one just says so in its place.' + overLine + '</div>';
}

/* one field on the floor's screen — empty says so plainly rather than disappearing,
   because a field that vanishes when blank makes a half-written page look finished */
function fblock(lab, v, q){
  v = (v || '').trim();
  return '<div class="fblk"><span class="flab">'+esc(lab)+'</span>' +
    (v ? (q ? '<q>'+esc(v)+'</q>' : '<div class="fprose">'+esc(v)+'</div>')
       : '<div class="fprose none">Not written yet.</div>') + '</div>';
}
function flist(lab, v){
  var l = String(v||'').split(/\r?\n/).map(function(x){ return x.trim(); }).filter(Boolean);
  return '<div class="fblk"><span class="flab">'+esc(lab)+'</span>' +
    (l.length ? '<ul class="flst">'+l.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>'
              : '<div class="fprose none">Not written yet.</div>') + '</div>';
}

/* the floor's screen — read only, no cost, no method, no kitchen ingredient list */
function fohViewHTML(){
  var inh = inheritedAllergens(), mine = S.allergens || [];
  var all = mine.slice();
  Object.keys(inh).forEach(function(k){ if (all.indexOf(k) < 0) all.push(k); });
  var ord = ALLERGENS.map(function(a){ return a.k; });
  all.sort(function(a,b){ return ord.indexOf(a) - ord.indexOf(b); });
  var desc = ((S.method && S.method.foh) || '').trim();

  return '<div class="pane">' +
    '<div class="fhint">The floor’s screen — only what a guest can be told.</div>' +
    '<div class="fcard">' +
      '<div class="fnm">' + esc(S.name || 'Untitled') + '</div>' +
      (S.section ? '<div class="fsec">' + esc(S.section) + '</div>' : '') +
      (S.photos && S.photos.length
        ? '<div class="fphotos">' + S.photos.map(function(p){
            return '<img src="' + esc(p.u) + '" alt="' + esc(S.name) + '">'; }).join('') + '</div>'
        : '') +
      (desc
        ? '<div class="fdesc">' + esc(desc) + '</div>'
        : '<div class="fdesc none">The menu line is not written yet — the floor would see nothing here. ' +
          'Go back and write one under <b>For the floor</b>.</div>') +

      fblock('Say it like this', S.method && S.method.say, 'q') +
      fblock('The story', S.method && S.method.story) +
      flist('What is in it', S.method && S.method.ing) +
      flist('Garnish', S.method && S.method.garnish) +
      fblock('More information', S.method && S.method.more) +

      /* An untouched allergen row and a genuinely allergen-free dish look identical,
         and this is the one field on the page a guest's answer comes off. So with
         nothing ticked the floor is not shown a clean list — it is told it does not
         know, and to come and ask. */
      '<div class="falg' + (all.length ? '' : ' none') + '">' +
        (all.length
          ? '<b>Contains</b> ' + all.map(function(k){ return esc(allergenName(k)); }).join(' · ')
          : '<b>Not ticked yet</b> — the floor’s page will say it cannot answer an allergy ' +
            'question and to ask the kitchen. If the dish really carries none, tick nothing ' +
            'and it stays that way; it never claims the dish is clear on its own.') +
      '</div>' +
      (function(){
        var cut = (S.method && S.method.cutlery) || [];
        return cut.length
          ? '<div class="fcut"><b>Set</b> ' + cut.map(esc).join(' · ') + '</div>'
          : '<div class="fcut none">No cutlery ticked — the waiter’s page cannot say what to lay.</div>';
      })() +
      (S.price != null ? '<div class="fprice">' + fmt(S.price) + ' <small>AED</small></div>' : '') +
    '</div>' +
    '<button class="newr" id="backtokitchen">‹ Back to the recipe</button></div>';
}

/* ── what is in it, for anyone who has to ask ── */
function drawAlg(){ var a = $('alg'); if (a) a.innerHTML = algInner(); }
function algInner(){
  var mine = S.allergens || [], inh = inheritedAllergens();
  var all = mine.slice();
  Object.keys(inh).forEach(function(k){ if (all.indexOf(k) < 0) all.push(k); });
  var order = ALLERGENS.map(function(a){ return a.k; });
  all.sort(function(a,b){ return order.indexOf(a) - order.indexOf(b); });

  return '<div class="mhd">Allergens</div>' +
    /* A chef does not need six lines telling him to tap what is in his own dish. The one
       thing worth keeping in front of him is the part he cannot see: that nothing is
       guessed, so an untapped chip means the floor gets told nothing. */
    /* "tap what is in this recipe" is what a row of chips already looks like. What is
       left is the half he cannot see: nothing is guessed, so an untapped chip tells the
       floor nothing. */
    '<div class="msub">Nothing is guessed from an ingredient’s name — it is your tick.</div>' +
    howto('allerg', 'Anything a batch inside this dish carries is added on its own and says which ' +
      'batch it came from — change it on that batch and every dish using it follows. ' +
      '<b>Crustaceans</b> is prawn, lobster and crab; oysters, clams and mussels are ' +
      '<b>Molluscs</b>, on their own — “shellfish” covers both and is the word that gets this ' +
      'wrong. A missed allergen is the one mistake here that can hurt somebody.',
      'Batches, and the shellfish trap') +
    '<div class="achips">' + ALLERGENS.map(function(a){
      var on = mine.indexOf(a.k) > -1, viaB = inh[a.k];
      /* the chip stays just the word — at 360px "Fish from ZZ fish stock, inside ZZ
         cream sauce" would eat the whole row. Where it came from is spelled out in
         full on the Contains line underneath, which has the width for it. */
      return '<button class="ach'+(on?' on':'')+(viaB?' via':'')+'" data-alg="'+a.k+'"' +
        (viaB ? ' title="comes in from '+esc(viaB.join('; '))+'"' : '') + '>' + esc(a.t) + '</button>';
    }).join('') + '</div>' +
    (all.length
      ? '<div class="acon"><b>Contains</b> ' + all.map(function(k){
          return '<span class="aitem">'+esc(allergenName(k)) +
            (inh[k] ? ' <span class="asrc">from '+esc(inh[k].join('; '))+'</span>' : '') + '</span>';
        }).join('<span class="adot">·</span>') + '</div>'
      : '<div class="acon none">Nothing ticked yet — this recipe will show <b>no allergens</b> to the floor. ' +
        'If that is right, leave it; if it is not, tap them above.</div>');
}
/* ───── the method reads as steps ─────
   A dessert method is five or six things done in order, and written as one paragraph the
   cook at the pass has to read the whole block to find where he is. So the steps are
   RECOGNISED rather than demanded: a line each is a step, and a plain paragraph is still
   a perfectly good answer — it simply counts as one. Nothing is imposed on how he writes.

   The text stored is the text he typed. No new field, no format to learn, nothing to
   migrate — the line breaks he already puts in ARE the steps. */
function methodSteps(text){
  return String(text || '').split(/\r?\n/)
    .map(function(l){ return l.replace(/^\s*(?:\d+\s*[.)\-–]|[-–•*])\s*/, '').trim(); })
    .filter(function(l){ return l.length; });
}
/* Only ever offered, never done behind his back: it puts each sentence on its own line
   and he reads it back. A program guessing where a step ends inside "50 to 55 grams" and
   silently rewriting a method is not a trade worth making. */
function proseToSteps(text){
  return String(text || '').trim()
    .replace(/([.!?])\s+(?=[A-Z(])/g, '$1\n')
    .split(/\n/).map(function(l){ return l.trim(); }).filter(Boolean).join('\n');
}
/* `k` says which box this note belongs to. It used to be assumed to be the method, and the
   moment a second box wanted the same treatment that assumption would have rewritten the
   method from the plating box's button. */
function stepsNote(v, k){
  k = k || 'method';
  var st = methodSteps(v);
  if (!st.length) return '';
  if (st.length === 1){
    var words = st[0].split(/\s+/).length;
    /* a short one-liner is genuinely one step — leave him alone */
    if (words < 32) return '<div class="stepn">Reads as <b>one step</b>.</div>';
    return '<div class="stepn">Reads as <b>one step</b> of ' + words + ' words. ' +
      'At the pass that is a paragraph to read through.' +
      '<button class="stepb" data-mksteps="' + k + '">Put each sentence on its own line</button>' +
      '<span class="stepw">You can change any of it afterwards.</span></div>';
  }
  return '<div class="stepn">Reads as <b>' + st.length + ' steps</b>.' +
    '<ol class="steplist">' + st.map(function(s){
      return '<li>' + esc(s.length > 96 ? s.slice(0,96) + '…' : s) + '</li>'; }).join('') + '</ol></div>';
}
/* ───────── once it is made: how it is kept ─────────
   A batch is the only kind of recipe that gets put away. It is made hours or days before
   anybody eats it, and every time it is made the same three questions come up at the
   section — what does it go in, where does it live, how long is it good for. Nothing on
   this sheet asked them, so the answer lived in whichever chef made it last.

   ONE box, not three. Same call as the method on 2 August: three boxes nobody fills are
   three boxes to scroll past on every batch, and a chef writes "vac-pac, fridge, 3 days"
   in one line far quicker than he fills a form. The shelf life is inside it rather than
   on a line of its own — the placeholder shows the shape so it does not get left out.

   A main recipe never sees this. A dish is plated and goes out; it has "On the pass" for
   the only waiting it ever does. The key survives a save either way (see MKEYS), so a
   batch turned into a main and back again still says how to store it. */
function storeInner(){
  if (S.kind !== 'batch') return '';
  var v = (S.method && S.method.store) || '';
  return '<div class="mhd ph2">Once it is made</div>' +
    howto('store', 'What it goes in, where it lives and how long it is good for. ' +
      'It prints on the batch card and on the production sheet, next to the batch it ' +
      'belongs to — so whoever makes it and whoever finds it in the fridge a day later ' +
      'read the same answer. It can be left empty: a batch with nothing here saves ' +
      'perfectly well.', 'About storing it') +
    '<div class="msec">' +
      '<label class="ml" for="m-store">How to store it</label>' +
      '<textarea class="mbox" id="m-store" data-m="store" rows="1" ' +
        'placeholder="Vac-pac in 500 g bags, labelled with the date. Fridge. Use within 3 days.">' +
        esc(v) + '</textarea>' +
      '<div class="whwrap" id="wh-store"></div>' +
    '</div>';
}
/* ═════════ writing help — what the chef sees ═════════
   Two engines, one place on the screen. The free one runs the moment he leaves
   a box; the paid one runs once, after Save, and never makes him wait for it.

   The rule both obey: nothing changes until he taps. These chefs are partly
   learning English from this app, so a silent fix teaches nothing — and a
   silent fix that is WRONG puts a word into the printed Food Bible that no
   human ever typed. Accepting a whole box costs one tap instead. */
var WH_FIND = {};      /* box key -> findings from the free table pass */
var WH_ASK  = {};      /* box key -> questions about words nobody knows */
var WH_BUSY = {};      /* box key -> a question is being answered */

/* Every prose box on the sheet, so a word can be asked about against every
   sentence it appears in rather than one. */
function whBoxes(){
  var m = S.method || {}, out = {};
  ['mise','method','order','plating','store','foh','say','story','ing','garnish','more']
    .forEach(function(k){ if ((m[k] || '').trim()) out[k] = m[k]; });
  return out;
}

function whFixHTML(f, k, i){
  return '<div class="whrow">' +
      '<span class="whwas">' + esc(f.wrong) + '</span>' +
      '<span class="wharr">→</span>' +
      '<button class="whfix" data-whfix="' + k + ':' + i + '">' + esc(f.right) + '</button>' +
    '</div>';
}

/* A word nobody recognises. Never a fix — always a question, even when the
   answer looks certain. "It's what we call it" is always on screen, so a real
   house word is closed for good the first time it is raised, by anybody. */
function whAskHTML(a, k, i){
  if (WH_BUSY[k + ':' + i]) return '<div class="whask"><div class="whbusy">Looking at every recipe that uses it…</div></div>';
  return '<div class="whask">' +
      '<div class="whq">Nobody recognises <b>' + esc(a.wrong) + '</b>' +
        (a.right ? ' — did you mean <b>' + esc(a.right) + '</b>?' : '.') + '</div>' +
      (a.why ? '<div class="whwhy">' + esc(a.why) + '</div>' : '') +
      '<div class="whacts">' +
        (a.right ? '<button class="whyes" data-whyes="' + k + ':' + i + '">Yes, that\'s it</button>' : '') +
        '<button class="whno" data-whno="' + k + ':' + i + '">' + (a.right ? 'No — I\'ll type it' : 'Leave it') + '</button>' +
        '<button class="whno" data-whhouse="' + k + ':' + i + '">It\'s what we call it</button>' +
      '</div>' +
    '</div>';
}

function whDraw(k){
  var wrap = $('wh-' + k);
  if (!wrap) return;
  var fx = WH_FIND[k] || [], as = WH_ASK[k] || [];
  if (!fx.length && !as.length){ wrap.innerHTML = ''; fitBar(); return; }

  var h = '';
  if (fx.length){
    h += '<div class="whn"><b>' + fx.length + ' word' + (fx.length === 1 ? '' : 's') +
         '</b> to look at. Tap one to change it.</div>';
    h += fx.map(function(f, i){ return whFixHTML(f, k, i); }).join('');
    if (fx.length > 1) h += '<button class="whall" data-whall="' + k + '">Fix all ' + fx.length + '</button>';
    h += '<button class="whskip" data-whskip="' + k + '">Leave them</button>';
  }
  h += as.map(function(a, i){ return whAskHTML(a, k, i); }).join('');
  wrap.innerHTML = h;
  fitBar();
}

/* The free pass. No network, no cost, no waiting — and it returns nothing at
   all for most boxes, which is the whole point. */
function whScanBox(k){
  if (!window.WritingHelp) return;
  var v = (S.method || {})[k] || '';
  WH_FIND[k] = WritingHelp.scan(v);
  whDraw(k);
}

/* Every prose box on the sheet, read as soon as it is drawn. This is what makes
   the help findable at all — see the note in wireMethod. */
function whScanAll(){
  if (!window.WritingHelp) return;
  ['mise','method','order','plating','store','foh','say','story','ing','garnish','more']
    .forEach(function(k){ if ($('m-' + k)) whScanBox(k); });
}

/* Put a correction in, in front of him. Every occurrence in this box, because
   a word he wrote twice is one decision, not two. */
function whApply(k, f){
  var m = mth(), cur = String(m[k] || '');
  var re = new RegExp('(^|[^\\p{L}\\p{N}-])(' +
    f.wrong.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?![\\p{L}\\p{N}-])', 'giu');
  m[k] = cur.replace(re, function(all, pre){ return pre + f.right; });
  var box = $('m-' + k);
  if (box){ box.value = m[k]; grow(box); }
  drawSaveBar();
}

/* ── after Save, never during it ──
   Save writes, the ✓ shows, and this comes back a moment later above the save
   bar. It is never a gate: no signal means the free pass already ran and this
   one quietly does not, and the next save catches it. */
function whAfterSave(){
  if (!window.WritingHelp) return;
  var boxes = whBoxes();
  if (!Object.keys(boxes).length) return;
  WritingHelp.check(boxes).then(function(found){
    if (!found.length) return;
    var fresh = 0;
    found.forEach(function(f){
      /* somebody already answered this word — use the answer, do not ask twice */
      var known = WritingHelp.knownFix(f.wrong);
      var k = whBoxOf(boxes, f.wrong);
      if (!k) return;
      /* the free pass already has this one — do not show it twice */
      var dup = (WH_FIND[k] || []).some(function(x){ return WritingHelp.covers(x.wrong, f.wrong); });
      if (dup) return;
      if (known){
        (WH_FIND[k] = WH_FIND[k] || []).push({ wrong: f.wrong, right: known, sure: true });
      } else {
        (WH_ASK[k] = WH_ASK[k] || []).push(f);
      }
      fresh++;
    });
    if (!fresh) return;
    Object.keys(boxes).forEach(whDraw);
    flash(fresh === 1 ? 'One word to look at — it is on the sheet, above Save.'
                      : fresh + ' words to look at — they are on the sheet, above Save.');
  });
}

function whBoxOf(boxes, term){
  var re = new RegExp('(^|[^\\p{L}\\p{N}-])' +
    term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![\\p{L}\\p{N}-])', 'iu');
  var hit = null;
  Object.keys(boxes).forEach(function(k){ if (!hit && re.test(boxes[k])) hit = k; });
  return hit;
}

/* ═════════ the story helper ═════════
   He types what he knows, in Italian or English or both, and gets it back in
   English. It may not add a fact he did not give it: a story is read out to a
   guest as though it were true, so an invented grandmother is a lie the
   restaurant told. Starved of facts it asks instead of writing.

   His words stay in the box. Nothing is replaced until he taps Use this. */
var WH_STORY = null, WH_STORY_BUSY = false;

/* one textarea grows to whatever is written in it — no scrollbar inside a box */
function grow(t){ if (!t) return; t.style.height='auto'; t.style.height=(t.scrollHeight+2)+'px'; }
/* Every box has to be re-measured whenever the type size or the width changes —
   turning a phone on its side, or picking the sheet up off the laptop and using it
   with a finger, makes the same words take more lines. Sized once at 15px and left
   alone, the last steps of a method were cut off with nothing on screen to say so. */
/* textarea only — the dish code is a one-line input and sizing it by scrollHeight
   would stretch it to nothing on some browsers and a tall empty box on others */
function growAll(){ document.querySelectorAll('textarea.mbox').forEach(grow); }
function drawMethod(){
  var m = $('mth'); if (!m) return;
  m.innerHTML = methodInner(); wireMethod();
}
/* Nothing typed into these boxes may depend on `S.method` already existing. It used
   to, and the throw was silent: the words stayed on the screen and never reached the
   record. One line, in front of every write, so no route into this sheet can ever
   swallow a method again. */
function mth(){ if (!S.method) S.method = emptyMethod(); return S.method; }
function wireMethod(){
  MSEC.forEach(function(s){
    var t = $('m-'+s.k); if (!t) return;
    grow(t);
    t.addEventListener('input', function(){
      mth()[s.k] = this.value; grow(this);
      /* the count follows what he is typing — never redraw the box he is typing in */
      var n = $('stepn-'+s.k); if (n) n.innerHTML = stepsNote(this.value, s.k);
    });
    /* on blur, not on keystroke: he has finished the thought and is already
       looking away, which is the cheapest possible moment to interrupt. A red
       squiggle following the cursor is a nag, and it fires on half-typed words. */
    t.addEventListener('blur', function(){ whScanBox(s.k); });
  });
  /* the floor's fields carry a live length against what one A4 actually holds */
  FSEC.forEach(function(s){
    var t = $('m-'+s.k); if (!t) return;
    grow(t);
    t.addEventListener('input', function(){
      mth()[s.k] = this.value; grow(this);
      var w = $('wc-'+s.k); if (w) w.innerHTML = budget(s, this.value);
      drawFohState();
    });
    t.addEventListener('blur', function(){ whScanBox(s.k); });
  });
  var c = $('m-code');
  if (c) c.addEventListener('input', function(){ mth().code = this.value; });
  /* plating behaves exactly like the method — a new line is a step, and it says how many */
  var pl = $('m-plating');
  if (pl){
    grow(pl);
    pl.addEventListener('input', function(){
      mth().plating = this.value; grow(this);
      var n = $('stepn-plating'); if (n) n.innerHTML = stepsNote(this.value, 'plating');
    });
    pl.addEventListener('blur', function(){ whScanBox('plating'); });
  }
  /* batch only, and it may not be on the sheet at all — the guard is the same one every
     other box here uses, because a main recipe never draws it */
  var st = $('m-store');
  if (st){
    grow(st);
    st.addEventListener('input', function(){ mth().store = this.value; grow(this); });
    st.addEventListener('blur', function(){ whScanBox('store'); });
  }
  /* ⚠ 7 Aug 2026 — WITHOUT THIS, NOBODY EVER SAW IT.
     The check used to run on blur only. That is right for a box he is EDITING,
     but it meant opening a recipe showed nothing at all: a chef could open
     Chocolate coin, read "papin bag" in the method, and never be told — unless
     he happened to tap into that exact box and back out of it again. Francesco
     opened the recipe, saw no difference, and was right.
     So: every box is read the moment the sheet is drawn. Free, offline, and it
     still shows nothing when there is nothing to say. */
  whScanAll();
  ['pass','crockery'].forEach(function(k){
    var e = $('m-'+k); if (!e) return;
    e.addEventListener('input', function(){
      /* minutes is a number of minutes — "4 min" typed in by hand is still four */
      mth()[k] = (k === 'pass') ? this.value.replace(/[^\d.]/g,'') : this.value;
      if (k === 'pass' && this.value !== mth()[k]) this.value = mth()[k];
    });
  });
}

  if (f) f.outerHTML = fohState(S.method || {});

/* ── the backdrop, taken to a true white ──────────────────────────────────────────
   The Food Bible lays a dish photograph straight onto the paper with no frame: the
   white the dish was shot on is made to take the colour of the sheet, so the plate
   appears to sit on the page. That only works if the backdrop really is white. The
   house shoot is not — measured off the files, the ground runs 233–250 and carries a
   blue cast (243,244,249) against warm paper (251,247,240). Near enough to look right
   in a folder, far enough to print as a cool grey panel behind every plate.

   So it is fixed here, once, when the photo comes in, rather than asked of anybody.

   Two things it must not do. It must not touch a photograph that has no seamless
   backdrop — a plate on a table, a pass, a fridge — so the ground is measured first
   and anything dark or busy is left completely alone. And it must not eat the white
   china, which is only a little darker than the backdrop behind it. Hence the ramp:
   nothing below the floor moves at all, the ground is carried to white, and in between
   it eases, so no edge appears where the correction stops.

   Returns true if it changed anything, because the person who loaded the photo should
   be told the app touched it. */
function levelGround(ctx, w, h){
  var d, p;
  try { d = ctx.getImageData(0, 0, w, h); p = d.data; }
  catch(e){ return false; }                 /* never let a colour fix break an upload */

  /* the ground, read off a one-pixel border — a seamless backdrop reaches every edge */
  var lum = [], i, x, y, o;
  var stepX = Math.max(1, Math.floor(w/120)), stepY = Math.max(1, Math.floor(h/120));
  for (x = 0; x < w; x += stepX){
    for (y of [1, h-2]){ o = (y*w + x)*4; lum.push(0.299*p[o] + 0.587*p[o+1] + 0.114*p[o+2]); }
  }
  for (y = 0; y < h; y += stepY){
    for (x of [1, w-2]){ o = (y*w + x)*4; lum.push(0.299*p[o] + 0.587*p[o+1] + 0.114*p[o+2]); }
  }
  if (lum.length < 40) return false;
  lum.sort(function(a,b){ return a-b; });
  var pct = function(q){ return lum[Math.min(lum.length-1, Math.floor(lum.length*q))]; };
  /* Read at the MIDDLE of the border, not the darkest tenth of it. These plates are lit
     with a soft shadow that reaches the edge of the frame, so the darkest tenth is the
     shadow, not the backdrop — judged on that, the desserts came out as "no backdrop"
     and were left grey. The median is the paper the dish was stood on. */
  var g50 = pct(0.50), g90 = pct(0.90);

  /* not a studio backdrop: too dark to be one, or too varied to be seamless. A
     photograph of the dining room reads 81 here and is left completely alone. */
  if (g50 < 205 || (g90 - g50) > 30) return false;
  /* already white enough that touching it would only add risk */
  if (g50 >= 252) return false;

  /* a fixed 34-wide ramp under the backdrop: wide enough that the correction fades in
     invisibly, narrow enough that it never reaches down into the food */
  var HI = g90, LO = Math.max(150, HI - 34);
  var span = HI - LO, t;
  for (i = 0; i < p.length; i += 4){
    var L = 0.299*p[i] + 0.587*p[i+1] + 0.114*p[i+2];
    if (L <= LO) continue;
    t = L >= HI ? 1 : (L - LO) / span;
    t = t * t * (3 - 2*t);                  /* smoothstep — no visible seam at the join */
    p[i]   += (255 - p[i])   * t;
    p[i+1] += (255 - p[i+1]) * t;
    p[i+2] += (255 - p[i+2]) * t;
  }
  ctx.putImageData(d, 0, 0);
  return true;
}

/* A kitchen photo off a phone is 4–8 MB. Shrunk to the long side of 1400px it is
   still sharper than any screen it will be read on, and small enough to save with
   the recipe. Never re-encoded twice — this runs once, when the photo comes in. */
function shrinkPhoto(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), im = new Image();
    im.onload = function(){
      URL.revokeObjectURL(url);
      var w = im.naturalWidth, h = im.naturalHeight, MAX = 1400;
      if (!w || !h) return rej(new Error('that image could not be read'));
      var sc = Math.min(1, MAX/Math.max(w,h));
      var c = document.createElement('canvas');
      c.width = Math.round(w*sc); c.height = Math.round(h*sc);
      var cx = c.getContext('2d', { willReadFrequently:true });
      cx.drawImage(im, 0, 0, c.width, c.height);
      /* before the encode, not after — the backdrop is corrected on the pixels the
         recipe will actually keep, and the photo is still only encoded once */
      var levelled = levelGround(cx, c.width, c.height);
      res({ u: c.toDataURL('image/jpeg', 0.75), n: file.name || 'photo', levelled: levelled });
    };
    im.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('that is not an image the app can open')); };
    im.src = url;
  });
}
function addPhotos(files){
  var list = [].slice.call(files).filter(function(f){ return /^image\//.test(f.type); });
  var note = $('pnote'); if (note) note.textContent = 'Adding '+list.length+' photo'+(list.length===1?'':'s')+'…';
  if (!list.length){
    if (note) note.textContent = 'That is not a photo — pick a picture off the phone or take one.';
    return;
  }
  var bad = [];
  Promise.all(list.map(function(f){
    return shrinkPhoto(f).catch(function(e){ bad.push(f.name); return null; });
  })).then(function(out){
    var ok = out.filter(Boolean), cleaned = 0;
    ok.forEach(function(p){
      if (p.levelled) cleaned++;
      /* the flag is for the sentence below, not for the recipe — only the photo and its
         name are kept, so nothing new lands in the saved record */
      S.photos.push({ u: p.u, n: p.n });
    });
    drawMethod();
    var n = $('pnote');
    if (n && bad.length) n.textContent = bad.length+' could not be read — '+bad.join(', ')+'. The rest are here.';
    else if (n) n.textContent = S.photos.length+' photo'+(S.photos.length===1?'':'s') +
      /* say it plainly: the app changed the picture, and this is what it did */
      (cleaned ? ' · backdrop taken to white on '+(cleaned===1?'one':cleaned) : '') +
      ' · Save to keep them';
  });
}

function foot(){
  if (S.step !== 'sheet') return;
  /* ── while lines are picked, this strip answers HIS question ──
     It takes over the costing rather than sitting beside it: two totals on one strip,
     one of the sheet and one of a handful of lines, is exactly how the wrong number
     gets read out loud. The costing comes back the moment nothing is picked, in
     whichever state — open or shut — he left it in. */
  if (S.sel && S.sel.length){
    var s = pickedTotals(), f0 = $('foot');
    var amt = [];
    if (s.g)   amt.push({ v:fmt(s.g,   s.g   % 1 ? 1 : 0), u:'G' });
    if (s.ml)  amt.push({ v:fmt(s.ml,  s.ml  % 1 ? 1 : 0), u:'ML' });
    if (s.pcs) amt.push({ v:fmt(s.pcs, s.pcs % 1 ? 1 : 0), u:s.pcs === 1 ? 'PIECE' : 'PIECES' });
    f0.classList.add('sel');
    f0.classList.remove('shut');            /* it is one line either way — never 200px */
    f0.innerHTML = '<div class="slim">' +
      (amt.length
        ? amt.map(function(a){ return '<span class="sv">'+a.v+' <small>'+a.u+'</small></span>'; }).join('')
        : '<span class="sv">—</span>') +
      '<span class="sv">'+(s.noCost ? 'at least ' : '')+fmt(s.cost)+' <small>AED</small></span>' +
      '<span class="spick">'+s.n+' picked</span>' +
      ((s.noQty || s.noCost)
        ? '<span class="swhat">' +
            [ s.noQty  ? '<b>'+s.noQty+'</b> with no amount yet, not counted' : '',
              s.noCost ? s.noCost+' with no cost yet' : '' ].filter(Boolean).join(' · ') +
          '</span>'
        : '') +
      '<button class="sclr" id="selclr">Clear</button></div>';
    padForFoot();
    return;
  }
  $('foot').classList.remove('sel');
  var t = totals();
  var mk   = (S.makesQty && S.makesQty > 0) ? S.makesQty : null;
  var each = mk ? t.total / mk : null;              /* per portion, or per kg / L / piece */
  var net  = S.price ? S.price/1.225 : null;
  var fc   = (net && each != null) ? each/net*100 : null;
  /* When a batch in this dish carries no cost, or an ingredient has no price on the
     stock take, every one of these figures is a FLOOR, not the number. It used to be
     printed in the same type as a finished one with the reason underneath, and 15.3%
     against a real 23.6% is the kind of figure a menu gets priced on. Say "at least"
     on the face of it, so the number can never be read as settled. */
  var short_ = !!(t.badBatch.length || t.noPrice || t.noProd || t.noQty);
  var least  = function(v){ return short_ ? '<span class="atleast">at least</span> ' + v : v; };
  var mu   = S.makesUnit || (S.kind==='main' ? 'portions' : 'kg');
  /* the one thing that must survive being collapsed: a number that is knowably short,
     or a batch with no "makes", is not something to hide behind a tap */
  var needsSaying = (mk==null) ? (S.kind==='batch' ? 'no “makes” yet' : 'no portions yet')
                  : t.badBatch.length ? t.badBatch.length + ' batch' + (t.badBatch.length===1?'':'es') + ' with no cost'
                  : t.noPrice ? t.noPrice + ' with no price'
                  : t.noProd ? t.noProd + ' without an ingredient'
                  : '';
  var mkIn = '<input class="pr" id="mk" inputmode="decimal" placeholder="—" style="width:56px" value="'+(S.makesQty==null?'':S.makesQty)+'">';
  var muSel = '<select class="mu" id="mu">' + ['kg','L','pcs'].map(function(u){
                return '<option value="'+u+'"'+(mu===u?' selected':'')+'>'+u+'</option>'; }).join('') + '</select>';
  /* ── out of the way while he works ──
     This bar is fixed to the bottom, and open it is two hundred pixels of the sheet
     he cannot see. A chef writing a recipe is reading the rows, not the food cost —
     so it sits as one slim line and opens when he wants it, which is when he is
     pricing rather than when he is typing.

     The line still carries the two numbers worth a glance, cost and food cost, so
     collapsing it never means losing sight of where the dish is. */
  var f = $('foot');
  f.classList.toggle('shut', !!S.footShut);
  if (S.footShut){
    f.innerHTML = '<div class="slim" id="footopen">' +
      '<span class="sv">'+(short_?'at least ':'')+fmt(t.total)+' <small>AED</small></span>' +
      (S.kind==='main'
        ? '<span class="sv">'+(fc==null?'—':(short_?'at least ':'')+fmt(fc,1)+'%')+' <small>FOOD COST</small></span>'
        : '<span class="sv">'+(each==null?'—':(short_?'at least ':'')+fmt(each))+' <small>PER '+esc(mu.replace('pcs','PIECE').toUpperCase())+'</small></span>') +
      (needsSaying ? '<span class="sflag">'+needsSaying+'</span>' : '') +
      '<span class="sopenb">Open the costing ▼</span></div>';   /* it opens downward now */
    padForFoot();
    drawAlg();
    return;
  }
  f.innerHTML = '<div class="in"><div class="grp">' +
    '<div><div class="l">Cost</div><div class="v">'+least(fmt(t.total))+' <small>AED</small></div></div>' +
    (S.kind==='main'
      ? '<div><div class="l">Makes</div><div class="v">'+mkIn+' <small>PORTIONS</small></div></div>' +
        '<div><div class="l">Each portion</div><div class="v">'+(each==null?'—':least(fmt(each)))+' <small>AED</small></div></div>' +
        '<div><div class="l">Menu price</div><div class="v"><input class="pr" id="pr" inputmode="decimal" placeholder="—" value="'+(S.price==null?'':S.price)+'"></div></div>' +

document.addEventListener('change', function(e){

  if (t.classList.contains('prod') && (t.value === '__add' || t.value === '__batch')){
    var act = t.value; t.value = r.code || '';        /* the dropdown is not the answer, it starts one */
    /* Open the form on the unit he already wrote. It defaulted to kg, so "0.5 L" met
       a form that said "sold by kg" and the litres were quietly re-read as grams. */
    if (act === '__add'){
      r.adding = true; r.adj = false;
      if (!r.addUnit) r.addUnit = soldByOf(r.unit || r.typedUnit);
      redrawRow(+i);
      var f = document.querySelector('[data-i="'+i+'"][data-f="anm"]'); if (f){ f.focus(); f.select(); }
    } else makeBatchFor(+i);

  }
  if (t.classList.contains('prod')){
    var wasStale = isStale(r), oldCode = r.code, oldName = itemOf(r) && itemOf(r).name;
    r.code = t.value || null;
    if (wasStale && r.code && r.code !== oldCode){
      SWAPS.push({ from:oldCode, fromName:oldName, to:r.code,
                   toName:(r.opts.filter(function(o){ return o.code===r.code; })[0]||{}).name });
      delete RETIRED[oldCode];
    }
    if (r.code){
      var _it = itemOf(r), _al = unitsFor(_it), _want = r.unit || r.typedUnit;
      if (_al.indexOf(_want) > -1) r.unit = _want;
      else {
        r.unit = defUnit(_it);
        if (r.typedUnit && r.typedUnit !== '?' && r.qty != null){  /* 2 pcs sold by the kilo is NOT 2 g */
          r.mismatch = r.typedUnit; r.qty = null;
        }
      }
      /* and a bare count — "1 lemon" — of something sold by weight is not 1 gram */
      if (!r.typedUnit && r.qty != null && baseOf(_it) !== 'pcs'){ r.bare = r.qty; r.qty = null; }
      if (baseOf(_it) === 'pcs'){ r.bare = null; r.noMeasure = false; }
    }
    /* the "on this sheet twice" note lives on BOTH lines, and the other one is not
       the row being redrawn — so when a pick creates or clears a pair, the sheet is
       drawn, not the row. Everything else stays a single-row redraw. */
    var pair = r.code && S.rows.filter(function(x){ return x.code === r.code; }).length > 1;
    var wasPair = oldCode && S.rows.filter(function(x){ return x.code === oldCode; }).length === 1;
    if (pair || wasPair) rows(); else redrawRow(+i);
    foot(); swapbar();
    var next = -1;                                          /* stay in the Ingredient column */
    for (var k=+i+1;k<S.rows.length;k++) if (!S.rows[k].code){ next=k; break; }
    if (next > -1){ var s = document.querySelector('.prod[data-i="'+next+'"]'); if (s) s.focus(); }
    return;

  if (t.dataset.f === 'afr'){ r.addFree = t.checked; redrawRow(+i); return; }
  if (t.dataset.f === 'unit'){
    /* the dash on a line that has not picked anything means "not said yet", not a unit */
    if (t.value === '—'){ r.unit = null; r.mismatch = null; redrawRow(+i); foot(); return; }
    /* 180 typed as grams, then the box flipped to kg, used to become 180 KILOS — the
       footer said "at least 36,000.00 AED · 28451.6% food cost" and it was allowed.
       The amount is a real amount, not a number that happens to sit next to a word:
       change the word and the number follows. Only between the same kind of measure —
       g↔kg and ml↔L. Anything else is a different thing and is left alone. */
    var was = r.unit, now = t.value, SCALE = { 'g|kg':0.001, 'kg|g':1000, 'ml|l':0.001, 'l|ml':1000 };
    var k = SCALE[String(was||'').toLowerCase() + '|' + String(now||'').toLowerCase()];

    var it = { code:mintCode(), name:nm, group:'Added by you', unit:un, price:pr,

      /* He wrote "0.5 L", then said this thing is sold by the litre — so litres is the

         a thousand times too small again on the card somebody cooks from. */
      var want = rr.unit || rr.typedUnit, allow = unitsFor(it);

        if (want && want !== '?' && rr.qty != null){ rr.mismatch = want; rr.qty = null; }

/* ───────── bringing in more than one file ─────────
   The à la carte folder is sixty workbooks and one of them — Risotto Bosco — holds
   five recipes on its own. One file at a time meant sixty trips through pick, read,
   review, create, and that is the difference between an afternoon and a week.

   Every file is read, and a file that cannot be read is NAMED. Silently dropping
   three of sixty and showing a confident total is how you find out in November that
   Rombo was never written. */
var READABLE = /\.(xlsx|xlsm|xls|csv|docx|pdf)$/i;

function readMany(fileList){
  var files = [].slice.call(fileList).filter(function(f){ return READABLE.test(f.name); });
  var skipped = [].slice.call(fileList).length - files.length;
  if (!files.length) return Promise.reject(new Error(
    skipped ? 'none of those ' + skipped + ' files is an Excel, Word or PDF file'
            : 'no files picked'));

  /* "Reading…" and nothing else is indistinguishable from a page that has died —
     which is exactly what it looked like. Say which file it is on, and once it has
     been going a while say that a big folder takes minutes, so waiting is a decision
     rather than a guess. The file name is also the one thing needed to find out
     WHICH workbook stopped it, if one ever does. */
  var st = $('brs'), done = 0, now = '', began = new Date().getTime();
  var say = function(){
    if (!st) return;
    st.className = 'brn';
    var slow = (new Date().getTime() - began) > 15000;
    st.textContent = 'Reading ' + done + ' of ' + files.length + (now ? ' — ' + now : '') + '…' +
      (slow ? '  (' + files.length + ' files takes a few minutes — leave it running)' : '');
  };
  say();

  /* Read them in small groups. Sixty spreadsheets opened at once on a laptop that is
     also running service is how a tab dies with no message at all. */
  var out = [], failed = [], i = 0;
  function step(){
    if (i >= files.length) return Promise.resolve();
    var group = files.slice(i, i + 4); i += 4;
    return Promise.all(group.map(function(f){
      now = f.name; say();
      try { console.log('[recipes import] reading', f.name); } catch(x){}
      return readAnyFile(f)
        .then(function(res){
          done++; say();
          var stem = f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim();
          (res.recipes||[]).forEach(function(r){
            if (!r.name) r.name = stem;
            r.how = res.how; r.file = f.name;
            out.push(r);
          });
          if (!(res.recipes||[]).length)
            failed.push({ name:f.name, why:'nothing in it looks like a recipe' });
        })
        .catch(function(e){ done++; say(); failed.push({ name:f.name, why:plain(e.message) });
          try { console.warn('[recipes import] could not read', f.name, e); } catch(x){} });
    })).then(step);
  }

  return step().then(function(){
    return { recipes:out, failed:failed, files:files.length, skipped:skipped,
             how:(out[0] && out[0].how) || 'the files' };
  });
}

function handlePicked(fileList){
  if (!fileList || !fileList.length) return;
  /* ── take a copy of the list, now, before anything is read ──
     The input is reset the instant this returns — `this.value=''` — so that picking
     the SAME file twice still fires. Resetting it empties the live FileList this
     argument points at, and every look at fileList[0] after the read is therefore a
     look at nothing.

     That is the bug that stopped a workbook importing all day. It only bit a single
     file holding MORE than one recipe — the ordinary case, a dish with its sub-recipes
     — because that path is the one that reads fileList[0].name to label the screen.
     It threw, the catch below read the same dead thing and threw again, and a thrown
     error inside a catch reaches nobody: no message, and "Reading 1 of 1" on screen
     for ever. It looked like a hang and it was never a hang.

     Every test I ran passed because a hand-built array does not empty itself. */
  var files = [].slice.call(fileList);
  if (!files.length) return;
  var many = files.length > 1;
  var st = $('brs');
  if (st){ st.className = 'brn'; st.textContent = 'Reading ' + (many ? files.length + ' files…' : files[0].name + '…'); }

  readMany(files).then(function(res){
    if (!res.recipes.length){
      throw new Error(res.failed.length
        ? 'none of those ' + res.files + ' files could be read. ' +
          res.failed.slice(0,3).map(function(f){ return f.name + ' — ' + f.why; }).join('; ') +
          (res.failed.length > 3 ? '; and ' + (res.failed.length-3) + ' more' : '')
        : 'nothing in that file looks like a recipe — I need a Quantity / Unit / Name list, ' +
          'like your Standard Recipe Form');
    }
    /* One recipe out of one file still goes straight to the sheet, exactly as before —
       nothing about the single-file way of working changes. */
    if (!many && res.recipes.length === 1 && !res.failed.length){
      useImported(res.recipes[0]);
    } else {
      res.fileName = many ? res.files + ' files' : files[0].name;
      S.found = res; S.fq = ''; S.step = 'found';
    }
    render(); window.scrollTo(0,0);
  }).catch(function(err){
    var s = $('brs');
    /* Name the file. "Cannot read properties of undefined" tells a chef nothing and
       tells whoever has to fix it nothing either — which of sixty workbooks was it? */
    var which = many ? 'one of those ' + files.length + ' files'
                     : '“' + files[0].name + '”';
    var msg = plain(err.message);
    if (/undefined|null|not a function|Cannot read/i.test(msg))
      msg = 'the app tripped over something in it (' + msg + '). Send me the file and ' +
            'I will make it read — nothing has been saved.';
    if (s){ s.className = 'brn bad'; s.textContent = 'Could not use ' + which + ' — ' + msg; }
    try { console.error('[recipes import]', files.map(function(f){ return f.name; }), err); } catch(x){}
  });
}
