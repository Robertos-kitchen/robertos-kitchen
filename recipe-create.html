      }).join('');
      $('lnote').innerHTML = list.length + ' of ' + ING.length + ' shown' + (list.length>300 ? ' (first 300)' : '') +
        '. <b>Works out at</b> is the price per kilo or litre once the pack is opened up — ' +
        packs + ' of these are sold by the pack, not by weight. ' +
        (unread ? '<b>'+unread+'</b> have a unit the app can\'t read; those are listed for Aung rather than guessed. ' : '') +
        '<br><br><b>This list is Aung\'s newest stock take, and nothing else.</b> Earlier months are not used at all. ' +
        'When a stock take drops an item, any recipe using it carries no cost for that line and asks you to point ' +
        'at what replaces it — an old price is a wrong price.' +
        /* Say plainly whether the things he adds are being kept. This screen used to
           promise it and not do it. */
        (MINE_ERR
          ? '<br><br><b class="bad">Your own ingredients cannot be read right now</b> — ' + esc(minePlain(MINE_ERR)) +
            ' Anything you add will work for this sitting and will not come back. Say so before you rely on it.'
          : '<br><br><b>Anything you add here is kept</b> and is on your list every time you open this screen, ' +
            'marked <span class="mine">yours</span>. If Aung\'s next stock take carries the same code, ' +
            '<b>his price takes over</b> and yours is ignored.');
    };
    if (S.find){                                     /* came from a row — land on that item */
      var hit = pool().filter(function(i){ return i.code === S.find; })[0];
      if (hit) $('lq').value = hit.name;
      S.find = null;
    }
    $('lq').addEventListener('input', draw); $('lg').addEventListener('change', draw);
      $('lt').addEventListener('change', draw); wireAdd(draw); draw();
  }

  else if (S.step === 'saved'){
    b.classList.add('off');
    /* Searching looks in the removed ones too. If the only Vitello you ever wrote was
       removed last month, a search that says "nothing found" is a lie that makes you
       write it twice — so a match that is archived is shown, marked, without you
       having to know to open the removed list first. */
    var all   = S.sq ? findRecipes(S.sq, S.saved) : S.saved;
    var live  = all.filter(function(r){ return !r.archived; });
    var gone  = all.filter(function(r){ return  r.archived; });
    /* the headline count is what he can actually open. The removed ones are still loaded
       — search looks in them, and the Removed folder puts them back — but "69 saved" over
       a list of 30 openable recipes is a number that cannot be made to add up. */
    var nlive = S.saved.filter(function(r){ return !r.archived; }).length;
    var card = function(r){
      var mu2 = r.makes_unit || '';
      if (mu2 === 'portions' && r.makes_qty == 1) mu2 = 'portion';
      var makes = r.makes_qty ? r.makes_qty+' '+mu2 : null;
      var lv = r.archived ? '' : levelOf(r);
      return '<div class="srow'+(S.id===r.id?' on':'')+(r.archived?' gone':'')+(lv?' lv-'+lv:'')+'" id="row-'+r.id+'">' +
        '<button class="sopen" data-open="'+r.id+'">' +
          '<span class="sn">'+esc(r.name)+'</span>' +
          '<span class="sm">'+(r.section?esc(r.section)+' · ':'') +
            (makes ? 'makes '+esc(makes) : '<i>doesn\'t say how much it makes</i>')+'</span>' +
        '</button>' +
        (r.archived ? needsWork(r) : marksHTML(r)) +
        '<span class="sd">'+new Date(r.updated_at).toLocaleDateString('en-GB',{day:'numeric',month:'short'})+'</span>' +
        /* Quieter, but it keeps the WORD. A bare ⋯ reads as "more options" and this one
           archives the recipe on the first tap when nothing depends on it — and the
           handler writes '…' into the button as its working state, which against a ⋯ is
           no change at all. Nothing that destroys something may be unlabelled. */
        (r.archived ? '<button class="srm" data-undo="'+r.id+'">Put it back</button>'
                    : '<button class="srm quiet" data-rmr="'+r.id+'" ' +
                        'aria-label="Remove ‘'+esc(r.name)+'’">Remove</button>') +
      '</div>';
    };
    /* ── the folders ──
       Menu first, then the section inside it, then the dishes. Three hundred recipes in
       one column is a wall you scroll past rather than read; the folder you want is one
       of about eight, and the dish is one of about nine once you are in it.

       A dish on three menus shows up in all three. That is not a duplicate — it really
       is on three menus, and Remove takes the recipe away, not the copy. */
    var folders = function(){
      var out = [], mains2 = live.filter(function(r){ return r.kind==='main'; });
      SAVEDMENUS.forEach(function(m){
        var n = mains2.filter(function(r){ return menusOf(r).indexOf(m.id) >= 0; }).length;
        /* a menu that has been put away is only worth a folder while something is still
           on it — an empty one that is still running is worth showing, so he can see it */
        if (!n && m.archived) return;
        out.push({ key:m.id, name:m.name, n:n, dim:!n || m.archived,
                   note: m.archived ? 'put away' : (n ? '' : 'nothing on it yet') });
      });
      var loose = mains2.filter(function(r){ return !menusOf(r).length; }).length;
      if (loose) out.push({ key:'__none', name:'Not on a menu', n:loose,
                            note:'written, but not put on anything yet' });
      var nb = live.filter(function(r){ return r.kind==='batch'; }).length;
      if (nb) out.push({ key:'__batch', name:'Batch recipes', n:nb,
                         note:'sauces, stocks, doughs — used inside the dishes' });
      if (gone.length) out.push({ key:'__gone', name:'Removed', n:gone.length, dim:true,
                                  note:'nothing is destroyed — put any of them back' });
      return out;
    };
    /* what is actually in the open folder */
    var inFolder = function(k){
      if (k === '__gone')  return gone;
      if (k === '__batch') return live.filter(function(r){ return r.kind==='batch'; });
      var mains3 = live.filter(function(r){ return r.kind==='main'; });
      if (k === '__none')  return mains3.filter(function(r){ return !menusOf(r).length; });
      return mains3.filter(function(r){ return menusOf(r).indexOf(k) >= 0; });
    };
    var foldName = function(k){
      return k === '__none'  ? 'Not on a menu'
           : k === '__batch' ? 'Batch recipes'
           : k === '__gone'  ? 'Removed'
           : menuNameOf(k);
    };
    /* the sections present in this folder, in his order, with the unsectioned last */
    var groupsOf = function(rs){
      var seen = {}, g = [];
      rs.forEach(function(r){
        var s = r.section || '__nosec';
        if (!seen[s]){ seen[s] = { key:s, name:(r.section || 'No section yet'), rs:[] }; g.push(seen[s]); }
        seen[s].rs.push(r);
      });
      g.sort(function(a,b){
        if (a.key === '__nosec') return 1;
        if (b.key === '__nosec') return -1;
        var d = secOrder(a.key) - secOrder(b.key);
        return d || a.name.localeCompare(b.name);
      });
      return g;
    };
    var fbtn = function(f){
      return '<button class="fold'+(f.dim?' dim':'')+'" data-fold="'+esc(f.key)+'">' +
        '<span class="ft"><span class="fn">'+esc(f.name)+'</span>' +
        '<span class="fm">'+(f.note ? esc(f.note) : '&nbsp;')+'</span></span>' +
        '<span class="fc">'+f.n+'</span></button>';
    };
    var sbtn = function(g){
      return '<button class="fold" data-fsec="'+esc(g.key)+'">' +
        '<span class="ft"><span class="fn">'+esc(g.name)+'</span>' +
        '<span class="fm">&nbsp;</span></span>' +
        '<span class="fc">'+g.rs.length+'</span></button>';
    };

    var body;
    if (S.sq){
      /* searching goes straight past the folders — you are looking for one dish and you
         do not know, or care, which menu it is on */
      var mains = live.filter(function(r){ return r.kind==='main'; });
      var bats  = live.filter(function(r){ return r.kind==='batch'; });
      body = (!live.length && !gone.length
              ? '<div class="todo"><b>Nothing saved matches “'+esc(S.sq)+'”.</b> ' +
                'Every word you type has to be in the name or the section, so fewer words ' +
                'find more — try just “vitello”. If it really isn’t written yet, ' +
                '<b>Start a new recipe</b> above.</div>'
              : '<div class="crumb">Looking through all '+nlive+' recipes, every menu.</div>') +
             (mains.length ? '<div class="shd">Main recipes · '+mains.length+'</div>' + mains.map(card).join('') : '') +
             (bats.length  ? '<div class="shd">Batch recipes · '+bats.length+'</div>' + bats.map(card).join('')  : '') +
             (gone.length  ? '<div class="shd">Removed — but it matches, so here it is</div>' + gone.map(card).join('') : '');
    }
    else if (S.foldErr){
      body = '<div class="todo"><b>Could not work out which menu each recipe is on, so they are ' +
             'all listed together below.</b> Nothing is lost and nothing is wrong with the recipes — ' +
             'the folders come back on their own next time the list loads.</div>' +
             (live.filter(function(r){ return r.kind==='main'; }).length
               ? '<div class="shd">Main recipes</div>' + live.filter(function(r){ return r.kind==='main'; }).map(card).join('') : '') +
             (live.filter(function(r){ return r.kind==='batch'; }).length
               ? '<div class="shd">Batch recipes</div>' + live.filter(function(r){ return r.kind==='batch'; }).map(card).join('') : '');
    }
    else if (!S.fmenu){
      var fs2 = folders();
      body = '<div class="crumb">Tap a menu to see what is on it.</div>' +
             (fs2.length ? '<div class="folds">' + fs2.map(fbtn).join('') + '</div>'
                         : '<div class="tip">No menus yet. Make one on the Menus screen and the dishes will file themselves.</div>');
    }
    else {
      /* The list reloads while a folder is open — a dish gets moved to another menu, a
         section empties, a menu is put away. Sitting on the folder that has just gone
         hollow shows "Pasta · 0 recipes · Nothing in here", which is a dead end he did
         not ask for. Fall outwards to the nearest place that still has something in it. */
      var rs2 = inFolder(S.fmenu);
      if (!rs2.length){ S.fmenu = null; S.fsec = null; render(); return; }
      var gs = groupsOf(rs2);
      if (S.fsec && !gs.some(function(g){ return g.key === S.fsec; })) S.fsec = null;
      /* one section in the folder is not a folder — do not make him tap twice to see
         the same nine dishes */
      var flat = gs.length <= 1 || S.fmenu === '__gone';
      if (flat || S.fsec){
        var pick = flat ? (gs[0] || { name:null, rs:rs2 })
                        : (gs.filter(function(g){ return g.key === S.fsec; })[0] || { name:S.fsec, rs:[] });
        body = '<div class="crumb">'+esc(foldName(S.fmenu)) +
                 (pick.name && !flat ? ' · <b>'+esc(pick.name)+'</b>' : (pick.name && gs.length ? ' · '+esc(pick.name) : '')) +
                 ' · '+pick.rs.length+' recipe'+(pick.rs.length===1?'':'s') +
                 stateSummary(pick.rs) + '</div>' +
               (pick.rs.length ? pick.rs.map(card).join('')
                               : '<div class="tip">Nothing in here.</div>');
      } else {
        body = '<div class="crumb"><b>'+esc(foldName(S.fmenu))+'</b> · '+rs2.length+' recipe'+(rs2.length===1?'':'s')+
               ' across '+gs.length+' sections' + stateSummary(rs2) + '</div>' +
               '<div class="folds">' + gs.map(sbtn).join('') + '</div>';
      }
    }

    w.innerHTML = '<div class="pane">' + parkedNote() +
      (S.listErr
        ? '<div class="todo"><b>Could not reach the recipe list.</b> '+esc(S.listErr)+'</div>'
        : !S.saved.length
          ? '<div class="q">Nothing saved yet</div><div class="sub">The first recipe you save shows up here.</div>' +
            '<button class="newr" id="newr">＋ Start a new recipe</button>'
          : '<div class="q">Saved recipes</div>' +
            howto('saved', 'Open one to change it — the sheet comes back exactly as you left it, ' +
              'and Save puts the changes on the same recipe. Costs are worked out fresh off Aung\'s ' +
              'newest stock take every time, so nothing here is a frozen price.', 'Opening and costs') +
            '<div class="sfind"><input id="sq" value="'+esc(S.sq||'')+'" ' +
                'placeholder="search all '+nlive+' recipes — burrata, vitello, pasta…">' +
              (S.sq ? '<button class="sclr" id="sclr">Clear</button>' : '') +
              /* while searching, the matched removed ones are listed under their own
                 heading — counting them here would put the total above the number of
                 recipes there are */
              '<span class="scount">'+(S.sq
                 ? live.length + ' of ' + nlive
                 : nlive + ' saved')+'</span></div>' +
            '<button class="newr" id="newr">＋ Start a new recipe</button>' +
            '<button class="newr" id="tomenus">Menus</button>' +
            (MENUS.length ? '<button class="newr" id="tomicros">Micros request for Aung</button>' : '') +
            /* the count is on the button, so he can see from here whether it is worth
               opening — a door labelled "Needs finishing" with nothing behind it is noise */
            (function(){
              var n = S.saved.filter(function(x){ return !x.archived && issuesOf(x).length; }).length;
              return n ? '<button class="newr wrn" id="totodo">Needs finishing · ' + n + '</button>'
                       : '<button class="newr" id="totodo">Nothing needs finishing ✓</button>';
            })() +
            body
      ) + '</div>';
    /* the caret stays where it was: render() rebuilds this pane on every keystroke */
    var sq = $('sq');
    if (sq){
      sq.addEventListener('input', function(){
        S.sq = sq.value; var at = sq.selectionStart; render();
        var n = $('sq'); if (n){ n.focus(); try{ n.setSelectionRange(at,at); }catch(_){} }
      });
    }
  }

  /* ───────── everything that is not finished, in one place ─────────
     A recipe that is half written costs the dish nothing and says so nowhere. This is
     the one screen a chef can open to see all of it at once — mains and batches, worst
     first — and tap straight into whichever one he wants to put right. */
  else if (S.step === 'todo'){
    b.classList.add('off');
    var live2 = S.saved.filter(function(r){ return !r.archived; });
    var bad = live2.map(function(r){ return { r:r, is:issuesOf(r) }; })
                   .filter(function(x){ return x.is.length; });
    /* the ones that break the cost first, then the most broken, then by name */
    var hardOf = function(x){ return x.is.filter(function(i){ return i.hard; }).length; };
    bad.sort(function(a, b2){
      return (hardOf(b2) ? 1 : 0) - (hardOf(a) ? 1 : 0) ||
             hardOf(b2) - hardOf(a) || b2.is.length - a.is.length ||
             String(a.r.name).localeCompare(String(b2.r.name));
    });
    var trow = function(x){
      var r = x.r;
      var mu3 = r.makes_unit || '';
      if (mu3 === 'portions' && r.makes_qty == 1) mu3 = 'portion';
      return '<button class="trow'+(hardOf(x)?' hard':'')+'" data-open="'+r.id+'">' +
        '<span class="tn">'+esc(r.name)+'</span>' +
        '<span class="tk">'+(r.kind==='batch'?'batch':'main')+
          (r.section?' · '+esc(r.section):'')+
          (r.makes_qty?' · makes '+r.makes_qty+' '+esc(mu3):'')+'</span>' +
        '<span class="ti">'+x.is.map(function(i){
          return '<em class="'+(i.hard?'h':'')+'">'+esc(i.s)+'</em>'; }).join('') + '</span>' +
      '</button>';
    };
    var mainsBad = bad.filter(function(x){ return x.r.kind === 'main'; });
    var batsBad  = bad.filter(function(x){ return x.r.kind === 'batch'; });
    var hardCount = bad.filter(hardOf).length;
    /* Unsaved work belongs here more than anywhere: it IS unfinished work, and this is
       the door he opens to ask "is anything not done?". He could not find it before
       because it only ever showed on the What are you making? screen. */
    w.innerHTML = '<div class="pane">' + parkedNote() +
      (!S.tally
        ? '<div class="todo"><b>Could not read the lines, so nothing can be checked.</b> ' +
          'Nothing is wrong with the recipes — open Saved recipes again and it will try afresh.</div>'
        : !bad.length
          ? '<div class="q">' + (parkedList().length ? 'Nothing saved needs finishing' : 'Nothing needs finishing') + '</div>' +
            '<div class="sub">All '+live2.length+' recipes have an ingredient and an amount on every line, ' +
            'every batch inside them is still there, and every dish has its section, its price and a menu.' +
            /* saying "nothing needs finishing" above a box full of unsaved work is a lie */
            (parkedList().length ? ' <b>What is in Unsaved work above has not been saved yet</b>, so it is not counted here.' : '') +
            '</div>'
          : '<div class="q">Needs finishing</div>' +
            '<div class="sub"><b>'+bad.length+' of '+live2.length+'</b> are not done. ' +
            (hardCount ? '<b>'+hardCount+'</b> of them cannot be costed at all — those are first, in red. ' : '') +
            'Tap one to put it right; you come back here afterwards.</div>' +
            (mainsBad.length ? '<div class="shd">Main recipes · '+mainsBad.length+'</div>' + mainsBad.map(trow).join('') : '') +
            (batsBad.length  ? '<div class="shd">Batch recipes · '+batsBad.length+'</div>' + batsBad.map(trow).join('')  : '')
      ) + '</div>';
  }

  else if (S.step === 'menus'){
    b.classList.add('off');
    w.innerHTML = menusInner();
  }

  else if (S.step === 'micros'){
    b.classList.add('off');
    var menu = MENUS.filter(function(m){ return m.id === MICREQ.menuId; })[0];
    var take = MICREQ.rows.filter(function(r){ return r.take; });
    var noPrice = take.filter(function(r){ return r.price == null; });
    var noCost  = take.filter(function(r){ return r.cost  == null; });
    var over    = take.filter(function(r){ return (r.micros||'').length > 16; });
    /* only the sections Micros has never heard of. His own families that simply carry
       no code on the sheet are fine and are not worth a warning. */
    var noFam   = take.map(function(r){ return r.section; })
                      .filter(function(s, i, a){
                        return a.indexOf(s) === i && micFamCode(s) == null &&
                               MICFAM_NOCODE.indexOf(s) < 0; });

    w.innerHTML = '<div class="pane">' +
      '<div class="q">Micros request for Aung</div>' +
      howto('micros', 'The form you have always sent, built from the menu instead of typed again — ' +
        'typed twice is how the till ends up saying one price and the recipe another. ' +
        '<b>The item codes stay empty:</b> those are Aung\'s to assign.', 'Why it is built for you') +

      '<div class="sfind"><select id="micmenu">' + MENUS.map(function(m){
          return '<option value="'+m.id+'"'+(m.id===MICREQ.menuId?' selected':'')+'>'+esc(m.name)+'</option>'; }).join('') +
        '</select>' +
        '<input id="micpre" value="'+esc(MICREQ.prefix)+'" placeholder="short prefix — Valen, RA, SV…" style="max-width:230px">' +
        '<span class="scount">'+take.length+' of '+MICREQ.rows.length+' going</span></div>' +
      '<div class="tip" style="margin:2px 0 14px">The prefix is how you have always done it — <b>Valen</b> RiccioMare, ' +
        '<b>RA</b> Harira Soup. Change it and every till name below is rewritten; edit any one of them afterwards ' +
        'and your wording is kept.</div>' +

      (MICREQ.err ? '<div class="todo"><b>Could not read the menu.</b> '+esc(plain(MICREQ.err))+'</div>' : '') +
      (!MICREQ.ready ? '<div class="tip">Costing every dish on the menu…</div>' : '') +

      (noPrice.length ? '<div class="todo"><b>'+noPrice.length+' with no menu price.</b> ' +
        esc(noPrice.slice(0,4).map(function(r){ return r.name; }).join(', ')) +
        (noPrice.length>4 ? ' and '+(noPrice.length-4)+' more' : '') +
        ' — the form goes out with the price column empty for '+(noPrice.length===1?'it':'them')+
        ', which is what Aung will price against. Put the price on the recipe first, or untick '+
        (noPrice.length===1?'it':'them')+'.</div>' : '') +
      (noCost.length ? '<div class="todo"><b>'+noCost.length+' with no cost yet.</b> ' +
        esc(noCost.slice(0,4).map(function(r){ return r.name; }).join(', ')) +
        (noCost.length>4 ? ' and '+(noCost.length-4)+' more' : '') +
        ' — usually a batch inside them that is not finished. The cost column is left empty rather than guessed.</div>' : '') +
      (over.length ? '<div class="todo"><b>'+over.length+' till name'+(over.length===1?' is':'s are')+' over 16 characters.</b> ' +
        'Micros cuts them off. Shorten '+(over.length===1?'it':'them')+' below.</div>' : '') +
      /* A section that is not one of Aung's families goes out with no family code, and he
         has to work out where it belongs. Better said here than found by him. */
      (noFam.length ? '<div class="todo"><b>'+noFam.length+' section'+(noFam.length===1?'':'s')+
        ' Micros has no family for:</b> ' + esc(noFam.join(', ')) + '. ' +
        'The sections on the recipes are Aung\'s own families now, so this one is left over from ' +
        'before. The form goes out with the family code empty for ' +
        (noFam.length===1?'it':'them')+' — open the recipe and pick a section from the list.</div>' : '') +

      '<div class="shd">On '+esc(menu ? menu.name : 'this menu')+'</div>' +
      MICREQ.rows.map(function(r, i){
        var len = (r.micros||'').length;
        return '<div class="microw'+(r.take?'':' out')+'">' +
          '<label class="mictick"><input type="checkbox" data-mic="'+i+'"'+(r.take?' checked':'')+'></label>' +
          '<span class="micnm">'+esc(r.name)+'<span class="micsec">'+esc(r.section)+'</span></span>' +
          '<span class="micfld"><input class="micin'+(len>16?' bad':'')+'" data-micname="'+i+'" value="'+esc(r.micros||'')+'" maxlength="16">' +
            '<span class="miclen'+(len>16?' bad':'')+'">'+len+'/16</span></span>' +
          '<span class="micnum">'+(r.cost==null?'<i class="none">no cost</i>':fmt(r.cost))+
            '<span class="miclbl">cost</span></span>' +
          '<span class="micnum">'+(r.price==null?'<i class="none">no price</i>':fmt(r.price))+
            '<span class="miclbl">price</span></span>' +
          /* the same figure the form's own formula gives — the price with VAT, municipality
             and service taken back out. It is what the cost % is worked against, so it is
             shown rather than left to be worked out from the other two. */
          '<span class="micnum">'+(r.price==null?'<i class="none">—</i>':fmt(micNet(r.price)))+
            '<span class="miclbl">net</span></span>' +
        '</div>';
      }).join('') +

      '<div class="micfoot">' +
        '<button class="okb" id="micdl"'+(take.length?'':' disabled')+'>' +
          (take.length ? 'Make the form for '+take.length+' dish'+(take.length===1?'':'es') : 'Nothing ticked — tick a dish first') + '</button>' +
        '<button class="newr" id="micpr" style="margin:0"'+(take.length?'':' disabled')+'>Print it</button>' +
        '<span class="brn" id="micst"></span>' +
      '</div>' +

      /* ── send, last on the page and on purpose ──
         The till names, the ticks and the prefix are his to change first. A send
         button up beside Download would fire off the untouched suggestion. */
      '<div class="micsend">' +
        (MICREQ.sent ?
          '<div class="micdone"><b>✓ Sent to '+MICMAIL.who+'</b> — '+MICREQ.sent+' dish'+
            (MICREQ.sent===1?'':'es')+' on '+esc(menu ? menu.name : 'this menu')+', cc '+MICMAIL.ccWho+'. '+
            'The file went with it as an attachment.' +
            '<button class="newr" id="micagain" style="margin:10px 0 0">Send it again</button></div>'
        : MICREQ.confirm ?
          '<div class="micask"><b>Send this to '+MICMAIL.who+'?</b>' +
            '<div class="micaskl">'+take.length+' dish'+(take.length===1?'':'es')+' from <b>'+
              esc(menu ? menu.name : 'this menu')+'</b>, as a branded Excel form attached to the email.<br>' +
              'To: <b>'+esc(MICMAIL.to)+'</b><br>cc: '+esc(MICMAIL.cc.join(', '))+'</div>' +
            (over.length ? '<div class="micaskw">'+over.length+' till name'+(over.length===1?' is':'s are')+
              ' still over 16 characters — Micros will cut '+(over.length===1?'it':'them')+' off.</div>' : '') +
            (noPrice.length ? '<div class="micaskw">'+noPrice.length+' '+(noPrice.length===1?'dish goes':'dishes go')+
              ' with no price on the line.</div>' : '') +
            '<div class="micaskb"><button class="okb" id="micgo">Yes — send it to '+MICMAIL.who+'</button>' +
              '<button class="newr" id="micno" style="margin:0">Not yet</button>' +
              '<span class="brn" id="micsendst"></span></div></div>'
        :
          '<button class="okb" id="micsend"'+(take.length?'':' disabled')+'>' +
            (take.length ? 'Send it to '+MICMAIL.who+' →' : 'Nothing ticked — tick a dish first') + '</button>' +
          '<div class="tip" style="margin-top:8px">Change the till names above first — this sends what is ' +
            'on the screen right now, to '+esc(MICMAIL.to)+', cc '+MICMAIL.ccWho+'. It asks once more before it goes.</div>'
        ) +
      '</div>' +

      '<div class="tip" style="margin-top:12px"><b>The form works the cost out itself</b>, with its own formula, ' +
        'unchanged from the one you have been sending since December 2025 — the price with every tax inside it, ' +
        'net of VAT, municipality and service. That is the same basis as the food cost on the sheet, so the two ' +
        'agree. The only things written into the form are the name, the cost and the price; everything else on ' +
        'it is a formula, so it still recalculates when Aung corrects a figure.</div>' +
      '</div>';

    var mm = $('micmenu');
    if (mm) mm.addEventListener('change', function(){
      /* a different menu is a different request — the tick that said "sent" was about
         the last one, and leaving it up would read as this one having gone */
      MICREQ.menuId = this.value; MICREQ.sent = 0; MICREQ.confirm = false; render();
      loadMicros(MICREQ.menuId).then(function(){ if (S.step==='micros') render(); });
    });
    var mp = $('micpre');
    if (mp) mp.addEventListener('input', function(){
      MICREQ.prefix = this.value;
      /* only the ones he has not written himself — retyping over his wording would
         be the app arguing with him */
      MICREQ.rows.forEach(function(r){ if (!r.edited) r.micros = micShort(r.name, MICREQ.prefix); });
      var at = this.selectionStart; render();
      var n = $('micpre'); if (n){ n.focus(); try{ n.setSelectionRange(at,at); }catch(x){} }
    });
  }

  else if (S.step === 'type'){
    b.classList.add('off'); b.textContent='Next';
    /* ── the way back to what he already has open ──
       Two taps of Back from the sheet land here, and the only things on this screen say
       "Main" and "Batch" — so that is what he taps, and choosing a kind starts a NEW
       recipe: the name, the lines and the method all come off the screen at once. If the
       recipe was saved, nothing is even parked, because a saved sheet is not dirty.

       What that looked like from the pass on 4 August: a chef saved "Mascarpone mousse
       pistacchio" at 11:45, came back through here, found an empty sheet, assumed it was
       lost and typed it again — and Save answered "there is already a recipe called
       that". So he added a word to the name. Two rows for one dessert, three minutes
       apart, and the first one deleted by hand.

       He is not choosing between main and batch at this moment. He is trying to get back
       to his dish. So it is offered first, by name, before the two doors that wipe it. */
    var hold = (S.id || (S.name||'').trim() || (S.rows||[]).length) ? {
      name: (S.name||'').trim() || 'the recipe you have open',
      saved: !!S.id,
      lines: (S.rows||[]).length
    } : null;
    w.innerHTML = '<div class="pane">' + parkedNote() +
      (hold ? '<div class="holdon"><div class="holdt"><b>' + esc(hold.name) + '</b> is still open' +
                (hold.lines ? ' — ' + hold.lines + ' line' + (hold.lines===1?'':'s') : '') +
                (hold.saved ? ', saved' : ', not saved yet') + '.</div>' +
              '<button class="okb" id="holdback">Carry on with it</button>' +
              '<div class="holdw">Choosing below starts a <b>new</b> recipe and takes this one off the screen.' +
                (hold.saved ? ' It is saved, so it stays in Saved recipes.' : '') + '</div></div>' : '') +
      '<div class="q">What are you making?</div>' +
      howto('kind', 'A main goes on the menu. A batch is something you make once and use in other dishes.',
        'Main or batch') +
      '<div class="two">' +
      '<button class="big" data-k="main"><div class="t">Main recipes</div><div class="d">Goes to the pass, gets a POS key.</div></button>' +
      '<button class="big" data-k="batch"><div class="t">Batch recipes</div><div class="d">A sauce, a stock, a dough. Link it into any recipe.</div></button>' +
      '</div>' + bringHTML() + '</div>';
  }

  else if (S.step === 'found'){
    b.classList.add('off');
    var F = S.found || { recipes:[] };
    var failed = F.failed || [], multi = (F.files || 1) > 1;
    /* At sixty workbooks the list is long enough to need finding in, and it is the
       same search as everywhere else in the module. */
    var shown = F.recipes.map(function(f,i){ return { f:f, i:i }; });
    if (S.fq){
      var qw = words(S.fq);
      shown = shown.filter(function(x){
        return nameHit(qw, x.f.name || '') || nameHit(qw, x.f.file || '') || nameHit(qw, x.f.cat || '');
      });
    }
    w.innerHTML = '<div class="pane">' +
      '<div class="q">'+esc(F.fileName)+'</div>' +
      '<div class="sub">Read from '+esc(F.how)+'. <b>'+F.recipes.length+'</b> recipe'+(F.recipes.length===1?'':'s')+
        (multi ? ' across '+F.files+' files' : ' in it')+'. ' +
        'Take the lot in one go, or open one at a time — either way you still pick every ingredient.</div>' +
      /* Named, never dropped. A confident "41 recipes" with three files silently
         missing is how Rombo turns out never to have been written. */
      (failed.length
        ? '<div class="todo"><b>'+failed.length+' file'+(failed.length===1?'':'s')+' could not be read, and '+
          (failed.length===1?'it is':'they are')+' not in the count above:</b><br>' +
          failed.map(function(x){ return '· '+esc(x.name)+' — '+esc(x.why); }).join('<br>') +
          '<br>Everything else below is fine. Bring those in on their own, or fix them and come back.</div>'
        : '') +
      (F.skipped ? '<div class="tip">'+F.skipped+' file'+(F.skipped===1?' was':'s were')+
         ' not an Excel, Word or PDF file, so '+(F.skipped===1?'it was':'they were')+' left alone.</div>' : '') +
      '<button class="okb" id="allatonce">Bring in all '+F.recipes.length+' and link them</button>' +
      '<div class="tip" style="margin:9px 0 16px">The dish and its batches, built from the bottom up so ' +
        'every batch exists before the dish points at it. You see exactly what will be made before anything is.' +
        (F.recipes.length > 12 ? ' <b>At this size it is worth doing one folder at a time</b> — you still have to pick the ingredients on every line afterwards.' : '') +
      '</div>' +
      (F.recipes.length > 8
        ? '<div class="sfind"><input id="fq" value="'+esc(S.fq||'')+'" placeholder="find one of the '+F.recipes.length+' — burrata, pasta, the file name…">' +
          (S.fq ? '<button class="sclr" id="fclr">Clear</button>' : '') +
          '<span class="scount">'+(S.fq ? shown.length+' of '+F.recipes.length : F.recipes.length+' found')+'</span></div>'
        : '') +
      (S.fq && !shown.length ? '<div class="todo">Nothing found matches “'+esc(S.fq)+'”.</div>' : '') +
      shown.map(function(x){
        var f = x.f, i = x.i;
        return (function(f,i){
        /* These workbooks get made by copying the last one, and the tab gets renamed
           while "Recipe Name:" inside it does not. Filetto di Wagyu still says
           Branzino in that cell. The cell is what we read, and it is usually right —
           but when the two disagree the dish is about to be saved under a name that
           belongs to another dish, so say so here, before anything is created. */
        var tab = String(f.where||'').replace(/^R\s*-\s*/i,'').replace(/\s+/g,' ').trim().toLowerCase();
        var nm  = String(f.name||'').replace(/^R\s*-\s*/i,'').replace(/\s+/g,' ').trim().toLowerCase();
        var odd = tab && nm && tab.indexOf(nm) < 0 && nm.indexOf(tab) < 0;
        return '<div class="srow"><button class="sopen" data-take="'+i+'">' +
          '<span class="sn">'+esc(f.name||'(no name)')+'</span>' +
          '<span class="sm">'+(f.kind==='batch'?'batch recipe':'main recipe')+
            (f.cat?' · '+esc(f.cat):'')+' · '+f.lines.length+' ingredient'+(f.lines.length===1?'':'s')+
            (f.method?' · has the method':'')+
            /* which workbook it came out of — with sixty of them, "Branzino" alone
               does not tell you which Branzino */
            (multi && f.file ? ' · <i>'+esc(f.file)+'</i>' : '')+'</span>' +
          (odd ? '<span class="sm warn">The sheet is called <b>'+esc(f.where)+'</b> but its Recipe Name says <b>' +
                 esc(f.name)+'</b>. Open it and check the name before you save it.</span>' : '') +
          '</button></div>';
        })(f, i);
      }).join('') +
      '<button class="newr" id="pickfile">Bring in different files</button>' +
      '<button class="newr" id="pickfolder">Bring in a whole folder</button>' +
      /* The way out. This screen had three doors and every one of them led further into
         the file — there was no way to say "forget this, I am writing my own". */
      '<button class="newr" id="dropfound">＋ Forget this file and start a new recipe</button></div>';
    var fq = $('fq');
    if (fq) fq.addEventListener('input', function(){
      S.fq = fq.value; var at = fq.selectionStart; render();
      var n = $('fq'); if (n){ n.focus(); try{ n.setSelectionRange(at,at); }catch(_){} }
    });
  }

  else if (S.step === 'foh'){
    b.classList.add('off');
    w.innerHTML = fohViewHTML();
  }

  else if (S.step === 'bringall'){
    b.classList.add('off');
    w.innerHTML = '<div class="pane" id="planpane">' + planInner() + '</div>';
  }

  else if (S.step === 'write'){
    b.textContent='Make the sheet'; gate();
    w.innerHTML = '<div class="pane">' + parkedNote() +
      '<input class="name" id="nm" placeholder="Octopus" value="'+esc(S.name)+'">' +
      '<div class="q" style="font-size:21px">What goes in it?</div>' +
      howto('write', 'However you like — one line, spaces or commas. The app sorts them out.',
        'How to write them') +
      '<textarea class="dumpbox" id="dp" rows="4" placeholder="olive oil lemon garlic parsley salt black pepper"></textarea>' +
      importedNote() + bringHTML(true) +
      '<div class="split" id="sp"></div></div>';
    var nm=$('nm'), dp=$('dp');
    dp.value = S.text;
    (S.name ? dp : nm).focus();
    nm.addEventListener('input', function(){
      S.name=this.value; $('bnm').textContent=this.value||'New '+S.kind+' recipe'; gate(); });
    dp.addEventListener('input', function(){ S.text=this.value; reflow(); });
    reflow();
  }

  else if (S.step === 'sheet'){
    b.textContent = S.id ? 'Save changes' : 'Save'; b.classList.remove('off');
    w.innerHTML =
      /* which stock take the money comes off is a fact about THIS sheet and stays;
         how to move down the columns is a thing you learn once */
      '<div class="hint"><b>Costed off Aung\'s ' + new Date(MONTH+'-01T12:00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'}) + ' stock take.</b> ' +
        howto('sheet', 'Go down Ingredient, then down Qty. Nothing opens. Tick the last box only ' +
          'on the things you trim — octopus, whole fish — and yield &amp; waste drop down for that one.',
          'Working the sheet') + '</div>' +
      parkedNote() +
      '<div class="savebar" id="savebar"></div>' +
      (S.cameFrom ? '<button class="newr" id="backto" style="margin:0 0 10px">‹ Back to the dish that uses this</button>' : '') +
      (S.fromPlan && S.plan ? '<button class="newr" id="backtoplan" style="margin:0 0 10px">‹ Back to the ' +
        S.plan.recs.length + ' from ' + esc(S.plan.file) + '</button>' : '') +
      (S.fromTodo ? '<button class="newr" id="backtotodo" style="margin:0 0 10px">‹ Back to what needs finishing</button>' : '') +
      '<div class="swapbar" id="sb"></div>' +
      howto('ibleg', '<b>I</b> an ingredient from Aung\'s list &nbsp;·&nbsp; <b>B</b> a batch — ' +
        'tap either to go and look at it', 'I and B') +
      '<div class="sheetwrap"><table class="sheet">' +
      /* Qty must hold a kilo quantity written out — 0.0035 is six characters and
         a clipped number is worse than no number. Widened from 66px, which fit "0.03"
         and silently cut everything smaller. checkFit() below now proves it. */
      '<colgroup><col style="width:30px"><col style="width:32%"><col><col class="cq"><col style="width:56px">' +
        '<col style="width:82px"><col style="width:46px"><col style="width:32px"></colgroup>' +
      '<thead><tr>' +
        /* The unit column had no heading, so a lone "g" beside a number read as part of
           the number. "How do I know if that 1 is a kilo or a gram" is the question it
           caused, and it is a fair one. */
        '<th class="c"></th><th>You wrote</th><th>Ingredient — Aung\'s list</th><th class="n">Qty</th><th class="un">Unit</th>' +
        '<th class="n">Cost</th><th class="c">Trim</th><th></th>' +
      '</tr></thead><tbody id="tb"></tbody></table></div>' +
      '<div class="undobar" id="undobar"></div>' +
      /* This was here already, but it was a dashed box that only answered the Enter key
         and said "more ingredients" — so the way to add a forgotten one looked like
         going back, and going back is where the trouble was. It has a button now, and
         it says what it does. */
      '<div class="addline"><input id="more" placeholder="olive oil 20g, lemon 1 — type as many as you like">' +
        /* it says what it adds, not where it puts it — he is looking at the sheet */
        '<button class="addb" id="addmore">＋ Add ingredient</button></div>' +
      methodHTML();
      rows(); swapbar(); wireMethod(); drawSaveBar(); drawUndo();
    var addMore = function(){
      var box = $('more'); if (!box || !box.value.trim()) return;
      var n = 0;
      splitLine(box.value).forEach(function(x){ S.rows.push(mkRow(x)); n++; });
      box.value = '';
      /* the typed text has to learn about it too, or stepping back to the ingredients
         box and forward again quietly drops what was just added */
      syncText(); rows(); foot(); fitBar();
      flash(n + (n===1 ? ' ingredient' : ' ingredients') + ' added — pick '+(n===1?'it':'them')+' at the bottom of the sheet.');
      var last = document.querySelectorAll('tr.main select.prod');
      if (last.length) last[last.length-1].scrollIntoView({ block:'center' });
      box.focus();
    };
    $('more').addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); addMore(); }
    });
    $('addmore').addEventListener('click', addMore);
  }
  foot();
  if (typeof fitBar === 'function') fitBar();
}
function gate(){ $('act').classList.toggle('off', !(S.name.trim() && S.rows.length)); }

/* ── the one confirm screen for a whole workbook ── */
function drawPlan(){ var p = $('planpane'); if (p) p.innerHTML = planInner(); }
/* links on this recipe whose batch never made it in */
function lostLinks(R){
  return R.links.filter(function(l){ return l.to.done === 'failed'; });
}
function planInner(){
  var P = S.plan; if (!P) return '';
  var toMake = P.recs.filter(function(R){ return !R.existing; });
  var known  = P.recs.filter(function(R){ return  R.existing; });
  var noMakes = toMake.filter(function(R){ return R.kind==='batch' && R.f.makesQty == null; });
  var failed = P.recs.filter(function(R){ return R.done === 'failed'; });
  var made   = P.recs.filter(function(R){ return R.done === 'made'; });
  var busy   = P.recs.some(function(R){ return R.done === 'busy'; });

  var card = function(R){
    var n = P.order.indexOf(R) + 1;
    var st = R.done === 'made' ? '<span class="pl ok">added</span>'
           : R.done === 'already' ? '<span class="pl was">already saved</span>'
           : R.done === 'busy' ? '<span class="pl">adding…</span>'
           : R.done === 'failed' ? '<span class="pl bad">not added</span>'
           : R.existing ? '<span class="pl was">already saved — it will be linked, not made again</span>' : '';
    var fixed = R.fixed && R.fixed.length
      ? '<div class="pfix">Filled in '+R.fixed.length+' line'+(R.fixed.length===1?'':'s')+' that had nothing picked: ' +
        R.fixed.map(function(j){ return '<b>'+esc(j.was)+'</b> → '+esc(j.name); }).join(', ') +
        '. Nothing you had already chosen was changed.</div>' : '';
    /* Once it exists it can be opened — every one of them, not just the dish. This screen
       is the last look at what was made, and "is that right?" is answered by opening it,
       so each card that has landed is the way in to itself. */
    var pid = R.newId || (R.existing && R.existing.id) || null;
    return (pid ? '<button class="pcard pclick" data-openplan="'+esc(pid)+'">'
                : '<div class="pcard'+(R.done==='failed'?' bad':'')+'">') +
      '<div class="ph1"><span class="pnum">'+n+'</span>' +
        '<span class="pnm">'+esc(R.name)+'</span>' +
        '<span class="pkind'+(R.kind==='batch'?' b':'')+'">'+(R.kind==='batch'?'batch':'main')+'</span>' + st + '</div>' +
      '<div class="pmeta">'+R.rows.length+' ingredient'+(R.rows.length===1?'':'s') +
        (R.section ? ' · '+esc(R.section) : '') +
        /* the same batch written into a dozen workbooks is made ONCE — say so on its
           own card, where somebody looking for the other eleven would look */
        (R.alsoIn && R.alsoIn.length
          ? ' · <b>also in '+R.alsoIn.length+' other file'+(R.alsoIn.length===1?'':'s')+'</b>, made once' : '') +
        (hasMethod(R.method) ? ' · the method comes with it' : ' · no method in the file') +
        (R.kind==='batch' && R.f.makesQty==null && !R.existing
          ? ' · <b>doesn’t say how much it makes</b>' : '') + '</div>' +
      (R.links.length
        ? '<div class="plinks">' + R.links.map(function(l){
            return '<span class="plink">'+esc(l.was)+' <b>→</b> '+esc(l.to.name)+'</span>'; }).join('') + '</div>'
        : '') +
      fixed +
      (R.why ? '<div class="pwhy">'+esc(R.why)+'</div>' : '') +
      /* a batch that did not go in leaves a line on the dish with nothing picked.
         Say which line, by name — a dish quietly missing its sauce is the whole danger */
      (R.done === 'made' && lostLinks(R).length
        ? '<div class="pwhy"><b>'+lostLinks(R).map(function(l){ return esc(l.was); }).join(' and ') +
          '</b> '+(lostLinks(R).length===1?'has':'have')+' nothing picked on this recipe, because ' +
          lostLinks(R).map(function(l){ return esc(l.to.name); }).join(' and ') +
          ' did not go in. The line is still there with what the file wrote — pick it, or run the file again.</div>'
        : '') +
      (pid ? '<span class="pgo">Open it and check &rarr;</span>' : '') +
    (pid ? '</button>' : '</div>');
  };

  return '<div class="q">'+esc(P.file)+'</div>' +
    '<div class="sub">Read from '+esc(P.how)+'. There '+(P.recs.length===1?'is 1 recipe':'are '+P.recs.length+' recipes')+
      ' in it — the dish and everything underneath it. Built from the bottom up, so every batch exists ' +
      'before the dish points at it. You still pick every ingredient afterwards; this only saves you ' +
      'opening them one at a time and re-typing the links.</div>' +

    (S.planRan
      ? '<div class="'+(failed.length?'todo':'okline')+'">' +
          (failed.length
            ? '<b>'+made.length+' added, '+failed.length+' did not go in.</b> ' +
              failed.map(function(R){ return esc(R.name); }).join(' and ') + ' — the reason is under each one. ' +
              'The '+made.length+' that landed are saved and are in Saved recipes. ' +
              '<b>Bring the same file in again</b> and only what is missing gets created — nothing already ' +
              'saved is written over.'
            : '<b>'+(known.length ? made.length+' added, '+known.length+' were already saved'
                                  : 'All '+made.length+' added')+'.</b> ' +
              'Open the dish and every batch is already linked.') +
        '</div>' +
        /* the dish is the one he almost always wants, so it is the filled button — but
           every batch under it opens from its own card now */
        '<button class="okb" id="openmain">Open '+esc((P.order[P.order.length-1]||{}).name||'the dish')+'</button> ' +
        '<button class="newr" id="pickfile">Bring in another file</button>' +
        '<div class="tip" style="margin:9px 0 2px">Or tap any of them below to check it and change it — ' +
          'they are all saved.</div>'
      : !toMake.length
        /* everything in the file is already saved — offering "Create all 0" would be
           nonsense, and quietly re-writing what he has built is worse */
        ? '<div class="okline"><b>Every recipe in this file is already saved.</b> ' +
            'Nothing was created and nothing was touched — open the dish to change it, ' +
            'or open any batch from Saved recipes.</div>' +
          '<button class="okb" id="openmain">Open '+esc((P.order[P.order.length-1]||{}).name||'the dish')+'</button> ' +
          '<button class="newr" id="pickfile">Bring in another file</button>'
        : '<div class="pnote2">' +
            '<b>'+toMake.length+'</b> will be created' +
            (known.length ? ', <b>'+known.length+'</b> already saved and will just be linked — nothing you have ' +
                            'already built gets written over' : '') + '. ' +
            (noMakes.length
              ? '<b>'+noMakes.length+' of the batches don’t say how much they make</b>, so they carry no cost ' +
                'until you fill that in — the file does not say, and a made-up number is worse than a blank.'
              : '') +
          '</div>' +
          '<button class="okb" id="doall"'+(busy?' disabled':'')+'>Create '+
            (toMake.length===1?'it':'all '+toMake.length)+' and link them</button> ' +
          '<button class="newr" id="oneatatime">No — open them one at a time</button>') +

    '<div class="plist">' + P.order.map(card).join('') + '</div>';
}

function voiceOk(){ return ('SpeechRecognition' in window) || ('webkitSpeechRecognition' in window); }
function bringHTML(withVoice){
  return '<div class="bring">' +
    '<button class="brb" id="pickfile">Bring it in from a file</button>' +
    '<button class="brb" id="pickfolder">Bring in a whole folder</button>' +
    (withVoice && voiceOk() ? '<button class="brb mic" id="mic">🎤 Say it</button>' : '') +
    '<span class="brn">Excel, Word (.docx) or a PDF with real text in it — one, several, or a whole folder' +
      (withVoice && !voiceOk() ? ' — speaking only works on Android, not on iPhone' : '') + '</span>' +
    '<span class="brn" id="brs"></span></div>';
}
function importedNote(){
  var im = S.imported; if (!im) return '';
  return '<div class="imp"><b>Read from '+esc(im.how)+(im.where?' — '+esc(im.where):'')+'.</b> ' +
    'Check the split below, then make the sheet as usual.' +
    (im.costing
      ? '<br>This sheet carries Aung\'s codes, so those lines are matched exactly rather than guessed.' +
        (im.makes ? ' It makes <b>'+esc(im.makes)+'</b>.' : '') +
        (im.price ? ' Menu price <b>'+fmt(im.price)+'</b>.' : '') +
        (im.subs.length ? '<br>' + im.subs.map(esc).join(', ') + ' ' + (im.subs.length===1?'is a sub-recipe':'are sub-recipes') +
          ' — make ' + (im.subs.length===1?'it':'them') + ' a batch on the sheet.' : '')
      : '') +
    (im.noUnit.length

        /* its own line, allowed to wrap. The one-line meta above is clipped with an
           ellipsis, and "…put the a" is not a warning. */
        ? '<span class="meta warnu"><i class="stale">this line is in ' + esc(u) + ', but it is sold by ' +

    '<td>'+sel+'</td>' +
    '<td><input class="cell qty" data-i="'+i+'" data-f="qty" inputmode="decimal" value="'+(r.qty==null?'':r.qty)+'" placeholder="—"></td>' +

    '</div></td></tr>'
    : !r.adj ? '' :
    '<tr class="drop"><td colspan="8"><div class="dropin">' +
      '<div class="f"><label>Yield %</label><div class="bx">' +

      '<div class="f"><label>Waste %</label><div class="bx">' +
        '<input class="dcell" data-i="'+i+'" data-f="waste" inputmode="decimal" value="'+r.waste+'"><span class="pc">%</span></div></div>' +
      '<div class="exp"><b>Yield</b> — what\'s left after you clean it. 4 kg octopus in, 2.4 kg out, that\'s 60.<br>' +
      '<b>Waste</b> — what you lose on top: trim, spillage, the plate that comes back.' +
      /* This is the part nobody could see, and it is the whole point of the two
         boxes. Without it a chef reasonably reads them as changing the recipe. */
      '<br><br><b>These change the COST only — never the quantity.</b> The line still says ' +
      /* String(), not num() — num() in this file is the PARSER, not a formatter. The
         quantity is shown exactly as it is stored, because that is what the pass card
         will print and the two must not differ by a rounding. */
      (r.qty == null ? 'what you typed' : '<b>' + esc(String(r.qty)) + ' ' + esc(r.unit || '') + '</b>') +
      ', and that is what the section cooks from on the pass card. What the costing carries ' +

      ' <span id="yw-'+i+'">' + ywSum(r) + '</span>' +

    '</div></td></tr>';
  return main + drop;

/* the session counter is gone — see mintCode(). It restarted at 1 every load, so the
   second sitting minted MINE-1 again on top of the first one. */
function wireAdd(draw){
  var b = $('ab'); if (!b) return;
  b.onclick = function(){
    var nm = $('an').value.trim(), code = $('ac').value.trim(),
        unit = $('au').value, praw = $('ap').value.trim(), grp = $('ag').value;
    var err = $('ae'); err.textContent = '';
    if (!nm){ err.textContent = 'Give it a name.'; $('an').focus(); return; }
    if (praw === ''){ err.textContent = 'Put a price. If it is free, type 0.'; $('ap').focus(); return; }
    var price = parseFloat(praw);
    if (isNaN(price) || price < 0){ err.textContent = 'That price is not a number.'; $('ap').focus(); return; }
    if (code && ING.some(function(i){ return i.code === code; })){
      err.textContent = 'Code ' + code + ' is already on Aung\u2019s list \u2014 search for it instead of adding it twice.'; return; }
    if (ING.some(function(i){ return i.name.toLowerCase() === nm.toLowerCase(); })){
      err.textContent = 'There is already something called \u201c' + nm + '\u201d on the list \u2014 use that one.'; return; }
    if (!code) code = mintCode();
    var it = { code:code, name:nm, group:grp, unit:unit, price:price,
               units:[{ unit:unit, price:price }], mine:true };
    /* It goes to the database FIRST. Putting it on screen and saving quietly behind
       it is how the old version lied: it looked added, worked all sitting, and was
       gone the next morning. If this fails he is told, and nothing pretends. */
    b.disabled = true; var was = b.textContent; b.textContent = 'Adding\u2026';
    err.style.color = ''; err.textContent = '';
    saveMine(it).then(function(){
      ING.push(it);
      refreshOpts();                                           /* pickable in the recipe at once */
      $('an').value=''; $('ac').value=''; $('ap').value='';
      err.style.color = 'var(--oliva)';
      err.textContent = nm + ' added \u2713' + (price === 0 ? ' at no cost' : ' at ' + price.toFixed(2) + ' per ' + unit.toLowerCase()) +
                        '. It is on your list for every recipe from now on.';
      setTimeout(function(){ if($('ae')){ $('ae').textContent=''; $('ae').style.color=''; } }, 6000);
      setNItems();
      draw();
      $('an').focus();
    }).catch(function(e){
      err.style.color = '';
      err.textContent = 'Not added \u2014 ' + minePlain(e.message) + ' Nothing was lost, what you typed is still here.';
    }).then(function(){ b.disabled = false; b.textContent = was; });
  };
}

/* Make this line a batch recipe of its own — empty for now, linked straight away.

function foundSub(name){

    });

function makeBatchFor(i){
  var r = S.rows[i], nm = (r.word||'').trim();
  if (!nm) return;

    return sb('recipes', { method:'POST', body:{
        kind:'batch', name:disp(f.name), section:'Prep',
        makes_qty:f.makesQty==null?null:f.makesQty, makes_unit:f.makesUnit||null } })
      .then(function(out){
        var id = out[0].id;
        return (built.length ? sb('recipe_lines', { method:'POST', prefer:'return=minimal',
                                                    body:linesFor(id, built) }) : Promise.resolve())
          .then(function(){ return loadBatches(); })

            if (it) r.opts = [it].concat(r.opts.filter(function(o){ return o.code !== it.code; }));
            r.code = 'R:'+id; r.wantBatch = false;

  }

function makeEmptyBatch(i){
  var r = S.rows[i], nm = (r.word||'').trim();
  if (!nm) return;
  var link = function(id){
    return loadBatches().then(function(){
      var it = MYB.filter(function(b){ return b.code === 'R:'+id; })[0];

      r.code = 'R:'+id;

      rows(); foot();

  };
  sb('recipes', { method:'POST', body:{ kind:'batch', name:nm, section:'Prep' } })
    .then(function(out){ return link(out[0].id); })
    .catch(function(){                                  /* one already has that name — use it */
      return sb('recipes?kind=eq.batch&archived=is.false&name=eq.'+encodeURIComponent(nm)+'&select=id')
        .then(function(rs){ if (rs && rs[0]) return link(rs[0].id); throw new Error('could not make that batch'); });
    })
    .catch(function(err){ r.addErr = plain(err.message); rows(); });
}

function redrawRow(i){                      /* only this row — never blow away the sheet mid-pass */
  var tb = $('tb'), tr = tb.querySelectorAll('tr.main')[i];
  if (!tr) return;
  var nxt = tr.nextElementSibling;
  var tmp = document.createElement('tbody'); tmp.innerHTML = rowHTML(S.rows[i], i);
  var frag = document.createDocumentFragment();
  while (tmp.rows.length) frag.appendChild(tmp.rows[0]);
  if (nxt && nxt.classList.contains('drop')) tb.removeChild(nxt);
  tb.replaceChild(frag, tr);
}

/* ═════════ how it is made — four boxes and the photos, on the same sheet ═════════

   type, so a two-line prep and a twenty-step method both read whole, with no bar
   to drag. Empty is a perfectly good answer — a recipe with no method is never
   flagged as unfinished, because plenty of them genuinely have none. */
function methodHTML(){
  return (S.kind === 'main' ? '<div class="mnu" id="mnubox">' + menuInner() + '</div>' : '') +
         '<div class="alg" id="alg">' + algInner() + '</div>' +
         '<div class="mth" id="mth">' + methodInner() + '</div>' +
         (S.kind === 'main' ? '<div class="foh" id="fohbox">' + fohInner() + '</div>' : '');
}

/* ═════════ Menus — where they live, what is on them, and turning them off ═════════
   A menu made from inside a recipe has to be findable afterwards, or it is a thing
   that exists only in a dropdown. This screen is where they live: what is on each
   one, rename it, turn it off, put it away.

   The reason "turn it off" matters more than "delete": a menu for a single night is
   a real thing, and in a year there will be dozens of them. An OFF menu keeps
   everything that was on it and stops appearing in the picker — so the picker stays
   the four or five menus actually in use, not every night since last Christmas.

   Putting one away (archived) is the only kind of delete there is. The table allows
   no real delete, and it should not: a menu is what a card and a Food Bible filter
   by, and deleting one would quietly empty screens people are cooking from. */
var MENUADM = { ready:false, err:null, counts:{}, dishes:{}, all:[], showOff:false,
                open:null, busy:'', ask:null, rename:null };
var MENUSALL = false;      /* the bar picker: show every menu, not just the live ones */

function loadMenuAdmin(){
  MENUADM.ready = false; MENUADM.err = null;
  return Promise.all([
    sb('menus?venue_id=eq.robertos-difc&select=*&order=archived,position,name'),
    sb('recipe_menus?select=menu_id,recipe_id'),
    sb('recipes?kind=eq.main&select=id,name,section,archived')
  ]).then(function(res){
    MENUADM.all = res[0] || [];
    var byId = {}; (res[2]||[]).forEach(function(r){ byId[r.id] = r; });
    var counts = {}, dishes = {};
    (res[1]||[]).forEach(function(rm){
      var r = byId[rm.recipe_id];
      if (!r || r.archived) return;                 /* an archived recipe is not on anything */
      counts[rm.menu_id] = (counts[rm.menu_id] || 0) + 1;
      (dishes[rm.menu_id] = dishes[rm.menu_id] || []).push(r);
    });
    Object.keys(dishes).forEach(function(k){
      dishes[k].sort(function(a,b){ return String(a.section||'').localeCompare(String(b.section||'')) ||
                                           String(a.name).localeCompare(String(b.name)); });
    });
    MENUADM.counts = counts; MENUADM.dishes = dishes; MENUADM.ready = true;
  }).catch(function(e){ MENUADM.err = e.message; MENUADM.ready = true; });
}

/* Exactly one menu runs at a time, and the database enforces it — so the one that is
   running has to be stood down BEFORE the new one stands up, or the write is refused. */
function setRunning(id){
  var was = MENUADM.all.filter(function(m){ return m.running && !m.archived && m.id !== id; });
  var stand = was.length
    ? sb('menus?id=eq.'+was[0].id, { method:'PATCH', prefer:'return=minimal',
        body:{ running:false, updated_at:new Date().toISOString() } })
    : Promise.resolve();
  return stand.then(function(){
    return sb('menus?id=eq.'+id, { method:'PATCH', prefer:'return=minimal',
      body:{ running:true, active:true, updated_at:new Date().toISOString() } });
  });
}
function patchMenu(id, body){
  body.updated_at = new Date().toISOString();
  return sb('menus?id=eq.'+id, { method:'PATCH', prefer:'return=minimal', body:body });
}
function menuRow(id){ return MENUADM.all.filter(function(m){ return m.id === id; })[0]; }

function menusInner(){
  if (MENUADM.err)
    return '<div class="pane"><div class="q">Menus</div>' +
      '<div class="todo"><b>The menus cannot be read.</b> ' + esc(menuPlain(MENUADM.err)) + '</div></div>';
  if (!MENUADM.ready)
    return '<div class="pane"><div class="q">Menus</div><div class="tip">Reading the menus…</div></div>';

  /* one menu opened — what is on it */
  if (MENUADM.open){
    var m = menuRow(MENUADM.open);
    if (!m) { MENUADM.open = null; return menusInner(); }
    var on = MENUADM.dishes[m.id] || [];
    var sec = null;
    return '<div class="pane">' +
      '<div class="q">' + esc(m.name) + '</div>' +
      '<div class="sub">' + (on.length ? on.length + ' dish' + (on.length===1?'':'es') + ' on this menu. ' +
          'Tap one to open it. Taking a dish off changes only this menu — the recipe stays exactly where it is.'
        : 'Nothing is on this menu yet. Open a recipe and put it on from the bar at the top.') + '</div>' +
      (m.note ? '<div class="tip" style="margin:0 0 12px">' + esc(m.note) + '</div>' : '') +
      '<button class="newr" id="mabk" style="margin:0 0 14px">‹ All menus</button>' +
      on.map(function(r){
        var hd = (r.section !== sec) ? (sec = r.section, '<div class="shd">' + esc(r.section || 'No section') + '</div>') : '';
        return hd + '<div class="marow">' +
          '<span class="manm" data-maopen="' + r.id + '">' + esc(r.name) + '</span>' +
          '<button class="maoff" data-matake="' + r.id + '">Take off this menu</button>' +
        '</div>';
      }).join('') +
      '</div>';
  }

  var live = MENUADM.all.filter(function(m){ return !m.archived; });
  var off  = MENUADM.all.filter(function(m){ return m.archived; });
  var card = function(m){
    var n = MENUADM.counts[m.id] || 0;
    var asking = MENUADM.ask === m.id;
    var ren    = MENUADM.rename === m.id;
    return '<div class="macard' + (m.archived ? ' away' : '') + (m.running ? ' run' : '') + '">' +
      '<div class="matop">' +
        (ren
          ? '<input class="maren" id="maren" value="' + esc(m.name) + '">' +
            '<button class="okb" data-marensave="' + m.id + '">Save the name</button>' +
            '<button class="newr" style="margin:0" data-marencx="1">Cancel</button>'
          : '<span class="mahd">' + esc(m.name) + '</span>' +
            (m.running ? '<span class="mabadge run">running now</span>' : '') +
            (!m.archived && !m.active ? '<span class="mabadge off">off</span>' : '') +
            (m.archived ? '<span class="mabadge away">put away</span>' : '')) +
        '<span class="macount">' + n + ' dish' + (n===1?'':'es') + '</span>' +
      '</div>' +
      (asking
        ? '<div class="maask"><b>Put ' + esc(m.name) + ' away?</b> ' +
            (n ? 'The ' + n + ' dish' + (n===1?'':'es') + ' on it stay exactly as they are — ' +
                 (n===1?'it is':'they are') + ' simply no longer on this menu. ' : '') +
            'It stops appearing anywhere, and it can be brought back from below.' +
            '<div class="maaskb"><button class="okb" data-maaway="' + m.id + '">Yes, put it away</button>' +
            '<button class="newr" style="margin:0" data-manoaway="1">Keep it</button></div></div>'
        : '<div class="maacts">' +
            (m.archived
              ? '<button class="newr" style="margin:0" data-maback="' + m.id + '">Bring it back</button>'
              : '<button class="newr" style="margin:0" data-maopenm="' + m.id + '">See what is on it</button>' +
                '<button class="newr" style="margin:0" data-marename="' + m.id + '">Rename</button>' +
                (m.running ? '' : '<button class="newr" style="margin:0" data-marun="' + m.id + '">Make it the one running</button>') +
                (m.running ? '<span class="matip">The cards open on this one, so it cannot be turned off or put away until another one is running.</span>'
                  : '<button class="newr" style="margin:0" data-maact="' + m.id + '">' +
                      (m.active ? 'Turn it off' : 'Turn it back on') + '</button>' +
                    '<button class="newr" style="margin:0" data-maaskaway="' + m.id + '">Put it away</button>')) +
          '</div>') +
    '</div>';
  };

  return '<div class="pane">' +
    '<div class="q">Menus</div>' +
    howto('menuadm', 'Every menu the kitchen has, and what is on each one. This is what the recipe ' +
      'card and the Food Bible filter by — a dish on no menu shows on no card at all.<br>' +
      '<b>A menu for one night is normal.</b> When the night is over <b>turn it off</b>: everything on it ' +
      'is kept and it stops filling up the picker on the recipe. That is what stops this list becoming ' +
      'a hundred menus nobody can choose between.', 'Turning menus off') +
    '<div class="mnew" style="margin:0 0 18px"><input id="manew" placeholder="A new menu — New Year’s Eve 2026">' +
      '<button class="okb" id="manewok">Make this menu</button><span class="err" id="manewe"></span></div>' +
    (live.length ? live.map(card).join('') : '<div class="tip">No menus yet.</div>') +
    (off.length
      ? '<button class="newr" id="mashow">' + (MENUADM.showOff ? 'Hide' : 'Show') + ' the ' + off.length +
          ' put away</button>' + (MENUADM.showOff ? off.map(card).join('') : '')
      : '') +
    '</div>';
}

/* ── the menu control in the bar ──
   Same question as the box further down the sheet, asked where the section is asked.
   A dish can be on more than one menu, so picking a name TOGGLES it rather than
   replacing what is there — and the closed control says how many are on, because a
   select that shows one name while three are ticked is a select that lies.
   Batches never get it: a batch belongs to the dishes that use it. */
function barMenuLabel(){
  var on = (S.menus || []).filter(function(id){
    return MENUS.some(function(m){ return m.id === id; }); });
  if (!on.length) return 'Which menu?';
  if (on.length === 1) return menuName(on[0]);
  return on.length + ' menus';
}
function drawBarMenu(){
  var bm = $('bmn'); if (!bm) return;
  var show = S.kind === 'main' && (S.step === 'write' || S.step === 'sheet');
  bm.style.display = show ? 'inline-block' : 'none';
  if (!show){ var p = $('bmnew'); if (p) p.classList.remove('on'); return; }
  var on = S.menus || [];
  /* Only the menus in use, plus any this dish is already on. A menu for one night is
     turned off when the night is over, and an off menu has no business in a picker a
     chef uses every day — that is what keeps this list five long instead of a hundred. */
  var live = MENUS.filter(function(m){ return MENUSALL || m.active || on.indexOf(m.id) > -1; });
  var hidden = MENUS.length - live.length;
  bm.innerHTML =
    '<option value="">' + esc(barMenuLabel()) + '</option>' +
    live.map(function(m){
      var yes = on.indexOf(m.id) > -1;
      return '<option value="' + m.id + '">' + (yes ? '✓ ' : '＋ ') + esc(m.name) +
             (m.running ? ' — running now' : (m.active ? '' : ' — off')) + '</option>';
    }).join('') +
    (hidden ? '<option value="__all">… and ' + hidden + ' turned off — show ' +
              (hidden===1?'it':'them')+' too</option>' : '') +
    '<option value="__new">＋ A menu that is not here yet…</option>' +
    '<option value="__manage">⚙ Menus — see, rename, turn off…</option>';
  bm.className = 'bsec' + (on.length ? '' : ' none');
  bm.title = on.length ? 'On ' + on.map(menuName).join(', ') : 'This dish is on no menu — it will show on no card';
}
/* Under the last thing pinned to the top, whatever that is today — the costing sits
   between this strip and the bar now, so measuring off the bar alone would put the
   new-menu box straight on top of the cost. */
function fitBarMenu(){
  var p = $('bmnew'); if (!p) return;
  var f = document.getElementById('foot');
  var last = (f && f.style.display !== 'none' && f.classList.contains('shut'))
           ? f : document.querySelector('.bar');
  if (last) p.style.top = Math.round(last.getBoundingClientRect().bottom) + 'px';
}
function openNewMenu(){
  var p = $('bmnew'); if (!p) return;
  fitBarMenu(); p.classList.add('on');
  var e = $('bmne'); if (e) e.textContent = '';
  var i = $('bmnn'); if (i){ i.value = ''; i.focus(); }
}
function closeNewMenu(){ var p = $('bmnew'); if (p) p.classList.remove('on'); }
/* the way in to the menus screen, from anywhere that offers it */
function openMenus(){
  guard(function(){
    closeNewMenu();
    if (S.step !== 'menus') S.back = S.step;
    MENUADM.open = null; MENUADM.ask = null; MENUADM.rename = null; MENUADM.ready = false;
    S.step = 'menus'; render(); window.scrollTo(0,0);
    loadMenuAdmin().then(function(){ if (S.step === 'menus') render(); });
  });
}
/* the screen and the picker read two different lists — refresh both, always together,
   or the bar goes on offering a menu that has just been put away */
function menusChanged(){
  return Promise.all([loadMenuAdmin(), loadMenus()]).then(function(){
    if (S.step === 'menus') render();
    drawBarMenu();
    var box = $('mnubox'); if (box) box.innerHTML = menuInner();
  });
}
/* Made AND the dish put on it. Making a menu from inside a recipe means you want this
   recipe on it; anything else is two taps for one thought. */
function makeMenuFromBar(){
  var inp = $('bmnn'), err = $('bmne'), btn = $('bmnok');
  var nm = inp ? inp.value.trim() : '';
  if (!nm){ if (err) err.textContent = 'Give the menu a name.'; if (inp) inp.focus(); return; }
  if (MENUS.some(function(m){ return m.name.toLowerCase() === nm.toLowerCase(); })){
    if (err) err.textContent = 'There is already a menu called that — pick it from the list instead.';
    return;
  }
  var was = btn.textContent; btn.disabled = true; btn.textContent = 'Making…';
  if (err) err.textContent = '';
  newMenu(nm).then(function(m){
    if (!m) throw new Error('the menu came back empty');
    (S.menus = S.menus || []).push(m.id);
    closeNewMenu();
    return persistMenus('On ' + m.name + ' ✓');
  }).catch(function(ex){
    if (err) err.textContent = 'Not made — ' + menuPlain(ex.message);
  }).then(function(){
    btn.disabled = false; btn.textContent = was;
    drawBarMenu(); drawSaveBar();
    var box = $('mnubox'); if (box) box.innerHTML = menuInner();
  });
}
/* An unsaved recipe carries its menus to Save with everything else. A saved one is
   written now, and says so — the same as changing the section does. */
function persistMenus(msg){
  var sel = $('bmn');
  if (!S.id) { if (sel) flag(sel, msg.replace(/ ✓$/, '') + ' — saves with the recipe', false); return Promise.resolve(); }
  return saveRecipeMenus()
    .then(function(){ if (sel) flag(sel, msg, false); })
    .catch(function(e){ if (sel) flag(sel, 'Not changed — ' + menuPlain(e.message), true); });
}

/* ── which menus this dish is on ──
   Batches never get this box: a batch belongs to the dishes that use it. */
function menuInner(){
  var on = S.menus || [];
  if (MENU_ERR)
    return '<div class="mhd">On which menus</div>' +
      '<div class="msub bad">The menus cannot be read right now — ' + esc(menuPlain(MENU_ERR)) + ' ' +
      'The recipe will still save; put it on a menu once this is back.</div>';
  if (!MENUS.length)
    return '<div class="mhd">On which menus</div>' +
      '<div class="msub">No menus yet. <b>Make the first one</b> and every dish can go on it.</div>' +
      '<div class="mnew"><input id="mnn" placeholder="À la carte 2026"><button class="okb" id="mnadd">Make this menu</button>' +
      '<span class="err" id="mne"></span></div>';

  return '<div class="mhd">On which menus</div>' +
    howto('menus', 'A dish can be on more than one — Burrata is on the à la carte and on Christmas. ' +
      'This is what the recipe card and the Food Bible filter by, so a waiter training on one menu ' +
      'sees only its dishes. <b>A dish on no menu shows on no card at all.</b>', 'What menus do') +
    '<div class="mchips">' + MENUS.map(function(m){
      var yes = on.indexOf(m.id) > -1;
      return '<button class="mchip'+(yes?' on':'')+'" data-menu="'+m.id+'">' +
        (yes ? '✓ ' : '') + esc(m.name) +
        (m.running ? '<span class="mrun">running now</span>' : (m.active ? '' : '<span class="moff">off</span>')) +
      '</button>'; }).join('') + '</div>' +
    (!on.length
      ? '<div class="msub bad">This dish is on no menu, so nobody will find it on the pass card or in the Food Bible. Tap one above.</div>'
      : '') +
    '<div class="mnew"><input id="mnn" placeholder="A new menu — Christmas 2026"><button class="newr" id="mnadd">＋ Make this menu</button>' +
      '<span class="err" id="mne"></span></div>';
}

/* ── the floor's half of the same recipe ──
   One record, two readers. The kitchen gets the method and the cost; the floor gets
   what to SAY. Never a second recipe to keep in step — a description that lives
   somewhere else is a description that goes stale the day the dish changes. */
function fohInner(){
  var m = S.method || {};
  return '<div class="mhd">For the floor</div>' +
    '<div class="msub">The dish in guest words.</div>' +
    howto('foh', 'The floor never sees the method or what it costs — it sees this, the allergens ' +
      'above, and the photo. Written here once, by you, because a dish described in two places ends ' +
      'up saying two different things.', 'What the floor sees') +

    FSEC.map(function(s){
      var v = m[s.k] || '';
      return '<div class="msec">' +
        '<label class="ml" for="m-'+s.k+'">'+esc(s.t)+'</label>' +
        '<textarea class="mbox" id="m-'+s.k+'" data-m="'+s.k+'" rows="1" ' +
          'placeholder="'+esc(s.p)+'">'+esc(v)+'</textarea>' +
        '<div class="mhint">'+esc(s.h)+' <span class="wc" id="wc-'+s.k+'">'+budget(s,v)+'</span></div>' +
      '</div>';
    }).join('') +

    '<div class="msec" id="cutwrap">' + cutInner() + '</div>' +

    fohState(m) +
    '<button class="newr" id="seefoh">See exactly what the floor sees</button>';
}
/* Paper does not negotiate. The bible page was measured with every field written out
   and it closes at 297mm with nothing to spare, so these are the real lengths — said
   here, while it can still be shortened, instead of in the printed binder. */
function budget(s, v){
  if (s.lmax){
    var n = linesIn(v);
    if (!n) return '';
    return n > s.lmax
      ? '<b class="over">'+n+' lines — the page holds '+s.lmax+'</b>'
      : n + ' of ' + s.lmax + ' lines';
  }
  var w = wordsIn(v);
  if (!w) return '';
  return w > s.wmax
    ? '<b class="over">'+w+' words — past about '+s.wmax+' this runs onto a second sheet</b>'
    : w + ' of about ' + s.wmax + ' words';
}
function cutInner(){
  var set = (S.method && S.method.cutlery) || [];
  return '<label class="ml">Mise en place — what to set</label>' +
    '<div class="mhint" style="margin:0 0 8px">What this dish is eaten with.</div>' +
    '<div class="achips">' + CUTLERY.map(function(c){
      return '<button class="ach'+(set.indexOf(c)>-1?' on':'')+'" data-cut="'+esc(c)+'">'+esc(c)+'</button>';
    }).join('') + '</div>';
}
/* Blank fields are the phase we are in, not a fault — so this counts, once, quietly,
   and never marks the recipe as unfinished. */
/* Written and "fits on the page" are two different questions, and this line used to
   answer only the first — it said everything was written while four of its own word
   budgets were in the red underneath it, and the field that gets pushed onto the
   second sheet is the allergen strip. Answer both. */
function fohOver(m){
  return FSEC.filter(function(s){
    var v = (m && m[s.k]) || '';
    if (!String(v).trim()) return false;
    return s.lmax ? linesIn(v) > s.lmax : wordsIn(v) > s.wmax;
  }).map(function(s){ return s.t; });
}
function fohState(m){
  var miss = fohMissing(m), over = fohOver(m);
  var overLine = over.length
    ? ' <b class="over">Too long for one A4: ' + over.map(esc).join(', ') + '</b> — ' +
      'the page runs onto a second sheet and the allergens go with it.'
    : '';
  if (!miss.length)
    return '<div class="fstate' + (over.length ? '' : ' done') + '">' +
      (over.length ? 'Every part of the floor’s page is written.' + overLine
                   : 'Every part of the floor’s page is written.') + '</div>';
  return '<div class="fstate">Not written yet: <b>' + miss.map(esc).join('</b>, <b>') + '</b>. ' +
    'The page prints without them — each one just says so in its place.' + overLine + '</div>';
}

/* one field on the floor's screen — empty says so plainly rather than disappearing,
   because a field that vanishes when blank makes a half-written page look finished */
function fblock(lab, v, q){
  v = (v || '').trim();
  return '<div class="fblk"><span class="flab">'+esc(lab)+'</span>' +
    (v ? (q ? '<q>'+esc(v)+'</q>' : '<div class="fprose">'+esc(v)+'</div>')
       : '<div class="fprose none">Not written yet.</div>') + '</div>';
}
function flist(lab, v){
  var l = String(v||'').split(/\r?\n/).map(function(x){ return x.trim(); }).filter(Boolean);
  return '<div class="fblk"><span class="flab">'+esc(lab)+'</span>' +
    (l.length ? '<ul class="flst">'+l.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>'
              : '<div class="fprose none">Not written yet.</div>') + '</div>';
}

/* the floor's screen — read only, no cost, no method, no kitchen ingredient list */
function fohViewHTML(){
  var inh = inheritedAllergens(), mine = S.allergens || [];
  var all = mine.slice();
  Object.keys(inh).forEach(function(k){ if (all.indexOf(k) < 0) all.push(k); });
  var ord = ALLERGENS.map(function(a){ return a.k; });
  all.sort(function(a,b){ return ord.indexOf(a) - ord.indexOf(b); });
  var desc = ((S.method && S.method.foh) || '').trim();

  return '<div class="pane">' +
    '<div class="fhint">The floor’s screen — only what a guest can be told.</div>' +
    '<div class="fcard">' +
      '<div class="fnm">' + esc(S.name || 'Untitled') + '</div>' +
      (S.section ? '<div class="fsec">' + esc(S.section) + '</div>' : '') +
      (S.photos && S.photos.length
        ? '<div class="fphotos">' + S.photos.map(function(p){
            return '<img src="' + esc(p.u) + '" alt="' + esc(S.name) + '">'; }).join('') + '</div>'
        : '') +
      (desc
        ? '<div class="fdesc">' + esc(desc) + '</div>'
        : '<div class="fdesc none">The menu line is not written yet — the floor would see nothing here. ' +
          'Go back and write one under <b>For the floor</b>.</div>') +

      fblock('Say it like this', S.method && S.method.say, 'q') +
      fblock('The story', S.method && S.method.story) +
      flist('What is in it', S.method && S.method.ing) +
      flist('Garnish', S.method && S.method.garnish) +
      fblock('More information', S.method && S.method.more) +

      /* An untouched allergen row and a genuinely allergen-free dish look identical,
         and this is the one field on the page a guest's answer comes off. So with
         nothing ticked the floor is not shown a clean list — it is told it does not
         know, and to come and ask. */
      '<div class="falg' + (all.length ? '' : ' none') + '">' +
        (all.length
          ? '<b>Contains</b> ' + all.map(function(k){ return esc(allergenName(k)); }).join(' · ')
          : '<b>Not ticked yet</b> — the floor’s page will say it cannot answer an allergy ' +
            'question and to ask the kitchen. If the dish really carries none, tick nothing ' +
            'and it stays that way; it never claims the dish is clear on its own.') +
      '</div>' +
      (function(){
