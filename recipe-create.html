/* ───────── allergens ─────────
   The fourteen that have to be declared, in kitchen words. Never guessed from an
   ingredient name — "Flour Mix" carrying gluten is obvious to a chef and a coin toss
   to a program, and a missed allergen is the one mistake in this whole module that
   can hurt somebody. So: he ticks them, and a batch passes its own up to every dish
   that uses it, however deep. Nothing else is inferred.

   ONE list, one word per allergen, everywhere. The kitchen card, this sheet and the
   Food Bible page all read from this. It used to say "Shellfish" here and the bible
   went looking for "Crustaceans", so three of the fourteen never met — and the way
   that failed was an EMPTY box on the waiter's page, which reads exactly like "this
   dish is safe". The words below are the ones that have to appear on a label, because
   the floor's page is where a guest's allergy question gets answered. */
var ALLERGENS = [
  { k:'gluten',    t:'Gluten' },      { k:'crustacean', t:'Crustaceans' },
  { k:'egg',       t:'Egg' },         { k:'fish',       t:'Fish' },
  { k:'peanut',    t:'Peanuts' },     { k:'soy',        t:'Soya' },
  { k:'milk',      t:'Milk' },        { k:'nuts',       t:'Tree nuts' },
  { k:'celery',    t:'Celery' },      { k:'mustard',    t:'Mustard' },
  { k:'sesame',    t:'Sesame' },      { k:'sulphites',  t:'Sulphites' },
  { k:'lupin',     t:'Lupin' },       { k:'mollusc',    t:'Molluscs' }
];
function allergenName(k){
  var a = ALLERGENS.filter(function(x){ return x.k === k; })[0];
  return a ? a.t : k;
}
/* Everything a batch carries, including through batches inside it — and, for each one,
   the recipe where it is actually TICKED. Saying "fish, from the cream sauce" when the
   fish is really in the stock inside that sauce sends him to open the sauce, find
   nothing ticked, and lose faith in the whole line. Name the recipe he has to open. */
function batchAllergens(id, stack){
  var b = BATCH[id]; if (!b) return [];
  stack = stack || []; if (stack.indexOf(id) > -1) return [];      /* a ring stops here */
  stack = stack.concat([id]);
  var out = (b.allergens || []).map(function(k){ return { k:k, at:b.name }; });
  b.lines.forEach(function(l){
    if (!l.child_recipe_id) return;
    batchAllergens(l.child_recipe_id, stack).forEach(function(x){
      if (!out.some(function(y){ return y.k === x.k; })) out.push(x);
    });
  });
  return out;
}
/* what this recipe carries because of what is IN it, and exactly where each came from */
function inheritedAllergens(){
  var from = {};
  (S.rows || []).forEach(function(r){
    if (!isMine(r.code)) return;
    var id = idOf(r.code), b = BATCH[id]; if (!b) return;
    batchAllergens(id).forEach(function(x){
      if (!from[x.k]) from[x.k] = [];
      /* "at" is where it is ticked, "via" is the batch on this sheet that brings it in */
      var where = x.at === b.name ? b.name : x.at + ', inside ' + b.name;
      if (from[x.k].indexOf(where) < 0) from[x.k].push(where);
    });
  });
  return from;
}
/* Whatever came back from the database, make it the four boxes and nothing else —
   plus `foh`, the line the floor reads. There is no description column on `recipes`
   and adding one needs SQL run by hand; a key in this jsonb needs nothing, works
   today, and moves to a real column later without a single recipe being redone. */
function normMethod(m){
  var out = emptyMethod();
  if (typeof m === 'string') { out.method = m; return out; }
  if (m && typeof m === 'object'){
    /* MKEYS, not MSEC: the sheet only SHOWS Method now, but anything written under the
       old headings is still carried through a save. A box disappearing off a screen
       must never delete what somebody typed into it. */
    MKEYS.forEach(function(k){ if (typeof m[k] === 'string') out[k] = m[k]; });
    FKEYS.forEach(function(k){ if (typeof m[k] === 'string') out[k] = m[k]; });
    /* only cutlery this restaurant actually sets — anything else came from a bad
       write and is dropped rather than printed on a waiter's page */
    if (Array.isArray(m.cutlery)) out.cutlery = m.cutlery.filter(function(c){
      return CUTLERY.indexOf(c) > -1; });
  }
  return out;
}
/* what the Food Bible page needs before it can be printed for a guest-facing binder */
function fohMissing(m){
  return FSEC.filter(function(s){ return !((m && m[s.k]) || '').trim(); })
    .map(function(s){ return s.t; });
}
function wordsIn(s){ var t = String(s||'').trim(); return t ? t.split(/\s+/).length : 0; }
function linesIn(s){ return String(s||'').split(/\r?\n/).filter(function(l){ return l.trim(); }).length; }
function hasMethod(m){ return MSEC.some(function(s){ return (m && m[s.k] || '').trim(); }); }

/* A file writes its method as one block with his own headings in it — "Mise en Place",
   "Method", "Plating Method". Put each part under the heading it belongs to. A heading
   we don't know (Branzino says "Pickling Liquid") is left in the text exactly as written,
   because it is part of what the chef wrote. Nothing is thrown away. */
function parseMethod(text){
  var out = emptyMethod();
  if (!text) return out;
  /* It used to deal the lines out under the four headings. There is one box now, so
     the whole thing goes into it — his own headings kept exactly as he typed them,
     because they are part of what he wrote. Splitting into boxes that no longer exist
     would have binned everything his workbooks put under "Mise en Place" and
     "Plating Method", which is most of what they say. */
  out.method = String(text).replace(/\r/g,'').replace(/\n{3,}/g,'\n\n').trim();
  return out;
}

/* ───────── DEV-site write protection ─────────
   The same files serve DEV (robertos-kitchen.github.io) and LIVE
   (guarracinofamily.github.io) against ONE production database. The app's app.js
   wraps window.fetch to block writes on the dev host — but this page is opened on
   its own and never loads app.js, so it would have written real recipes into the
   production kitchen while he was "just checking". Same guard, same localStorage
   key, same PIN, so unlocking in the app unlocks here and nothing has two answers.
   localhost stays writable. Must run before anything calls fetch. */
var IS_DEV_HOST = location.hostname === 'robertos-kitchen.github.io';
var DEV_READ_ONLY = IS_DEV_HOST && localStorage.getItem('kitchen-dev-writes') !== '1';
if (DEV_READ_ONLY){
  var _realFetch = window.fetch.bind(window);
  window.fetch = function(url, opts){
    var method = ((opts && opts.method) || 'GET').toUpperCase();
    var s = String(url);
    if (method !== 'GET' && method !== 'HEAD' && s.indexOf('/rest/v1/') !== -1){
      console.warn('[DEV read-only] blocked ' + method + ' ' + s);
      return Promise.resolve(new Response(
        JSON.stringify({ message:'The DEV site is read-only. Tap the DEV badge at the bottom left, ' +
          'and enter the schedule PIN, to save test recipes to the real database.' }),
        { status:403, headers:{ 'Content-Type':'application/json' } }));
    }
    return _realFetch(url, opts);
  };
}
if (IS_DEV_HOST){
  window.addEventListener('DOMContentLoaded', function(){
    var b = document.createElement('div');
    b.textContent = DEV_READ_ONLY ? 'DEV · read-only' : 'DEV · WRITES ON';
    /* It sat at bottom:8px, which is on top of the costing bar — the badge is the
       one thing on the page allowed to cover the sheet, and it was covering the
       numbers instead. It rides above the bar, whatever height the bar is. */
    b.id = 'devbadge';
    b.style.cssText = 'position:fixed;bottom:8px;left:8px;z-index:99999;padding:5px 12px;border-radius:14px;' +
      'font:700 11px/1.3 system-ui,sans-serif;letter-spacing:.4px;cursor:pointer;color:#fff;' +
      'box-shadow:0 2px 8px rgba(0,0,0,.25);background:' + (DEV_READ_ONLY ? '#6B1F2A' : '#B00020');
    b.onclick = function(){
      if (DEV_READ_ONLY){
        var p = prompt('The DEV site is read-only.\nEnter the schedule PIN to save test recipes into the real database:');
        if (p === null) return;
        if (p.trim() !== '2468'){ alert('Wrong PIN.'); return; }
        localStorage.setItem('kitchen-dev-writes','1');
      } else {
        localStorage.removeItem('kitchen-dev-writes');
      }
      location.reload();
    };
    document.body.appendChild(b);
  });
}

/* A request that never comes back is worse than one that fails, because nothing on the
   screen says so. The kitchen wifi drops for a few seconds mid-save, this promise never
   settles, and the Save button sits on "Saving…" for ever — every tap after it is a
   silent no-op, and the method he has just written can never be saved again without
   reloading the page. Forty-five seconds is long enough for a recipe carrying photos on
   a bad phone signal, and short enough that a dead connection is something he is told
   about rather than something he has to guess at. */
var SB_TIMEOUT = 45000;
function sb(path, opts){
  opts = opts || {};
  var h = { apikey:SB_KEY, Authorization:'Bearer '+SB_KEY };
  if (opts.body){ h['Content-Type']='application/json'; h.Prefer = opts.prefer || 'return=representation'; }
  else if (opts.prefer) h.Prefer = opts.prefer;
  var ac = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var timer = setTimeout(function(){ if (ac) ac.abort(); }, SB_TIMEOUT);
  return fetch(SB_URL+'/rest/v1/'+path, { method:opts.method||'GET', headers:h,
           signal: ac ? ac.signal : undefined,
           body: opts.body ? JSON.stringify(opts.body) : undefined })
    .then(function(res){
      return res.text().then(function(txt){
        var data = null; try { data = txt ? JSON.parse(txt) : null; } catch(e){}
        if (!res.ok) throw new Error((data && (data.message||data.hint)) || txt || ('HTTP '+res.status));
        return data;
      });
    })
    .then(function(v){ clearTimeout(timer); return v; }, function(err){
      clearTimeout(timer);
      if (err && (err.name === 'AbortError' || /aborted/i.test(err.message||'')))
        throw new Error('the network did not answer in ' + Math.round(SB_TIMEOUT/1000) +
                        ' seconds, so nothing was sent');
      throw err;
    });
}

function linesFor(recipeId, rowsArr){

             child_recipe_id: mineB ? idOf(r.code) : null,
             stock_code: mineB ? null : (r.code || null),
             stock_name: mineB ? null : (it ? it.name : null),
             qty:r.qty, unit:r.unit || (it ? defUnit(it) : null),
             trim_on: !!r.adj, yield_pct: r.adj ? (r.yield||100) : null,
             waste_pct: r.adj ? (r.waste||0) : null };
  });
}

/* Save — the recipe, then its lines. Never a stored cost: it re-costs off the stock take every time. */
function saveRecipe(){
  var head = {
    kind: S.kind, name: S.name.trim(), section: S.section || null,
    /* The picker shows kg selected and the panel says "PER KG", but `S.makesUnit` is
       only set on change — so accepting the default saved nothing, and the pass card
       then read "Makes 4" with no unit at all. Save what the screen says. */
    makes_qty: S.makesQty, makes_unit: S.makesUnit || (S.kind==='main' ? 'portions' : 'kg'),
    menu_price: S.kind==='main' ? S.price : null,
    method: normMethod(S.method), photos: S.photos || [],
    /* only what he ticked on THIS recipe. What a batch brings is worked out live from
       the batch every time, so fixing the batch fixes every dish — never a stored copy
       that goes stale the moment the batch changes. */
    allergens: (S.allergens || []).filter(function(k){
      return ALLERGENS.some(function(a){ return a.k === k; }); }),
    updated_at: new Date().toISOString()
  };
  /* Save changes saves the WHOLE card, never part of it — and the other half of that
     rule is that a sheet which never held the whole card must not be allowed to blank
     the parts it does not know about. That is exactly how a photo was lost: the sheet
     came back from Unsaved work without one, and the save wrote photos:[] straight over
     a picture that was on the record. Every route onto a sheet sets `whole` today; if a
     new one ever forgets, the fields it cannot vouch for are left alone rather than
     emptied. */
  if (S.id && !S.whole){
    delete head.photos; delete head.method; delete head.allergens;
  }
  var step1 = S.id
    ? sb('recipes?id=eq.'+S.id, { method:'PATCH', body:head })
    : sb('recipes', { method:'POST', body:head });
  return step1.then(function(out){
    var rec = out && out[0]; if (!rec) throw new Error('the database did not return the recipe');
    S.id = rec.id;
    return sb('recipe_lines?recipe_id=eq.'+S.id, { method:'DELETE', prefer:'return=minimal' });
  }).then(function(){
    if (!S.rows.length) return null;
    return sb('recipe_lines', { method:'POST', prefer:'return=minimal', body: linesFor(S.id, S.rows) });
  }).then(function(){
    return saveRecipeMenus();
  }).then(function(){
    /* a batch that just changed must re-cost everywhere it is used */
    return S.kind === 'batch' ? loadBatches() : null;
  });
}

/* ═════════ leaving a sheet with work on it ═════════
   No dialog. A dialog is the one thing he asked never to see, and it would be the
   only thing in the module that opens. Instead the sheet itself says it, in place,
   and asks the question where the work is — and until he answers, nothing moves. */
function sig(){
  return JSON.stringify({
    k:S.kind, n:(S.name||'').trim(), s:S.section||'', p:S.price,
    mq:S.makesQty, mu:S.makesUnit, m:normMethod(S.method),
    a:(S.allergens||[]).slice().sort(),
    mn:(S.menus||[]).slice().sort(),
    ph:(S.photos||[]).map(function(p){ return (p.n||'') + ':' + ((p.u||'').length); }),
    r:(S.rows||[]).map(function(r){
      return [r.raw, r.code, r.qty, r.unit, !!r.adj, r.yield, r.waste].join('|'); })
  });
}
function markClean(){ S.clean = sig(); }
/* Deliberately NOT tied to which screen he is on. The sheet is still in memory while
   he browses Saved recipes, and tapping another recipe from there would overwrite it
   just as surely as going back would. */
function isDirty(){
  if (!S.kind || !(S.rows || []).length) return false;
  if (!S.id) return true;                    /* never saved — all of it is at risk */
  return S.clean != null && sig() !== S.clean;
}
/* run it, or hold it until he has answered — asked ON the sheet, where the work is,
   so he can see what he is about to lose instead of reading about it */
function guard(go){
  if (!isDirty()) return go();
  S.pendingGo = go;
  if (S.step !== 'sheet'){ S.step = 'sheet'; render(); window.scrollTo(0,0); }
  else drawSaveBar();
  var b = $('savebar'); if (b && b.scrollIntoView) b.scrollIntoView({ block:'center' });
}
function drawSaveBar(){ var b = $('savebar'); if (b) b.innerHTML = saveBarInner(); }
function saveBarInner(){
  if (!isDirty()) return '';
  if (!S.pendingGo)
    return '<div class="sb1"><span class="sbt"><b>Not saved.</b> ' +
      (S.id ? 'This recipe has changes that are only on this screen.'
            : 'Nothing here is saved yet.') + '</span>' +
      '<button class="okb" id="sbsave">Save now</button></div>';
  return '<div class="sb1 ask"><span class="sbt"><b>Wait — this is not saved.</b> ' +
    'Leave now and ' + (S.id ? 'these changes go' : 'the whole sheet goes') + '.</span>' +
    '<button class="okb" id="sbsavego">Save, then go</button>' +
    '<button class="cxb" id="sbgo">Go without saving</button>' +
    '<button class="cxb" id="sbstay">Stay here</button></div>';
}

/* the database speaks database. Say it in kitchen words. */
function plain(msg){
  if (/recipes_name_unique|duplicate key/i.test(msg))
    return 'There is already a recipe called "'+S.name.trim()+'". Give this one a different name, or open that one and change it.';
  if (/Failed to fetch|NetworkError|network/i.test(msg))
    return 'No connection to the Kitchen database. Your sheet is safe here — try Save again in a moment.';
  return msg;
}

/* ═════════ starting a new one without losing the old one ═════════
   Wanting to write a new recipe is not a reason to be stopped, and half a Salmoriglio
   is not a reason to lose it. So the half-written sheet is put to one side and he goes
   straight where he asked to go. It sits in a line at the top of the new sheet until he
   picks it back up or saves the new one over the top of nothing. One slot: parking a
   second one would be a filing system nobody asked for. */
var PARKMAX = 12, PARKLS = 'rcp.unsaved.v1';
/* Only what a recipe IS — not the hundred options hanging off each row, which are read
   back off Aung's list anyway. Small enough to keep on the machine, so a shut lid or a
   reloaded page is not the end of it either. */
function parkSnapshot(){
  return { at:new Date().toISOString(),
           label:(S.name || '').trim() || ('a ' + (S.kind || 'new') + ' recipe with no name yet'),
           id:S.id, kind:S.kind, name:S.name, section:S.section, text:S.text,
           price:S.price, makesQty:S.makesQty, makesUnit:S.makesUnit,
           method:S.method, allergens:S.allergens, menus:S.menus,
           /* The photo was the one thing a snapshot did not carry, so a picture taken
              at the pass and not yet saved was gone the moment the sheet was put down —
              and a photo is the only part of a recipe that cannot be typed again from
              memory. It counts as a change (see sig()), so adding one is exactly what
              causes the sheet to be parked in the first place. */
           photos:(S.photos || []).slice(),
           lines:(S.rows || []).length,
           rows:(S.rows || []).map(function(r){
             return { raw:r.raw, code:r.code || null, qty:r.qty, unit:r.unit || null,
                      adj:!!r.adj, yield:r.yield, waste:r.waste }; }) };
}
function parkedList(){ if (!S.parkedList) S.parkedList = []; return S.parkedList; }
function parkPut(l){
  try { localStorage.setItem(PARKLS, JSON.stringify(l)); return true; } catch(e){ return false; }
}
/* Photos are data URIs and this machine holds about five megabytes, so twelve parked
   recipes each carrying one taken on a phone will not fit. The old line swallowed that
   failure whole — the write threw, nothing was said, and the entire Unsaved work list
   quietly stopped being kept.
   When it will not fit, give things up in the order they can be replaced: photos first
   and oldest first (a photo can be taken again), then the oldest pieces of work, and
   never the one just put down. */
function savePark(){
  var l = parkedList();
  if (parkPut(l)) return true;
  for (var i = l.length - 1; i >= 0; i--){
    if (l[i] && l[i].photos && l[i].photos.length){
      l[i].photos = []; l[i].photosDropped = true;
      if (parkPut(l)) return true;
    }
  }
  while (l.length > 1){
    l.pop();
    if (parkPut(l)) return true;
  }
  return false;
}
function loadPark(){
  try { var v = JSON.parse(localStorage.getItem(PARKLS) || '[]'); S.parkedList = Array.isArray(v) ? v : []; }
  catch(e){ S.parkedList = []; }
}
function parkCurrent(){
  if (!isDirty()) return false;
  var snap = parkSnapshot();
  /* the same recipe put down twice is one piece of work, not two */
  var l = parkedList().filter(function(p){
    return !(String(p.id) === String(snap.id) && p.label === snap.label); });
  l.unshift(snap);
  S.parkedList = l.slice(0, PARKMAX);
  savePark();
  S.parkedLabel = snap.label;
  S.parkedWasSaved = !!snap.id;
  return true;
}
/* Two different things end up in the same list and they do not mean the same thing.
   A recipe that has never been saved is work in progress — there is nothing to save it
   onto yet. A recipe that already exists and has been CHANGED is different: the change
   belongs on the recipe, and being told it is "in Unsaved work" reads like everything
   is fine when what he actually did — picking the two missing ingredients on Lobster
   bisque — is not on the recipe at all. Say which one it is. */
function parkedFlash(){
  return S.parkedWasSaved
    ? '“' + S.parkedLabel + '” has changes you have not saved. They are kept in Unsaved work.'
    : '“' + S.parkedLabel + '” is in Unsaved work — carry on with it any time.';
}
function dropPark(i){ parkedList().splice(i, 1); savePark(); }
function unparkAt(i){
  var p = parkedList()[i]; if (!p) return;
  parkCurrent();                                  /* whatever he is on now joins the list */
  var l = parkedList(), k = l.indexOf(p); if (k > -1) l.splice(k, 1);
  savePark();
  newRecipe();
  S.id = p.id || null; S.kind = p.kind; S.name = p.name || ''; S.section = p.section || '';
  S.text = p.text || ''; S.price = p.price;
  S.makesQty = p.makesQty; S.makesUnit = p.makesUnit;
  S.method = p.method || emptyMethod(); S.allergens = p.allergens || []; S.menus = p.menus || [];
  S.photos = Array.isArray(p.photos) ? p.photos.filter(function(x){ return x && x.u; }) : [];
  /* the rows are rebuilt off the same words in the same order, then what he had chosen
     is put back on them line by line — a row whose words have changed is left alone */
  S.rows = splitLine(S.text).map(function(x){ return mkRow(x); });
  S.rows.forEach(function(r, idx){
    var sr = (p.rows || [])[idx]; if (!sr || sr.raw !== r.raw) return;
    if (sr.code){
      var it = pool().filter(function(x){ return x.code === sr.code; })[0];
      if (it){ r.opts = [it].concat(r.opts.filter(function(o){ return o.code !== it.code; })); r.code = sr.code; }
    }
    r.qty = sr.qty; r.unit = sr.unit; r.adj = sr.adj;
    if (sr.yield != null) r.yield = sr.yield;
    if (sr.waste != null) r.waste = sr.waste;
  });
  S.pendingGo = null;
  S.step = S.rows.length ? 'sheet' : 'write';
}
/* Everything half written, in one place, on the screen a new recipe starts from.
   Each one comes back or goes in the bin — his call, never the app's. */
function parkedNote(){
  var l = parkedList(); if (!l.length) return '';
  return '<div class="parked"><div class="ph">Unsaved work · ' + l.length + '</div>' +
    l.map(function(p, i){
      var when = '';
      try { when = new Date(p.at).toLocaleString('en-GB',
            { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }); } catch(e){}
      return '<div class="prow"><span class="pn">' + esc(p.label) + '</span>' +
        '<span class="pm">' + (p.id ? '<b>changes not saved onto it</b> · ' : '') +
          (p.kind === 'batch' ? 'batch' : 'main') + ' · ' + p.lines +
          ' line' + (p.lines === 1 ? '' : 's') + (when ? ' · ' + esc(when) : '') + '</span>' +
        '<button class="lnk" data-unpark="' + i + '">' +
          (p.id ? 'Open it and save' : 'Carry on with it') + '</button>' +
        '<button class="lnk bin" data-binpark="' + i + '">Delete</button></div>';
    }).join('') + '</div>';
}
/* the shell calls this every time the Create new recipes tile is tapped, so that tile
   always opens on a clean sheet — and never at the cost of what was on the screen */
window.__rcpNew = function(){
  try { parkCurrent(); S.pendingGo = null; newRecipe(); render(); window.scrollTo(0,0); }
  catch(e){}
};

function newRecipe(){
  /* A brand-new sheet IS the whole recipe — there is nothing on the record it does not
     already hold. See `whole` in saveRecipe. */
  S.whole = true;
  S.id=null; S.kind=null; S.name=''; S.section=''; S.text=''; S.rows=[];
  S.price=null; S.makesQty=null; S.makesUnit=null; S.step='type';
  S.imported=null; S.found=null; S.hints=null; S.cameFrom=null; S.find=null;
  S.method = emptyMethod(); S.photos = []; S.bigPhoto = null; S.allergens = [];
  /* A dish on no menu shows up on no card at all — so a new one starts on the menu
     that is running. Untick it if it belongs somewhere else; it is one tap either
     way, and the other way round is a dish nobody can find. */
  var run = MENUS.filter(function(m){ return m.running; })[0];
  S.menus = run ? [run.id] : [];
  S.plan = null; S.planRan = false; S.fromPlan = false; S.fromTodo = false;
}

/* ───────── the two things both called a batch ─────────
   Aung's stock take carries "RF Cacio e Pepe (Polpo) (PA)" — a code and a price per kilo,
   and nothing else. It is not a recipe and there are no ingredients behind it. What we
   write in this module IS a recipe. The sheet used to draw both with the same gold B, so
   tapping the second kind landed on a list row you can do nothing with.

   The two are the same batch written by two hands, and the names line up once his wrapper
   is off: 9 of the first 10 batch recipes written match his list exactly this way. So the
   B goes to the recipe whenever one exists, and says so plainly when one does not. */
function batchKey(s){
  return String(s||'').replace(/^\s*RF\s+/i,'').replace(/\s*\(PA\)\s*$/i,'')
                      .replace(/\s+/g,' ').trim().toLowerCase();
}
function plainBatch(s){
  return String(s||'').replace(/^\s*RF\s+/i,'').replace(/\s*\(PA\)\s*$/i,'').replace(/\s+/g,' ').trim();
}
/* the recipe behind one of Aung's batch lines, if it has been written. Removed ones count —
   offering to write a recipe that already exists, archived, is how you end up with two. */
function myBatchFor(name){
  var k = batchKey(name); if (!k) return null;
  for (var i = 0; i < MYB.length; i++) if (batchKey(MYB[i].name) === k) return MYB[i];
  return null;
}

/* Aung's list can hold two of a thing — "RF Cacio e Pepe (Polpo) (PA)" and
   "RF Cacio e Peper (Spaghetto) (PA)" — and when it does, myBatchFor() finds neither,
   because neither is an exact key. Refusing to choose is right; a silent wrong link is
   the worst thing this module can do. But refusing is not the same as having nothing.
   These are the recipes he might have meant, ranked, for HIM to pick from. simName is
   the "did he mean this?" score — the deliberately generous one. Never picked for him. */
function batchCandidates(aungName){
  var k = batchKey(aungName); if (!k) return [];
  return MYB.filter(function(b){ return !b.away; })
    .map(function(b){ return { it:b, s:simName(k, batchKey(b.name)) }; })
    .filter(function(x){ return x.s >= 0.55; })
    .sort(function(a, b){ return b.s - a.s; })
    .slice(0, 3)
    .map(function(x){ return x.it; });
}

/* which live recipes have this batch in them */
function usedBy(id){
  return sb('recipe_lines?child_recipe_id=eq.'+id+'&select=recipe_id')
    .then(function(ls){
      var ids = (ls||[]).map(function(l){ return l.recipe_id; })
                        .filter(function(v,i,a){ return a.indexOf(v)===i && v!==id; });
      if (!ids.length) return [];
      return sb('recipes?id=in.('+ids.join(',')+')&archived=is.false&select=name')
        .then(function(rs){ return (rs||[]).map(function(r){ return r.name; }); });
    })
    .catch(function(){ return []; });
}

/* Remove = put away, not destroy. The recipe stops showing; nothing is lost. */
function archiveRecipe(id, on){
  return sb('recipes?id=eq.'+id, { method:'PATCH', prefer:'return=minimal',
    body:{ archived:!!on, updated_at:new Date().toISOString() } });
}

/* ───────── our own batch recipes, usable inside any recipe ─────────
   A batch costs what its ingredients cost, divided by how much it makes.
   If anything about it is unfinished we carry NO cost and say why — a batch
   must never quietly hand a made-up number to the dish that uses it. */
var MYB = [];              /* pseudo-items, shaped like a stock item so everything else just works */
var BATCH = {};            /* id -> { name, makesQty, makesUnit, lines } */
function pool(){ return MYB.length ? ING.concat(MYB) : ING; }            /* everything, so a link still resolves */
function pickable(){ return MYB.length ? ING.concat(MYB.filter(function(b){ return !b.away; })) : ING; }
function isMine(code){ return typeof code === 'string' && code.indexOf('R:') === 0; }
function idOf(code){ return String(code).slice(2); }

/* Main recipes, shaped exactly like a batch so the SAME cost walk works on them.
   Kept apart from BATCH on purpose: anything in BATCH becomes pickable as a batch,
   and a dish must never be linkable inside another dish. */
var MAINS = {};

function batchCost(id, stack){
  var b = BATCH[id] || MAINS[id];
  if (!b) return { problem:'that batch is no longer there' };
  stack = stack || [];
  if (stack.indexOf(id) > -1) return { problem:'it ends up using itself' };
  stack = stack.concat([id]);
  if (!b.makesQty) return { problem:'it does not say how much it makes' };

  var total = 0, why = null;
  for (var i=0; i<b.lines.length; i++){
    var l = b.lines[i], per = null, base = null;
    if (!l.child_recipe_id && !l.stock_code){ why = why || 'a line in it has no ingredient picked yet'; continue; }
    if (l.child_recipe_id){
      var sub = batchCost(l.child_recipe_id, stack);
      if (sub.problem){ why = why || ((BATCH[l.child_recipe_id]||{}).name||'a batch') + ' inside it ' + sub.problem; continue; }
      per = sub.per; base = sub.base;
    } else {
      var it = ING.filter(function(x){ return x.code === l.stock_code; })[0];
      if (!it){ why = why || 'an ingredient in it is no longer on the stock take'; continue; }
      if (it.price === 0 && !it.mine){ why = why || 'an ingredient in it has no price on the stock take'; continue; }
      var bp = basePrice(it);
      if (!bp){ why = why || 'an ingredient in it has a unit the app cannot read'; continue; }
      per = bp.v; base = bp.base;
    }
    if (l.qty == null){ why = why || 'a line in it has no quantity'; continue; }
    var c = qtyInBase(l.qty, l.unit || (base==='kg'?'g':base==='L'?'ml':'pcs')) * per;
    total += c / ((l.trim_on ? (l.yield_pct==null?100:l.yield_pct) : 100)/100)
               * (1 + (l.trim_on ? (l.waste_pct||0) : 0)/100);
  }
  if (why) return { problem: why };
  if (!b.lines.length) return { problem:'it has nothing in it yet' };
  return { per: total / b.makesQty, base: b.makesUnit, total: total };
}

/* would putting `id` inside the recipe we're editing come back round to itself? */
function usesBatch(id, target, stack){
  if (id === target) return true;
  stack = stack || [];
  if (stack.indexOf(id) > -1) return false;
  var b = BATCH[id]; if (!b) return false;
  return b.lines.some(function(l){
    return l.child_recipe_id && usesBatch(l.child_recipe_id, target, stack.concat([id]));
  });
}

function loadBatches(){
  return Promise.all([
    /* removed batches are loaded too — a recipe that still links one must keep the link
       and say so, not quietly drop the line the next time it is saved */
    sb('recipes?kind=eq.batch&select=id,name,makes_qty,makes_unit,archived,allergens'),
    sb('recipe_lines?select=recipe_id,stock_code,child_recipe_id,qty,unit,trim_on,yield_pct,waste_pct')
  ]).then(function(both){
    BATCH = {};
    (both[0]||[]).forEach(function(r){
      BATCH[r.id] = { name:r.name, makesQty:r.makes_qty, makesUnit:r.makes_unit||'kg',
                      archived:!!r.archived, allergens:r.allergens||[], lines:[] };
    });
    (both[1]||[]).forEach(function(l){ if (BATCH[l.recipe_id]) BATCH[l.recipe_id].lines.push(l); });
    MYB = Object.keys(BATCH).map(function(id){
      var b = BATCH[id], c = b.archived ? { problem:'it has been removed from the saved recipes' } : batchCost(id);
      return { code:'R:'+id, name:b.name, group:'Our batch recipes',
               unit:b.makesUnit, price: c.problem ? null : c.per,
               units: c.problem ? [] : [{ unit:b.makesUnit, price:c.per }],
               myBatch:true, problem:c.problem||null, makes:b.makesQty, away:b.archived };
    });
  }).catch(function(e){ MYB = []; BATCH = {}; });
}

function loadSaved(){
  /* 400 was the cap while there were five recipes. Ordered newest-first, a cap does
     not trim the list — it silently deletes the OLDEST recipes off the end, which are
     exactly the ones you open the search for. The whole book is well under 2000. */
  /* The folders are menu → section, so which menus each recipe is on has to come back
     WITH the list. If that one call fails we do not quietly file three hundred recipes
     under "Not on a menu" — that reads as a fact and it is a lie. The flag drops the
     screen back to the plain list and says why. */
  return Promise.all([
    /* `method` comes back with the list so Needs finishing can say when a dish has no
       method written and when the floor's half is empty — both invisible from outside */
    sb('recipes?select=id,kind,name,section,makes_qty,makes_unit,menu_price,updated_at,archived,method' +
       '&order=updated_at.desc&limit=2000'),
    sb('recipe_menus?select=recipe_id,menu_id').catch(function(){ return null; }),
    sb('menus?venue_id=eq.robertos-difc&select=id,name,archived,position&order=archived,position,name')
      .catch(function(){ return null; }),
    /* what is wrong with each one, counted here so the list can say it without him
       opening twenty recipes to find the three that need him */
    sb('recipe_lines?select=recipe_id,stock_code,child_recipe_id,qty').catch(function(){ return null; })
  ]).then(function(res){
    S.saved = res[0] || []; S.listErr = null;
    S.foldErr = !res[1] || !res[2];
    S.tally = null;
    if (res[3]){
      var t = {};
      res[3].forEach(function(l){
        var x = t[l.recipe_id] || (t[l.recipe_id] = { lines:0, noIng:0, noQty:0, kids:[] });
        x.lines++;
        if (!l.stock_code && !l.child_recipe_id) x.noIng++;
        if (l.qty == null) x.noQty++;
        if (l.child_recipe_id) x.kids.push(l.child_recipe_id);
      });
      S.tally = t;
    }
    var m = {}; (res[1] || []).forEach(function(r){ (m[r.recipe_id] = m[r.recipe_id] || []).push(r.menu_id); });
    S.rmenus = m;
    SAVEDMENUS = res[2] || [];
  })
    .catch(function(e){ S.saved=[]; S.rmenus={}; S.foldErr=true; S.listErr = e.message; });
}
/* every menu, archived ones too — a recipe can sit on a menu that has been put away,
   and a folder list that skips it hides the recipe altogether */
var SAVEDMENUS = [];
/* ───────── what is still wrong with a saved recipe ─────────
   Everything that stops it costing, said on the row, so twenty recipes can be looked
   over in one glance instead of opened one at a time. Only what is true: no ingredient
   picked on a line, no quantity on a line, a batch inside it that has been removed, or
   a batch that never said how much it makes. All four cost the dish nothing and all
   four are invisible until you open it. */
function issuesOf(r){
  if (!S.tally) return [];                      /* the count did not load — claim nothing */
  var t = S.tally[r.id], out = [];
  /* what stops it costing comes first — those are the ones that quietly make a dish
     look cheaper than it is */
  if (!t || !t.lines) out.push({ hard:true, s:'nothing in it yet' });
  else {
    if (t.noIng) out.push({ hard:true, s:t.noIng + (t.noIng===1 ? ' line with no ingredient' : ' lines with no ingredient') });
    if (t.noQty) out.push({ hard:true, s:t.noQty + (t.noQty===1 ? ' line with no amount' : ' lines with no amount') });
    var gone = 0, seen = {};
    t.kids.forEach(function(id){
      if (seen[id]) return; seen[id] = 1;
      var b = BATCH[id]; if (b && b.archived) gone++;
    });
    if (gone) out.push({ hard:true, s:gone + (gone===1 ? ' batch in it has been removed' : ' batches in it have been removed') });
  }
  if (r.kind === 'batch' && r.makes_qty == null) out.push({ hard:true, s:'doesn’t say how much it makes' });
  if (r.kind === 'main'){
    /* Batches are left out of these two on purpose: nobody cooks a batch off a card at
       the pass and the floor never reads one, so a batch with no method is not unfinished.
       A dish with none is — the pass has nothing to cook from, and the Food Bible page
       the floor reads comes out blank. */
    var m = normMethod(r.method);
    if (!hasMethod(m)) out.push({ s:'no method — nothing for the pass to cook from' });
    if (!FSEC.some(function(f){ return String(m[f.k] || '').trim(); }))
      out.push({ s:'nothing for the floor — the Food Bible page is blank' });
    if (r.makes_qty == null)  out.push({ s:'doesn’t say how many portions' });
    if (!r.section)           out.push({ s:'no section — Aung’s form needs one' });
    if (r.menu_price == null) out.push({ s:'no menu price' });
    if (S.rmenus && !(S.rmenus[r.id] || []).length) out.push({ s:'not on a menu' });
  }
  return out;
}
/* ───── three marks instead of the sentence ─────
   Every dish needs the same things written, so the list can show WHICH rather than spell
   it out per row. On a list of thirty, the same fourteen-word sentence printed twenty-two
   times is not information — no row looks different from any other, and the sentence is
   wider and heavier than the dish's own name.

   A batch is judged on different things on purpose: nobody cooks a batch off a card at
   the pass and the floor never reads one, so a batch with no method is not unfinished.
   What a batch must say is how much it makes, or nothing using it can carry a cost. */
/* "Lines" was the word the code uses for the rows on the sheet. It means nothing to a
   chef reading a list of dishes, and the mark also takes him to the ingredients when he
   taps it — so it says the thing it checks and names where it lands. */
function marksOf(r){
  var t = S.tally && S.tally[r.id];
  var out = [{ k:'Ingredients', on: !!(t && t.lines && !t.noIng && !t.noQty) }];
  if (r.kind === 'main'){
    var m = normMethod(r.method);
    out.push({ k:'Method', on: hasMethod(m) });
    out.push({ k:'Floor',  on: FSEC.some(function(f){ return String(m[f.k] || '').trim(); }) });
  } else {
    out.push({ k:'Makes', on: r.makes_qty != null });
  }
  return out;
}
/* green finished, amber started, plain nothing written — so the eye sorts the list before
   it reads a word of it. Empty when the tally did not load: a row painted "finished" off
   a count that never arrived is worse than a row painted nothing. */
function levelOf(r){
  if (!S.tally) return '';
  var ms = marksOf(r), n = ms.filter(function(x){ return x.on; }).length;
  return n === ms.length ? 'done' : (n === 0 ? 'empty' : 'part');
}
/* Each mark is the way in to the thing it is about. Seeing that the method is missing and
   then having to open the dish and find the method yourself is two jobs where the row has
   already done the first one. */
var JUMPSEC = { Ingredients:'lines', Method:'method', Floor:'floor', Makes:'makes' };
function marksHTML(r){
  if (!S.tally) return '';
  /* the words are not thrown away — they are on the mark itself, and in full on
     Needs finishing, which is the screen for reading them */
  var why = issuesOf(r).map(function(x){ return x.s; }).join(' · ');
  return '<span class="mks"'+(why?' title="'+esc(why)+'"':'')+'>' + marksOf(r).map(function(x){
    var sec = JUMPSEC[x.k];
    return '<button class="mk'+(x.on?' on':'')+'" data-jump="'+r.id+'" data-sec="'+sec+'" ' +
      'aria-label="'+esc(r.name)+' — '+x.k.toLowerCase()+' '+(x.on?'written':'not written yet')+
      '. Open it here." title="Open ‘'+esc(r.name)+'’ at the '+x.k.toLowerCase()+'">' +
      (x.on?'✓ ':'')+x.k+'</button>';
  }).join('') + '</span>';
}
/* where each mark lands. `makes` lives in the costing rather than on the sheet, so that
   one opens the costing on the way past — landing him on a panel he still has to open is
   the same dead end as not jumping at all. */
var JUMPAT = { lines:'.sheetwrap', method:'#mth', floor:'#fohbox', makes:'#foot' };
function jumpTo(sec){
  if (sec === 'makes' && S.footShut){
    S.footShut = false;
    try{ localStorage.setItem('rcpFoot','open'); }catch(x){}
    foot();
  }
  var el = document.querySelector(JUMPAT[sec] || '');
  if (!el) return;
  /* under everything pinned to the top, or he lands on a heading hidden behind the bar */
  var cs = getComputedStyle(document.documentElement);
  var px = function(v){ return parseFloat(cs.getPropertyValue(v)) || 0; };
  var y = Math.max(0, el.getBoundingClientRect().top + window.pageYOffset
          - (px('--barh') + px('--costh') + px('--msgh') + 14));
  /* the two-number form, not scrollTo({top,behavior}). This page has no doctype, so it
     renders in quirks mode — document.scrollingElement is BODY and the object form is
     ignored outright: the highlight landed on the method and the page never moved. */
  window.scrollTo(0, y);
  /* say where he landed — a page that just moves leaves him hunting for what changed */
  el.classList.remove('jumped'); void el.offsetWidth; el.classList.add('jumped');
  setTimeout(function(){ el.classList.remove('jumped'); }, 1800);
}
/* Said once for the folder instead of once on every row. Four rows carrying the same
   sentence is the same fact printed four times; "4 started" is that fact, once, and it
   also tells him the order to work in. */
function stateSummary(rs){
  if (!S.tally || !rs || !rs.length) return '';
  var n = { done:0, part:0, empty:0 };
  rs.forEach(function(r){ if (r.archived) return; var l = levelOf(r); if (l) n[l]++; });
  var bits = [];
  if (n.done)  bits.push('<b class="ss done">'+n.done+' ready</b>');
  if (n.part)  bits.push('<b class="ss part">'+n.part+' started</b>');
  if (n.empty) bits.push('<b class="ss empty">'+n.empty+' not begun</b>');
  return bits.length ? ' · ' + bits.join(' · ') : '';
}
function needsWork(r){
  var is = issuesOf(r); if (!is.length) return '';
  var hard = is.filter(function(x){ return x.hard; });
  var show = (hard.length ? hard : is).map(function(x){ return x.s; });
  return '<span class="swk' + (hard.length ? '' : ' soft') + '">' + esc(show.join(' · ')) +
         (hard.length && is.length > hard.length ? ' +' + (is.length - hard.length) : '') + '</span>';
}
function menuNameOf(id){
  for (var i = 0; i < SAVEDMENUS.length; i++) if (SAVEDMENUS[i].id === id) return SAVEDMENUS[i].name;
  return 'A menu that is no longer there';
}
function menusOf(r){ return (S.rmenus || {})[r.id] || []; }
/* his order, not the alphabet — Crudo comes before Dessert on the menu and on the screen */
function secOrder(s){ var i = SECTIONS.indexOf(s); return i < 0 ? 900 : i; }

/* ───────── the ingredients he added himself ─────────
   Aung's list is the stock take and nothing else. This is the short list of things
   that are not on it — tap water, a dough, something bought mid-month before the
   sheet caught up.

   It used to live in memory for one sitting. That is why the form's promise —
   "it joins your list for every recipe" — was not true, and it mattered far more
   than it looked: a line with no ingredient makes the WHOLE batch carry no cost,
   so water inside Porcini stock quietly emptied the cost of every dish built on
   it. It is a table now. */
var MINE_ERR = null;

function fromMineRow(r){
  var p = Number(r.price) || 0;
  return { code:r.code, name:r.name, group:r.group_name || 'Added by you',
           unit:r.unit, price:p, units:[{ unit:r.unit, price:p }], mine:true, rowId:r.id };
}
/* Aung's sheet always wins. The moment his stock take carries the same code his
   price takes over and this row is ignored — which is exactly what the add form
   says on screen, and it has to be true or the sheet is pricing off an old number. */
function loadMine(){
  return sb('ingredients?venue_id=eq.robertos-difc&archived=is.false&select=*&order=created_at')
    .then(function(list){
      var have = {};
      ING.forEach(function(i){ have[String(i.code).toLowerCase()] = 1; });
      (list||[]).forEach(function(r){
        if (have[String(r.code).toLowerCase()]) return;      /* Aung has it, or it is already loaded */
        ING.push(fromMineRow(r));
      });
      MINE_ERR = null;
      var ni = $('nitems'); if (ni) ni.textContent = ING.length;
    })
    .catch(function(e){ MINE_ERR = e.message; });
}
/* Not a counter. A counter restarts at 1 every time the page loads, so the second
   sitting mints MINE-1 again and writes it over the first one. */
function mintCode(){
  var s = 'MINE-', A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  for (var i=0;i<6;i++) s += A.charAt(Math.floor(Math.random()*A.length));
  return s;
}
function saveMine(it){
  return sb('ingredients', { method:'POST', body:{
      code:it.code, name:it.name, group_name:it.group, unit:it.unit, price:it.price } })
    .then(function(rows){ var r = rows && rows[0]; if (r) it.rowId = r.id; return it; });
}
/* Plain words for what the database says back */
function minePlain(msg){
  msg = String(msg||'');
  if (/ingredients_name_live|duplicate key.*name/i.test(msg))
    return 'Something on your list is already called that — use that one instead of adding it twice.';
  if (/ingredients_code_live|duplicate key/i.test(msg))
    return 'That code is already on your list.';
  if (/relation .*ingredients.* does not exist|PGRST205/i.test(msg))
    return 'The ingredients table is not there yet, so this cannot be kept.';
  if (/row-level security/i.test(msg))
    return 'The database would not accept it.';
  if (/Failed to fetch|NetworkError/i.test(msg))
    return 'No connection to the database.';
  return msg;
}
/* Removing one is archiving it, the same as a recipe — but an ingredient that a
   saved recipe is USING must not vanish, because that recipe would go straight back
   to carrying no cost. So the recipes are asked first, and named. */
function mineInUse(code){
  /* the names come back with the query, not out of S.saved — that list is only loaded
     once you have opened Saved recipes, so relying on it turned "Vitello Tonnato and
     Polletto are using it" into a bare "1 saved recipe", which tells you nothing about
     what to go and fix. recipe_lines points at recipes twice, so the join is named. */
  return sb('recipe_lines?stock_code=eq.' + encodeURIComponent(code) +
            '&select=recipe_id,recipes!recipe_lines_recipe_id_fkey(name,archived)')
    .then(function(rows){
      var seen = {}, names = [];
      (rows||[]).forEach(function(r){
        var rec = r.recipes;
        if (!r.recipe_id || seen[r.recipe_id] || (rec && rec.archived)) return;
        seen[r.recipe_id] = 1;
        names.push((rec && rec.name) || 'a recipe');
      });
      return { n:names.length, names:names };
    });
}
/* Re-running search() on a row is how a new ingredient becomes pickable in the sheet
   you already have open. On its own it also THROWS AWAY whatever that row had picked,
   if the pick does not happen to match the words typed — openRecipe hit the same trap
   and repairs it the same way: put the picked item back on the front of the list. */
function refreshOpts(){
  (S.rows||[]).forEach(function(r){
    r.opts = search(r.word);
    if (r.code && !itemOf(r)){
      var hit = pool().filter(function(i){ return i.code === r.code; })[0];
      if (hit) r.opts = [hit].concat(r.opts);
    }
  });
}
function archiveMine(it){
  return sb('ingredients?id=eq.'+it.rowId, { method:'PATCH', prefer:'return=minimal',
    body:{ archived:true, updated_at:new Date().toISOString() } });
}

/* ───────── menus ─────────
   A section says where a dish sits on a menu. It does not say WHICH menu, and with
   an à la carte, a Christmas menu and whatever else comes, the card and the Food
   Bible could only ever show all three hundred at once — so a waiter training on the
   à la carte had to already know which of them belonged to it.

   A dish is on more than one: Burrata is à la carte AND Christmas. So it is a list
   of menus, and a list of what is on each — never a column on the recipe.

   Batches are deliberately not assigned. A batch belongs to the dishes that use it
   and is reached by opening one of them; putting Porcini stock on a menu would be
   saying a guest can order it. */
var MENUS = [], MENU_ERR = null;

function loadMenus(){
  return sb('menus?venue_id=eq.robertos-difc&archived=is.false&select=*&order=position,name')
    .then(function(list){ MENUS = list || []; MENU_ERR = null; })
    .catch(function(e){ MENUS = []; MENU_ERR = e.message; });
}
/* which menus THIS recipe is on. Read fresh with the recipe, never cached against a
   sheet that has since been left open for an hour. */
function loadRecipeMenus(id){
  if (!id){ S.menus = []; return Promise.resolve(); }
  return sb('recipe_menus?recipe_id=eq.'+id+'&select=menu_id')
    .then(function(rows){ S.menus = (rows||[]).map(function(r){ return r.menu_id; }); })
    .catch(function(){ S.menus = []; });
}
/* Written after the recipe itself, and only the difference — so a dish already on
   four menus is not taken off all four and put back on them every time you press
   Save, which is four chances for a half-finished write to lose one. */
function saveRecipeMenus(){
  if (!S.id || S.kind !== 'main') return Promise.resolve();
  return sb('recipe_menus?recipe_id=eq.'+S.id+'&select=menu_id').then(function(rows){
    var was = (rows||[]).map(function(r){ return r.menu_id; });
    var now = S.menus || [];
    var add = now.filter(function(m){ return was.indexOf(m) < 0; });
    var off = was.filter(function(m){ return now.indexOf(m) < 0; });
    var jobs = [];
    if (add.length) jobs.push(sb('recipe_menus', { method:'POST', prefer:'return=minimal',
      body: add.map(function(m){ return { recipe_id:S.id, menu_id:m }; }) }));
    off.forEach(function(m){
      jobs.push(sb('recipe_menus?recipe_id=eq.'+S.id+'&menu_id=eq.'+m,
        { method:'DELETE', prefer:'return=minimal' }));
    });
    return Promise.all(jobs);
  });
}
function menuName(id){
  var m = MENUS.filter(function(x){ return x.id === id; })[0];
  return m ? m.name : 'a menu';
}
function newMenu(name){

    position:(MENUS.length ? Math.max.apply(null, MENUS.map(function(m){ return m.position||0; })) + 1 : 0) } })
    .then(function(rows){ var m = rows && rows[0]; if (m) MENUS.push(m); return m; });
}
function menuPlain(msg){
  msg = String(msg||'');
  if (/menus_name_live|duplicate key/i.test(msg)) return 'There is already a menu called that.';
  if (/menus_one_running/i.test(msg)) return 'Another menu is already the one running — turn that one off first.';
  if (/relation .*menus.* does not exist|PGRST205/i.test(msg)) return 'The menus table is not there yet.';

/* ═════════ the Micros request for Aung ═════════
   Until now this was an Excel form filled in by hand, one line per dish: the name as
   it reads on the menu, the same name squeezed into 16 characters for the till, the
   cost, and the price. Everything on it is already in this module — so the form is
   built from the menu rather than typed again, and typed twice is how the till ends
   up saying one price and the recipe another.

   What is NOT filled in: the Micros item code. Aung assigns those. And the 16-character
   name is only suggested — "Valen RiccioMare" is a judgement, not an algorithm. */
var MICREQ = { menuId:null, prefix:'', rows:[], err:null, ready:false,
               confirm:false, sent:0, today:'' };

/* The net selling price — the price with every tax taken back out. Written as the form's
   own formula writes it, not as ÷1.225, so the screen and the sheet can never disagree:
   VAT, municipality and service have all been inside the price since December 2025. */
function micNet(price){ return price - price * 0.183675; }

/* his own shorthand, as far as a machine can take it: drop the joining words, keep the
   words that mean something, then shorten the longest one until it fits */
var MICSTOP = { di:1, de:1, del:1, della:1, al:1, alla:1, allo:1, ai:1, con:1, e:1, la:1,
                il:1, lo:1, in:1, a:1, the:1, of:1, and:1, with:1 };
function micShort(name, prefix, limit){
  limit = limit || 16;
  var head = (prefix||'').trim();
  var room = limit - (head ? head.length + 1 : 0);
  var w = String(name||'').replace(/[^\p{L}\p{N}\s]/gu,' ').split(/\s+/)
            .filter(function(x){ return x && !MICSTOP[x.toLowerCase()]; })
            .map(function(x){ return x.charAt(0).toUpperCase() + x.slice(1); });
  if (!w.length) w = [String(name||'').trim()];
  var join = function(){ return w.join(' '); };
  /* squeeze the longest word first — losing a letter off "Carnaroli" reads better
     than losing a whole word */
  var guard = 0;
  while (join().length > room && guard++ < 80){
    var li = 0;
    for (var i=1;i<w.length;i++) if (w[i].length > w[li].length) li = i;
    if (w[li].length <= 3){ w.pop(); if (!w.length) break; continue; }
    w[li] = w[li].slice(0, -1);
  }
  var out = (head ? head + ' ' : '') + join();
  return out.slice(0, limit).trim();
}

/* Every dish on the menu, costed, without opening one of them. batchCost() already
   walks a recipe's lines — including batches inside batches — so the mains are shaped
   the same way and handed to the same walk. */
function loadMicros(menuId){
  MICREQ.err = null; MICREQ.ready = false;
  return Promise.all([
    sb('recipes?kind=eq.main&archived=is.false&select=id,name,section,makes_qty,menu_price'),
    sb('recipe_menus?menu_id=eq.' + menuId + '&select=recipe_id'),
    sb('recipe_lines?select=recipe_id,stock_code,child_recipe_id,qty,unit,trim_on,yield_pct,waste_pct'),
    MYB.length ? Promise.resolve(null) : loadBatches()
  ]).then(function(res){
    var on = {}; (res[1]||[]).forEach(function(r){ on[r.recipe_id] = 1; });
    var byRecipe = {};
    (res[2]||[]).forEach(function(l){ (byRecipe[l.recipe_id] = byRecipe[l.recipe_id] || []).push(l); });

    MAINS = {};
    (res[0]||[]).forEach(function(r){
      /* a main "makes" its portions — the same field a batch uses, so the same walk
         gives cost per portion instead of cost per kilo */
      MAINS[r.id] = { name:r.name, makesQty:r.makes_qty, makesUnit:'portion',
                      archived:false, lines: byRecipe[r.id] || [] };
    });

    MICREQ.rows = (res[0]||[]).filter(function(r){ return on[r.id]; })
      .sort(function(a,b){ return String(a.section||'').localeCompare(String(b.section||'')) ||
                                  String(a.name).localeCompare(String(b.name)); })
      .map(function(r){
        var c = batchCost(r.id);
        return { id:r.id, name:r.name, section:r.section || 'No section',
                 price:r.menu_price, cost: c.problem ? null : c.per, why: c.problem || null,
                 micros: micShort(r.name, MICREQ.prefix), take:true };
      });
    MICREQ.ready = true;
  }).catch(function(e){ MICREQ.err = e.message; MICREQ.rows = []; });
}

/* ── the workbook ─────────────────────────────────────────────────────────────
   Laid out cell for cell like the ones he has been sending, and now in the house
   colours: every other document this module puts out is branded, and a plain grey
   spreadsheet with Roberto's name on it is the one that looks borrowed.

   It is built with ExcelJS, not the XLSX reader the rest of the module uses. That
   is not a preference — the XLSX build we carry SILENTLY DROPS every fill, font and
   border on write. It was proved rather than assumed: a cell written with a vino
   fill came back out of the file with no fill at all. ExcelJS keeps them, and keeps
   the formulas too. Do not "simplify" this back onto XLSX.

   The form does its own arithmetic and always has — LEN, the cost %, the net price
   are formulas in the sheet, not numbers we put there. Writing values over them would
   mean Aung opening a form that no longer recalculates when he corrects a price. */
var MICBRAND = { vino:'FF410207', vinoMid:'FF5E0A10', cream:'FFF5EDE0',
                 sabbia:'FFE1D3C2', sabbiaLight:'FFEDE5D8', line:'FFCFC0AD', ink:'FF2A1A10' };

/* ── the Micros family codes ──
   Read off Aung's own form (Copy of R's Micros Request Food -New Menu 18.12.2025.xlsx),
   not invented. Every family line on his sheet carries its code in column B, and the
   dishes under it are numbered inside that block — 10600 Insalate, then 10601, 10602.
   The FAMILY code is a fixed thing and belongs on the form; the ITEM code for a brand
   new dish is the next free number in the block and stays Aung's to give.
   The order on his sheet follows the menu, not the numbers — Caviar 10300 sits well
   below Grill 12000 — so this is a lookup, never a sequence. */
var MICFAM = { 'Food':10000, 'Crudo':10001, 'Caviar':10300, 'Insalate':10600,
               'Antipasti':10800, 'Pizza':11000, 'Pasta':11200, 'Secondi':11500,
               'Pesce':11501, 'Carne':11800, 'Grill':12000, 'Side Dish':15000,
               'Condiment':35500 };
function micFamCode(section){
  var k = String(section||'').trim();
  if (MICFAM[k] != null) return MICFAM[k];
  /* one spelling difference should not lose the code */
  var hit = Object.keys(MICFAM).filter(function(n){ return n.toLowerCase() === k.toLowerCase(); })[0];
  return hit ? MICFAM[hit] : null;
}

function micWorkbook(ExcelJS, menuName){
  var rows = MICREQ.rows.filter(function(r){ return r.take; });
  var B = MICBRAND;
  var HEADF = { name:'Calibri', size:10, bold:true, color:{argb:B.cream} };
  var BODYF = { name:'Calibri', size:11, color:{argb:B.ink} };
  var FAMF  = { name:'Georgia', size:11.5, bold:true, color:{argb:B.vino} };
  var thin  = { style:'thin', color:{argb:B.line} };
  var ROWB  = { top:thin, bottom:thin, left:thin, right:thin };

  var wb = new ExcelJS.Workbook();
  wb.creator = "Roberto's DIFC — Kitchen App";
  /* his tab is called "Micros Request" — checked on the 18.12.2025 file. The menu is
     in the filename and in the header, so the tab matches what he opens every time. */
  var ws = wb.addWorksheet('Micros Request', {
    views: [{ state:'frozen', ySplit:8 }],
    pageSetup: { orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:0,
                 margins:{ left:.3, right:.3, top:.4, bottom:.5, header:.2, footer:.2 } }
  });
  /* his widths, column for column, straight off the 18.12.2025 form — including the
     ones past N that the first build stopped short of */
  ws.columns = [{width:1.73},{width:12.73},{width:27.63},{width:22.45},{width:4.73},{width:12.54},
                {width:19.18},{width:18.09},{width:10.73},{width:8.43},{width:12.54},{width:14.09},
                {width:14.36},{width:24.54},{width:8.73},{width:12.73},{width:10.18},{width:7.91},
                {width:0.54},{width:11.18},{width:15.27},{width:8.73}];

  /* paint a stripe of cells first, then write the values into it — a value written
     with put() only touches the value, so the stripe underneath is not lost */
  var stripe = function(row, from, to, o){
    for (var c = from; c <= to; c++){
      var cell = ws.getRow(row).getCell(c);
      if (o.fill)   cell.fill   = { type:'pattern', pattern:'solid', fgColor:{argb:o.fill} };
      if (o.font)   cell.font   = o.font;
      if (o.border) cell.border = o.border;
      if (o.align)  cell.alignment = o.align;
    }
  };
  var put = function(addr, v, o){
    var c = ws.getCell(addr); o = o || {};
    if (o.f) c.value = { formula:o.f };
    else if (v !== null && v !== undefined && v !== '') c.value = v;
    if (o.z)     c.numFmt = o.z;
    if (o.font)  c.font = o.font;
    if (o.fill)  c.fill = { type:'pattern', pattern:'solid', fgColor:{argb:o.fill} };
    if (o.align) c.alignment = o.align;
    if (o.border) c.border = o.border;
    return c;
  };

  /* ── the band across the top ── */
  stripe(1, 1, 18, { fill:B.vino });
  ws.mergeCells('B1:N1');
  put('B1', 'MICROS POS Item Modification, Addition & Deletion Form',
      { font:{ name:'Georgia', size:15, bold:true, color:{argb:B.cream} },
        align:{ vertical:'middle', horizontal:'left' } });
  ws.getRow(1).height = 30;

  stripe(2, 1, 18, { fill:B.sabbiaLight });
  stripe(3, 1, 18, { fill:B.sabbiaLight });
  put('B2', "Outlet Name:  Roberto's DIFC",
      { font:{ name:'Georgia', size:12, bold:true, color:{argb:B.vino} } });
  put('B3', 'Date: ' + (MICREQ.today || ''), { font:BODYF });
  put('L2', 'Prepared by the Kitchen Recipes app',
      { font:{ name:'Calibri', size:9, italic:true, color:{argb:B.vinoMid} },
        align:{ horizontal:'right' } });
  put('L3', menuName || '', { font:{ name:'Calibri', size:9, color:{argb:B.vinoMid} },
        align:{ horizontal:'right' } });

  /* His own way of ticking it: the three boxes stay as boxes and the chosen one is
     highlighted yellow. That is what Aung looks for. An invented "X" would be us
     changing the convention on a form that is his, not ours. */
  put('B5', 'Type of Request:  Please Tick One',
      { font:{ name:'Calibri', size:11, bold:true, color:{argb:B.vino} } });
  put('D5', '□ Modification', { font:BODYF, align:{ horizontal:'center' } });
  ws.mergeCells('F5:H5');
  put('F5', '□ Addition', { font:{ name:'Calibri', size:11, bold:true, color:{argb:'FF000000'} },
        fill:'FFFFFF00', align:{ horizontal:'center' } });
  ws.mergeCells('I5:K5');
  put('I5', '□ Deletion', { font:BODYF, align:{ horizontal:'center' } });

  /* ── the two header rows ── */
  var hAlign = { vertical:'middle', horizontal:'center', wrapText:true };
  stripe(7, 2, 21, { fill:B.vino, font:HEADF, border:ROWB, align:hAlign });
  stripe(8, 2, 21, { fill:B.vino, font:HEADF, border:ROWB, align:hAlign });
  ws.getRow(7).height = 20; ws.getRow(8).height = 24;

  ws.mergeCells('B7:B8'); put('B7', 'Micros Code');
  ws.mergeCells('C7:C8'); put('C7', 'Item Name in Menu');
  ws.mergeCells('D7:E7'); put('D7', 'Item Name in Micros');
  ws.mergeCells('D8:E8'); put('D8', '*Maximum 16 Characters Including Space*');
  ws.mergeCells('F7:H7'); put('F7', 'Group');
  put('F8', 'Major'); put('G8', 'Family'); put('H8', 'SLU');
  ws.mergeCells('I7:J7'); put('I7', 'Cost Price');
  put('I8', 'Exclu.VAT'); put('J8', 'Cost %');
  put('K7', 'Old Net Price'); put('K8', 'Incl. 5%VAT');
  put('L7', 'Sales Price');   put('L8', 'Inclu. All Taxes');
  put('M7', 'Net Sales Price'); put('M8', 'Exclu. All Taxes');
  ws.mergeCells('N7:N8'); put('N7', 'Date Required');
  put('P7', 'Old Price'); put('P8', 'All Inclusive');
  ws.mergeCells('Q7:R7'); put('Q7', 'Price Status');
  put('Q8', '+ / -'); put('R8', '%');
  /* T and U are on his form too. They are for a price CHANGE — what the item sold and
     what the change is worth — so an addition leaves them empty, but the columns are
     his and taking them off would be us editing his form. */
  put('T7', 'Qty Sold');    put('T8', 'Last period');
  put('U7', 'Total Sales'); put('U8', 'Impact +/-');

  var money = { horizontal:'right' };
  var R = 9, fam = null;
  rows.forEach(function(r){
    /* a family line, then its dishes — the shape his own form is written in.
       No code on it: the Micros codes are Aung's to assign, ours would be invented. */
    if (r.section !== fam){
      fam = r.section;
      stripe(R, 2, 21, { fill:B.sabbia, font:FAMF, border:ROWB });
      ws.getRow(R).height = 19;
      /* the family code IS known — it is on his form and it does not change */
      var fc = micFamCode(fam);
      if (fc != null) put('B'+R, fc, { align:{ horizontal:'center' } });
      put('C'+R, fam); put('D'+R, fam);
      R++;
    }
    stripe(R, 2, 21, { fill:'FFFFFFFF', font:BODYF, border:ROWB });
    put('C'+R, r.name);
    put('D'+R, r.micros);
    put('E'+R, null, { f:'LEN(D'+R+')', align:{ horizontal:'center' } });
    put('F'+R, 'Food');
    put('G'+R, r.section);
    put('H'+R, r.section);                                   /* SLU, same as the family */
    if (r.cost != null) put('I'+R, Math.round(r.cost*100)/100, { z:'0.00', align:money });
    put('J'+R, null, { f:'IF(M'+R+'=0,0,+I'+R+'/M'+R+')', z:'0.00%', align:money });
    if (r.price != null) put('L'+R, r.price, { z:'0.00', align:money });
    /* His own formula, character for character. It is 1/1.225 written the way the
       form has always written it — VAT, municipality and service all inside the
       price since December 2025. Not re-derived here: the form is the authority. */
    put('M'+R, null, { f:'-L'+R+'*0.183675+L'+R, z:'0.00', align:money });
    R++;
  });

  /* the foot — says where it came from, and that the empty column is deliberate */
  var F = R + 1;
  ws.mergeCells('B'+F+':N'+F);
  put('B'+F, 'Family codes are the existing ones. Item codes are left blank for Aung — a new ' +
             'dish takes the next free number in its family. Cost %, name length and net price ' +
             'are formulas, so the sheet recalculates when a figure is corrected.',
      { font:{ name:'Calibri', size:9, italic:true, color:{argb:B.vinoMid} } });
  ws.mergeCells('B'+(F+1)+':N'+(F+1));
  put('B'+(F+1), "Roberto's DIFC · Kitchen Recipes app",
      { font:{ name:'Georgia', size:9, color:{argb:B.vino} } });

  return wb;
}

/* One build, three destinations — download it, print it, or send it. Written with a
   reader the module carries itself, so nothing is fetched from an outside host: the
   same rule as the recipe cards. */
function micFileName(menuName){
  var d = new Date(), stamp = String(d.getFullYear()).slice(2) +
    ('0'+(d.getMonth()+1)).slice(-2) + ('0'+d.getDate()).slice(-2);
  return stamp + '-Micros Request -' + menuName + '.xlsx';
}
function micMenuName(){
  var m = MENUS.filter(function(x){ return x.id === MICREQ.menuId; })[0];
  return m ? m.name : 'menu';
}
function micBuild(){
  return lazy('lib/exceljs.min.js', 'ExcelJS').then(function(ExcelJS){
    var name = micMenuName();
    /* the tab is named after the menu, the way his files are — "Valentine", "Ramadan" */
    return micWorkbook(ExcelJS, name).xlsx.writeBuffer().then(function(buf){
      return { name: micFileName(name), menu: name, buf: buf };
    });
  });
}
/* Uint8Array → base64 without blowing the argument limit on a 60-dish sheet */
function micB64(buf){
  var b = new Uint8Array(buf), s = '', CH = 0x8000;
  for (var i = 0; i < b.length; i += CH) s += String.fromCharCode.apply(null, b.subarray(i, i+CH));
  return btoa(s);
}
