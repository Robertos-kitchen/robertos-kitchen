/* The net selling price — the price with every tax taken back out. Written as the form's
   own formula writes it, not as ÷1.225, so the screen and the sheet can never disagree:
   VAT, municipality and service have all been inside the price since December 2025. */
function micNet(price){ return price - price * 0.183675; }

/* his own shorthand, as far as a machine can take it: drop the joining words, keep the
   words that mean something, then shorten the longest one until it fits */
var MICSTOP = { di:1, de:1, del:1, della:1, al:1, alla:1, allo:1, ai:1, con:1, e:1, la:1,
                il:1, lo:1, in:1, a:1, the:1, of:1, and:1, with:1 };
function micShort(name, prefix, limit){
  limit = limit || 16;
  var head = (prefix||'').trim();
  var room = limit - (head ? head.length + 1 : 0);
  var w = String(name||'').replace(/[^\p{L}\p{N}\s]/gu,' ').split(/\s+/)
            .filter(function(x){ return x && !MICSTOP[x.toLowerCase()]; })
            .map(function(x){ return x.charAt(0).toUpperCase() + x.slice(1); });
  if (!w.length) w = [String(name||'').trim()];
  var join = function(){ return w.join(' '); };
  /* squeeze the longest word first — losing a letter off "Carnaroli" reads better
     than losing a whole word */
  var guard = 0;
  while (join().length > room && guard++ < 80){
    var li = 0;
    for (var i=1;i<w.length;i++) if (w[i].length > w[li].length) li = i;
    if (w[li].length <= 3){ w.pop(); if (!w.length) break; continue; }
    w[li] = w[li].slice(0, -1);
  }
  var out = (head ? head + ' ' : '') + join();
  return out.slice(0, limit).trim();
}

/* Every dish on the menu, costed, without opening one of them. batchCost() already
   walks a recipe's lines — including batches inside batches — so the mains are shaped
   the same way and handed to the same walk. */
function loadMicros(menuId){
  MICREQ.err = null; MICREQ.ready = false;
  return Promise.all([
    sb('recipes?kind=eq.main&archived=is.false&select=id,name,section,makes_qty,menu_price'),
    sb('recipe_menus?menu_id=eq.' + menuId + '&select=recipe_id'),
    sb('recipe_lines?select=recipe_id,stock_code,stock_name,typed_text,child_recipe_id,qty,unit,' +
       'trim_on,yield_pct,waste_pct,position&order=position'),
    MYB.length ? Promise.resolve(null) : loadBatches()
  ]).then(function(res){
    var on = {}; (res[1]||[]).forEach(function(r){ on[r.recipe_id] = 1; });
    var byRecipe = {};
    (res[2]||[]).forEach(function(l){ (byRecipe[l.recipe_id] = byRecipe[l.recipe_id] || []).push(l); });

    MAINS = {};
    (res[0]||[]).forEach(function(r){
      /* a main "makes" its portions — the same field a batch uses, so the same walk
         gives cost per portion instead of cost per kilo */
      MAINS[r.id] = { name:r.name, makesQty:r.makes_qty, makesUnit:'portion',
                      archived:false, lines: byRecipe[r.id] || [] };
    });

    MICREQ.rows = (res[0]||[]).filter(function(r){ return on[r.id]; })
      .sort(function(a,b){ return String(a.section||'').localeCompare(String(b.section||'')) ||
                                  String(a.name).localeCompare(String(b.name)); })
      .map(function(r){
        var c = batchCost(r.id);
        return { id:r.id, name:r.name, section:r.section || 'No section',
                 price:r.menu_price, cost: c.problem ? null : c.per, why: c.problem || null,
                 micros: micShort(r.name, MICREQ.prefix), take:true };
      });
    MICREQ.ready = true;
  }).catch(function(e){ MICREQ.err = e.message; MICREQ.rows = []; });
}

/* ── the workbook ─────────────────────────────────────────────────────────────
   Laid out cell for cell like the ones he has been sending, and now in the house
   colours: every other document this module puts out is branded, and a plain grey
   spreadsheet with Roberto's name on it is the one that looks borrowed.

   It is built with ExcelJS, not the XLSX reader the rest of the module uses. That
   is not a preference — the XLSX build we carry SILENTLY DROPS every fill, font and
   border on write. It was proved rather than assumed: a cell written with a vino
   fill came back out of the file with no fill at all. ExcelJS keeps them, and keeps
   the formulas too. Do not "simplify" this back onto XLSX.

   The form does its own arithmetic and always has — LEN, the cost %, the net price
   are formulas in the sheet, not numbers we put there. Writing values over them would
   mean Aung opening a form that no longer recalculates when he corrects a price. */
var MICBRAND = { vino:'FF410207', vinoMid:'FF5E0A10', cream:'FFF5EDE0',
                 sabbia:'FFE1D3C2', sabbiaLight:'FFEDE5D8', line:'FFCFC0AD', ink:'FF2A1A10' };

/* ── the Micros family codes ──
   Read off Aung's own form (Copy of R's Micros Request Food -New Menu 18.12.2025.xlsx),
   not invented. Every family line on his sheet carries its code in column B, and the
   dishes under it are numbered inside that block — 10600 Insalate, then 10601, 10602.
   The FAMILY code is a fixed thing and belongs on the form; the ITEM code for a brand
   new dish is the next free number in the block and stays Aung's to give.
   The order on his sheet follows the menu, not the numbers — Caviar 10300 sits well
   below Grill 12000 — so this is a lookup, never a sequence. */
var MICFAM = { 'Food':10000, 'Crudo':10001, 'Caviar':10300, 'Insalate':10600,
               'Antipasti':10800, 'Pizza':11000, 'Pasta':11200, 'Secondi':11500,
               'Pesce':11501, 'Carne':11800, 'Grill':12000, 'Side Dish':15000,
               'Condiment':35500 };
function micFamCode(section){
  var k = String(section||'').trim();
  if (MICFAM[k] != null) return MICFAM[k];
  /* one spelling difference should not lose the code */
  var hit = Object.keys(MICFAM).filter(function(n){ return n.toLowerCase() === k.toLowerCase(); })[0];
  return hit ? MICFAM[hit] : null;
}

/* ── the recipe behind every line ────────────────────────────────────────────────
   Aung is not being sent a picture of a recipe. He copies these rows into the
   inventory system, so the recipe goes as SHEETS in the same workbook — one row per
   ingredient, real numbers, one header row, nothing merged inside the table. A PDF
   would look better and be useless to him.

   One line, worked out exactly the way batchCost() works it out, so a figure on the
   recipe sheet and the cost on the request can never disagree. */
function micLineFacts(l){
  var o = { name:'', what:'', code:'', qty:(l.qty==null?null:l.qty), unit:l.unit||'',
            unitPrice:null, base:'', cost:null, note:'' };
  if (l.child_recipe_id){
    var b = BATCH[l.child_recipe_id];
    o.what = 'batch';
    o.name = b ? b.name : 'a batch that is no longer there';
    var sub = batchCost(l.child_recipe_id);
    if (sub.problem) o.note = sub.problem;
    else { o.unitPrice = sub.per; o.base = sub.base; }
  } else if (l.stock_code){
    var it = ING.filter(function(x){ return x.code === l.stock_code; })[0];
    o.what = 'ingredient'; o.code = l.stock_code;
    o.name = it ? it.name : (l.stock_name || l.typed_text || l.stock_code);
    if (!it) o.note = 'no longer on the stock take';
    else {
      var bp = basePrice(it);
      if (bp){ o.unitPrice = bp.v; o.base = bp.base; }
      else o.note = 'the unit on it cannot be read';
    }
  } else {
    o.what = 'ingredient';
    o.name = l.stock_name || l.typed_text || '—';
    o.note = 'nothing picked on this line yet';
  }
  if (o.unitPrice != null && o.qty != null){
    var u = o.unit || (o.base === 'kg' ? 'g' : o.base === 'L' ? 'ml' : 'pcs');
    var c = qtyInBase(o.qty, u) * o.unitPrice;
    o.cost = c / ((l.trim_on ? (l.yield_pct == null ? 100 : l.yield_pct) : 100) / 100)
               * (1 + (l.trim_on ? (l.waste_pct || 0) : 0) / 100);
  }
  if (o.qty == null && !o.note) o.note = 'no quantity on this line yet';
  return o;
}
/* Every batch the ticked dishes reach, including a batch inside a batch, each one
   once and in the order it is first met. Guarded against a loop the same way the
   cost walk is — a recipe that ends up using itself must not hang the download. */
function micBatchesUsed(dishIds){
  var out = [], seen = {};
  function walk(lines, stack){
    (lines || []).forEach(function(l){
      var id = l.child_recipe_id; if (!id) return;
      if (stack.indexOf(id) > -1) return;
      if (!seen[id]){ seen[id] = 1; out.push(id); }
      var b = BATCH[id]; if (b) walk(b.lines, stack.concat([id]));
    });
  }
  dishIds.forEach(function(id){ walk((MAINS[id] || {}).lines, [id]); });
  return out;
}
/* which dishes on this request a batch ends up inside — said on the batch's own line,
   so he is not holding two sheets side by side to work it out */
function micBatchUsedIn(batchId, dishIds){
  return dishIds.filter(function(d){
    var hit = false;
    (function walk(lines, stack){
      (lines || []).forEach(function(l){
        var id = l.child_recipe_id; if (!id || stack.indexOf(id) > -1) return;
        if (id === batchId) hit = true;
        var b = BATCH[id]; if (b) walk(b.lines, stack.concat([id]));
      });
    })((MAINS[d] || {}).lines, [d]);
    return hit;
  }).map(function(d){ return (MAINS[d] || {}).name || ''; }).filter(function(n){ return n; });
}

/* A sheet of flat rows in the house colours: band, one header row, then the table.
   Nothing is merged from the header down — a merged cell inside a table is what turns
   a copy-paste into a mess at the other end. */
function micFlatSheet(wb, tabName, title, sub, cols, B){
  var ws = wb.addWorksheet(tabName, {
    views: [{ state:'frozen', ySplit:4 }],
    pageSetup: { orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:0,
                 margins:{ left:.3, right:.3, top:.4, bottom:.5, header:.2, footer:.2 } }
  });
  /* ── room for the filter button ──
     Excel draws the drop-down inside the header cell, hard against its right edge. A
     column sized to its text alone has the button sitting on top of the last letters,
     and every header then reads as if it belongs to the column next to it. So each
     column is at least wide enough for its own title PLUS the button, and never
     narrower than the button itself. */
  ws.columns = cols.map(function(c){
    return { width: Math.max(c.w, String(c.t).length + 4, 9) };
  });
  var last = cols.length;
  for (var c = 1; c <= last; c++){
    ws.getRow(1).getCell(c).fill = { type:'pattern', pattern:'solid', fgColor:{argb:B.vino} };
    ws.getRow(2).getCell(c).fill = { type:'pattern', pattern:'solid', fgColor:{argb:B.sabbiaLight} };
  }
  ws.getCell('A1').value = title;
  ws.getCell('A1').font = { name:'Georgia', size:14, bold:true, color:{argb:B.cream} };
  ws.getCell('A1').alignment = { vertical:'middle' };
  ws.getRow(1).height = 26;
  ws.getCell('A2').value = sub;
  ws.getCell('A2').font = { name:'Calibri', size:10, color:{argb:B.vinoMid} };
  cols.forEach(function(cl, i){
    var cell = ws.getRow(4).getCell(i + 1);
    cell.value = cl.t;
    cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:B.vino} };
    cell.font = { name:'Calibri', size:9.5, bold:true, color:{argb:B.cream} };
    /* every title left, including the number columns. Right-aligned, the title runs
       straight into its own filter button. */
    cell.alignment = { vertical:'middle', horizontal:'left', wrapText:true };
  });
  ws.getRow(4).height = 32;
  ws.autoFilter = { from:{ row:4, column:1 }, to:{ row:4, column:last } };
  return ws;
}

var MICMONEY = '#,##0.00';

/* ── the names in the workbook open the recipe ───────────────────────────────────
   Clicking a dish on the form did nothing, which is exactly the moment Aung wants to
   see what is in it. Every dish and every batch name in the file is a link now.

   ALWAYS to LIVE, never to whatever this page happens to be served from. The workbook
   is emailed and opened on somebody else's machine: a link to localhost or to the dev
   preview is a dead link the moment it leaves the building. The recipe card takes
   `?id=` and has no code on the door, so it opens for whoever is sent it. */
var MICSITE = 'https://guarracinofamily.github.io/robertos-kitchen/';
function micCardUrl(id){
  return MICSITE + 'recipe-card.html?id=' + encodeURIComponent(id);
}
/* Written as a hyperlink VALUE, not a HYPERLINK() formula — a formula shows its own
   text when the cell is copied out into another system, and copying out is the whole
   reason these sheets are shaped the way they are. */
function micLinkCell(cell, text, id, font){
  if (!id){ cell.value = text; if (font) cell.font = font; return cell; }
  cell.value = { text: text, hyperlink: micCardUrl(id), tooltip: 'Open ' + text + ' in the Recipes app' };
  var f = {};
  for (var k in (font||{})) f[k] = font[k];
  f.underline = true;
  if (!f.color) f.color = { argb:'FF400207' };
  cell.font = f;
  return cell;
}
/* ── sheet 2: the dishes, and every batch OPENED UP UNDERNEATH THE DISH IT BELONGS TO ──
   A line that says "Hot Chocolate Sifon · batch · 0.2 kg" tells Aung nothing about what
   is in it or whose dish it is — he was left holding two sheets side by side working it
   out. So a batch is not just named here: its own ingredients are written straight under
   it, indented, carrying the dish's name in column A and the batch's name in "Inside
   batch". Every row on this sheet says which dish it belongs to.

   EVERY SUMMARY SITS ABOVE WHAT IT SUMS. The dish's total is the first row of the dish,
   not the last, and a batch carries its own "what it costs to make one" on the line that
   names it — so the answer is read before scrolling, and the rows underneath are the
   working. That means the formulas point DOWN the sheet, which is the whole idea.

   TWO COST COLUMNS, and the difference is the whole point:
     "Cost in the dish"      — what this dish pays for that line. Only the dish's own
                               lines carry it; a batch line carries the cost of the
                               amount the dish uses. The dish total sums these.
     "Cost to make the batch"— what a whole batch costs to make, on the line that names
                               it, and what each thing in it costs underneath. A
                               breakdown, NOT a second charge, so it is kept out of the
                               dish total. One column instead of two and every dish with
                               a batch in it would read double. */
function micRecipeSheet(wb, B, menuName, rows){
  var cols = [
    { t:'Dish', w:30 }, { t:'Family', w:14 }, { t:'Name in Micros', w:18 },
    { t:'Portions', w:9, n:true },
    { t:'Inside batch', w:26 },
    { t:'#', w:5, n:true },
    { t:'Ingredient / batch', w:38 }, { t:'Type', w:13 }, { t:'Stock code', w:12 },
    { t:'Qty', w:9, n:true }, { t:'Unit', w:8 },
    { t:'Unit price', w:11, n:true }, { t:'per', w:6 },
    { t:'Cost in the dish', w:14, n:true },
    { t:'Cost to make the batch', w:16, n:true },
    { t:'Yield %', w:8, n:true }, { t:'Waste %', w:8, n:true },
    { t:'Note', w:46 }
  ];
  var ws = micFlatSheet(wb, 'Recipes', 'Recipes behind the request — ' + menuName,
    'Every row says which dish it belongs to, and every total sits ABOVE the rows it adds up. ' +
    'A batch is opened up under the dish that uses it: "Inside batch" is empty for the dish\'s own ' +
    'ingredients and carries the batch name for the things inside one. "Cost in the dish" is what ' +
    'the dish pays and adds up to the dish total; "Cost to make the batch" is the breakdown inside ' +
    'a batch and is deliberately left out of it, so nothing is counted twice.',
    cols, B);

  var C_DISH = 14, C_BATCH = 15;
  var R = 5;
  var body = function(row){
    for (var c = 1; c <= cols.length; c++)
      row.getCell(c).font = { name:'Calibri', size:11, color:{argb:B.ink} };
    [12, C_DISH, C_BATCH].forEach(function(c){ row.getCell(c).numFmt = MICMONEY; });
  };
  var band = function(row, fill, boldCols){
    for (var c = 1; c <= cols.length; c++){
      row.getCell(c).fill = { type:'pattern', pattern:'solid', fgColor:{argb:fill} };
      row.getCell(c).font = { name:'Calibri', size:11,
        bold: boldCols.indexOf(c) > -1, color:{argb:B.vino} };
    }
    [12, C_DISH, C_BATCH].forEach(function(c){ row.getCell(c).numFmt = MICMONEY; });
  };

  rows.forEach(function(r){
    var m = MAINS[r.id] || { lines:[] };
    var lines = m.lines || [];

    /* the dish's headline is written FIRST and filled in afterwards — its total adds
       rows that do not exist yet, which is the price of putting the answer on top */
    var headRow = R; R++;
    var mine = [];

    /* one line, and — if it is a batch — everything inside it, as far down as it goes.
       `costCol` says which of the two money columns this level writes into: the dish's
       own lines pay the dish, everything below is a breakdown. */
    var emit = function(l, i, inside, depth, stack, costCol){
      var f = micLineFacts(l), row = ws.getRow(R), here = R;
      var kid = l.child_recipe_id ? BATCH[l.child_recipe_id] : null;
      row.getCell(1).value  = r.name;
      row.getCell(2).value  = r.section || '';
      row.getCell(3).value  = r.micros || '';
      row.getCell(4).value  = m.makesQty == null ? null : m.makesQty;
      row.getCell(5).value  = inside;
      row.getCell(6).value  = i + 1;
      /* indented by where it sits, so the shape is readable before a single column is
         read — and the indent is spaces in the cell, never a merged or shifted column */
      row.getCell(7).value  = (depth ? Array(depth + 1).join('    ') + '› ' : '') + f.name;
      row.getCell(8).value  = kid ? 'BATCH' : depth ? 'in batch' : 'ingredient';
      row.getCell(9).value  = f.code || '';
      row.getCell(10).value = f.qty;
      row.getCell(11).value = f.unit || '';
      row.getCell(12).value = f.unitPrice;
      row.getCell(13).value = f.base || '';
      row.getCell(costCol).value = f.cost;
      row.getCell(16).value = l.trim_on ? (l.yield_pct == null ? 100 : l.yield_pct) : null;
      row.getCell(17).value = l.trim_on ? (l.waste_pct || 0) : null;
      row.getCell(18).value = f.note || '';
      body(row);
      if (f.note) row.getCell(18).font = { name:'Calibri', size:10, italic:true, color:{argb:B.vinoMid} };
      R++;

      if (kid && stack.indexOf(l.child_recipe_id) < 0){
        var path = inside ? inside + ' › ' + kid.name : kid.name;
        var sub = [], klines = kid.lines || [];
        klines.forEach(function(kl, ki){
          sub.push(emit(kl, ki, path, depth + 1, stack.concat([l.child_recipe_id]), C_BATCH));
        });
        /* the batch's own summary goes ON THE LINE THAT NAMES IT, not on a row after
           its ingredients: what a whole batch costs to make, read before the working.
           Named cells, not a range — a batch inside a batch sits in the same column and
           a SUM over the block would count it and its own ingredients both. */
        var c = batchCost(l.child_recipe_id);
        row.getCell(C_BATCH).value = sub.length
          ? { formula: sub.map(function(n){ return 'O' + n; }).join('+') } : null;
        row.getCell(18).value =
          'Makes ' + (kid.makesQty != null ? kid.makesQty + ' ' : '') + (kid.makesUnit || '') +
          (c.problem ? ' · cost not worked out — ' + c.problem
                     : ' · ' + fmt(c.per) + ' per ' + (kid.makesUnit || 'unit')) +
          (klines.length ? ' · the ' + klines.length + ' row' + (klines.length === 1 ? '' : 's') +
                           ' below are what is in it' : ' · nothing is written on it yet');
        band(row, B.cream, [7, 8, C_DISH, C_BATCH]);
        /* after the band, or the band's own font would take the link's underline off
           the batch name the moment it is painted over */
        micLinkCell(row.getCell(7), (depth ? Array(depth + 1).join('    ') + '› ' : '') + f.name,
                    l.child_recipe_id, { name:'Calibri', size:11, bold:true, color:{argb:B.vino} });
        row.getCell(18).font = { name:'Calibri', size:10, italic:true, color:{argb:B.vinoMid} };
      } else if (kid){
        row.getCell(18).value = 'This batch ends up using itself, so it is not opened up here.';
        band(row, B.cream, [7, 8, C_DISH]);
      }
      return here;
    };

    lines.forEach(function(l, i){ mine.push(emit(l, i, '', 0, [r.id], C_DISH)); });

    /* now the headline, filled in over the block it belongs to */
    var h = ws.getRow(headRow);
    h.getCell(1).value = r.name;
    h.getCell(2).value = r.section || '';
    h.getCell(3).value = r.micros || '';
    h.getCell(4).value = m.makesQty == null ? null : m.makesQty;
    h.getCell(7).value = r.name.toUpperCase();
    h.getCell(8).value = 'DISH TOTAL';
    /* adds the dish's OWN lines by name — never a range, or every row a batch put
       underneath would be added again */
    h.getCell(C_DISH).value = mine.length
      ? { formula: mine.map(function(n){ return 'N' + n; }).join('+') } : null;
    h.getCell(18).value = (m.makesQty
      ? 'Makes ' + m.makesQty + ' portion' + (m.makesQty === 1 ? '' : 's') +
        ' — cost per portion ' + (r.cost == null ? 'not worked out yet' : fmt(r.cost))
      : 'it does not say how much it makes') +
      (lines.length ? '. The ' + lines.length + ' row' + (lines.length === 1 ? '' : 's') +
                      ' below are the dish; anything indented under them is inside a batch, ' +
                      'and is not in this total.'
                    : '. Nothing is written on this recipe yet.');
    band(h, B.sabbiaLight, [7, 8, C_DISH]);
    /* both the plain name and the shouted one open the dish */
    micLinkCell(h.getCell(1), r.name, r.id, { name:'Calibri', size:11, color:{argb:B.vino} });
    micLinkCell(h.getCell(7), r.name.toUpperCase(), r.id,
                { name:'Calibri', size:11, bold:true, color:{argb:B.vino} });
    h.getCell(18).font = { name:'Calibri', size:10, italic:true, color:{argb:B.vino} };

    R += 1;
  });
  return ws;
}

/* ── sheet 3: every batch once, and WHO IT BELONGS TO on every single row ──
   The dish sheet answers "what is in this dish". This one answers the other question —
   "I have been given this batch, whose is it" — and it answers it on every row rather
   than once on a total line nobody scrolls to. Same rule as the dish sheet: the batch's
   total is the first row of its block, not the last. */
function micBatchSheet(wb, B, menuName, rows){
  var dishIds = rows.map(function(r){ return r.id; });
  var ids = micBatchesUsed(dishIds);
  var cols = [
    { t:'Batch', w:30 }, { t:'Used in these dishes', w:38 },
    { t:'Makes', w:9, n:true }, { t:'Unit', w:8 },
    { t:'#', w:5, n:true }, { t:'Ingredient / batch', w:36 }, { t:'Type', w:12 },
    { t:'Stock code', w:12 }, { t:'Qty', w:9, n:true }, { t:'Unit', w:8 },
    { t:'Unit price', w:11, n:true }, { t:'per', w:6 }, { t:'Line cost', w:11, n:true },
    { t:'Yield %', w:8, n:true }, { t:'Waste %', w:8, n:true }, { t:'Note', w:44 }
  ];
  var ws = micFlatSheet(wb, 'Batches', 'Batches inside them — ' + menuName,
    'Every batch the dishes on this request reach, including a batch inside a batch, each one once. ' +
    'The total is the first row of each batch and the rows under it are what is in it. ' +
    '"Used in these dishes" is on every row, so any line filtered or copied on its own still says ' +
    'whose it is. The same batches are also written out under their dish on the Recipes sheet.',
    cols, B);
  if (!ids.length){
    ws.getCell('A5').value = 'No batch is used by the dishes on this request.';
    ws.getCell('A5').font = { name:'Calibri', size:11, italic:true, color:{argb:B.vinoMid} };
    return ws;
  }
  var R = 5;
  ids.forEach(function(id){
    var b = BATCH[id]; if (!b) return;
    var lines = b.lines || [];
    var c = batchCost(id);
    var used = micBatchUsedIn(id, dishIds).join(', ');

    var headRow = R; R++;
    var first = R;
    lines.forEach(function(l, i){
      var f = micLineFacts(l), row = ws.getRow(R);
      row.getCell(1).value  = b.name;
      row.getCell(2).value  = used;
      row.getCell(3).value  = b.makesQty == null ? null : b.makesQty;
      row.getCell(4).value  = b.makesUnit || '';
      row.getCell(5).value  = i + 1;
      row.getCell(6).value  = f.name;
      row.getCell(7).value  = l.child_recipe_id ? 'BATCH' : 'ingredient';
      row.getCell(8).value  = f.code || '';
      row.getCell(9).value  = f.qty;
      row.getCell(10).value = f.unit || '';
      row.getCell(11).value = f.unitPrice;
      row.getCell(12).value = f.base || '';
      row.getCell(13).value = f.cost;
      row.getCell(14).value = l.trim_on ? (l.yield_pct == null ? 100 : l.yield_pct) : null;
      row.getCell(15).value = l.trim_on ? (l.waste_pct || 0) : null;
      row.getCell(16).value = f.note || (l.child_recipe_id
        ? 'a batch inside this one — it has its own block on this sheet' : '');
      [11, 13].forEach(function(cc){ row.getCell(cc).numFmt = MICMONEY; });
      for (var k = 1; k <= cols.length; k++)
        row.getCell(k).font = { name:'Calibri', size:11, color:{argb:B.ink} };
      if (row.getCell(16).value) row.getCell(16).font =
        { name:'Calibri', size:10, italic:true, color:{argb:B.vinoMid} };
      /* a batch used inside this one opens too, so its own block is one click away
         instead of a scroll looking for the name */
      if (l.child_recipe_id)
        micLinkCell(row.getCell(6), f.name, l.child_recipe_id,
                    { name:'Calibri', size:11, color:{argb:B.ink} });
      R++;
    });

    var h = ws.getRow(headRow);
    h.getCell(1).value = b.name;
    h.getCell(2).value = used;
    h.getCell(3).value = b.makesQty == null ? null : b.makesQty;
    h.getCell(4).value = b.makesUnit || '';
    h.getCell(6).value = b.name.toUpperCase();
    h.getCell(7).value = 'BATCH TOTAL';
    h.getCell(13).value = lines.length ? { formula:'SUM(M' + first + ':M' + (R - 1) + ')' } : null;
    h.getCell(13).numFmt = MICMONEY;
    h.getCell(16).value = 'What it costs to make ' + (b.makesQty != null ? b.makesQty + ' ' : '') +
      (b.makesUnit || '') + ' of it' +
      (c.problem ? ' — not worked out, ' + c.problem
                 : ' · ' + fmt(c.per) + ' per ' + (b.makesUnit || 'unit')) +
      (lines.length ? ' · the ' + lines.length + ' row' + (lines.length === 1 ? '' : 's') +
                      ' below are what is in it' : ' · nothing is written on it yet');
    for (var k2 = 1; k2 <= cols.length; k2++){
      h.getCell(k2).fill = { type:'pattern', pattern:'solid', fgColor:{argb:B.sabbiaLight} };
      h.getCell(k2).font = { name:'Calibri', size:11, bold:k2 === 6 || k2 === 7 || k2 === 13,
                             color:{argb:B.vino} };
    }
    h.getCell(16).font = { name:'Calibri', size:10, italic:true, color:{argb:B.vino} };
    /* the batch's name opens the batch — same as a dish name does everywhere else */
    micLinkCell(h.getCell(1), b.name, id, { name:'Calibri', size:11, color:{argb:B.vino} });
    micLinkCell(h.getCell(6), b.name.toUpperCase(), id,
                { name:'Calibri', size:11, bold:true, color:{argb:B.vino} });

    R += 1;
  });
  return ws;
}
function micWorkbook(ExcelJS, menuName){
  var rows = MICREQ.rows.filter(function(r){ return r.take; });
  var B = MICBRAND;
  var HEADF = { name:'Calibri', size:10, bold:true, color:{argb:B.cream} };
  var BODYF = { name:'Calibri', size:11, color:{argb:B.ink} };
  var FAMF  = { name:'Georgia', size:11.5, bold:true, color:{argb:B.vino} };
  var thin  = { style:'thin', color:{argb:B.line} };
  var ROWB  = { top:thin, bottom:thin, left:thin, right:thin };

  var wb = new ExcelJS.Workbook();
  wb.creator = "Roberto's DIFC — Kitchen App";
  /* his tab is called "Micros Request" — checked on the 18.12.2025 file. The menu is
     in the filename and in the header, so the tab matches what he opens every time. */
  var ws = wb.addWorksheet('Micros Request', {
    views: [{ state:'frozen', ySplit:8 }],
    pageSetup: { orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:0,
                 margins:{ left:.3, right:.3, top:.4, bottom:.5, header:.2, footer:.2 } }
  });
  /* his widths, column for column, straight off the 18.12.2025 form — including the
     ones past N that the first build stopped short of */
  ws.columns = [{width:1.73},{width:12.73},{width:27.63},{width:22.45},{width:4.73},{width:12.54},
                {width:19.18},{width:18.09},{width:10.73},{width:8.43},{width:12.54},{width:14.09},
                {width:14.36},{width:24.54},{width:8.73},{width:12.73},{width:10.18},{width:7.91},
                {width:0.54},{width:11.18},{width:15.27},{width:8.73}];

  /* paint a stripe of cells first, then write the values into it — a value written
     with put() only touches the value, so the stripe underneath is not lost */
  var stripe = function(row, from, to, o){
    for (var c = from; c <= to; c++){
      var cell = ws.getRow(row).getCell(c);
      if (o.fill)   cell.fill   = { type:'pattern', pattern:'solid', fgColor:{argb:o.fill} };
      if (o.font)   cell.font   = o.font;
      if (o.border) cell.border = o.border;
      if (o.align)  cell.alignment = o.align;
    }
  };
  var put = function(addr, v, o){
    var c = ws.getCell(addr); o = o || {};
    if (o.f) c.value = { formula:o.f };
    else if (v !== null && v !== undefined && v !== '') c.value = v;
    if (o.z)     c.numFmt = o.z;
    if (o.font)  c.font = o.font;
    if (o.fill)  c.fill = { type:'pattern', pattern:'solid', fgColor:{argb:o.fill} };
    if (o.align) c.alignment = o.align;
    if (o.border) c.border = o.border;
    return c;
  };

  /* ── the band across the top ── */
  stripe(1, 1, 18, { fill:B.vino });
  ws.mergeCells('B1:N1');
  put('B1', 'MICROS POS Item Modification, Addition & Deletion Form',
      { font:{ name:'Georgia', size:15, bold:true, color:{argb:B.cream} },
        align:{ vertical:'middle', horizontal:'left' } });
  ws.getRow(1).height = 30;

  stripe(2, 1, 18, { fill:B.sabbiaLight });
  stripe(3, 1, 18, { fill:B.sabbiaLight });
  put('B2', "Outlet Name:  Roberto's DIFC",
      { font:{ name:'Georgia', size:12, bold:true, color:{argb:B.vino} } });
  put('B3', 'Date: ' + (MICREQ.today || ''), { font:BODYF });
  put('L2', 'Prepared by the Kitchen Recipes app',
      { font:{ name:'Calibri', size:9, italic:true, color:{argb:B.vinoMid} },
        align:{ horizontal:'right' } });
  put('L3', menuName || '', { font:{ name:'Calibri', size:9, color:{argb:B.vinoMid} },
        align:{ horizontal:'right' } });

  /* His own way of ticking it: the three boxes stay as boxes and the chosen one is
     highlighted yellow. That is what Aung looks for. An invented "X" would be us
     changing the convention on a form that is his, not ours. */
  put('B5', 'Type of Request:  Please Tick One',
      { font:{ name:'Calibri', size:11, bold:true, color:{argb:B.vino} } });
  put('D5', '□ Modification', { font:BODYF, align:{ horizontal:'center' } });
  ws.mergeCells('F5:H5');
  put('F5', '□ Addition', { font:{ name:'Calibri', size:11, bold:true, color:{argb:'FF000000'} },
        fill:'FFFFFF00', align:{ horizontal:'center' } });
  ws.mergeCells('I5:K5');
  put('I5', '□ Deletion', { font:BODYF, align:{ horizontal:'center' } });

  /* ── the two header rows ── */
  var hAlign = { vertical:'middle', horizontal:'center', wrapText:true };
  stripe(7, 2, 21, { fill:B.vino, font:HEADF, border:ROWB, align:hAlign });
  stripe(8, 2, 21, { fill:B.vino, font:HEADF, border:ROWB, align:hAlign });
  ws.getRow(7).height = 20; ws.getRow(8).height = 24;

  ws.mergeCells('B7:B8'); put('B7', 'Micros Code');
  ws.mergeCells('C7:C8'); put('C7', 'Item Name in Menu');
  ws.mergeCells('D7:E7'); put('D7', 'Item Name in Micros');
  ws.mergeCells('D8:E8'); put('D8', '*Maximum 16 Characters Including Space*');
  ws.mergeCells('F7:H7'); put('F7', 'Group');
  put('F8', 'Major'); put('G8', 'Family'); put('H8', 'SLU');
  ws.mergeCells('I7:J7'); put('I7', 'Cost Price');
  put('I8', 'Exclu.VAT'); put('J8', 'Cost %');
  put('K7', 'Old Net Price'); put('K8', 'Incl. 5%VAT');
  put('L7', 'Sales Price');   put('L8', 'Inclu. All Taxes');
  put('M7', 'Net Sales Price'); put('M8', 'Exclu. All Taxes');
  ws.mergeCells('N7:N8'); put('N7', 'Date Required');
  put('P7', 'Old Price'); put('P8', 'All Inclusive');
  ws.mergeCells('Q7:R7'); put('Q7', 'Price Status');
  put('Q8', '+ / -'); put('R8', '%');
  /* T and U are on his form too. They are for a price CHANGE — what the item sold and
     what the change is worth — so an addition leaves them empty, but the columns are
     his and taking them off would be us editing his form. */
  put('T7', 'Qty Sold');    put('T8', 'Last period');
  put('U7', 'Total Sales'); put('U8', 'Impact +/-');

  var money = { horizontal:'right' };
  var R = 9, fam = null;
  rows.forEach(function(r){
    /* a family line, then its dishes — the shape his own form is written in.
       No code on it: the Micros codes are Aung's to assign, ours would be invented. */
    if (r.section !== fam){
      fam = r.section;
      stripe(R, 2, 21, { fill:B.sabbia, font:FAMF, border:ROWB });
      ws.getRow(R).height = 19;
      /* the family code IS known — it is on his form and it does not change */
      var fc = micFamCode(fam);
      if (fc != null) put('B'+R, fc, { align:{ horizontal:'center' } });
      put('C'+R, fam); put('D'+R, fam);
      R++;
    }
    stripe(R, 2, 21, { fill:'FFFFFFFF', font:BODYF, border:ROWB });
    /* the name on his own form is the way into the recipe — one click from the line
       he is pricing to what is actually in the dish */
    micLinkCell(ws.getCell('C'+R), r.name, r.id, BODYF);
    put('D'+R, r.micros);
    put('E'+R, null, { f:'LEN(D'+R+')', align:{ horizontal:'center' } });
    put('F'+R, 'Food');
    put('G'+R, r.section);
    put('H'+R, r.section);                                   /* SLU, same as the family */
    if (r.cost != null) put('I'+R, Math.round(r.cost*100)/100, { z:'0.00', align:money });
    put('J'+R, null, { f:'IF(M'+R+'=0,0,+I'+R+'/M'+R+')', z:'0.00%', align:money });
    if (r.price != null) put('L'+R, r.price, { z:'0.00', align:money });
    /* His own formula, character for character. It is 1/1.225 written the way the
       form has always written it — VAT, municipality and service all inside the
       price since December 2025. Not re-derived here: the form is the authority. */
    put('M'+R, null, { f:'-L'+R+'*0.183675+L'+R, z:'0.00', align:money });
    R++;
  });

  /* the foot — says where it came from, and that the empty column is deliberate */
  var F = R + 1;
  ws.mergeCells('B'+F+':N'+F);
  put('B'+F, 'Family codes are the existing ones. Item codes are left blank for Aung — a new ' +
             'dish takes the next free number in its family. Cost %, name length and net price ' +
             'are formulas, so the sheet recalculates when a figure is corrected. ' +
             'Click any dish name to open its recipe — ingredients, batches, allergens and method.',
      { font:{ name:'Calibri', size:9, italic:true, color:{argb:B.vinoMid} } });
  ws.mergeCells('B'+(F+1)+':N'+(F+1));
  put('B'+(F+1), "Roberto's DIFC · Kitchen Recipes app",
      { font:{ name:'Georgia', size:9, color:{argb:B.vino} } });

  /* The recipe and every batch inside it travel with the form, in the same file and
     in the same colours. Aung and the cost controller price against what is actually
     in the dish, and it goes as rows they can copy — not as a picture of a card. */
  micRecipeSheet(wb, B, menuName, rows);
  micBatchSheet(wb, B, menuName, rows);

  return wb;
}

/* One build, three destinations — download it, print it, or send it. Written with a
   reader the module carries itself, so nothing is fetched from an outside host: the
   same rule as the recipe cards. */
function micFileName(menuName){
  var d = new Date(), stamp = String(d.getFullYear()).slice(2) +
    ('0'+(d.getMonth()+1)).slice(-2) + ('0'+d.getDate()).slice(-2);
  return stamp + '-Micros Request -' + menuName + '.xlsx';
}
function micMenuName(){
  var m = MENUS.filter(function(x){ return x.id === MICREQ.menuId; })[0];
  return m ? m.name : 'menu';
}
function micBuild(){
  return lazy('lib/exceljs.min.js', 'ExcelJS').then(function(ExcelJS){
    var name = micMenuName();
    /* the tab is named after the menu, the way his files are — "Valentine", "Ramadan" */
    return micWorkbook(ExcelJS, name).xlsx.writeBuffer().then(function(buf){
      return { name: micFileName(name), menu: name, buf: buf };
    });
  });
}
/* Uint8Array → base64 without blowing the argument limit on a 60-dish sheet */
function micB64(buf){
  var b = new Uint8Array(buf), s = '', CH = 0x8000;
  for (var i = 0; i < b.length; i += CH) s += String.fromCharCode.apply(null, b.subarray(i, i+CH));
  return btoa(s);
}

function micDownload(btn){
  var st = $('micst');
  var take = MICREQ.rows.filter(function(r){ return r.take; });
  if (!take.length) return;
  btn.disabled = true; var was = btn.textContent; btn.textContent = 'Making it…';
  if (st){ st.className = 'brn'; st.textContent = ''; }
  micBuild().then(function(file){
    var blob = new Blob([file.buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = file.name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    if (st){ st.className = 'brn'; st.textContent = 'Made ✓ — ' + take.length + ' dish' +
      (take.length===1?'':'es') + '. It is in your downloads.'; }
  }).catch(function(e){
    if (st){ st.className = 'brn bad'; st.textContent = 'Could not make it — ' + plain(e.message); }
  }).then(function(){ btn.disabled = false; btn.textContent = was; });
}

    '</style></head><body>' +
    '<div class="band"><h1>MICROS POS Item Addition Form</h1>' +

var RETIRED = {};      /* codes that are no longer on the newest stock take */

function mkRow(part){

  var opts = search(part.name), loose = false;
  if (!opts.length){
    /* "Seabass Fillett sliced" is his wording, not Aung's — try the shorter phrase.
       These are suggestions only: a loose match is NEVER picked for you. */
    /* only real words — "LE Campaillou" must not fall back to "LE" and offer 34 lemons */
    var w = words(part.name).filter(function(x){ return x.length >= 3; });
    for (var n = w.length - 1; n >= 1 && !opts.length; n--){
      opts = search(w.slice(0, n).join(' '));
      if (!opts.length) opts = search(w.slice(w.length - n).join(' '));
    }
    loose = opts.length > 0;
  }
  var r = { raw:part.raw, word:part.name, note:part.note || null, opts:opts, loose:loose,
            code: (!loose && opts.length === 1) ? opts[0].code : null,   /* auto only when there's no choice to make */
            qty:part.qty, unit:null, yield:100, waste:0, adj:false };
  var it = itemOf(r);
  r.typedUnit = part.unit || null;      /* what he actually wrote, checked again once he picks */
  if (part.unit === '?'){               /* a tablespoon / a clove / a pinch is not a measurement */
    r.noMeasure = true; r.qty = null; r.unit = null;
  } else if (part.unit){                /* keep what the chef wrote if this item can be measured that way */
    if (!it){
      /* Nothing is picked yet, so there is nothing to check the unit against — and
         `unitsFor(null)` answers "g / kg" for everything, which is a guess, not a
         check. Throwing the unit away here is what turned "5 L water" into a bare 5
         while the sheet went on showing "g", and what later let "0.5 L" be re-read as
         0.5 ml once the ingredient was added. Keep exactly what he wrote. It is
         checked properly the moment an ingredient is picked, and only then. */
      r.unit = part.unit;
    } else {
      var allowed = unitsFor(it);

             : (part.unit==='kg'&&allowed.indexOf('g')>-1) ? 'kg'
             : (part.unit==='L'&&allowed.indexOf('ml')>-1) ? 'L' : null;

    }

    r.bare = part.qty; r.qty = null;

  var h = S.hints && S.hints[part.raw];
  if (h){
    if (h.code){
      var exact = ING.filter(function(x){ return String(x.code) === String(h.code); })[0];
      if (!exact) r.goneCode = h.code;                 /* the file names a code Aung no longer lists */
      else if (!nameAgrees(part.name, exact.name)){
        /* codes get re-used. A code that now points at something else is the most
           dangerous kind of match, because it looks exact. Never take it. */
        r.codeMoved = { code:h.code, now:exact.name };
        r.opts = [exact].concat(r.opts.filter(function(o){ return o.code !== exact.code; }));
        r.code = null;
      } else {
        r.opts = [exact].concat(r.opts.filter(function(o){ return o.code !== exact.code; }));
        r.code = exact.code; r.loose = false; r.byCode = true;
        var al = unitsFor(exact);
        if (al.indexOf(r.unit) < 0) r.unit = defUnit(exact);
      }
    }
    if (h.isSub && !r.byCode){                          /* it is one of his own sub-recipes */
      r.wantBatch = true; r.code = null; r.mismatch = null;
      r.qty = part.qty; r.unit = part.unit || null;      /* keep what the file said */
    }

  }

/* do the file's name and Aung's name for that code describe the same thing at all? */
function nameAgrees(a, b){

function totals(){
  var t=0, noProd=0, noQty=0, noPrice=0, badBatch=[];
  S.rows.forEach(function(r){

    var it = itemOf(r);

/* ═════════ bringing a recipe in — Excel, Word, PDF, or spoken ═════════
   Every route ends in the same place: the words go in the box, you see the split,
   you pick the ingredients. A file fills the sheet; it never picks for you. */

var LIBS = {};
function lazy(src, check){                       /* only downloads when you actually use it */
  if (window[check]) return Promise.resolve(window[check]);
  if (LIBS[src]) return LIBS[src];
  LIBS[src] = new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = src;
    s.onload  = function(){ window[check] ? res(window[check]) : rej(new Error('the reader did not start')); };
    s.onerror = function(){ rej(new Error('could not load the reader for that kind of file')); };
    document.head.appendChild(s);
  });
  return LIBS[src];
}

/* GRM/ML/PCS are his words. A pinch is not a measurement — it gets no quantity. */
var UNITMAP = { grm:'g', gr:'g', g:'g', gm:'g', gram:'g', grams:'g', kg:'kg', kgs:'kg', kilo:'kg', kilogram:'kg',
                ml:'ml', mls:'ml', l:'L', ltr:'L', lt:'L', litre:'L', liter:'L',
                pcs:'pcs', pc:'pcs', piece:'pcs', pieces:'pcs', each:'pcs', ea:'pcs', nos:'pcs' };
function mapUnit(u){
  var k = String(u||'').toLowerCase().replace(/[^a-z]/g,'');
  return UNITMAP[k] || null;                     /* pinch, qb, to taste → nothing, on purpose */
}
function cell(v){ return String(v==null?'':v).replace(/\s+/g,' ').trim(); }
/* like cell(), but a line break inside the cell is content, not whitespace — a method

function mcell(v){
  return String(v==null?'':v).replace(/\r\n?/g,'\n').replace(/[ \t ]+/g,' ')
           .split('\n').map(function(x){ return x.trim(); }).join('\n')
           .replace(/\n{3,}/g,'\n\n').trim();

function isNum(v){ return v!=='' && v!=null && isFinite(String(v).replace(',','.')); }

var LABELROW = /standard recipe form|recipe name|outlet name|categor|prepared by/i;
/* "Quantity", "Qty" — and QANTITY, which is how the 2020 and 2022 templates spell it.
   That single missing U meant the quantity column was never found, so every line was
   skipped and about seventy real recipes came back as "nothing in it looks like a
   recipe". Written once, here, and used by both the row test and the column lookup. */

      && /name of the item|ingredient|item|description/.test(j);

function findCol(c, re){ for (var i=0;i<c.length;i++) if (re.test(c[i])) return i; return -1; }
function labelVal(rows, re){                      /* "Nos of Serving:" … 3.41 */
  for (var r=0;r<rows.length;r++){
    var c = rows[r].map(cell), i = findCol(c, re);
    if (i < 0) continue;
    for (var k=i+1;k<c.length;k++) if (isNum(c[k])) return parseFloat(String(c[k]).replace(',','.'));

/* One sheet can hold several forms stacked on top of each other — split them first,

function splitForms(rows){
  var hdr = [];
  rows.forEach(function(r,i){ if (isHeaderRow(r.map(cell))) hdr.push(i); });
  if (hdr.length <= 1) return [rows];
  return hdr.map(function(h,k){
    var start = k===0 ? 0 : h-1, floor = k===0 ? 0 : hdr[k-1]+1;
    while (start > floor && LABELROW.test(rows[start-1].map(cell).join(' '))) start--;
    var end = (k+1 < hdr.length)
      ? (function(){ var s = hdr[k+1]-1, f = h+1;
          while (s > f && LABELROW.test(rows[s-1].map(cell).join(' '))) s--;

/* One Standard Recipe Form — as rows of cells. Works for Excel and for a Word table. */
function readForm(rows){

  for (var r=0; r<rows.length; r++){
    var c = rows[r].map(cell), joined = c.join(' ').toLowerCase();
    if (!name && /recipe name/.test(joined))  name = c.slice(c.findIndex(function(x){ return /recipe name/i.test(x); })+1).filter(Boolean)[0] || '';
    if (!cat  && /categor/.test(joined))      cat  = c.slice(c.findIndex(function(x){ return /categor/i.test(x); })+1).filter(Boolean)[0] || '';
    if (hdr<0 && isHeaderRow(c)){

        else if (/^unit/i.test(x)) ui=i;

  /* The costing template carries far more: Aung's own code per line, an I/R column
     saying which lines are sub-recipes, wastage, servings and the selling price. */

    if (qi < 0) qi = findCol(h, /quantity/i);

    if (LABELROW.test(c.join(' ')) || isHeaderRow(c)) break;   /* the next form has started */
    /* before the ingredient check — a second line of the method sits on a row of its

    var q = cell(c[qi]), u = mapUnit(c[ui]);
    var qty = isNum(q) ? String(q).replace(',','.') : null;
    if (qty && !u && !costing){ noUnit.push(nm); qty = null; }   /* never turn a pinch into a gram */
    if (costing && !qty) continue;                               /* the blank filler rows */
    var line = (qty ? qty + (u ? ' '+u : '') + ' ' : '') + nm;
    lines.push(line);
    if (costing){
      if (u) units[u] = (units[u]||0) + 1;
      var code = ci>-1 ? cell(c[ci]) : '', isSub = ri>-1 && /^r$/i.test(cell(c[ri]));
      var wst  = wi>-1 && isNum(cell(c[wi])) ? parseFloat(cell(c[wi])) : null;
      if (code || isSub || wst) hints[line] = { code:code||null, isSub:isSub, waste:wst };
      if (isSub) subs.push(nm);
    }
  }
  if (!lines.length) return null;

  /* The method, kept whole with his own headings — and kept as LINES.
     cell() flattens every run of whitespace to one space, which is right for an
     ingredient name and wrong for a method: one cell holds all twelve steps with
     newlines between them, and flattening them ran the whole thing into a single
     unreadable paragraph AND glued "Plating Method" onto the first step so the
     heading could not be found. mcell() tidies each line but keeps the breaks. */
  var method = '';
  for (var m=hdr; m<rows.length; m++){
    var j = rows[m].map(cell).join(' ');
    if (/preparation method/i.test(j)){
      method = rows.slice(m).map(function(rr){ return rr.map(mcell).filter(Boolean).join('\n'); })
                   .join('\n').replace(/^\s*preparation method\s*:?\s*/i,'')
                   .replace(/\n{3,}/g,'\n\n').trim();
      break;
    }
  }
  if (!method && mnotes.length) method = mnotes.join('\n');
  var kind = /sub[\s-]?recipe|prep|batch/i.test(cat) ? 'batch' : 'main';
  name = name.replace(/^\s*R\s*-\s*/i, '');    /* their "R - Pappa al pomodoro" is the same thing
                                                  the main recipe calls "Pappa al pomodoro" */
  var out = { name:name, cat:cat, lines:lines, method:method, noUnit:noUnit, kind:kind,
              hints:hints, subs:subs, costing:costing };
  if (costing){
    var serves = labelVal(rows, /nos of serving/i), pw = labelVal(rows, /portion weight/i);
    if (kind === 'batch'){
      var base = Object.keys(units).sort(function(a,b){ return units[b]-units[a]; })[0] || 'kg';
      if (serves){ out.makesQty = +(serves * (pw || 1)).toFixed(4); out.makesUnit = base; }
    } else if (serves){ out.makesQty = serves; out.makesUnit = 'portions'; }
    var sp = labelVal(rows, /suggested selling price/i);
    if (kind === 'main' && sp) out.price = sp;
  }
  return out;
}

/* ═════════ Antonio's sheets ═════════
   The bread and pastry recipes are not on the Standard Recipe Form at all — they are
   a baker's sheet, and they were coming back as "nothing in it looks like a recipe".
   Two shapes, both real, both here.

   ── the dough sheet ──
   "NAME OF RECIPE:" at the top, then a PREFERMENT block and a REFRESHEMENT block:
   the ingredient in one column and its grams in the next, with the procedure written
   as prose off to the right. Between the ingredients sit the settings a baker needs —
   final temperature, hours of maturation, baking — which are NOT ingredients but are
   the half of the recipe that makes it work, so they are kept as method rather than
   thrown away.

   "PREFERMENT" appears twice: once as the heading of its block, and once as an
   ingredient of the second block, being the dough made in the first. It is only an
   ingredient when it has a weight beside it. */
/* the settings that are part of how the dough is made, and belong in the method */
var BAKE_SET  = /^(final temp|temp\. final|storage temp|hours of maturation|resting time)\b/i;
/* the column headings of the form itself — they say nothing and belong nowhere */
var BAKE_HEAD = /^(total flour|recipe balancing|dough|q\.?ta|qty|grams|grammi|ø|%)$/i;
var BAKE_OVEN = /^(baking|precooking|regeneration|cottura)\b/i;
var BAKE_BLK  = /^(preferment|refreshement|refreshment)\b/i;
/* their numbers: 22,5 is twenty-two and a half, and 1OOO is a thousand typed with
   the letter O. A weight read as nothing is an ingredient silently dropped. */
function bakeQty(v){
  var s = cell(v).replace(/\s/g,'');
  if (!s) return null;
  if (/^[0-9OoIl.,+]+$/.test(s)) s = s.replace(/[Oo]/g,'0').replace(/[Il]/g,'1');
  s = s.replace(',', '.');
  var plus = s.split('+').map(parseFloat).filter(function(x){ return isFinite(x); });
  if (plus.length > 1) return plus.reduce(function(a,b){ return a+b; }, 0);   /* "50+75" */
  return isFinite(parseFloat(s)) ? parseFloat(s) : null;
}
function readBakeryForm(rows){
  var name = '', hdr = -1;
  for (var r=0; r<rows.length && hdr<0; r++){
    var c = rows[r].map(cell);
    for (var i=0;i<c.length;i++){
      if (/name of (the )?recipe|nome della ricetta/i.test(c[i])){
        name = c.slice(i+1).filter(Boolean)[0] || ''; hdr = r; break;
      }
    }
  }
  if (hdr < 0) return null;

  var lines = [], method = [], total = 0;
  for (var k=hdr+1; k<rows.length; k++){
    var c = rows[k].map(cell), mc = rows[k].map(mcell);
    var nm = c[1] || c[0];
    /* the procedure, wherever in the row it was written */
    mc.slice(2).forEach(function(x){ if (x && x.length > 25) method.push(x); });
    if (!nm || BAKE_HEAD.test(nm)) continue;
    if (BAKE_OVEN.test(nm)){
      var bits = c.slice(2).filter(function(x){ return x && x.length <= 25; });
      if (bits.length) method.push(nm + ': ' + bits.join(' · '));
      continue;
    }
    if (BAKE_SET.test(nm)){
      var v = c.slice(2).filter(Boolean)[0];
      if (v) method.push(nm + ': ' + v);
      continue;
    }
    var q = bakeQty(c[2]);
    if (q == null) continue;                    /* a blank line of the template */
    /* "PREFERMENT 3250" in the second block is the dough made in the first, used by
       weight. Its flour, water and yeast are already listed above, so counting it as
       an ingredient would buy the same flour twice and say the batch weighs half as
       much again as it does. The weight he actually uses is said in the method. */
    if (BAKE_BLK.test(nm)){
      if (q) method.push('Uses ' + q + ' g of the ' + nm.toLowerCase() + ' made above.');
      continue;
    }
    lines.push(q + ' g ' + nm);
    total += q;
  }
  if (!lines.length) return null;

  var out = { name:name, cat:'Sub recipe', kind:'batch', lines:lines,
              method: method.filter(function(x,i,a){ return a.indexOf(x) === i; }).join('\n'),
              noUnit:[], hints:{}, subs:[], costing:false };
  /* it makes what it weighs — so the cost per kilo is real rather than left blank */
  if (total > 0){ out.makesQty = +(total/1000).toFixed(4); out.makesUnit = 'kg'; }
  return out;
}

/* ── the INGREDIENTS / METHOD sheet ──
   The pastry ones. Ingredients are already written the way this app asks for them —
   "500 g almond flour" — with the method beside them. The lines in capitals with no
   weight ("FOR THE CRUSCO OIL", "MASCARPONE CREAM") are the parts of the dish, not
   ingredients; they are already repeated over in the method, so they are left there. */
function readIngMethodForm(rows){
  var hdr = -1, ii = -1, mi = -1;
  for (var r=0; r<rows.length && hdr<0; r++){
    var c = rows[r].map(cell), a = -1, b = -1;
    for (var i=0;i<c.length;i++){
      if (a<0 && /^ingredients?$/i.test(c[i])) a = i;
      if (b<0 && /^method$/i.test(c[i])) b = i;
    }
    if (a > -1 && b > -1){ hdr = r; ii = a; mi = b; }
  }
  if (hdr < 0) return null;

  var name = '';
  for (var t=0; t<hdr && !name; t++)
    name = rows[t].map(cell).filter(Boolean)[0] || '';
  if (/^recipe name$/i.test(name)) name = '';        /* the template's own placeholder */

  var lines = [], method = [];
  for (var k=hdr+1; k<rows.length; k++){
    var c = rows[k].map(cell), mc = rows[k].map(mcell);
    if (mc[mi]) method.push(mc[mi]);
    var v = c[ii];
    if (!v) continue;
    var hasNum = /\d/.test(v);
    var heading = !hasNum && (/^for the\b/i.test(v) || v === v.toUpperCase());
    if (heading) continue;                            /* a part of the dish, already in the method */
    lines.push(v);
  }
  if (!lines.length) return null;
  return { name:name, cat:'', kind:'main', lines:lines, method:method.join('\n'),
           noUnit:[], hints:{}, subs:[], costing:false };
}

/* Plain text (PDF, or a Word file with no table) — one ingredient per line */
function readText(text){
  var ls = String(text).split(/\r?\n/).map(function(x){ return x.replace(/\s+/g,' ').trim(); });
  var name='', cat='', lines=[], noUnit=[], started=false;
  var RE = /^(\d+(?:[.,]\d+)?)\s*([A-Za-z]{1,8})?\s+(.{2,})$/;
  ls.forEach(function(l){
    if (!l) return;
    var mn = l.match(/recipe name\s*:?\s*(.+)$/i);  if (mn){ name = mn[1].trim(); return; }
    var mc = l.match(/categor\w*\s*:?\s*(.+)$/i);   if (mc){ cat  = mc[1].trim(); return; }
    if (/preparation method|^method\b|^plating\b/i.test(l)) { started = true; return; }
    if (started) return;
    if (/^quantity\b/i.test(l)) return;
    var m = l.match(RE); if (!m) return;
    var u = mapUnit(m[2]);
    /* words that look like a unit but measure nothing — drop the word AND the quantity */
    if (!u && m[2] && /^(pinch|pinches|qb|tt|dash|drop|drops|sprig|sprigs|leaf|leaves|tsp|tbsp)$/i.test(m[2])){
      noUnit.push(m[3].trim()); lines.push(m[3].trim()); return;
    }
    var nm = (u ? m[3] : (m[2] ? m[2]+' '+m[3] : m[3])).trim();
    lines.push(m[1].replace(',','.') + (u ? ' '+u : '') + ' ' + nm);
  });
  return lines.length ? { name:name, cat:cat, lines:lines, method:'', noUnit:noUnit,
                          kind: /sub[\s-]?recipe|prep|batch/i.test(cat) ? 'batch' : 'main' } : null;
}

function fromExcel(buf){
  return lazy('lib/xlsx.full.min.js','XLSX').then(function(X){
    var wb = X.read(new Uint8Array(buf), { type:'array' }), out = [];
    /* Antonio's workbooks carry an ITA sheet beside the ENG one, and it is not a
       translation — it is whatever recipe the template was copied from, left behind.
       FOCACCIA's says PIZZA ROBERTO'S. Reading it would invent a recipe nobody wrote. */
    var hasEng = wb.SheetNames.some(function(x){ return /^eng$/i.test(x); });
    wb.SheetNames.forEach(function(n){
      if (hasEng && /^ita$/i.test(n)) return;
      var aoa = X.utils.sheet_to_json(wb.Sheets[n], { header:1, blankrows:false, defval:'' });
      var got = 0;
      splitForms(aoa).forEach(function(block, bi){
        var f = readForm(block);
        if (f){ f.name = f.name || (bi ? n+' '+(bi+1) : n); f.where = n; out.push(f); got++; }
      });
      /* not the Standard Recipe Form — try the two Antonio writes his breads and
         pastry on, before giving up on the sheet */
      if (!got){
        var g = readBakeryForm(aoa) || readIngMethodForm(aoa);
        /* "Sheet1" is not a name. Left empty, the file's own name is used instead —
           which is how "CRUSCO PEPPER MAIO" is called what the chef calls it. */
        if (g){ if (!g.name && !/^sheet\s*\d*$/i.test(n)) g.name = n; g.where = n; out.push(g); }
      }
    });
    return { recipes:out, how:'Excel' };
  });
}

/* .docx is a zip. Unpacked with the browser's own decompressor — no library. */
function unzipEntry(buf, want){
  var dv = new DataView(buf), u8 = new Uint8Array(buf), eocd = -1;
  for (var i = buf.byteLength - 22; i >= 0 && i > buf.byteLength - 66000; i--)
    if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  if (eocd < 0) throw new Error('that Word file could not be opened');
  var n = dv.getUint16(eocd+10, true), off = dv.getUint32(eocd+16, true), p = off, found = null;
  for (var e=0; e<n; e++){
    var nl = dv.getUint16(p+28, true), el = dv.getUint16(p+30, true), cl = dv.getUint16(p+32, true);
    var nm = new TextDecoder().decode(u8.subarray(p+46, p+46+nl));
    if (nm === want) found = { method: dv.getUint16(p+10, true),
                               csize:  dv.getUint32(p+20, true),
                               lo:     dv.getUint32(p+42, true) };
    p += 46 + nl + el + cl;
  }
  if (!found) throw new Error('there is no document inside that Word file');
  var l = found.lo, ln = dv.getUint16(l+26, true), le = dv.getUint16(l+28, true);
  var from = l + 30 + ln + le;
  /* exactly this entry — anything trailing makes the decompressor give up */
  var data = u8.subarray(from, found.csize ? from + found.csize : u8.length);
  if (found.method === 0) return Promise.resolve(new TextDecoder().decode(data));
  if (typeof DecompressionStream === 'undefined') throw new Error('this browser cannot open Word files');
  return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
}
function fromWord(buf){
  return unzipEntry(buf, 'word/document.xml').then(function(xml){
    var doc = new DOMParser().parseFromString(xml, 'application/xml');
    var txt = function(el){ return [].map.call(el.getElementsByTagName('w:t'), function(t){ return t.textContent; }).join(''); };
    var out = [];
    [].forEach.call(doc.getElementsByTagName('w:tbl'), function(tbl){
      var rows = [].map.call(tbl.getElementsByTagName('w:tr'), function(tr){
        return [].map.call(tr.getElementsByTagName('w:tc'), txt);
      });
      splitForms(rows).forEach(function(block){ var f = readForm(block); if (f) out.push(f); });
    });
    if (!out.length){
      var paras = [].map.call(doc.getElementsByTagName('w:p'), txt).join('\n');
      var f2 = readText(paras); if (f2) out.push(f2);
    }
    return { recipes:out, how:'Word' };
  });
}

function fromPdf(buf){
  return lazy('lib/pdf.min.js','pdfjsLib').then(function(P){
    try { P.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js'; } catch(e){}
    return P.getDocument({ data:new Uint8Array(buf) }).promise;
  }).then(function(doc){
    var pages = [];
    for (var i=1; i<=doc.numPages; i++) pages.push(i);
    return pages.reduce(function(chain, n){
      return chain.then(function(acc){
        return doc.getPage(n).then(function(pg){ return pg.getTextContent(); }).then(function(tc){
          var byLine = {};
          tc.items.forEach(function(it){
            var y = Math.round(it.transform[5]);
            (byLine[y] = byLine[y] || []).push({ x:it.transform[4], s:it.str });
          });
          var text = Object.keys(byLine).sort(function(a,b){ return b-a; }).map(function(y){
            return byLine[y].sort(function(a,b){ return a.x-b.x; }).map(function(o){ return o.s; }).join(' ');
          }).join('\n');
          return acc + text + '\n';
        });
      });
    }, Promise.resolve('')).then(function(all){
      if (all.replace(/\s/g,'').length < 40)
        throw new Error('there are no words inside that PDF — it is a picture of a page, not text. ' +
                        'Send the Excel or Word it came from, or say it out loud instead.');
      var f = readText(all);
      return { recipes: f ? [f] : [], how:'PDF' };
    });
  });
}

function readAnyFile(file){
  var n = (file.name||'').toLowerCase();
  return file.arrayBuffer().then(function(buf){
    if (/\.(xlsx|xlsm|xls|csv)$/.test(n)) return fromExcel(buf);
    if (/\.docx$/.test(n))                return fromWord(buf);
    if (/\.pdf$/.test(n))                 return fromPdf(buf);
    if (/\.doc$/.test(n))
      throw new Error('that is the old Word format. Open it in Word and Save As .docx, then bring it in.');
    throw new Error('that kind of file cannot be read — Excel, Word (.docx) or PDF');
  });
}

/* put a read recipe into the write screen, exactly as if it had been typed */
function useImported(f){
  S.kind    = f.kind || S.kind || 'main';
  S.name    = f.name || S.name;
  var sec   = SECTIONS.filter(function(s){ return new RegExp('^'+s.split(' ')[0], 'i').test(String(f.cat||'')); })[0];
  S.section = sec || S.section;
  S.hints   = f.hints || null;                   /* codes / sub-recipe flags / wastage, by line */
  S.text    = f.lines.join(',\n') + ',';         /* a comma per line — one line is one ingredient */
  S.method  = parseMethod(f.method || '');
  if (f.makesQty != null){ S.makesQty = f.makesQty; S.makesUnit = f.makesUnit; }
  if (f.price != null && S.kind === 'main') S.price = f.price;
  S.imported = { how:f.how, noUnit:f.noUnit||[], where:f.where||'',
                 costing:!!f.costing, subs:f.subs||[],
                 makes:(f.makesQty!=null ? f.makesQty+' '+f.makesUnit : null), price:f.price||null };
  /* Straight to the sheet. The screen in between asked him to check the split of a list
     the file had just written for him — a stop with no work in it, and the sheet IS the
     split, line for line. Back still goes there if he wants to retype the words. */
  S.rows = splitLine(S.text).map(function(p){ return mkRow(p); }); S.sel = [];
  S.lastRm = null;
  S.step = S.rows.length ? 'sheet' : 'write';
}

/* ═════════ bringing a whole workbook in at once ═════════
   One file is a dish and everything under it. Branzino.xlsx is 8 recipes. Opening
   them one at a time, and re-typing the links by hand, is the slowest thing in the
   module. This does the lot in one confirm.

   Names in a workbook do NOT match between the dish and its own sub-recipes — the
   dish says "Pickled red radish", the sub-recipe is called "Pickled Radish", and
   "Pomegranate" is spelt "Pomegrnate" on its own sheet. So the match is on a similar
   name, never an exact one, and it has to be sure of itself: a match only stands if
   it is clearly better than the runner-up, or nothing is linked and the line stays
   as the chef typed it. A wrong link is far worse than no link. */
/* the same plain words, but for this screen — "try Save again" is the wrong advice
   here, because there is no sheet in front of him and the fix is to run the file again */
function planPlain(msg){
  if (/Failed to fetch|NetworkError|network/i.test(msg)) return 'The Kitchen database could not be reached.';
  if (/recipes_name_unique|duplicate key/i.test(msg)) return 'Something else is already saved under that exact name.';
  return msg;
}
function nameWords(s){
  return String(s||'').toLowerCase().replace(/[^a-z0-9 ]+/g,' ').split(/\s+/)
    .filter(function(w){ return w.length > 1; });
}
/* how alike are two recipe names, 0 to 1, judged on the shorter of the two —
   "Artichokes" is inside "Artichokes sliced", and that is a match, not a near miss */
function simName(a, b){
  var A = nameWords(a), B = nameWords(b);
  if (!A.length || !B.length) return 0;
  var short = A.length <= B.length ? A : B, long = A.length <= B.length ? B : A;
  var used = {}, sum = 0;
  short.forEach(function(w){
    var best = 0, bi = -1;
    long.forEach(function(x, i){
      if (used[i]) return;
      var s = 0;
      if (w === x || stem(w) === stem(x)) s = 1;
      else if (w.length >= 4 && (x.indexOf(w) === 0 || w.indexOf(x) === 0)) s = 0.85;
      else if (w.length >= 5 && x.length >= 5 && dist(w, x) <= 1) s = 0.9;
      if (s > best){ best = s; bi = i; }
    });
    if (bi > -1){ used[bi] = 1; sum += best; }
  });
  return sum / short.length;
}
/* the one clear winner, or nothing at all */
/* How much of the LONGER name is accounted for. simName() divides by the shorter one,
   so "water" scores 1.00 against "Lemon water" — right for "did he mean this?", wrong
   for "these are the same thing". */
function covers(a, b){
  var A = nameWords(a), B = nameWords(b);
  if (!A.length || !B.length) return 0;
  var n = Math.max(A.length, B.length);
  return simName(a, b) * (Math.min(A.length, B.length) / n);
}
function bestMatch(name, list, nameOf){
  var scored = list.map(function(x, i){ return { i:i, s:simName(name, nameOf(x)) }; })
                   .sort(function(p,q){ return q.s - p.s; });
  if (!scored.length || scored[0].s < 0.75) return null;
  if (scored[1] && scored[0].s - scored[1].s < 0.15) return null;   /* two look alike — pick neither */
  return scored[0];
}

/* Work out, before anything is written, exactly what will be created and what will
   be linked to what. Nothing here touches the database. */
function planWorkbook(res){
  var recs = res.recipes.map(function(f, i){
    return { i:i, f:f, name:(f.name||'').trim(), kind:f.kind || 'main', file:f.file || null };
  }).filter(function(R){ return R.name; });

  /* Across sixty workbooks the same batch is in a dozen of them — Porcini stock is
     written into every dish that uses it. Taken at face value that is a dozen Porcini
     stocks in the database, each dish pointing at a different copy, and changing the
     recipe then changes it for one dish out of twelve.

     The first one wins, the rest are folded into it, and the screen says which files
     it was in so nobody wonders where the other eleven went. */
  var byName = {}, folded = [];
  recs = recs.filter(function(R){
    var k = R.kind + '|' + words(R.name).join(' ');
    if (!byName[k]){ byName[k] = R; R.alsoIn = []; return true; }
    var first = byName[k];
    if (R.file && first.alsoIn.indexOf(R.file) < 0) first.alsoIn.push(R.file);
    folded.push({ name:R.name, file:R.file, into:first.file });
    return false;
  });
  res.folded = folded;

  /* something already saved under a similar name is LINKED, never made a second time */
  var saved = (S.saved || []).filter(function(r){ return !r.archived; });
  recs.forEach(function(R){
    var m = bestMatch(R.name, saved, function(r){ return r.name; });
    R.existing = m ? saved[m.i] : null;
    /* build its rows now, with this file's own codes and sub-recipe flags, so the
       screen can show what it found before a single row is written */
    var keep = S.hints; S.hints = R.f.hints || null;
    R.rows = splitLine(R.f.lines.join(',\n') + ',').map(function(p){
      var r = mkRow(p); r.filed = { qty:p.qty, unit:p.unit };   /* what the file actually said */
      return r;
    });
    S.hints = keep;
    R.method = parseMethod(R.f.method || '');
    R.section = SECTIONS.filter(function(s){
      return new RegExp('^' + s.split(' ')[0], 'i').test(String(R.f.cat || '')); })[0] || null;
  });

  /* which rows of each recipe are actually another recipe in the same file */
  recs.forEach(function(R){
    R.links = [];
    var others = recs.filter(function(x){ return x !== R; });
    R.rows.forEach(function(r, k){
      var m = bestMatch(r.word, others, function(x){ return x.name; });
      /* simName() divides by the SHORTER name, so a name wholly inside a longer one
         scores a perfect 1. Within one workbook that was harmless. Across sixty it is
         not: the line "water" in Pasta dough matched the batch "Lemon water" at 1.00,
         and pasta would have been made with lemon water and nothing on screen to say
         so. A link has to fit BOTH ways round, or it is not the same thing. */
      if (m && covers(r.word, others[m.i].name) >= 0.75)
        R.links.push({ row:k, was:r.word, to:others[m.i], score:m.s });
    });
  });

  /* deepest first — a batch has to exist before the dish can point at it */
  var order = [], done = {};
  for (var pass = 0; pass < recs.length + 2 && order.length < recs.length; pass++){
    recs.forEach(function(R){
      if (done[R.i]) return;
      var waiting = R.links.some(function(l){ return !done[l.to.i]; });
      if (!waiting){ done[R.i] = 1; order.push(R); }
    });
  }
  recs.forEach(function(R){ if (!done[R.i]) order.push(R); });   /* a ring — still build it */
  return { file:res.fileName, how:res.how, recs:recs, order:order };
}

/* A recipe that is already saved is never written over — with one exception, and it
   is the one that matters. If a batch failed to go in last time, the dish was saved
   with that line EMPTY. Running the file again used to leave it empty for ever, so
   the message telling him to run it again was a lie. This fills in a line that has
   nothing picked, and only such a line: anything he has already chosen is untouched. */
function repairLinks(R, madeId){
  if (!R.links.length) return null;
  var id = R.existing.id;
  return sb('recipe_lines?recipe_id=eq.'+id+'&select=id,position,typed_text,stock_code,child_recipe_id')
    .then(function(ls){
      var jobs = [];
      (ls || []).forEach(function(l){
        if (l.stock_code || l.child_recipe_id) return;             /* already picked — leave it alone */
        var txt = String(l.typed_text || '').replace(/#\d+$/,'');
        var m = bestMatch(txt, R.links, function(x){ return x.was; });
        if (!m) return;
        var newId = madeId[R.links[m.i].to.i];
        if (!newId || newId === id) return;
        jobs.push({ line:l.id, to:newId, was:txt, name:R.links[m.i].to.name });
      });
      if (!jobs.length) return null;
      return Promise.all(jobs.map(function(j){
        return sb('recipe_lines?id=eq.'+j.line, { method:'PATCH', prefer:'return=minimal',
                    body:{ child_recipe_id:j.to, stock_code:null, stock_name:null } });
      })).then(function(){ R.fixed = jobs; drawPlan(); });
    })
    .catch(function(){ return null; });     /* a failed repair must not stop the rest going in */
}

/* Create them, deepest first, one after another. If one fails the rest still go in
   and the screen names exactly which one did not — a half-done import that says
   nothing is how you end up with a dish quietly missing its sauce. */
function runWorkbook(){
  var P = S.plan, madeId = {};
  var seq = Promise.resolve();
  P.order.forEach(function(R){
    seq = seq.then(function(){
      if (R.existing){
        madeId[R.i] = R.existing.id; R.done = 'already'; drawPlan();
        return repairLinks(R, madeId);      /* fill in only the lines that have nothing picked */
      }
      R.done = 'busy'; drawPlan();
      var head = {
        kind: R.kind, name: R.name, section: R.section,
        makes_qty: R.f.makesQty != null ? R.f.makesQty : null,
        makes_unit: R.f.makesQty != null ? R.f.makesUnit : (R.kind === 'main' ? 'portions' : null),
        menu_price: R.kind === 'main' && R.f.price != null ? R.f.price : null,
        method: R.method, photos: [], updated_at: new Date().toISOString()
      };
      /* a file brought in by Antonio is Antonio's work, all four rows of it */
      signed(head);
      return sb('recipes', { method:'POST', body:head }).then(function(out){
        var rec = out && out[0];
        if (!rec) throw new Error('the database did not return the recipe');
        madeId[R.i] = rec.id; R.newId = rec.id;
        R.links.forEach(function(l){
          var id = madeId[l.to.i]; if (!id) return;
          var r = R.rows[l.row], fl = r.filed || {};
          r.code = 'R:' + id;                          /* the line now points at the batch */
          /* the unit rules that just ran were about a STOCK item — "5 pcs" was dropped
             because the tin of radish Aung sells is priced by the kilo. This line is a
             batch of his own now, so what the file wrote is what it is. A pinch is still
             not a measurement, so that one stays blank. */
          if (fl.unit && fl.unit !== '?'){
            r.unit = fl.unit;
            if (r.qty == null && fl.qty != null) r.qty = fl.qty;
            r.mismatch = null; r.bare = null; r.noMeasure = false;
          }
        });
        if (!R.rows.length) return null;
        return sb('recipe_lines', { method:'POST', prefer:'return=minimal',
                                    body: linesFor(rec.id, R.rows) });
      }).then(function(){ R.done = 'made'; drawPlan(); })
        .catch(function(err){ R.done = 'failed'; R.why = planPlain(err.message); drawPlan(); });
    });
  });
  return seq.then(function(){
    return Promise.all([loadSaved(), loadBatches()]);
  }).then(function(){ S.planRan = true; drawPlan(); });
}
