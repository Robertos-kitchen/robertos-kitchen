<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create a Recipe — Roberto's Kitchen</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500;600;700&display=swap');
:root{
  --sabbia:#e1d3c2;--sabbia-light:#ede5d8;--sabbia-dark:#cfc0ad;
  --vino:#410207;--vino-mid:#5e0a10;--vino-light:#7a1218;
  --oliva:#4b5128;--oro:#ba9b02;--ink:#2a1a10;--cream:#f5ede0;
  --attn:#755c04;--attn-soft:rgba(138,109,5,.09);
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'DM Sans',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--sabbia);font-family:var(--sans);color:var(--ink)}
.note{background:var(--ink);color:var(--cream);padding:9px 16px;font-size:11px;letter-spacing:.6px;line-height:1.6}
.note b{color:#e8cf7a;letter-spacing:2px}

/* It wraps. On a narrow screen the left half is a back button, the dish name, MAIN RECIPE
   and two dropdowns — every one of them nowrap — so it could not fit and did not try:
   "MAIN RECIPE" was printed straight through "SAVED RECIPES", and the section dropdown
   through "SAVE CHANGES". Nothing here can be dropped (they are the section and the menu,
   which decide where the dish appears at all), so the bar takes a second line instead.
   Its height is measured, so everything pinned below follows it down on its own. */
.bar{background:var(--vino);color:var(--cream);padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;row-gap:9px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
.bar .l{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 auto;flex-wrap:wrap;row-gap:8px}
.bar > div:last-child{flex:0 0 auto;margin-left:auto}
/* a real target for a thumb, not a glyph wedged in the corner */
/* Back says where it goes, not just "‹". A chevron on its own is a guess about which
   of nine screens you land on; the words are the whole point of it. */
.bar .back{display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:0 0 auto;
  min-width:36px;height:36px;border-radius:4px;border:1px solid rgba(245,237,224,.32);
  background:rgba(245,237,224,.12);font-size:19px;line-height:1;padding:0 11px 2px;
  color:var(--cream);cursor:pointer;user-select:none;max-width:230px}
.bar .back .bkw{font-family:var(--sans);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  padding-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:720px){ .bar .back .bkw{display:none} .bar .back{padding:0;width:36px} }
.bar .back:hover{background:rgba(245,237,224,.28);border-color:rgba(245,237,224,.65)}
.bar .back:active{background:rgba(245,237,224,.38)}
.bar .back.hide{display:none}
.bar .nm{font-family:var(--serif);font-size:21px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ty{font-size:8.5px;letter-spacing:1.5px;text-transform:uppercase;background:rgba(245,237,224,.2);border-radius:2px;padding:3px 7px;white-space:nowrap}
.bar .ty.b{background:var(--oro)}
/* ── the type is a control, not a label ──
   It was written on the bar from the first day and it could not be changed: picking
   "main" on the very first screen was a decision, and the only way out of it was to
   type the whole recipe again as a batch. It says the same thing it always said and
   is now the way to change it. The word is on it, so it does not have to be guessed
   at — a badge that quietly became tappable is a badge nobody taps. */
/* taller than the label it replaces, on purpose: as a label 19px was plenty, as
   something a chef hits with a thumb on the pass it is not */
.bar .ty.tap{cursor:pointer;border:1px solid rgba(245,237,224,.5);padding:9px 10px}
@media (pointer:coarse){ .bar .ty.tap{padding:11px 12px} }
.bar .ty.tap:hover{background:rgba(245,237,224,.42)}
.bar .ty.b.tap:hover{background:var(--oro);filter:brightness(1.12)}
.bar .ty .tych{opacity:.75;margin-left:6px;font-size:8px}
/* the strip it opens, on the sheet, where the work is — the same shape as everything
   else that asks him something here: it says what changes before it changes it */
.kindbar{margin:0 0 14px}
.kindbar:empty{display:none}
.kindask{background:var(--cream);border:1px solid var(--sabbia-dark);border-left:3px solid var(--oro);
  border-radius:0 7px 7px 0;padding:13px 15px}
.kindask.stop{border-left-color:var(--attn);background:var(--attn-soft)}
.kindask .kt{font-size:14px;line-height:1.5;color:var(--ink);margin-bottom:9px}
.kindask .kt b{color:var(--vino)}
.kindask .kw{font-size:12.5px;line-height:1.6;color:var(--vino-light);margin:9px 0 11px}
.kindask .kw b{color:var(--vino)}
.kindask .kw li{margin:2px 0}
.kindask .kw ul{margin:5px 0 0;padding-left:20px}
.bar .act{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;background:var(--cream);color:var(--vino);border:none;border-radius:3px;padding:8px 14px;font-weight:700;font-family:var(--sans);cursor:pointer;white-space:nowrap}
.bar .act.off{opacity:.35;pointer-events:none}

.wrap{max-width:1040px;margin:0 auto;padding:0 0 130px}
.pane{padding:26px 18px}
.q{font-family:var(--serif);font-size:27px;color:var(--vino);line-height:1.15;margin-bottom:5px}
.sub{font-size:13px;color:var(--vino-light);line-height:1.5;margin-bottom:20px}

/* ── THE ROOM ──────────────────────────────────────────────────────────────────
   Same logic as the Food Bible: the venue full-bleed behind everything, held under a
   vino wash so it never competes with what you are reading. It is fixed, so the sheet
   moves over it rather than dragging it along.

   To give a screen a room, set two properties on the body and nothing else:
     --room   the photograph
     --scrim  how far the wash is carried, for a room that reads thin under the
              heading. It is measured, not judged by eye — every room is brought to
              at least what Cortina reads at on "What are you making?", which is the
              screen that was approved. 1 means the wash exactly as it is there.

   The heading sits straight on the room. Anything that is WORK — a list, a table, a
   form — goes on paper over it: a chef reading forty rows must not be reading them
   off a photograph. That is what `.onpaper` is for. */
body.roomstep{background:#cdbba6;--scrim:1}
body.roomstep::before,body.roomstep::after{content:'';position:fixed;inset:0;z-index:0;
  pointer-events:none}
body.roomstep::before{background:var(--room) center/cover}
/* The wash is the light one. The Food Bible's gradient runs light at the top and deep
   at the bottom, which is backwards here — the question and the two grey buttons sit at
   the TOP, over the brightest part of the room (sky, tablecloths). So the light wash is
   kept and a short scrim is carried across the first 260px, where the type is. */
body.roomstep::after{background:linear-gradient(180deg,
  rgba(43,1,4,calc(.76*var(--scrim))) 0,
  rgba(43,1,4,calc(.52*var(--scrim))) 200px,
  rgba(43,1,4,calc(.38*var(--scrim))) 55%,
  rgba(43,1,4,calc(.62*var(--scrim))) 100%)}
body.roomstep>*{position:relative;z-index:1}
/* the work, on paper, over the room */
body.roomstep .onpaper{background:var(--sabbia);border-radius:10px;padding:15px 13px;
  margin-top:16px;box-shadow:0 18px 40px -22px rgba(20,4,4,.8)}
/* the type that sits straight on the room has to be read off it */
body.roomstep .q{color:#fbf3e9}
body.roomstep .sub{color:rgba(251,243,233,.82)}
/* the ember accent measures 3.6:1 against the room here — too thin for a 10.5px label,
   so on this step it lightens to 5.2:1 */
body.roomstep .howtob{color:#f2d3b8}
/* The explainer it opens is its OWN light box, so it keeps its own dark ink. It was
   being given cream type here, which put cream on sabbia the moment anybody tapped it. */
body.roomstep .howtox{background:rgba(250,245,236,.94);border-left-color:rgba(64,2,7,.3)}
/* the bar that counts how far the menu is sits above the heading, and a figure cannot
   be read off a photograph either — it gets the same paper the list below it gets */
body.roomstep .mprog{background:var(--sabbia);border-radius:9px;padding:13px 14px 12px;
  box-shadow:0 14px 32px -20px rgba(20,4,4,.7)}
/* the import row sits low enough to land on tablecloths, which are the brightest thing
   in the room — it gets its own plate rather than the whole photograph getting darker */
body.roomstep .bring{background:rgba(26,6,6,.56);border-radius:8px;padding:13px 14px;
  margin-top:18px}
body.roomstep .brb{color:#fbf3e9;border-color:rgba(245,237,224,.55);background:rgba(245,237,224,.12)}
body.roomstep .brb:hover{background:rgba(245,237,224,.24)}
body.roomstep .brn{color:rgba(251,243,233,.88);opacity:1}
/* the cards keep their cream — they are the thing you are choosing between, and they
   need to lift off the room */
body.roomstep .big{box-shadow:0 14px 30px -16px rgba(20,4,4,.7)}

/* ───── written once, read once ─────
   How a thing works is worth reading the first time and is clutter every time after. A
   chef who has written twenty recipes does not need to be told again what a batch is —
   he needs to see his rows. So the teaching prose folds away behind one small word and
   is still one tap from anybody who wants it.

   What does NOT belong in here: anything about THIS recipe. "3 of 30 are not done",
   "this dish is on no menu", "no cost yet" are the state of his work, not an
   explanation, and they stay on the page where he cannot miss them. */
.howto{margin:0 0 14px}
.howtob{font-family:var(--sans);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
  font-weight:700;background:none;border:none;border-bottom:1px dotted rgba(65,2,7,.4);
  color:var(--vino-light);padding:3px 0;cursor:pointer;opacity:.75;line-height:1.4}
.howtob:hover{opacity:1;border-bottom-style:solid}
.howtox{display:none;margin-top:9px;background:var(--sabbia-light);border-left:3px solid var(--sabbia-dark);
  border-radius:0 5px 5px 0;padding:10px 13px;font-size:12.5px;line-height:1.6;color:var(--vino-light)}
.howtox.on{display:block}
.howtox b{color:var(--vino)}

.two{display:flex;gap:12px;flex-wrap:wrap}
.big{flex:1;min-width:230px;text-align:left;background:var(--cream);border:1.5px solid var(--sabbia-dark);border-radius:7px;padding:18px;cursor:pointer;font-family:var(--sans)}
.big:hover{border-color:var(--vino)}
.big .t{font-family:var(--serif);font-size:23px;color:var(--vino)}
.big .d{font-size:12.5px;color:var(--vino-light);margin-top:5px;line-height:1.45}

.name{width:100%;font-family:var(--serif);font-size:34px;color:var(--vino);border:none;border-bottom:2px solid var(--sabbia-dark);background:none;padding:6px 0;outline:none;margin-bottom:26px}
.name:focus{border-color:var(--vino)}
.name::placeholder{color:var(--sabbia-dark)}
.dumpbox{width:100%;border:1.5px solid var(--sabbia-dark);border-radius:7px;padding:13px 14px;font-size:16px;font-family:var(--sans);outline:none;background:#fff;resize:vertical;line-height:1.9}
.dumpbox:focus{border-color:var(--vino)}

/* live split preview */
.split{margin-top:14px;min-height:34px}
.split .lab{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--vino-light);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--cream);border:1px solid var(--sabbia-dark);border-radius:99px;padding:6px 12px;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;line-height:1.3}
.chip b{font-weight:500}
.chip .n{font-size:10.5px;color:var(--vino-light);font-variant-numeric:tabular-nums}
.chip.warn{border-color:var(--attn);background:var(--attn-soft)}
.chip.warn .n{color:var(--attn)}
.chip .fix{font-size:11px;color:var(--vino);text-decoration:underline;cursor:pointer;white-space:nowrap}
.tip{font-size:11.5px;color:var(--vino-light);line-height:1.55;margin-top:11px}
.tip b{color:var(--vino)}

.hint{background:var(--cream);border-bottom:1px solid var(--sabbia-dark);padding:10px 16px;font-size:12.5px;color:var(--vino-light);line-height:1.5}
.hint b{color:var(--vino)}

/* overflow only when the table genuinely does not fit — an overflow box would
   otherwise stop the header row sticking under the bar */
.sheetwrap{overflow:visible}
.sheetwrap.scrollx{overflow-x:auto}
table.sheet{width:100%;border-collapse:collapse;background:var(--cream)}
/* under ALL of what is pinned above it — the bar, the costing, and any message. Pinned to
   the bar alone, the column titles slid underneath the costing the moment it appeared. */
table.sheet th{position:sticky;top:calc(var(--barh,52px) + var(--costh,0px) + var(--msgh,0px));z-index:20;background:var(--sabbia-light);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--vino-light);text-align:left;padding:8px 8px;border-bottom:1.5px solid var(--vino);white-space:nowrap;font-weight:700}
table.sheet th.n{text-align:right}
table.sheet th.c{text-align:center}
/* Fixed columns and one shared baseline. Every cell's first line sits in the same
   22px band at the top of the row, so the name, the ingredient, the quantity and the
   cost all read across on a straight line. */
table.sheet{table-layout:fixed}
/* Qty holds a kilo quantity written out — "0.00035" is seven characters. It was 66px,
   which fit "0.03" and silently cut anything smaller. Sized to the widest real number
   at each font size, not to a guess; checkFit() proves it at both widths. */
col.cq{width:92px}
table.sheet td{padding:12px 8px;border-bottom:1px solid rgba(207,192,173,.65);vertical-align:top}
table.sheet th{padding:8px}
table.sheet td.w{padding-left:14px}
select.prod,input.cell,select.unit{height:22px;line-height:22px;padding-top:0;padding-bottom:0}
td.money{line-height:22px}
table.sheet tr.main:nth-of-type(odd) td{background:rgba(237,229,216,.45)}
table.sheet tr.pick td{background:var(--attn-soft)}

td.w{padding:12px 8px 12px 14px}
/* one line each, so every row is the same height — the full text is on hover, and the
   ingredient column beside it always carries the complete name anyway */
td.w .nm{display:block;font-family:var(--serif);font-size:17px;line-height:22px;color:var(--vino);
     text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.w .meta{display:block;font-family:var(--sans);font-size:10.5px;line-height:15px;height:15px;
     margin-top:2px;text-transform:none;letter-spacing:.2px;
     white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* a wrong unit is a wrong cost, so this one is never clipped */
td.w .meta.warnu{white-space:normal;overflow:visible;height:auto;line-height:14px;margin-top:3px}
td.w .one{color:var(--oliva)}
/* what the chef wrote about this line — his voice, so it is set in the serif the sheet
   writes names in, not in the sans the app talks in */
td.w .meta.note{font-family:var(--serif);font-size:13px;line-height:16px;height:auto;
  color:var(--vino-light);font-style:italic;white-space:normal}
td.w .many{color:var(--attn)}
td.w .adj{color:var(--vino-light)}
td.w .fix{color:var(--vino);text-decoration:underline;cursor:pointer}

select.prod{width:100%;min-width:150px;border:none;background:transparent;font-family:var(--sans);font-size:13.5px;color:var(--ink);padding:11px 6px;outline:none;cursor:pointer;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--vino-light) 50%),linear-gradient(135deg,var(--vino-light) 50%,transparent 50%);
  background-position:calc(100% - 11px) calc(50% + 1px),calc(100% - 7px) calc(50% + 1px);background-size:4px 4px,4px 4px;background-repeat:no-repeat;padding-right:22px}
select.prod:focus{background-color:#fff;box-shadow:inset 0 0 0 2px var(--vino)}
select.prod.empty{color:var(--attn);font-weight:600}
select.prod option{color:var(--ink);font-weight:400}
select.prod optgroup{color:var(--vino-light);font-weight:700}

input.cell{width:100%;border:none;background:transparent;font-family:var(--sans);font-size:15px;padding:11px 7px;outline:none;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
input.cell:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--vino)}
input.cell::placeholder{color:var(--sabbia-dark)}
/* The unit was invisible, and the reason was arithmetic, not colour: box-sizing is
   border-box, the control height is 22px to line the columns up, and this rule used to
   re-add 11px of padding top AND bottom. 22 − 11 − 11 = a content box zero pixels high.
   The letters were being rendered into nothing. That is why the only way to find out
   whether a line was in grams or kilos was to open the dropdown and look at which row
   was highlighted. Vertical padding stays at zero — line 91 sets it that way for every
   control in the sheet for exactly this reason, and the shorthand here was overriding it.

   It also now looks like something you can change: a caret, and the same ink as the
   number it belongs to. */
/* the unit you can actually read: real text, with the caret that says it can be changed */
.unbx{position:relative;display:inline-flex;align-items:center;gap:3px;min-width:44px;height:22px;
  padding:0 3px;border-radius:3px;cursor:pointer}
.unbx:hover,.unbx:focus-within{background:rgba(232,217,199,.75)}
.unbx.none .unv{opacity:.45}
.unbx:focus-within{box-shadow:inset 0 0 0 2px var(--vino)}
.unbx .unv{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--vino);line-height:22px;
  white-space:nowrap}
.unbx::after{content:'';width:7px;height:5px;flex:0 0 auto;background:var(--vino);opacity:.45;
  clip-path:polygon(0 0,100% 0,50% 100%)}
/* the real control, still there and still doing the work — just not the thing you read */
select.unit{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:none;margin:0;padding:0;
  cursor:pointer;-webkit-appearance:none;appearance:none;font-size:16px}
table.sheet td.un,table.sheet th.un{padding-left:2px}
select.unit:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--vino)}
td.money{padding:12px 10px;text-align:right;font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
td.money.zero{color:var(--sabbia-dark)}
td.x{padding-top:12px}
button.rm{background:none;border:none;color:var(--sabbia-dark);font-size:17px;cursor:pointer;padding:6px}
button.rm:hover{color:var(--vino-light)}

/* ───── moving a line up or down ─────
   Antonio's: the order the sheet is written in is the order it is cooked in, and a
   chef reads a recipe faster when the first thing on the list is the first thing in
   the pan. Two arrows, stacked so the pair costs one column and not two — and next
   to the ×, because they are the three things you do TO a line rather than on it.
   Not drag-and-drop: the sheet re-lays itself into a flex row below 1024px, and a
   drag on a row that is three lines tall on a phone has nothing honest to grab. */
td.mv{padding-top:10px;text-align:center}
.mvb{display:flex;flex-direction:column;gap:1px;align-items:center}
button.mvu{background:none;border:none;color:var(--sabbia-dark);cursor:pointer;
  font-size:10px;line-height:1;padding:3px 5px;border-radius:4px}
button.mvu:hover:not(:disabled){color:var(--vino);background:rgba(43,1,4,.06)}
/* Greyed and unclickable at the ends of the list, never hidden — a control that
   disappears reads as a bug, and the title says which end it has reached. */
button.mvu:disabled{opacity:.22;cursor:default}

td.tk{text-align:center;padding-top:12px}
label.tick{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:1.5px solid var(--sabbia-dark);border-radius:4px;cursor:pointer;background:#fff}
label.tick input{display:none}
label.tick:after{content:'';font-size:13px;line-height:1}
label.tick.on{background:var(--vino);border-color:var(--vino)}
label.tick.on:after{content:'✓';color:var(--cream)}

/* Yield and waste, on the row. Two small boxes in the Trim column itself, so ticking
   never opens a panel underneath and the sheet never jumps under a chef's thumb. */
.inl{display:flex;gap:5px;justify-content:center;margin-top:7px}
.inl .p{display:flex;align-items:center;border:1px solid var(--sabbia-dark);border-radius:5px;background:#fff;overflow:hidden}
.inl .p .l{font-size:9px;letter-spacing:1px;font-weight:700;color:var(--vino-light);padding-left:6px}
.inl .p input{width:38px;border:none;background:transparent;padding:6px 2px;font-size:14px;text-align:right;outline:none;
  font-family:var(--sans);font-variant-numeric:tabular-nums;color:var(--ink);height:auto;line-height:normal}
.inl .p input:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--vino)}
.inl .p .pc{padding:0 5px 0 1px;color:var(--vino-light);font-size:11px}
/* the numbers the sheet still remembers while the tick is off — greyed, never gone */
.chip{display:block;margin-top:6px;font-size:10.5px;line-height:14px;color:var(--sabbia-dark);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.qmark{display:block;margin:5px auto 0;background:none;border:none;padding:2px;cursor:pointer;
  font-family:var(--sans);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--vino-light);
  text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--sabbia-dark)}
.qmark:hover{color:var(--vino)}

tr.drop td{background:var(--sabbia-light) !important;padding:11px 14px 13px}
.dropin{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap}
.dropin .f{display:flex;flex-direction:column;gap:4px}
.dropin label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--vino-light)}
.dropin .bx{display:flex;align-items:center;border:1px solid var(--sabbia-dark);border-radius:5px;background:#fff;overflow:hidden}
.dropin .bx input{width:66px;border:none;padding:9px 6px;font-size:16px;text-align:right;outline:none;font-family:var(--sans);font-variant-numeric:tabular-nums}
.dropin .bx .pc{padding:0 8px 0 2px;color:var(--vino-light);font-size:13px}
.dropin .exp{font-size:11.5px;color:var(--vino-light);line-height:1.5;flex:1;min-width:210px}
.dropin .exp b{color:var(--vino)}

.listhd{padding:16px 16px 13px;background:var(--cream);border-bottom:1px solid var(--sabbia-dark)}

.addb:hover{background:var(--vino-mid)}
/* one step back from an × — the row, where it was, and what was picked on it */
.undo{background:var(--cream);border:1px solid var(--sabbia-dark);border-left:3px solid var(--oro);
  border-radius:0 5px 5px 0;padding:9px 14px;margin:10px 0 0;font-size:12.5px;color:var(--vino-light)}
.undo b{color:var(--vino)}

/* Paper, not maroon. A second maroon slab stacked straight under the bar would be worse
   than what it replaced, and these are figures — they read better dark on light, which is
   the whole job of this strip. One rule and maroon numerals carry it. */
.foot{position:sticky;top:var(--barh,52px);z-index:29;background:var(--sabbia-light);color:var(--ink);
  border-bottom:2px solid var(--vino);box-shadow:0 4px 12px rgba(43,1,4,.10)}
/* Opened, it stops being pinned. He opened it to READ it, and 200px held against the top
   of the screen would eat the sheet exactly the way the old one ate it from the bottom. */
.foot:not(.shut){position:relative;top:auto;box-shadow:none}
/* shut: one slim line, so the sheet is whole */
.foot .slim{max-width:1040px;margin:0 auto;padding:0 16px;min-height:52px;display:flex;align-items:center;
  gap:20px;flex-wrap:wrap;cursor:pointer}
.foot .slim .sv{font-family:var(--serif);font-size:20px;line-height:1;white-space:nowrap;color:var(--vino)}
.foot .slim .sv small{font-family:var(--sans);font-size:9px;letter-spacing:1.6px;color:var(--vino-light);opacity:.9}
.foot .slim .sflag{font-family:var(--sans);font-size:11px;background:rgba(117,92,4,.11);color:var(--attn);
  border:1px solid rgba(117,92,4,.28);border-radius:3px;padding:5px 9px;line-height:1.3}
.foot .slim .sopenb{margin-left:auto;font-family:var(--sans);font-size:10px;letter-spacing:1.6px;
  text-transform:uppercase;color:var(--vino);font-weight:700;opacity:.9;white-space:nowrap}
.foot .slim:hover .sopenb{opacity:1;text-decoration:underline}
/* ── adding up the lines he taps ──
   Tapping an ingredient's NAME had no meaning on this sheet, so nothing was taken away
   to give it one: no button to start it, no mode to leave, no second surface. While
   anything is picked this strip stops being the costing and becomes the answer, then
   goes straight back. Nothing about a selection is ever saved — it is a question the
   chef asked once. */
/* one line, so it stays pinned like the shut costing does — `.foot:not(.shut)` drops the
   pinning for the OPEN costing, which is 200px tall and would eat the sheet. This is not.

   Paper, like the costing it replaces. A coloured slab here would be a second band of
   flat colour directly under the maroon bar, which is the thing this strip was redrawn
   to stop being. The state is already unmistakable — the rows are marked and the numbers
   have changed — so it is said with one gold rule and the word, not with a wash. */
.foot.sel{position:sticky;top:var(--barh,52px);box-shadow:0 4px 12px rgba(43,1,4,.10);
  background:var(--sabbia-light);border-bottom-color:var(--vino);box-shadow:inset 0 3px 0 var(--oro),0 4px 12px rgba(43,1,4,.10)}
.foot.sel .slim{cursor:default}
.foot.sel .slim .sv{color:var(--vino)}
.foot.sel .slim .sv small{color:var(--vino-light);opacity:.9}
/* the word that names the state, in the gold the sheet already uses for a badge */
.foot.sel .slim .swhat{font-family:var(--sans);font-size:11px;letter-spacing:.3px;color:var(--vino-light);
  line-height:1.4;max-width:300px}
.foot.sel .slim .swhat b{color:var(--vino)}
.foot.sel .slim .spick{font-family:var(--sans);font-size:9px;letter-spacing:1.8px;text-transform:uppercase;
  font-weight:700;color:var(--vino);background:rgba(186,155,2,.20);border:1px solid rgba(186,155,2,.55);
  border-radius:3px;padding:5px 9px;white-space:nowrap}
/* 44px at every width, not only under a media query. This is the one control that ends
   the state, a chef reaches it with a thumb, and the same button elsewhere on this sheet
   shipped at 33px for exactly as long as nobody measured it. */
.foot.sel .slim .sclr{margin-left:auto;background:rgba(65,2,7,.09);border:1px solid var(--vino);border-radius:4px;
  color:var(--vino);font-family:var(--sans);font-size:10px;letter-spacing:1.6px;text-transform:uppercase;
  font-weight:700;padding:0 16px;min-height:44px;min-width:88px;display:inline-flex;align-items:center;
  justify-content:center;cursor:pointer;white-space:nowrap}
.foot.sel .slim .sclr:hover{background:rgba(65,2,7,.18)}
@media (pointer:coarse),(max-width:640px){ .foot.sel .slim .sclr{font-size:11px;padding:0 18px} }
/* the line itself: a Vino Amarena edge and the faintest wash of it. The name is NOT
   recoloured — it is already the maroon this sheet is written in, and tinting it olive
   made a picked line read as a different KIND of line rather than the same line, chosen. */
table.sheet tr.main.sel td{background:rgba(65,2,7,.055)}
table.sheet tr.main.sel td:first-child{box-shadow:inset 4px 0 0 var(--vino)}
table.sheet tr.main.sel td.w .nm{font-weight:600}
/* it is tappable, and on a mouse it says so before you tap */
table.sheet td.w{cursor:pointer}
table.sheet tr.main:not(.sel):hover td.w .nm{text-decoration:underline;text-decoration-color:var(--sabbia-dark);
  text-underline-offset:3px}
/* In the flow, not pinned to the corner. Absolutely positioned it sat over a strip of
   reserved padding, and reserved padding is a guess: the moment the button grew — a
   border, bolder type, a bigger touch target — it reached past what was held for it and
   landed on "All 5 done". A button that takes its own space cannot do that at any size. */
.sshut{align-self:flex-start;margin-left:auto;background:rgba(65,2,7,.09);border:1px solid var(--vino);
  border-radius:4px;color:var(--vino);font-family:var(--sans);font-size:10px;letter-spacing:1.6px;
  text-transform:uppercase;font-weight:700;padding:10px 12px;cursor:pointer;white-space:nowrap}
.sshut:hover{background:rgba(65,2,7,.18)}
/* a thumb, not a mouse — and on a phone the open panel is 340px of an 812px screen,
   so the way out of it is the one control that must never be fiddly */
/* both, on purpose: pointer:coarse is the honest test but cannot be proved on a
   desktop at phone width, and a 33px target shipping unverified is how it stays 33px */
@media (pointer:coarse),(max-width:640px){ .sshut{padding:14px 14px;font-size:11px} .foot .slim{min-height:60px} }
/* Opened, it is a box he can see the edges of. Five figures laid straight on the paper
   read as five loose things near each other — cost, portions, price and food cost are one
   calculation and they belong inside one frame, so his eye takes the group before it takes
   any single number. Cream against the strip's sand, a maroon hairline, and a rule between
   each figure so "7.88 AED" and "1 PORTIONS" cannot be read as one column.
   No 130px held back on the right any more — nothing is floating over it to hold it for. */
.foot .in{position:relative;max-width:1040px;margin:12px auto 14px;padding:14px 16px;
  background:var(--cream);border:1.5px solid var(--vino);border-radius:8px;
  box-shadow:0 2px 8px rgba(43,1,4,.09);
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
/* width, not a side margin — a margin would have stopped it centring under the slim line
   it replaces, and the box would sit off to the left of the numbers it is framing */
.foot .in{width:calc(100% - 32px)}
@media (max-width:640px){ .foot .in{width:calc(100% - 24px);margin:10px auto 12px;padding:12px 13px} }
/* each figure in its own cell, so the group reads as a table and not as a sentence.
   The gap goes to zero because the cells carry their own padding now — left as it was,
   22px of gap PLUS 20px of padding put the rule nowhere near the middle. */
.foot .grp{column-gap:0;row-gap:14px}
.foot .grp > div{padding:0 20px;border-right:1px solid var(--sabbia-dark)}
.foot .grp > div:first-child{padding-left:0}
.foot .grp > div:last-child{padding-right:0;border-right:none}
@media (max-width:640px){
  .foot .grp{column-gap:20px}
  .foot .grp > div{border-right:none;padding:0}
}

.foot .v{font-family:var(--serif);font-size:26px;line-height:1.05;color:var(--vino)}
.foot .v small{font-family:var(--sans);font-size:10px;letter-spacing:1px;color:var(--vino-light);opacity:.9}
/* a cost that is knowably short says so on its own face, not only in a note below */
.foot .v .atleast{font-family:var(--sans);font-size:9px;letter-spacing:1.6px;text-transform:uppercase;

.foot .grp{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap}

.dropin.add{flex-wrap:wrap;align-items:flex-end}
.dcell.wide{width:190px}

.brb:hover{border-style:solid;background:rgba(232,217,199,.3)}
.brb.mic.on{border-style:solid;background:var(--vino);color:var(--cream)}
.brn{font-family:var(--sans);font-size:11.5px;opacity:.6;flex:1 1 180px}

.imp{font-family:var(--sans);font-size:12px;background:rgba(232,217,199,.4);border-left:3px solid var(--vino);border-radius:3px;padding:8px 11px;margin-top:10px;line-height:1.5}
.imp .warn{color:#8d1f1f}
.bsec{font-family:var(--sans);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border:1px solid rgba(245,237,224,.35);border-radius:3px;background:rgba(245,237,224,.1);color:var(--cream);outline:none;cursor:pointer;max-width:150px}
.bsec:hover{border-color:rgba(245,237,224,.7)}
/* The closed select is cream because it sits on the vino bar. The list that OPENS is
   drawn by the browser on white, and it inherits that cream — so every section was
   cream on white and you could only read whichever one was highlighted. Options get
   their own colour, exactly as select.prod already does. */
.bsec option{color:var(--ink);background:#fff;text-transform:none;font-size:14px;letter-spacing:0}
/* fade the closed control with colour, not opacity: opacity on a select washes out
   the open list too in some browsers, which is the same bug by another route */
.bsec.none{border-style:dashed;color:rgba(245,237,224,.65);border-color:rgba(245,237,224,.3)}
.bsec.none option{color:var(--ink)}

  box-shadow:0 6px 14px rgba(0,0,0,.18)}

.macard.run{border-color:var(--oro);border-left-width:4px}
.macard.away{background:rgba(232,217,199,.35);opacity:.75}
.matop{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.mahd{font-family:var(--serif);font-size:20px;line-height:1.15;color:var(--vino)}
.mabadge{font-family:var(--sans);font-size:9px;letter-spacing:1.2px;text-transform:uppercase;
  border-radius:2px;padding:3px 6px;background:var(--sabbia);color:var(--vino)}
.mabadge.run{background:var(--oro);color:var(--vino)}
.mabadge.off,.mabadge.away{background:rgba(64,2,7,.1);color:var(--vino-light)}
.macount{font-family:var(--sans);font-size:11.5px;opacity:.6;margin-left:auto;white-space:nowrap}
.maacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.maacts .newr{margin:0;font-size:12px;padding:8px 12px}
.matip{font-family:var(--sans);font-size:11.5px;color:var(--vino-light);align-self:center;flex:1 1 200px}
.maren{font-family:var(--sans);font-size:16px;padding:8px 10px;border:1px solid var(--sabbia-dark);
  border-radius:3px;background:#fff;color:var(--ink);outline:none;flex:1 1 200px;min-width:0}
.maask{background:rgba(232,217,199,.5);border-radius:3px;padding:11px 13px;margin-top:11px;
  font-family:var(--sans);font-size:12.5px;line-height:1.6}
.maask b{color:var(--vino)}
.maaskb{display:flex;gap:10px;flex-wrap:wrap;margin-top:11px}
.marow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;
  border:1px solid rgba(64,2,7,.12);border-radius:3px;padding:9px 13px;margin-bottom:5px}
.manm{font-family:var(--serif);font-size:17px;flex:1 1 180px;cursor:pointer;color:var(--vino)}
.manm:hover{text-decoration:underline}
.maoff{font-family:var(--sans);font-size:11.5px;background:none;border:1px solid rgba(64,2,7,.3);
  border-radius:3px;color:var(--vino);padding:7px 11px;cursor:pointer;min-height:34px}
.maoff:hover{background:rgba(232,217,199,.5)}
.micfoot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px}
/* Send sits apart from Download and Print, with a line above it: it is the one control
   on this screen that cannot be undone, and it should not read as a third button. */
.micsend{margin-top:22px;padding-top:18px;border-top:1px solid rgba(64,2,7,.16)}
.micask{background:rgba(232,217,199,.45);border:1px solid rgba(64,2,7,.22);border-radius:4px;padding:14px 16px}
.micask b{font-family:var(--sans);font-size:13.5px;color:var(--vino)}
.micaskl{font-family:var(--sans);font-size:12.5px;line-height:1.65;margin-top:7px}
.micaskw{font-family:var(--sans);font-size:12px;color:var(--attn);margin-top:7px}
.micaskb{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.micdone{background:rgba(75,81,40,.1);border:1px solid rgba(75,81,40,.35);border-radius:4px;
  padding:14px 16px;font-family:var(--sans);font-size:12.5px;line-height:1.6}
.micdone b{font-size:13.5px;color:var(--oliva)}
@media (max-width:640px){ .micnum{min-width:0;text-align:left;align-items:flex-start} .micin{width:150px} }
/* ── the requests themselves ──
   The door now opens on what has been sent, not on a form. One card per request,
   and the card says the four things anybody actually asks: which menu, how many
   dishes, who sent it, when. */
.mreq{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#fff;
  border:1px solid rgba(64,2,7,.16);border-radius:4px;padding:13px 15px;margin-bottom:9px}
.mreq.draft{background:rgba(232,217,199,.4);border-style:dashed}
.mreqnm{font-family:var(--serif);font-size:19px;color:var(--vino);flex:1 1 190px;line-height:1.2}
.mreqnm span{display:block;font-family:var(--sans);font-size:11.5px;color:var(--ink);
  opacity:.6;margin-top:3px}
.mreqpill{font-family:var(--sans);font-size:9px;letter-spacing:1.2px;text-transform:uppercase;
  border-radius:2px;padding:4px 7px;background:rgba(75,81,40,.14);color:var(--oliva);flex:0 0 auto}
.mreqpill.draft{background:rgba(64,2,7,.1);color:var(--vino-light)}
.mreqacts{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.mreqacts button{margin:0;font-size:12px;padding:8px 12px}
.mreqempty{background:rgba(232,217,199,.45);border-radius:4px;padding:16px 18px;
  font-family:var(--sans);font-size:13px;line-height:1.7}
/* the question sits inside the card it is about, full width under it — never over the
   page, and never on a card other than the one being removed */
.mreqask{flex:1 1 100%;margin-top:12px;padding-top:12px;border-top:1px solid rgba(64,2,7,.16)}
.mreqask b{font-family:var(--sans);font-size:13.5px;color:var(--vino)}
/* the toolbar over the dish list — search, and what is ticked */
.micbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 4px}
.micbar input.msrch{flex:1 1 220px;min-width:0;border:1px solid var(--sabbia-dark);border-radius:5px;
  padding:11px 13px;font-size:16px;font-family:var(--sans);background:#fff;outline:none}
.micbar input.msrch:focus{border-color:var(--vino)}
.micbar button{margin:0;font-size:12px;padding:9px 12px}
/* the family heading inside the list — the same order the sheet goes out in, so what
   is on screen and what Aung opens read the same way round */
.micfam{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  font-family:var(--serif);font-size:15px;color:var(--vino);
  border-bottom:1px solid rgba(64,2,7,.16);padding:12px 2px 5px;margin-bottom:7px}
.micfam .fc{font-family:var(--sans);font-size:10.5px;opacity:.55;letter-spacing:.5px}
.micfam button{margin:0 0 0 auto;font-size:11px;padding:5px 9px}
/* who it goes to — editable, and remembered from the last one that went */
.mrto{margin-top:11px}
.mrto label{display:block;font-family:var(--sans);font-size:10px;letter-spacing:1px;
  text-transform:uppercase;opacity:.6;margin:9px 0 3px}
.mrto input{width:100%;box-sizing:border-box;border:1px solid var(--sabbia-dark);border-radius:4px;
  padding:10px 11px;font-family:var(--sans);font-size:14px;background:#fff;color:var(--ink);outline:none}
.mrto input:focus{border-color:var(--vino)}
/* reviewing one that has gone — a table, not a form: nothing here can be changed */
.mrsnap{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:12.5px;margin-top:6px;
  background:#fff}
.mrsnap th{background:var(--vino);color:var(--cream);font-size:9.5px;letter-spacing:.8px;
  text-transform:uppercase;padding:7px 9px;text-align:left;font-weight:600}
.mrsnap td{padding:7px 9px;border-bottom:1px solid rgba(64,2,7,.1);vertical-align:top}
.mrsnap td.n{text-align:right;font-family:var(--serif);font-size:14px}
.mrsnap tr.fam td{background:var(--sabbia);color:var(--vino);font-family:var(--serif);font-size:14px}
.mrsnap .till{font-family:ui-monospace,Consolas,monospace}
.mrwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid rgba(64,2,7,.14);
  border-radius:4px}
/* the admin fold — apart from the requests, under a line, and never the first thing read */
.mradm{margin-top:26px;padding-top:16px;border-top:1px solid rgba(64,2,7,.16)}
.mradmb{font-family:var(--sans);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
  font-weight:700;background:none;border:none;border-bottom:1px dotted rgba(65,2,7,.4);
  color:var(--vino-light);padding:3px 0;cursor:pointer;opacity:.75;line-height:1.4;min-height:34px}
.mradmb:hover{opacity:1;border-bottom-style:solid}
.mradmx{background:rgba(232,217,199,.45);border:1px solid rgba(64,2,7,.18);border-radius:4px;
  padding:14px 16px;margin-top:10px}
/* what this send is doing differently — said where the send is, not in a tooltip */
.mroneoff{font-family:var(--sans);font-size:12px;line-height:1.6;color:var(--vino);
  background:rgba(196,154,60,.18);border-radius:3px;padding:8px 10px;margin-top:9px}
.sfind{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 2px}
.sfind input{flex:1 1 240px;min-width:0;border:1px solid var(--sabbia-dark);border-radius:5px;
  padding:11px 13px;font-size:16px;font-family:var(--sans);background:#fff;outline:none}
.sfind input:focus{border-color:var(--vino)}
.sclr{font-family:var(--sans);font-size:12px;background:none;border:1px solid rgba(64,2,7,.3);
  border-radius:4px;color:var(--vino);padding:9px 12px;cursor:pointer;flex:0 0 auto}
.sclr:hover{background:rgba(232,217,199,.4)}
.scount{font-family:var(--sans);font-size:12px;opacity:.55;flex:0 0 auto}
.shd{font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.55;margin:18px 0 6px}
/* Cream, not white. Pure white is not a colour this app owns — the page is sand, the
   sheet is cream, and a row of white cards cut through both. Hover now goes the other
   way, cream up to white, so the row he is on is the lightest thing on the screen
   instead of the darkest. */
.srow{display:flex;align-items:baseline;gap:12px;width:100%;background:var(--cream);
  border:1px solid rgba(64,2,7,.14);border-radius:6px;padding:9px 14px;margin-bottom:6px}
.srow:hover{border-color:rgba(64,2,7,.45);background:#fdfaf5}
.srow.on{border-color:var(--vino);background:#fff}
.srow.gone{opacity:.65;background:rgba(232,217,199,.2)}
.sopen{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;flex:1 1 auto;text-align:left;background:none;border:none;padding:6px 0;cursor:pointer;font:inherit;color:inherit}
/* the dish is what he is looking for, so it is the loudest thing on its row. It was
   losing to a filled grey band that was wider than it and sat in the middle of the row. */
.srow .sn{font-family:var(--serif);font-size:21px;line-height:1.15;color:var(--ink);flex:0 0 auto}
.srow .sm{font-family:var(--sans);font-size:11.5px;opacity:.55;flex:1 1 auto}
.srow .sd{font-family:var(--sans);font-size:11px;opacity:.45;flex:0 0 auto}

/* ───── the three marks ───── */
.srow .mks{display:flex;gap:4px;flex:0 0 auto}
/* each mark is a button — it says what is missing and it is the way to go and write it */
.mk{font-family:var(--sans);font-size:8.5px;letter-spacing:.9px;text-transform:uppercase;font-weight:700;
  padding:5px 8px;border-radius:3px;white-space:nowrap;cursor:pointer;
  background:var(--sabbia-light);border:1px solid var(--sabbia-dark);color:var(--vino-light);opacity:.5}
.mk:hover,.mk:focus{opacity:1;border-color:var(--vino);color:var(--vino);outline:none}
.mk.on{background:rgba(75,81,40,.15);border-color:var(--oliva);color:var(--oliva);opacity:1}
.mk.on:hover,.mk.on:focus{border-color:var(--oliva);color:var(--oliva);background:rgba(75,81,40,.28)}
@media (pointer:coarse){ .mk{padding:9px 10px;font-size:9.5px} }
/* where he landed, said out loud for a moment — a page that only moves leaves him
   hunting for what changed */
@keyframes jumped{ 0%{box-shadow:0 0 0 3px rgba(186,155,2,.55)} 100%{box-shadow:0 0 0 3px rgba(186,155,2,0)} }
.jumped{animation:jumped 1.8s ease-out 1;border-radius:6px}
/* the same three colours in the folder line as on the rows underneath it */
.crumb .ss{font-weight:700}
.crumb .ss.done{color:var(--oliva)}
.crumb .ss.part{color:#6b5a02}
.crumb .ss.empty{color:var(--vino-light);opacity:.7}
/* a colour down the edge, so the eye sorts before it reads */
.srow{border-left:3px solid transparent}
.srow.lv-done{border-left-color:var(--oliva)}
.srow.lv-part{border-left-color:var(--oro)}
.srow.lv-empty{border-left-color:var(--sabbia-dark)}
/* what still needs him, on the row — never a colour on its own, always the words */
.srow .swk{font-family:var(--sans);font-size:11px;color:var(--vino);background:rgba(186,155,2,.16);
  border-radius:3px;padding:2px 7px;flex:0 0 auto;white-space:nowrap}
.srow .swk.soft{background:rgba(207,192,173,.5);opacity:.85}
.newr.wrn{border-color:var(--vino);color:var(--vino);font-weight:600}
/* the dish he already has open, offered before the two doors that take it off the screen */
.holdon{background:var(--cream);border:1px solid var(--sabbia-dark);border-left:3px solid var(--oro);
  border-radius:0 7px 7px 0;padding:13px 15px;margin:0 0 16px}
.holdt{font-size:14px;line-height:1.5;color:var(--ink);margin-bottom:10px}
.holdt b{font-family:var(--serif);font-size:19px;color:var(--vino)}
.holdw{font-size:12px;line-height:1.5;color:var(--vino-light);margin-top:9px}
.holdw b{color:var(--vino)}
/* how the method reads — a count, and the steps it found, under the box */
.stepwrap{margin-top:6px}
.stepn{font-size:11.5px;line-height:1.55;color:var(--vino-light)}
.stepn b{color:var(--vino)}
.steplist{margin:7px 0 0;padding:0 0 0 22px}
.steplist li{margin:0 0 3px;line-height:1.5;color:var(--ink);opacity:.8}
.steplist li::marker{color:var(--vino);font-weight:700}
.stepb{display:inline-block;margin:7px 8px 0 0;font-family:var(--sans);font-size:11px;
  letter-spacing:.4px;background:rgba(65,2,7,.08);border:1px solid var(--vino);border-radius:4px;
  color:var(--vino);padding:7px 11px;cursor:pointer;font-weight:600}
.stepb:hover{background:rgba(65,2,7,.16)}
.stepw{font-size:11px;color:var(--vino-light);opacity:.8}
@media (pointer:coarse){ .stepb{padding:10px 13px;font-size:12px} }

/* ───── writing help ─────
   Deliberately the same furniture as the step note above: it sits in the same
   place, in the same small type, and it is empty almost always. A box with
   nothing wrong in it shows nothing at all — the app pushes, it does not nag.
   The correction IS the button, so accepting one costs a tap and not a hunt. */
.whwrap:empty{display:none}
/* A finding is the state of HIS OWN WORK, so unlike the teaching text on this
   sheet it stays on screen and is allowed to look like something. It was small
   grey type at first and read as another hint — Francesco opened a recipe with
   a known error in it and genuinely could not tell anything had happened. */
.whwrap{margin-top:9px;background:var(--cream);border:1px solid var(--sabbia-dark);
  border-left:3px solid var(--vino);border-radius:0 6px 6px 0;padding:11px 13px}
.whn{font-size:13px;line-height:1.5;color:var(--vino);margin-bottom:8px}
.whn b{font-family:var(--serif);font-size:15px}
.whrow{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin:0 0 5px}
.whwas{font-size:12.5px;color:var(--vino-light);text-decoration:line-through;opacity:.75}
.wharr{font-size:12px;color:var(--sabbia-dark)}
/* big enough to hit with a thumb over a hot pass, and it says the word itself
   rather than "Apply" — reading the button IS reading the correction */
.whfix{font-family:var(--sans);font-size:13px;font-weight:700;background:rgba(65,2,7,.09);
  border:1px solid rgba(65,2,7,.28);border-radius:4px;color:var(--vino);
  padding:7px 12px;cursor:pointer;line-height:1.2}
.whfix:hover{background:rgba(65,2,7,.17)}
.whall{font-family:var(--sans);font-size:12px;background:var(--vino);border:none;border-radius:4px;
  color:var(--cream);padding:8px 14px;cursor:pointer;margin:2px 8px 0 0;font-weight:700}
.whskip{font-family:var(--sans);font-size:11.5px;background:none;border:none;
  color:var(--vino-light);text-decoration:underline;cursor:pointer;padding:6px 2px;opacity:.85}
/* a word nobody knows is a QUESTION — never styled as a correction, because a
   wrong question costs one tap and a wrong fix costs the printed binder */
.whask{background:var(--sabbia-light);border-left:3px solid var(--oro);border-radius:0 5px 5px 0;
  padding:10px 12px;margin:6px 0 4px}
.whask .whq{font-size:12.5px;color:var(--vino);line-height:1.5;margin-bottom:8px}
.whask .whq b{font-family:var(--serif);font-size:15px}
.whask .whwhy{font-size:11.5px;color:var(--vino-light);line-height:1.5;margin:-3px 0 8px;opacity:.9}
.whacts{display:flex;flex-wrap:wrap;gap:7px}
.whacts button{font-family:var(--sans);font-size:12px;border-radius:4px;cursor:pointer;padding:8px 12px}
.whyes{background:var(--vino);border:none;color:var(--cream);font-weight:700}
.whno{background:none;border:1px solid var(--sabbia-dark);color:var(--vino-light)}
.whbusy{font-size:11.5px;color:var(--vino-light);opacity:.75;font-style:italic}

/* ───── the story helper ─────
   A button he presses, not a note that appears — he should always know whether
   the app noticed something or he asked for something. His words stay on the
   left and are never replaced until he taps Use this. */
.whsb{font-family:var(--sans);font-size:12px;background:none;border:1px dashed rgba(64,2,7,.35);
  border-radius:4px;color:var(--vino);padding:8px 13px;cursor:pointer;margin-top:7px}
.whsb:disabled{opacity:.55;cursor:default}
.whsp{background:var(--cream);border:1px solid var(--sabbia-dark);border-left:3px solid var(--vino);
  border-radius:0 6px 6px 0;padding:13px 14px;margin-top:9px}
.whsp .wht{font-family:var(--serif);font-size:15.5px;color:var(--ink);line-height:1.6}
.whsp .whu{font-size:11.5px;color:var(--vino-light);line-height:1.6;margin-top:9px;opacity:.9}
.whsp .whu b{color:var(--vino)}
.whsp .whm{background:var(--sabbia-light);border-radius:5px;padding:9px 11px;margin-top:10px;
  font-size:12px;color:var(--vino);line-height:1.6}
.whsp .whm b{font-family:var(--serif);font-size:13.5px}
/* Measured at 375px, not guessed: at 11px padding the correction button came out
   40px tall, under the 44px a thumb reliably hits — and this one is tapped with a
   wet hand next to a hot pass. */
@media (pointer:coarse){
  .whfix{padding:14px 16px;font-size:14px}
  .whacts button,.whall{padding:14px 16px;font-size:13px}
  .whsb{padding:14px 16px;font-size:13px}
  .whskip{padding:12px 4px}
}
/* the one screen for everything half done */
/* same family as .srow, so it takes the same ground — two lists of recipes that sit on
   different colours read as two different apps */
.trow{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;width:100%;background:var(--cream);
  border:1px solid rgba(64,2,7,.14);border-left:3px solid var(--sabbia-dark);border-radius:0 6px 6px 0;
  padding:10px 13px;margin-bottom:6px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.trow:hover{border-color:var(--vino);border-left-color:var(--vino);background:#fdfaf5}
.trow.hard{border-left-color:var(--vino)}
/* A dish nobody has started is not a broken recipe — it is an empty page. It reads
   quieter than the rows above it on purpose: those are dishes going out tonight with
   something missing, and these have not been begun. Same row, less ink. */
.trow.ns{border-left-style:dotted;border-left-color:rgba(64,2,7,.35);background:transparent}
.trow.ns:hover{background:#fdfaf5}
.trow.ns .tn{color:var(--vino-light)}
/* ── how far the menu is ──
   Above the heading because it is the answer to the question the screen gets opened
   with. One bar, three states, and the numbers written out underneath — a bar nobody
   can read a figure off is decoration. */
.mprog{margin:0 0 22px}
.mpn{font-family:var(--sans);font-size:13px;color:var(--vino-light);margin-bottom:7px}
.mpn b{font-family:var(--serif);font-size:20px;color:var(--vino);letter-spacing:.5px}
.mpbar{display:flex;height:10px;background:var(--sabbia);border:1px solid rgba(64,2,7,.14);
  border-radius:2px;overflow:hidden}
.mpbar i{display:block;height:100%}
.mpk{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:7px;
  font-family:var(--sans);font-size:11.5px;opacity:.7}
.mpk span{display:flex;align-items:center;gap:6px}
.mpk i{width:9px;height:9px;border-radius:2px;display:block;flex:0 0 auto;
  border:1px solid rgba(64,2,7,.14)}
.p-ok{background:var(--vino)}
.p-part{background:rgba(186,155,2,.55)}
.p-none{background:transparent}
.nsnote{font-family:var(--sans);font-size:12px;opacity:.6;margin:0 0 10px}
.nssec{font-family:var(--sans);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  opacity:.45;margin:14px 0 5px}
/* It must be allowed to SHRINK. A recipe somebody typed is "Polpo" and fits; a dish
   read off the printed menu is "Rombo sul Sale Aromatico, Asparagi e Salsa Ristretta
   alla Mediterranea", which at 0 0 auto is 503px of unbreakable row on a 375px phone —
   the whole page scrolled sideways, not just this line. min-width:0 is the half that
   actually does it: without it a flex item refuses to go below its content. */
.trow .tn{font-family:var(--serif);font-size:18px;color:var(--vino);
  flex:0 1 auto;min-width:0;overflow-wrap:break-word}
.trow .tk{font-family:var(--sans);font-size:11.5px;opacity:.55;flex:1 1 auto}
.trow .ti{flex:1 0 100%;display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.trow .ti em{font-style:normal;font-family:var(--sans);font-size:11px;padding:2px 7px;border-radius:3px;
  background:rgba(207,192,173,.5);color:var(--vino-light)}
.trow .ti em.h{background:rgba(186,155,2,.2);color:var(--vino);font-weight:600}
/* one that goes somewhere says so — 44px high so it can be hit with a thumb, and an
   underline so it does not just look like a label that happens to be tappable */
.trow .ti em.go{cursor:pointer;text-decoration:underline;text-underline-offset:2px;
  text-decoration-color:rgba(64,2,7,.3);min-height:44px;display:inline-flex;align-items:center}
.trow .ti em.go:hover{background:var(--vino);color:var(--cream);text-decoration-color:transparent}
/* .srow does not wrap, so a 100% basis inside it pushes the row past the screen
   instead of dropping to a second line — it has to be told it may wrap first */
@media(max-width:640px){
  .srow{flex-wrap:wrap}
  .srow .swk{flex:1 0 100%;white-space:normal;order:5}
  /* the marks drop to their own line rather than pushing the row off the screen —
     a row you have to drag sideways to read is a row nobody reads */
  .srow .mks{order:4;flex:1 0 100%;margin-top:2px}
  .srow .sd{order:6}
  .srow .srm{order:7;margin-left:auto}
}
.srm{font-family:var(--sans);font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:none;border:none;color:var(--vino);opacity:.45;cursor:pointer;padding:6px 2px;flex:0 0 auto}
/* Quiet means low contrast, never unlabelled. It is the one control on this screen that
   takes a recipe away, so the word stays on it at every size — it just stops carrying the
   same weight as the dish's own name. Hover does not exist on the pass screen or a phone,
   so it is legible sitting still and only firms up when he goes near it or tabs to it. */
.srm.quiet{font-size:10px;opacity:.4;padding:8px 6px;color:var(--vino-light)}
.srow:hover .srm.quiet{opacity:.8}
.srm.quiet:hover,.srm.quiet:focus{opacity:1;color:var(--vino);text-decoration:underline}
/* measured, not guessed — the pass screen is a thumb */
@media (pointer:coarse){ .srm.quiet{opacity:.6;font-size:11px;padding:13px 10px} }
.srm:hover{opacity:1;text-decoration:underline}
/* a folder — a menu, or a section inside one. A shelf, not a column: the whole book
   is a couple of bands you look at rather than ten lines you scroll past. The vino
   spine says it is live; a folder that has been put away loses it. */
.folds{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:8px;margin-bottom:6px}
.fold{display:flex;align-items:center;gap:11px;background:var(--cream);border:1px solid var(--sabbia-dark);
  border-left:3px solid var(--vino);border-radius:0 5px 5px 0;padding:12px 13px;min-height:52px;
  box-sizing:border-box;text-align:left;cursor:pointer;font:inherit;color:inherit;transition:background .12s}
.fold:hover{background:#fff;border-left-color:var(--oro)}
.fold .ft{flex:1 1 auto;min-width:0}
.fold .fn{display:block;font-family:var(--serif);font-size:19px;color:var(--vino);line-height:1.15;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold .fm{display:block;font-family:var(--sans);font-size:10px;color:var(--vino-light);opacity:.65;
  margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold .fc{flex:0 0 auto;width:27px;height:27px;border-radius:50%;background:var(--vino);color:var(--cream);
  display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:12px;
  font-weight:600;font-variant-numeric:tabular-nums}
.fold.dim{border-left-color:var(--sabbia-dark)}
.fold.dim .fc{background:var(--sabbia-dark);color:var(--vino)}
.fold.dim .fn{opacity:.65}
.crumb{font-family:var(--sans);font-size:12px;opacity:.6;margin:16px 0 8px}
/* everything half written, in one place, on the screen a new recipe starts from */
.parked{background:var(--cream);border:1px solid var(--sabbia-dark);border-left:3px solid var(--oliva);
  border-radius:0 5px 5px 0;padding:11px 14px 6px;margin:0 0 18px;color:var(--vino-light)}
.parked .ph{font-family:var(--sans);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--vino);opacity:.7;margin-bottom:7px}
.parked .prow{display:flex;flex-wrap:wrap;align-items:baseline;gap:5px 12px;padding:7px 0;
  border-top:1px solid rgba(207,192,173,.7)}
.parked .prow:first-of-type{border-top:none}
.parked .pn{font-family:var(--serif);font-size:17px;color:var(--vino);flex:0 0 auto}
.parked .pm{font-family:var(--sans);font-size:11.5px;opacity:.6;flex:1 1 auto}
.parked .lnk{font-size:12.5px;flex:0 0 auto}
.parked .lnk.bin{opacity:.6}
.parked .lnk.bin:hover{opacity:1;color:var(--vino-mid)}
/* a batch Aung prices but nobody has written — the answer, and the way out of it */
.offer{background:var(--cream);border:1px solid var(--sabbia-dark);border-left:3px solid var(--oro);
  border-radius:0 5px 5px 0;padding:14px 16px;margin:0 0 14px;font-size:13px;line-height:1.55;color:var(--vino-light)}
.offer b{color:var(--vino);font-weight:600}
.offer .maacts{margin-top:11px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.offer .offmeta{font-size:11.5px;opacity:.6;margin-right:8px}
.offer .offalt{margin-top:11px;font-size:12px;opacity:.8}
.lnk{background:none;border:none;padding:0;font:inherit;color:var(--vino);
  text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.lnk:hover{text-decoration-thickness:2px}
@media(max-width:520px){.folds{grid-template-columns:1fr}}
.newr{font-family:var(--sans);font-size:13px;background:none;border:1px dashed rgba(64,2,7,.35);border-radius:3px;color:var(--vino);padding:9px 14px;margin:14px 0 4px;cursor:pointer}
.newr:hover{border-style:solid;background:rgba(232,217,199,.3)}

/* ───── a whole workbook in one confirm ─────
   Everything the file holds, in the order it will be built, before a single row is
   written. Numbered from 1 so the order is the point: the batches first, the dish last. */
/* ───── not saved ─────
   A strip on the sheet, never a dialog. When he tries to leave it becomes the
   question, in place, with the work still in front of him. */
.savebar:empty{display:none}
.sb1{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--attn-soft);
  border:1px solid var(--attn);border-radius:6px;padding:10px 13px;margin:0 0 10px}
.sb1.ask{background:rgba(122,18,24,.09);border-color:var(--vino)}
.sbt{flex:1 1 240px;font-size:13px;line-height:1.5;color:var(--ink);min-width:0}
.sbt b{color:var(--vino)}
.sbwhy{font-size:12.5px;color:var(--attn);line-height:1.5;margin:-4px 0 10px;padding:0 2px}

/* ───── who wrote it ─────
   A fact about the recipe, so it sits on the sheet with the other facts and is asked
   the same way everything else here is asked — in place, never in a dialog. The names
   open UNDER the strip rather than over the sheet, so the work stays visible while
   somebody picks. Every target is 44px so it can be hit with a wet thumb. */
.whobar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;
  border:1px solid rgba(64,2,7,.14);border-radius:6px;padding:9px 13px;margin:0 0 10px}
.whobar.ask{background:var(--attn-soft);border-color:var(--attn)}
.whobar .wl{font-family:var(--sans);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--vino-light);font-weight:700;flex:0 0 auto}
.whobar .wn{font-family:var(--serif);font-size:20px;color:var(--vino);line-height:1.1;flex:1 1 auto;min-width:0}
.whobar .wn i{font-family:var(--sans);font-size:12.5px;font-style:normal;color:var(--attn)}
.whobar .wch{font-family:var(--sans);font-size:12px;color:var(--vino);background:none;border:none;
  border-bottom:1px solid rgba(64,2,7,.35);cursor:pointer;padding:0;min-height:44px;flex:0 0 auto}
.whobar .wed{flex:1 0 100%;font-family:var(--sans);font-size:11.5px;opacity:.55;margin-top:-4px}
.wholist{flex:1 0 100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:6px;margin-top:4px;max-height:46vh;overflow:auto}
.wholist button{font-family:var(--sans);font-size:13.5px;text-align:left;padding:10px 12px;min-height:44px;
  border:1px solid var(--sabbia-dark);border-radius:4px;background:#fff;color:var(--ink);cursor:pointer;line-height:1.3}
.wholist button:hover{border-color:var(--vino)}
.wholist button span{display:block;font-size:10.5px;opacity:.55;margin-top:2px}
.wholist .wsay{font-size:12.5px;opacity:.6;padding:8px 2px;grid-column:1/-1}

.pnote2{background:var(--sabbia-light);border:1px solid var(--sabbia-dark);border-radius:6px;
  padding:11px 13px;font-size:13px;line-height:1.55;color:var(--vino-light);margin:0 0 14px}
.pnote2 b{color:var(--vino)}
.okline{background:rgba(75,81,40,.14);border:1px solid rgba(75,81,40,.45);border-radius:6px;
  padding:11px 13px;font-size:13px;line-height:1.55;color:var(--ink);margin:0 0 14px}
.okline b{color:var(--oliva)}
.plist{margin-top:18px}
.pcard{border:1px solid var(--sabbia-dark);border-left:3px solid var(--sabbia-dark);border-radius:6px;
  background:var(--cream);padding:12px 14px;margin-bottom:9px}
.pcard.bad{border-left-color:var(--attn);background:var(--attn-soft)}
/* a card that has landed is the way into itself */
.pclick{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;
  border-left-color:var(--oliva)}
.pclick:hover{background:#fff;border-color:var(--vino);border-left-color:var(--vino)}
.pgo{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.06em;color:var(--vino);
  opacity:.55;margin-top:8px}
.pclick:hover .pgo{opacity:1;text-decoration:underline;text-underline-offset:3px}
.ph1{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pnum{flex:0 0 auto;width:24px;height:24px;border-radius:99px;background:var(--vino);color:var(--cream);
  font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.pnm{font-family:var(--serif);font-size:20px;color:var(--vino);line-height:1.15;min-width:0;word-break:break-word}
.pkind{font-size:8.5px;letter-spacing:1.4px;text-transform:uppercase;background:var(--sabbia-dark);
  color:var(--ink);border-radius:2px;padding:3px 7px;white-space:nowrap}
.pkind.b{background:var(--oro)}
.pl{font-size:11.5px;color:var(--vino-light)}
.pl.ok{color:var(--oliva);font-weight:700}
.pl.bad{color:var(--attn);font-weight:700}
.pl.was{color:var(--vino-light)}
.pmeta{font-size:12px;color:var(--vino-light);margin-top:5px;line-height:1.5}
.pmeta b{color:var(--attn)}
.plinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.plink{font-size:11.5px;background:var(--sabbia-light);border:1px solid var(--sabbia-dark);
  border-radius:99px;padding:4px 10px;line-height:1.4}
.plink b{color:var(--oliva)}
.pwhy{font-size:12px;color:var(--attn);margin-top:7px;line-height:1.5}
.pfix{font-size:12px;color:var(--oliva);margin-top:7px;line-height:1.5}
.pfix b{color:var(--vino)}

/* ───── how it is made ─────
   Same sheet, straight under the ingredients. The boxes have no scrollbar of their
   own and no drag handle — they grow to whatever is written in them, so a method is
   read whole on the pass instead of two lines at a time through a letterbox. */
/* which menus a dish is on — the box above the allergens, because it decides whether
   anybody can find the dish at all */
.mnu{padding:24px 16px 22px;background:var(--sabbia-light);border-top:1.5px solid var(--sabbia-dark)}
.mchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.mchip{display:inline-flex;align-items:center;gap:7px;font-family:var(--sans);font-size:13.5px;
  background:#fff;border:1px solid var(--sabbia-dark);border-radius:4px;color:var(--vino);
  padding:11px 14px;min-height:44px;cursor:pointer;text-align:left}
.mchip:hover{border-color:var(--vino)}
.mchip.on{background:var(--vino);border-color:var(--vino);color:var(--cream);font-weight:600}
.mrun{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;background:var(--oro);color:#2a1a10;
  border-radius:2px;padding:2px 6px}
.moff{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;opacity:.55}
.mnew{display:flex;flex-wrap:wrap;align-items:center;gap:9px}
.mnew input{flex:1 1 220px;min-width:0;border:1px solid var(--sabbia-dark);border-radius:5px;
  padding:11px 13px;font-size:16px;font-family:var(--sans);background:#fff;outline:none}
.mnew input:focus{border-color:var(--vino)}
.msub.bad{color:#8d1f1f}
.alg{padding:24px 16px 22px;background:var(--cream);border-top:1.5px solid var(--sabbia-dark)}
.achips{display:flex;flex-wrap:wrap;gap:8px}
.ach{font-family:var(--sans);font-size:13.5px;line-height:1.2;background:#fff;color:var(--ink);
  border:1.5px solid var(--sabbia-dark);border-radius:99px;padding:9px 15px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;min-height:40px}
.ach:hover{border-color:var(--vino)}
.ach.on{background:var(--vino);border-color:var(--vino);color:var(--cream);font-weight:600}
/* brought in by a batch: it is already true of this dish, so it reads as ticked-by-something-else
   rather than as an empty box he forgot */
.ach.via{border-color:var(--oliva);border-style:dashed;background:rgba(75,81,40,.08)}
.ach.on.via{background:var(--vino);border-style:solid}
.avia{font-size:10px;letter-spacing:.2px;color:var(--oliva);white-space:nowrap}
.acon{margin-top:14px;font-size:14px;line-height:1.6;color:var(--ink);background:var(--sabbia-light);
  border:1px solid var(--sabbia-dark);border-radius:6px;padding:11px 13px}
.acon b{color:var(--vino);letter-spacing:.4px}
.acon.none{color:var(--vino-light);font-size:13px}
.asrc{font-size:11.5px;color:var(--oliva)}
.aitem{display:inline-block}
.adot{color:var(--sabbia-dark);margin:0 8px}

.mth{padding:24px 16px 30px;background:var(--cream);border-top:1.5px solid var(--sabbia-dark)}
.mhd{font-family:var(--serif);font-size:23px;color:var(--vino);line-height:1.15}
.mhd.ph2{margin-top:30px;padding-top:22px;border-top:1px solid var(--sabbia-dark)}
.msub{font-size:12.5px;color:var(--vino-light);line-height:1.5;margin:4px 0 16px}
.msec{margin-bottom:16px}
.ml{display:block;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--vino-light);font-weight:700;margin-bottom:6px}
.mbox{display:block;width:100%;min-height:44px;border:1.5px solid var(--sabbia-dark);border-radius:6px;
  background:#fff;padding:11px 12px;font-family:var(--sans);font-size:15px;line-height:1.65;color:var(--ink);
  outline:none;resize:none;overflow:auto}
/* auto, not hidden. grow() sizes every box to what is written in it, so no scrollbar
   ever appears — but if it were ever wrong, hidden would CUT the last steps of a
   method with nothing on screen to say so. A scrollbar is ugly; losing the last two
   steps of a plating method at the pass is dangerous. */
.mbox:focus{border-color:var(--vino)}
.mbox::placeholder{color:var(--sabbia-dark)}

/* ── inside the Recipes module ──
   The module owns "which dish" and "which view", so this page drops its own way back
   to the recipe list. Everything that belongs to WRITING the dish — the name, the
   section, Aung's list, Saved recipes — stays, because that is this screen's job. */
/* Back used to be hidden inside the module, on the reasoning that the module's own
   "‹ Recipes" bar owned the navigation. It does not: that bar leaves the recipe
   altogether. Going back ONE step — off Aung's list to the sheet, off the sheet to
   the ingredients — has no other control, so it belongs here in embed too. The step
   handler already refuses to move when there is nowhere to go. */
/* It does not float any more. It was pinned 18px off the bottom of the window while the
   costing bar stood 52–60px tall there, so a message could only ever land inside it —
   maroon on maroon, the two sets of writing on top of each other. It is a strip in the
   flow now, directly under the costing, taking its own space: there is no scroll position
   on any screen where it is sitting on something else.

   Charcoal, not maroon, on purpose — a thing that appears and goes away should never read
   as another piece of the furniture. */
#flashes{position:sticky;top:calc(var(--barh,52px) + var(--costh,0px));z-index:28}
.openerr{background:var(--ink);color:var(--cream);font-size:13.5px;line-height:1.5;
  padding:11px 16px;box-shadow:0 3px 10px rgba(0,0,0,.22)}
.openerr .in{max-width:1040px;margin:0 auto}
.openerr.bad{background:#7a1218}

/* ───── at the pass ───── */
.pss{padding:24px 16px 26px;background:var(--sabbia-light);border-top:1.5px solid var(--sabbia-dark)}
.prow{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px}
.pcell{flex:0 0 auto;min-width:200px}
.pcell.wide{flex:1 1 260px}
.punit{display:flex;align-items:baseline;gap:8px}
.punit span{font-size:12px;color:var(--vino-light)}
.pnum{font-family:var(--serif);font-size:26px;color:var(--vino);background:#fff;
  border:1px solid var(--sabbia-dark);border-radius:6px;padding:8px 12px;width:110px;outline:none}
.pnum.wide{width:100%;font-size:18px;font-family:var(--sans)}
.pnum:focus{border-color:var(--vino)}
.pnum::placeholder{color:rgba(65,2,7,.3)}
@media (pointer:coarse){ .pnum{padding:11px 12px} }

/* ───── the floor's half of the same recipe ───── */
.foh{padding:24px 16px 30px;background:var(--cream);border-top:1.5px solid var(--sabbia-dark)}
.mcode{max-width:170px;min-height:0;text-transform:uppercase;letter-spacing:1px}
.mhint{font-size:11.5px;color:var(--vino-light);line-height:1.5;margin-top:5px}
.wc{white-space:nowrap;opacity:.85}
.wc .over{color:var(--attn);opacity:1}
/* Blank is the phase, not a fault — this is a count, in the body colour, never a warning. */
.fstate{font-size:12.5px;line-height:1.6;color:var(--vino-light);background:var(--sabbia-light);
  border:1px solid var(--sabbia-dark);border-radius:6px;padding:11px 13px;margin:6px 0 16px}
.fstate.done{color:var(--oliva,#4b5128)}
.fblk{margin-top:16px;padding-top:14px;border-top:1px solid var(--sabbia-light)}
.flab{display:block;font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--vino-light);margin-bottom:5px}
.fblk q{display:block;font-family:var(--serif);font-size:19px;line-height:1.45;color:var(--vino)}
.fprose{font-size:14px;line-height:1.7;color:var(--ink);white-space:pre-wrap}
.fprose.none{font-size:12.5px;color:var(--vino-light);font-style:italic}
.flst{margin:0;padding-left:18px;font-size:14px;line-height:1.7;color:var(--ink)}
.fcut{margin-top:14px;padding-top:12px;border-top:1px solid var(--sabbia-dark);font-size:14px;line-height:1.6}
.fcut b{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--vino-light);display:block;margin-bottom:4px}
.fcut.none{font-size:12.5px;color:var(--attn)}
.fhint{background:var(--sabbia-light);border:1px solid var(--sabbia-dark);border-radius:6px;
  padding:11px 13px;font-size:12.5px;line-height:1.55;color:var(--vino-light);margin-bottom:18px}
.fcard{background:#fff;border:1px solid var(--sabbia-dark);border-radius:8px;padding:22px 20px;max-width:620px}
.fnm{font-family:var(--serif);font-size:32px;line-height:1.1;color:var(--vino);word-break:break-word}
.fsec{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--vino-light);margin-top:6px}
.fphotos{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}
.fphotos img{width:100%;max-width:280px;height:170px;object-fit:cover;border-radius:6px;border:1px solid var(--sabbia-dark)}
.fdesc{font-size:16px;line-height:1.7;color:var(--ink);margin-top:16px;white-space:pre-wrap}
.fdesc.none{font-size:13px;color:var(--attn);background:var(--attn-soft);border-radius:6px;padding:10px 12px}
.falg{margin-top:18px;padding-top:14px;border-top:1px solid var(--sabbia-dark);font-size:14.5px;line-height:1.6}
.falg b{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--vino-light);
  display:block;margin-bottom:4px}
.falg.none{color:var(--attn)}
.falg.none b{color:var(--attn);display:inline;font-size:14.5px;letter-spacing:0;text-transform:none}
.fprice{font-family:var(--serif);font-size:26px;color:var(--vino);margin-top:16px}
.fprice small{font-family:var(--sans);font-size:10px;letter-spacing:1px;color:var(--vino-light)}

.pgrid{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px}
.ph{position:relative;flex:1 1 150px;max-width:220px;margin:0}
.ph img{display:block;width:100%;height:120px;object-fit:cover;border-radius:6px;border:1px solid var(--sabbia-dark);background:var(--sabbia-light);cursor:pointer}
.ph.big{flex:1 1 100%;max-width:100%}
.ph.big img{height:auto;max-height:66vh;object-fit:contain}
.phx{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:99px;border:none;
  background:rgba(42,26,16,.72);color:var(--cream);font-size:19px;line-height:1;cursor:pointer;padding:0}
.phx:hover{background:var(--vino)}

.pask{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  background:rgba(245,237,224,.93);border-radius:6px;font-size:12.5px;color:var(--vino);text-align:center;padding:8px}
.pask button{font-family:var(--sans);font-size:12.5px;border-radius:3px;padding:8px 14px;cursor:pointer;border:none}
.pyes{background:var(--vino);color:var(--cream)}
.pno{background:none;border:1px solid var(--sabbia-dark);color:var(--vino)}
.pnote{font-size:11.5px;color:var(--vino-light);margin-left:10px}

/* Measured, not guessed: at 1024 the eight-column table fits and cuts nothing.
   At 810 — an iPad held upright — four ingredient names are cut. So everything
   below 1024 gets the stacked row: phones, Android screens, iPad portrait.
   Above it, the table, which is what a laptop and the pass screen want.
   A finger also needs bigger type, which costs width — so a touch screen stays
   stacked a bit wider, up to 1200. The pass screen at 1920 still gets the table. */
@media(max-width:1023px), (pointer:coarse) and (max-width:1200px){
  table.sheet th{top:42px}
  td.w{font-size:17px}
  select.prod{min-width:110px;font-size:12.5px}
  input.cell{font-size:14px;padding:10px 4px}
  col.cq{width:84px}                 /* smaller font here, so it needs less — give the rest back */

  /* ───── the sheet on a phone ─────
     Eight columns do not fit in 360px: the ingredient name — the one column that has
     to be right — was cut by up to 124px. Same row, same order, same everything you
     can do on a laptop; it just wraps onto three lines instead of one.
     Nothing is removed, so a chef can still pick, type, change the unit, trim and
     delete on a phone exactly as on the pass screen. */
  table.sheet,table.sheet tbody,table.sheet tr,table.sheet td{display:block;width:auto}
  table.sheet thead{display:none}
  table.sheet tr.main{display:flex;flex-wrap:wrap;align-items:center;gap:8px;
    padding:12px 12px;border-bottom:1px solid rgba(207,192,173,.65)}
  table.sheet tr.main td{padding:0;border:none}
  table.sheet td.ib{order:1;flex:0 0 auto;padding:0;text-align:left}
  /* basis 0, not auto. Flex decides what fits on a line from the BASE size and only
     shrinks afterwards — with basis auto a long row note measured 288px, the × got
     pushed onto a line of its own and the row looked broken. */
  table.sheet td.w{order:2;flex:1 1 0;min-width:0;padding:0}
  /* the arrows and the × share order 3, so they stay side by side in DOM order at the
     right-hand end of the first line — the same place they sit in the table */
  table.sheet td.mv{order:3;flex:0 0 auto;padding:0}
  table.sheet td.x{order:3;flex:0 0 auto}
  table.sheet td:nth-child(3){order:4;flex:1 0 100%}        /* ingredient — its own full line */
  table.sheet td:nth-child(4){order:5;flex:0 0 84px}        /* qty */
  table.sheet td:nth-child(5){order:6;flex:0 0 auto}        /* unit */
  table.sheet td.money{order:7;flex:1 1 auto;text-align:right;line-height:normal}
  table.sheet td.tk{order:8;flex:0 0 auto}
  table.sheet tr.isbatch{border-left:3px solid rgba(75,81,40,.55)}
  table.sheet tr.isbatch td{border-left:none}
  table.sheet tr.drop td{padding:0 12px 12px}
  select.prod{min-width:0}                                  /* it has a whole line now */

  table.sheet td.money{font-size:16px}
  .foot .v{font-size:21px}
}

/* ───── anything driven by a finger ─────
   Keyed on the POINTER, not the width. The pass screen is 1080p and it is a touch
   screen: judging by width alone it got 20px targets, which is a mouse assumption.
   A phone, an Android screen on the line, an iPad and the pass all land here;
   a laptop with a trackpad keeps the tighter rows. The 22px control height exists
   to line the columns up — every control grows together, so the row still reads across. */
@media(pointer:coarse){
  select.prod,input.cell{height:44px;line-height:normal}
  /* the unit is a box you tap now, so the box is the 44px target — the select inside it
     fills it exactly, and stays invisible */
  /* a text link is a 19px target — fine for a mouse, not for a thumb */
  .lnk{display:inline-block;min-height:44px;line-height:44px}
  .unbx{height:44px;min-width:56px;padding:0 6px}
  .unbx .unv{font-size:15px;line-height:44px}
  select.unit{height:100%}
  input.cell{font-size:16px;padding:0 10px}      /* 16px — iOS zooms the page on anything smaller */
  select.prod{font-size:15px;padding:0 22px 0 10px}
  select.unit{font-size:15px;padding:0 8px;min-width:52px;text-align:center}
  .ibx{width:40px;height:40px;line-height:38px;font-size:15px}
  button.rm{font-size:22px;padding:0;width:44px;height:44px}
  /* Stacked, not side by side: two 44px-wide arrows next to the × would have taken
     88px off the ingredient name on a 360px phone and left it 140px. Stacked they
     cost 40px of width, and each arrow is a 40×34 target with nothing else near it. */
  button.mvu{font-size:13px;width:40px;height:34px;padding:0}
  .mvb{gap:2px}
  label.tick{width:40px;height:40px;border-radius:6px}
  label.tick.on:after{font-size:19px}
  /* the two trim boxes have to take a thumb too, not just a mouse */
  .inl .p input{width:46px;padding:10px 3px;font-size:16px}
  .inl .p .l{font-size:10px}
  .qmark{font-size:10.5px;padding:8px 4px}
  .chip{font-size:12px;margin-top:8px}
  table.sheet td{padding-top:9px;padding-bottom:9px}
  col.cq{width:104px}    /* the bigger touch font needs more room — 92px cut "0.00035" by 9px */

  /* 16px or iOS zooms the page the moment a thumb lands in the box */
  .mbox{font-size:16px;padding:12px 13px}
  .phx{width:44px;height:44px;font-size:24px}
  .pask button{padding:11px 16px;font-size:13.5px}
  /* every button a thumb has to hit, not just the ones in the sheet. "Create all 8
     and link them" was a 32px target on the pass screen — the single most important
     button in the module, sized for a mouse. */
  .okb,.newr,.brb,.cxb,.srm,.addb{min-height:44px;padding:12px 18px;font-size:14px}
  .ach{min-height:44px;font-size:14.5px;padding:10px 17px}
  .srm{padding:12px 10px}
}
