<!-- "write them however you like" was said here AND in the box's own placeholder AND
     behind How to write them — three times, permanently, for one idea. What is left is
     the only thing on this line he cannot find out from anywhere else: which stock list
     the prices are coming off. -->
<!-- The MOCKUP banner is gone. The chefs are writing real recipes into the real database
     on this screen, and a black bar at the top calling it a mockup tells them the work
     they are doing does not count. Which stock take the prices come off is still said
     where it belongs — on the sheet itself, above the ingredients. -->

<div class="bar">
  <div class="l"><span class="back" id="back" role="button" tabindex="0">‹<span class="bkw" id="backw"></span></span>
    <span class="nm" id="bnm">New recipe</span>
    <span class="ty" id="bty" style="display:none"></span>
    <select class="bsec" id="bsc" style="display:none"></select>
    <!-- Which menu, asked in the same breath as the section. A dish on no menu shows
         on no card at all, so it must be answered where the section is answered — not
         found later, further down a page he may never scroll to. -->
    <select class="bsec" id="bmn" style="display:none"></select></div>
  <div style="display:flex;align-items:center;gap:14px">
    <span class="lnk" id="tosaved">Saved recipes</span>
    <span class="lnk" id="tolist">Aung's list</span>
    <!-- Every word the whole book has a question about, on one page, so nothing
         has to be found recipe by recipe. It edits all 34 recipes at once, so it
         is not a chef's button — it asks for the schedule PIN first. -->
    <span class="lnk" id="tobook">Check the book</span>
    <button class="act off" id="act">Next</button>
  </div>
</div>
<!-- The costing, directly under the name — it used to be fixed to the bottom of the
     window. Two things were wrong with that. A message is pinned 18px off the bottom,
     and this bar is 52px tall (60 on a touch screen), so every "deleted" landed INSIDE
     it — maroon writing on a maroon band, with no edge between them. And opening it
     took 200px off the bottom of the sheet he was reading.

     Up here it takes its own space instead of covering anything, and it opens downward,
     which is the only direction there is at the top of a page. -->
<div class="foot" id="foot" style="display:none"></div>
<!-- and anything the app has to say goes directly under the costing, in the flow, so
     there is no scroll position on any screen where one is sitting on the other -->
<div id="flashes"></div>

     the recipe he is writing stays on screen behind it. -->

  <input id="bmnn" placeholder="Christmas 2026" autocomplete="off">

  <span class="err" id="bmne"></span>
</div>

  whoSeed();

     import screen that can still be the last dish somebody opened — signing Antonio's
     import with Danilo's name because Danilo wrote the recipe that happened to be open.
     A row being made now belongs to whoever is standing at the screen now. */
  var w = (WHO && WHO.name) ? WHO
        : (S.step !== 'plan' && S.who && S.who.name) ? S.who
        : null;
  /* On the import screen there is no falling back to the sheet's author at all. The gate
     on "Create them" already asks, and this is the second lock on the same door: no name
     is honest, the wrong name is not. */
  if (!w || !w.name) return {};
  return { created_by: w.emp_id || null, created_by_name: w.name,
           updated_by: w.emp_id || null, updated_by_name: w.name };
}
/* Adds the signature to a body without the caller having to remember the field names.
   Silently drops them again if this database has not had updated_by added yet. */
function signed(body){
  var s = signNew();
  for (var k in s) body[k] = s[k];
  return body;
}

/* Nothing saves without a name on it — but it is never a refusal and never a dialog.
   The strip opens where it stands, the page goes to it and marks it, and one tap is the
   whole answer. From then on this screen knows, and no later recipe asks again. */
function askWhoFirst(){
  whoSeed();                         /* never ask for something this screen already knows */
  var cur = whoOnScreen();
  if (cur && cur.name) return false;
  S.whoOpen = true; S.whoAsked = true;
  /* Was tied to the sheet, and the strip is on the import screen now too. Tied to the
     strip actually being on the page instead, so adding it to a third screen needs
     nothing changed here. */
  var again = function(){ render(); if ($('whobar')) jumpTo('who'); };
  loadStaff().then(again);
  again();
  return true;
}
/* Picking a name says two things at once, and both of them are true: this recipe is
   his, and he is the one standing at this screen. */
function whoPicked(w){
  if (!w || !w.name) return;
  var picked = { emp_id:w.emp_id || null, name:w.name };
  /* On the import screen this says who is bringing the file in — it must not overwrite
     the author of whatever recipe is still open on the sheet behind it. */
  if (S.step !== 'plan') S.who = picked;
  rememberWho(picked);
  S.whoOpen = false; S.whoAsked = false;
  render();
}
/* Save — the recipe, then its lines. Never a stored cost: it re-costs off the stock take every time. */
function saveRecipe(){
  var head = {
    kind: S.kind, name: S.name.trim(), section: S.section || null,
    /* The picker shows kg selected and the panel says "PER KG", but `S.makesUnit` is
       only set on change — so accepting the default saved nothing, and the pass card
       then read "Makes 4" with no unit at all. Save what the screen says. */
    makes_qty: S.makesQty, makes_unit: S.makesUnit || (S.kind==='main' ? 'portions' : 'kg'),
    menu_price: S.kind==='main' ? S.price : null,
    method: normMethod(S.method), photos: S.photos || [],
    /* only what he ticked on THIS recipe. What a batch brings is worked out live from
       the batch every time, so fixing the batch fixes every dish — never a stored copy
       that goes stale the moment the batch changes. */
    allergens: (S.allergens || []).filter(function(k){
      return ALLERGENS.some(function(a){ return a.k === k; }); }),
    updated_at: new Date().toISOString()
  };
  /* Save changes saves the WHOLE card, never part of it — and the other half of that
     rule is that a sheet which never held the whole card must not be allowed to blank
     the parts it does not know about. That is exactly how a photo was lost: the sheet
     came back from Unsaved work without one, and the save wrote photos:[] straight over
     a picture that was on the record. Every route onto a sheet sets `whole` today; if a
     new one ever forgets, the fields it cannot vouch for are left alone rather than
     emptied. */
  if (S.id && !S.whole){
    delete head.photos; delete head.method; delete head.allergens;
  }
  /* Who wrote it is written on every save, not only the first, because it can be
     corrected on the strip afterwards — a name typed onto the wrong recipe has to be
     fixable without deleting the work.

     Who last changed it is only written when this screen actually knows who is at it.
     Falling back to the creator would put his name on somebody else's edit, which is
     not a smaller lie for being a convenient one. */
  if (S.who && S.who.name){
    head.created_by = S.who.emp_id || null;
    head.created_by_name = S.who.name;
  }
  if (WHO && WHO.name){
    head.updated_by = WHO.emp_id || null;
    head.updated_by_name = WHO.name;
  }
  /* `updated_by` and `updated_by_name` are newer than this page. If the screen is ever
     opened against a database that has not had them added yet, PostgREST rejects the
     WHOLE save for an unknown column — and a chef would lose an hour's work over a
     field nobody has even asked to see. So the save drops them and goes again. It is
     the recipe that matters; the signature is the part that can wait. */
  function put(body){
    return (S.id ? sb('recipes?id=eq.'+S.id, { method:'PATCH', body:body })
                 : sb('recipes', { method:'POST', body:body }))
      .catch(function(err){
        if (!/updated_by/.test(err.message || '') || !('updated_by' in body)) throw err;
        var b2 = {}; for (var k in body) if (k !== 'updated_by' && k !== 'updated_by_name') b2[k] = body[k];
        return S.id ? sb('recipes?id=eq.'+S.id, { method:'PATCH', body:b2 })
                    : sb('recipes', { method:'POST', body:b2 });
      });
  }
  return put(head).then(function(out){
    var rec = out && out[0]; if (!rec) throw new Error('the database did not return the recipe');
    S.id = rec.id;
    return sb('recipe_lines?recipe_id=eq.'+S.id, { method:'DELETE', prefer:'return=minimal' });
  }).then(function(){
    if (!S.rows.length) return null;
    return sb('recipe_lines', { method:'POST', prefer:'return=minimal', body: linesFor(S.id, S.rows) });
  }).then(function(){
    return saveRecipeMenus();
  }).then(function(){
    /* Attach it to the printed dish it was started from, so it stops being counted as
       not started. Deliberately not fatal: the recipe is already saved by now, and
       losing the whole save over a link would be trading the chef's work for a count. */
    if (!S.fromItem) return null;
    var item = S.fromItem;
    return sb('menu_items?id=eq.'+item, { method:'PATCH', prefer:'return=minimal',
                body:{ recipe_id:S.id, updated_at:new Date().toISOString() } })
      .then(function(){
        S.fromItem = null;
        (MENUITEMS || []).forEach(function(mi){ if (mi.id === item) mi.recipe_id = S.id; });
      })
      .catch(function(){ /* it saved; the link can be made again by opening it from there */ });
  }).then(function(){
    /* a batch that just changed must re-cost everywhere it is used — and one that has
       just STOPPED being a batch has to leave the pool, or it stays pickable on a line
       until the page is reloaded */
    return (S.kind === 'batch' || (S.id && BATCH[S.id])) ? loadBatches() : null;
  }).then(function(out){
    /* Saved is the answer to the question Unsaved work asks. It used to keep asking it
       anyway — save the recipe properly and the same line was still sitting on the
       starting screen next time, so the only way to be rid of a row about work that was
       already safe was the bin. */
    dropParkFor(S.id, head.name);
    return out;
  });
}

/* ═════════ leaving a sheet with work on it ═════════
   No dialog. A dialog is the one thing he asked never to see, and it would be the
   only thing in the module that opens. Instead the sheet itself says it, in place,
   and asks the question where the work is — and until he answers, nothing moves. */
function sig(){
  return JSON.stringify({
    k:S.kind, n:(S.name||'').trim(), s:S.section||'', p:S.price,
    mq:S.makesQty, mu:S.makesUnit, m:normMethod(S.method),
    a:(S.allergens||[]).slice().sort(),
    mn:(S.menus||[]).slice().sort(),
    ph:(S.photos||[]).map(function(p){ return (p.n||'') + ':' + ((p.u||'').length); }),
    r:(S.rows||[]).map(function(r){
      return [r.raw, r.code, r.qty, r.unit, !!r.adj, r.yield, r.waste].join('|'); })
  });
}
function markClean(){ S.clean = sig(); }
/* Deliberately NOT tied to which screen he is on. The sheet is still in memory while
   he browses Saved recipes, and tapping another recipe from there would overwrite it
   just as surely as going back would. */
function isDirty(){
  if (!S.kind || !(S.rows || []).length) return false;
  if (!S.id) return true;                    /* never saved — all of it is at risk */
  return S.clean != null && sig() !== S.clean;
}
/* run it, or hold it until he has answered — asked ON the sheet, where the work is,
   so he can see what he is about to lose instead of reading about it */
function guard(go){
  if (!isDirty()) return go();
  S.pendingGo = go;
  if (S.step !== 'sheet'){ S.step = 'sheet'; render(); window.scrollTo(0,0); }
  else drawSaveBar();
  var b = $('savebar'); if (b && b.scrollIntoView) b.scrollIntoView({ block:'center' });
}
function drawSaveBar(){ var b = $('savebar'); if (b) b.innerHTML = saveBarInner(); }
function saveBarInner(){
  if (!isDirty()) return '';
  if (!S.pendingGo)
    return '<div class="sb1"><span class="sbt"><b>Not saved.</b> ' +
      (S.id ? 'This recipe has changes that are only on this screen.'
            : 'Nothing here is saved yet.') + '</span>' +
      '<button class="okb" id="sbsave">Save now</button></div>';
  return '<div class="sb1 ask"><span class="sbt"><b>Wait — this is not saved.</b> ' +
    'Leave now and ' + (S.id ? 'these changes go' : 'the whole sheet goes') + '.</span>' +
    '<button class="okb" id="sbsavego">Save, then go</button>' +
    '<button class="cxb" id="sbgo">Go without saving</button>' +
    '<button class="cxb" id="sbstay">Stay here</button></div>';
}

/* the database speaks database. Say it in kitchen words. */
function plain(msg){
  if (/recipes_name_unique|duplicate key/i.test(msg))
    return 'There is already a recipe called "'+S.name.trim()+'". Give this one a different name, or open that one and change it.';
  if (/Failed to fetch|NetworkError|network/i.test(msg))
    return 'No connection to the Kitchen database. Your sheet is safe here — try Save again in a moment.';
  return msg;
}

/* ═════════ starting a new one without losing the old one ═════════
   Wanting to write a new recipe is not a reason to be stopped, and half a Salmoriglio
   is not a reason to lose it. So the half-written sheet is put to one side and he goes
   straight where he asked to go. It sits in a line at the top of the new sheet until he
   picks it back up or saves the new one over the top of nothing. One slot: parking a
   second one would be a filing system nobody asked for. */
var PARKMAX = 12, PARKLS = 'rcp.unsaved.v1';
/* Only what a recipe IS — not the hundred options hanging off each row, which are read
   back off Aung's list anyway. Small enough to keep on the machine, so a shut lid or a
   reloaded page is not the end of it either. */
function parkSnapshot(){
  return { at:new Date().toISOString(),
           label:(S.name || '').trim() || ('a ' + (S.kind || 'new') + ' recipe with no name yet'),
           id:S.id, kind:S.kind, name:S.name, section:S.section, text:S.text,
           price:S.price, makesQty:S.makesQty, makesUnit:S.makesUnit,
           method:S.method, allergens:S.allergens, menus:S.menus,
           /* The photo was the one thing a snapshot did not carry, so a picture taken
              at the pass and not yet saved was gone the moment the sheet was put down —
              and a photo is the only part of a recipe that cannot be typed again from
              memory. It counts as a change (see sig()), so adding one is exactly what
              causes the sheet to be parked in the first place. */
           photos:(S.photos || []).slice(),
           lines:(S.rows || []).length,
           rows:(S.rows || []).map(function(r){
             return { raw:r.raw, code:r.code || null, qty:r.qty, unit:r.unit || null,
                      note:r.note || null,
                      adj:!!r.adj, yield:r.yield, waste:r.waste }; }) };
}
function parkedList(){ if (!S.parkedList) S.parkedList = []; return S.parkedList; }
function parkPut(l){
  try { localStorage.setItem(PARKLS, JSON.stringify(l)); return true; } catch(e){ return false; }
}
/* Photos are data URIs and this machine holds about five megabytes, so twelve parked
   recipes each carrying one taken on a phone will not fit. The old line swallowed that
   failure whole — the write threw, nothing was said, and the entire Unsaved work list
   quietly stopped being kept.
   When it will not fit, give things up in the order they can be replaced: photos first
   and oldest first (a photo can be taken again), then the oldest pieces of work, and
   never the one just put down. */
function savePark(){
  var l = parkedList();
  if (parkPut(l)) return true;
  for (var i = l.length - 1; i >= 0; i--){
    if (l[i] && l[i].photos && l[i].photos.length){
      l[i].photos = []; l[i].photosDropped = true;
      if (parkPut(l)) return true;
    }
  }
  while (l.length > 1){
    l.pop();
    if (parkPut(l)) return true;
  }
  return false;
}
function loadPark(){
  try { var v = JSON.parse(localStorage.getItem(PARKLS) || '[]'); S.parkedList = Array.isArray(v) ? v : []; }
  catch(e){ S.parkedList = []; }
}
/* Everything a piece of work IS, without when it was put down. Two snapshots that match
   on this are the same work, however many times it has been picked up and put back. */
function workSig(p){
  var c = {}; for (var k in p) if (k !== 'at' && k !== 'photosDropped') c[k] = p[k];
  return JSON.stringify(c);
}
function parkCurrent(){
  if (!isDirty()) return false;
  var snap = parkSnapshot();
  /* Putting the same sheet down again, unchanged, is not new work. It used to be filed
     as if it were — the row jumped to the top of the list with a fresh time on it — so
     opening something out of Unsaved work, reading it and going back made it look like
     something had just happened. Nothing had. Leave the line exactly where it was. */
  var same = parkedList().filter(function(p){ return workSig(p) === workSig(snap); })[0];
  if (same){ S.parkedLabel = same.label; S.parkedWasSaved = !!same.id; return true; }
  /* The same recipe put down twice is one piece of work, not two. A recipe that exists is
     the same recipe whatever it is called — matching on the name as well meant renaming
     one and putting it down left TWO rows for a single recipe, under both names, and
     saving it could only ever answer one of them. A sheet that has never been saved has
     no id to be known by, so for those the name is all there is. */
  var l = parkedList().filter(function(p){
    return snap.id ? String(p.id) !== String(snap.id)
                   : !(!p.id && p.label === snap.label); });
  l.unshift(snap);
  S.parkedList = l.slice(0, PARKMAX);
  savePark();
  S.parkedLabel = snap.label;
  S.parkedWasSaved = !!snap.id;
  return true;
}
/* Two different things end up in the same list and they do not mean the same thing.
   A recipe that has never been saved is work in progress — there is nothing to save it
   onto yet. A recipe that already exists and has been CHANGED is different: the change
   belongs on the recipe, and being told it is "in Unsaved work" reads like everything
   is fine when what he actually did — picking the two missing ingredients on Lobster
   bisque — is not on the recipe at all. Say which one it is. */
function parkedFlash(){
  return S.parkedWasSaved
    ? '“' + S.parkedLabel + '” has changes you have not saved. They are kept in Unsaved work.'
    : '“' + S.parkedLabel + '” is in Unsaved work — carry on with it any time.';
}
function dropPark(i){ parkedList().splice(i, 1); savePark(); }
/* Called the moment a save lands. The row for this recipe is answered and goes — and it
   only ever comes back if he changes something again and leaves it unsaved again.
   A recipe saved for the first time was parked before it had an id, so the line it left
   behind is matched on its name instead. */
function dropParkFor(id, name){
  var n = String(name || '').trim(), l = parkedList();
  var keep = l.filter(function(p){
    if (id && String(p.id) === String(id)) return false;
    if (!p.id && n && p.label === n) return false;
    return true;
  });
  if (keep.length === l.length) return;
  S.parkedList = keep; savePark();
}
function unparkAt(i){
  var p = parkedList()[i]; if (!p) return;
  parkCurrent();                                  /* whatever he is on now joins the list */
  /* The row STAYS in the list while he works on it. Taking it out on the way in meant a
     look-and-go-back had to file it all over again as new; and if the phone killed the
     tab in between, the only copy went with it. It is hidden from the list while it is
     the recipe on screen (see parkedNote), and it leaves the list when it is saved. */
  savePark();
  newRecipe();
  S.kindAsk = null; S.kindStop = null; S.kindBusy = false; S.kindStash = {};
  S.id = p.id || null; S.kind = p.kind; S.name = p.name || ''; S.section = p.section || '';
  S.text = p.text || ''; S.price = p.price;
  S.makesQty = p.makesQty; S.makesUnit = p.makesUnit;
  S.method = p.method || emptyMethod(); S.allergens = p.allergens || []; S.menus = p.menus || [];
  S.photos = Array.isArray(p.photos) ? p.photos.filter(function(x){ return x && x.u; }) : [];
  /* the rows are rebuilt off the same words in the same order, then what he had chosen
     is put back on them line by line — a row whose words have changed is left alone */
  S.rows = splitLine(S.text).map(function(x){ return mkRow(x); }); S.sel = [];
  S.rows.forEach(function(r, idx){
    var sr = (p.rows || [])[idx]; if (!sr || sr.raw !== r.raw) return;
    if (sr.code){
      var it = pool().filter(function(x){ return x.code === sr.code; })[0];
      if (it){ r.opts = [it].concat(r.opts.filter(function(o){ return o.code !== it.code; })); r.code = sr.code; }
    }
    r.qty = sr.qty; r.unit = sr.unit; r.adj = sr.adj;
    if (sr.yield != null) r.yield = sr.yield;
    if (sr.waste != null) r.waste = sr.waste;
  });
  S.pendingGo = null;
  S.step = S.rows.length ? 'sheet' : 'write';
}
/* Everything half written, in one place, on the screen a new recipe starts from.
   Each one comes back or goes in the bin — his call, never the app's. */
/* ───── it does not nag ─────
   This was on five screens, including the sheet he is typing on — and since the tab now
   parks itself whenever a phone puts it in the background, a chef who switched apps came
   back to "UNSAVED WORK · 1 · Pistachio Tiramisu'" sitting above the recipe that was open
   in front of him. Being told about work you are looking at is not a safety net, it is
   somebody tapping you on the shoulder.

   So it is off every working screen. It survives in one place — the "What are you making?"
   screen, which is where a chef is starting something and might want to pick up what he
   abandoned — and it never lists the recipe already open. The parking itself is untouched:
   nothing is lost, it just stops talking about it. */
function parkedNote(quiet){
  if (quiet) return '';
  /* Open and Delete act on the position in the REAL list, so the real position has to be
     carried through the filter. Renumbering the rows here would have pointed Delete at
     whichever recipe happened to take that slot — the wrong one, silently. */
  var l = parkedList().map(function(p, i){ return { p:p, i:i }; })
    .filter(function(x){
      /* the one on screen is not "unsaved work", it is the work */
      return !(x.p.id && S.id && String(x.p.id) === String(S.id));
    });
  if (!l.length) return '';
  return '<div class="parked"><div class="ph">Unsaved work · ' + l.length + '</div>' +
    l.map(function(x){
      var p = x.p, i = x.i;
      var when = '';
      try { when = new Date(p.at).toLocaleString('en-GB',
            { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }); } catch(e){}
      return '<div class="prow"><span class="pn">' + esc(p.label) + '</span>' +
        '<span class="pm">' + (p.id ? '<b>changes not saved onto it</b> · ' : '') +
          (p.kind === 'batch' ? 'batch' : 'main') + ' · ' + p.lines +
          ' line' + (p.lines === 1 ? '' : 's') + (when ? ' · ' + esc(when) : '') + '</span>' +
        '<button class="lnk" data-unpark="' + i + '">' +
          (p.id ? 'Open it and save' : 'Carry on with it') + '</button>' +
        '<button class="lnk bin" data-binpark="' + i + '">Delete</button></div>';
    }).join('') + '</div>';
}
/* the shell calls this every time the Create new recipes tile is tapped, so that tile
   always opens on a clean sheet — and never at the cost of what was on the screen */
window.__rcpNew = function(){
  try { parkCurrent(); S.pendingGo = null; newRecipe(); render(); window.scrollTo(0,0); }
  catch(e){}
};

function newRecipe(){
  /* A brand-new sheet IS the whole recipe — there is nothing on the record it does not
     already hold. See `whole` in saveRecipe. */
  S.whole = true;
  S.id=null; S.kind=null; S.name=''; S.section=''; S.text=''; S.rows=[]; S.sel=[];
  S.price=null; S.makesQty=null; S.makesUnit=null; S.step='type';
  S.imported=null; S.found=null; S.hints=null; S.cameFrom=null; S.find=null;
  /* the printed dish this was started from belongs to the sheet that has just left */
  S.fromItem = null;
  S.method = emptyMethod(); S.photos = []; S.bigPhoto = null; S.allergens = [];
  /* pre-filled with whoever this screen already knows, so the second recipe somebody
     writes costs them no taps at all — the whole point of remembering it */
  S.who = WHO ? { emp_id:WHO.emp_id, name:WHO.name } : null;
  S.whoUpd = null; S.whoAt = null; S.whoOpen = false; S.whoAsked = false;
  /* what the OTHER kind held belongs to the recipe that has just left the screen */
  S.kindAsk = null; S.kindStop = null; S.kindBusy = false; S.kindStash = {};
  /* A dish on no menu shows up on no card at all — so a new one starts on the menu
     that is running. Untick it if it belongs somewhere else; it is one tap either
     way, and the other way round is a dish nobody can find. */
  var run = MENUS.filter(function(m){ return m.running; })[0];
  S.menus = run ? [run.id] : [];
  S.plan = null; S.planRan = false; S.fromPlan = false; S.fromTodo = false;
  /* a fresh recipe has nothing to do with the Micros screen somebody came off an hour
     ago — leaving it set sends Back on THIS recipe to a request he is not making */
  S.micReturn = null;
}

/* ───────── the two things both called a batch ─────────
   Aung's stock take carries "RF Cacio e Pepe (Polpo) (PA)" — a code and a price per kilo,
   and nothing else. It is not a recipe and there are no ingredients behind it. What we
   write in this module IS a recipe. The sheet used to draw both with the same gold B, so
   tapping the second kind landed on a list row you can do nothing with.

   The two are the same batch written by two hands, and the names line up once his wrapper
   is off: 9 of the first 10 batch recipes written match his list exactly this way. So the
   B goes to the recipe whenever one exists, and says so plainly when one does not. */
function batchKey(s){
  return String(s||'').replace(/^\s*RF\s+/i,'').replace(/\s*\(PA\)\s*$/i,'')
                      .replace(/\s+/g,' ').trim().toLowerCase();
}
function plainBatch(s){
  return String(s||'').replace(/^\s*RF\s+/i,'').replace(/\s*\(PA\)\s*$/i,'').replace(/\s+/g,' ').trim();
}
/* the recipe behind one of Aung's batch lines, if it has been written. Removed ones count —
   offering to write a recipe that already exists, archived, is how you end up with two. */
function myBatchFor(name){
  var k = batchKey(name); if (!k) return null;
  for (var i = 0; i < MYB.length; i++) if (batchKey(MYB[i].name) === k) return MYB[i];
  return null;
}

/* Aung's list can hold two of a thing — "RF Cacio e Pepe (Polpo) (PA)" and
   "RF Cacio e Peper (Spaghetto) (PA)" — and when it does, myBatchFor() finds neither,
   because neither is an exact key. Refusing to choose is right; a silent wrong link is
   the worst thing this module can do. But refusing is not the same as having nothing.
   These are the recipes he might have meant, ranked, for HIM to pick from. simName is
   the "did he mean this?" score — the deliberately generous one. Never picked for him. */
function batchCandidates(aungName){
  var k = batchKey(aungName); if (!k) return [];
  return MYB.filter(function(b){ return !b.away; })
    .map(function(b){ return { it:b, s:simName(k, batchKey(b.name)) }; })
    .filter(function(x){ return x.s >= 0.55; })
    .sort(function(a, b){ return b.s - a.s; })
    .slice(0, 3)
    .map(function(x){ return x.it; });
}

/* ───────── our own batch recipes, usable inside any recipe ─────────
   A batch costs what its ingredients cost, divided by how much it makes.
   If anything about it is unfinished we carry NO cost and say why — a batch
   must never quietly hand a made-up number to the dish that uses it. */
var MYB = [];              /* pseudo-items, shaped like a stock item so everything else just works */
var BATCH = {};            /* id -> { name, makesQty, makesUnit, lines } */
function pool(){ return MYB.length ? ING.concat(MYB) : ING; }            /* everything, so a link still resolves */
function pickable(){ return MYB.length ? ING.concat(MYB.filter(function(b){ return !b.away; })) : ING; }

/* Main recipes, shaped exactly like a batch so the SAME cost walk works on them.
   Kept apart from BATCH on purpose: anything in BATCH becomes pickable as a batch,
   and a dish must never be linkable inside another dish. */
var MAINS = {};

function batchCost(id, stack){
  var b = BATCH[id] || MAINS[id];
  if (!b) return { problem:'that batch is no longer there' };
  stack = stack || [];
  if (stack.indexOf(id) > -1) return { problem:'it ends up using itself' };
  stack = stack.concat([id]);
  if (!b.makesQty) return { problem:'it does not say how much it makes' };

  var total = 0, why = null;
  for (var i=0; i<b.lines.length; i++){
    var l = b.lines[i], per = null, base = null;
    if (!l.child_recipe_id && !l.stock_code){ why = why || 'a line in it has no ingredient picked yet'; continue; }
    if (l.child_recipe_id){
      var sub = batchCost(l.child_recipe_id, stack);
      if (sub.problem){ why = why || ((BATCH[l.child_recipe_id]||{}).name||'a batch') + ' inside it ' + sub.problem; continue; }
      per = sub.per; base = sub.base;
    } else {
      var it = ING.filter(function(x){ return x.code === l.stock_code; })[0];
      if (!it){ why = why || 'an ingredient in it is no longer on the stock take'; continue; }
      if (it.price === 0 && !it.mine){ why = why || 'an ingredient in it has no price on the stock take'; continue; }
      var bp = basePrice(it);
      if (!bp){ why = why || 'an ingredient in it has a unit the app cannot read'; continue; }
      per = bp.v; base = bp.base;
    }
    if (l.qty == null){ why = why || 'a line in it has no quantity'; continue; }
    var c = qtyInBase(l.qty, l.unit || (base==='kg'?'g':base==='L'?'ml':'pcs')) * per;
    total += c / ((l.trim_on ? (l.yield_pct==null?100:l.yield_pct) : 100)/100)
               * (1 + (l.trim_on ? (l.waste_pct||0) : 0)/100);
  }
  if (why) return { problem: why };
  if (!b.lines.length) return { problem:'it has nothing in it yet' };
  return { per: total / b.makesQty, base: b.makesUnit, total: total };
}

/* would putting `id` inside the recipe we're editing come back round to itself? */

  if (id === target) return true;

  var b = BATCH[id]; if (!b) return false;

function saveMine(it){
  return sb('ingredients', { method:'POST', body:{
      code:it.code, name:it.name, group_name:it.group, unit:it.unit, price:it.price } })
    .then(function(rows){ var r = rows && rows[0]; if (r) it.rowId = r.id; return it; });
}
/* Plain words for what the database says back */
function minePlain(msg){
  msg = String(msg||'');
  if (/ingredients_name_live|duplicate key.*name/i.test(msg))
    return 'Something on your list is already called that — use that one instead of adding it twice.';
  if (/ingredients_code_live|duplicate key/i.test(msg))
    return 'That code is already on your list.';
  if (/relation .*ingredients.* does not exist|PGRST205/i.test(msg))
    return 'The ingredients table is not there yet, so this cannot be kept.';
  if (/row-level security/i.test(msg))
    return 'The database would not accept it.';
  if (/Failed to fetch|NetworkError/i.test(msg))
    return 'No connection to the database.';
  return msg;
}
/* Removing one is archiving it, the same as a recipe — but an ingredient that a
   saved recipe is USING must not vanish, because that recipe would go straight back
   to carrying no cost. So the recipes are asked first, and named. */
function mineInUse(code){
  /* the names come back with the query, not out of S.saved — that list is only loaded
     once you have opened Saved recipes, so relying on it turned "Vitello Tonnato and
     Polletto are using it" into a bare "1 saved recipe", which tells you nothing about
     what to go and fix. recipe_lines points at recipes twice, so the join is named. */
  return sb('recipe_lines?stock_code=eq.' + encodeURIComponent(code) +
            '&select=recipe_id,recipes!recipe_lines_recipe_id_fkey(name,archived)')
    .then(function(rows){
      var seen = {}, names = [];
      (rows||[]).forEach(function(r){
        var rec = r.recipes;
        if (!r.recipe_id || seen[r.recipe_id] || (rec && rec.archived)) return;
        seen[r.recipe_id] = 1;
        names.push((rec && rec.name) || 'a recipe');
      });
      return { n:names.length, names:names };
    });
}
/* Re-running search() on a row is how a new ingredient becomes pickable in the sheet
   you already have open. On its own it also THROWS AWAY whatever that row had picked,
   if the pick does not happen to match the words typed — openRecipe hit the same trap
   and repairs it the same way: put the picked item back on the front of the list. */
function refreshOpts(){
  (S.rows||[]).forEach(function(r){
    r.opts = search(r.word);
    if (r.code && !itemOf(r)){
      var hit = pool().filter(function(i){ return i.code === r.code; })[0];
      if (hit) r.opts = [hit].concat(r.opts);
    }
  });
}
function archiveMine(it){
  return sb('ingredients?id=eq.'+it.rowId, { method:'PATCH', prefer:'return=minimal',
    body:{ archived:true, updated_at:new Date().toISOString() } });
}

/* ───────── menus ─────────
   A section says where a dish sits on a menu. It does not say WHICH menu, and with
   an à la carte, a Christmas menu and whatever else comes, the card and the Food
   Bible could only ever show all three hundred at once — so a waiter training on the
   à la carte had to already know which of them belonged to it.

   A dish is on more than one: Burrata is à la carte AND Christmas. So it is a list
   of menus, and a list of what is on each — never a column on the recipe.

   Batches are deliberately not assigned. A batch belongs to the dishes that use it
   and is reached by opening one of them; putting Porcini stock on a menu would be
   saying a guest can order it. */
var MENUS = [], MENU_ERR = null;

function loadMenus(){
  return sb('menus?venue_id=eq.robertos-difc&archived=is.false&select=*&order=position,name')
    .then(function(list){ MENUS = list || []; MENU_ERR = null; })
    .catch(function(e){ MENUS = []; MENU_ERR = e.message; });
}
/* which menus THIS recipe is on. Read fresh with the recipe, never cached against a
   sheet that has since been left open for an hour. */
function loadRecipeMenus(id){
  if (!id){ S.menus = []; return Promise.resolve(); }
  return sb('recipe_menus?recipe_id=eq.'+id+'&select=menu_id')
    .then(function(rows){ S.menus = (rows||[]).map(function(r){ return r.menu_id; }); })
    .catch(function(){ S.menus = []; });
}
/* Written after the recipe itself, and only the difference — so a dish already on
   four menus is not taken off all four and put back on them every time you press
   Save, which is four chances for a half-finished write to lose one. */
function saveRecipeMenus(){
  if (!S.id) return Promise.resolve();
  /* A dish that has become a batch has to come OFF the menus it was on, not merely stop
     being written to them. Skipping the write left the rows behind, and a menu card and
     the Food Bible both read that table — so the batch would have gone on printing as a
     dish nobody could order. */
  if (S.kind !== 'main')
    return sb('recipe_menus?recipe_id=eq.'+S.id, { method:'DELETE', prefer:'return=minimal' })
             .then(function(){ S.menus = []; });
  return sb('recipe_menus?recipe_id=eq.'+S.id+'&select=menu_id').then(function(rows){
    var was = (rows||[]).map(function(r){ return r.menu_id; });
    var now = S.menus || [];
    var add = now.filter(function(m){ return was.indexOf(m) < 0; });
    var off = was.filter(function(m){ return now.indexOf(m) < 0; });
    var jobs = [];
    if (add.length) jobs.push(sb('recipe_menus', { method:'POST', prefer:'return=minimal',
      body: add.map(function(m){ return { recipe_id:S.id, menu_id:m }; }) }));
    off.forEach(function(m){
      jobs.push(sb('recipe_menus?recipe_id=eq.'+S.id+'&menu_id=eq.'+m,
        { method:'DELETE', prefer:'return=minimal' }));
    });
    return Promise.all(jobs);
  });
}
function menuName(id){
  var m = MENUS.filter(function(x){ return x.id === id; })[0];
  return m ? m.name : 'a menu';
}
function newMenu(name){
  return sb('menus', { method:'POST', body:{ name:name.trim(),
    position:(MENUS.length ? Math.max.apply(null, MENUS.map(function(m){ return m.position||0; })) + 1 : 0) } })
    .then(function(rows){ var m = rows && rows[0]; if (m) MENUS.push(m); return m; });
}
function menuPlain(msg){
  msg = String(msg||'');
  if (/menus_name_live|duplicate key/i.test(msg)) return 'There is already a menu called that.';
  if (/menus_one_running/i.test(msg)) return 'Another menu is already the one running — turn that one off first.';
  if (/relation .*menus.* does not exist|PGRST205/i.test(msg)) return 'The menus table is not there yet.';
  if (/Failed to fetch|NetworkError/i.test(msg)) return 'No connection to the database.';
  return msg;
}

/* ═════════ the Micros request for Aung ═════════
   Until now this was an Excel form filled in by hand, one line per dish: the name as
   it reads on the menu, the same name squeezed into 16 characters for the till, the
   cost, and the price. Everything on it is already in this module — so the form is
   built from the menu rather than typed again, and typed twice is how the till ends
   up saying one price and the recipe another.

   What is NOT filled in: the Micros item code. Aung assigns those. And the 16-character
   name is only suggested — "Valen RiccioMare" is a judgement, not an algorithm. */
var MICREQ = { menuId:null, prefix:'', rows:[], err:null, ready:false,
               confirm:false, sent:0, today:'',
               /* the request being built: a draft already saved keeps its id, so
                  "keep it for later" twice does not leave two half-requests behind */
               reqId:null, search:'', onlyNew:true, saving:false, missing:[],
               /* Who it goes to. `to`/`cc` null means "the default", and they go BACK to
                  null after every send: editing the address on the send screen is a
                  one-off for that send. The default itself only ever changes on the
                  admin panel — a test sent to yourself must not silently become the
                  address every request after it opens on. */
               to:null, cc:null, def:null, defErr:null, admin:false, adminTo:'', adminCc:'',
               /* the requests already made — the screen the door now opens on */
               list:null, listErr:null, listReady:false, open:null, openErr:null,
               /* the sent request being asked about before it is removed — one at a
                  time, and never open on a card he has not tapped */
               del:null };

/* ── what has been sent before ──────────────────────────────────────────────────
   Two tables, read once. Nothing here is derived from the recipes: a request is a
   record of what went out, and it has to keep saying that after the recipe changes.
   The tables not being there yet is not an error — the module worked without them
   until now, and it still does; the list simply says there is nothing in it. */
var MICNOTAB = false;
function micLoadList(){
  MICREQ.listErr = null; MICREQ.listReady = false;
  /* the setting rides with the list — every screen that reads one needs the other */
  micLoadSettings();
  return sb('micros_requests?select=*,items:micros_request_items(*)' +
            '&order=created_at.desc&limit=120')
    .then(function(r){
      MICREQ.list = (r||[]).map(function(q){
        (q.items||[]).sort(function(a,b){ return (a.position||0)-(b.position||0); });
        return q;
      });
      MICNOTAB = false; MICREQ.listReady = true;
    })
    .catch(function(e){
      /* PGRST205 = the table is not in the schema. Said plainly once, not as a failure. */
      MICNOTAB = /PGRST205|does not exist|schema cache/i.test(e.message||'');
      MICREQ.list = []; MICREQ.listReady = true;
      MICREQ.listErr = MICNOTAB ? null : e.message;
    });
}
/* Every recipe that has already gone out on a SENT request for this menu. A draft is
   not a send: a dish sitting on an unfinished draft must still be offered. */
function micSentBefore(menuId){
  var seen = {};
  (MICREQ.list||[]).forEach(function(q){
    if (!q.sent_at || q.menu_id !== menuId) return;
    (q.items||[]).forEach(function(it){ if (it.recipe_id) seen[it.recipe_id] = q; });
  });
  return seen;
}
/* ── the default, and the one-off ──
   Three layers, and only the middle one is ever written to by a send screen:
     MICMAIL      — what it has always been, if the setting has never been read
     MICREQ.def   — the setting, changed on the admin panel and nowhere else
     MICREQ.to    — typed on the send screen, for THIS send, cleared the moment it goes */
function micDefTo(){ return (MICREQ.def && MICREQ.def.send_to) || MICMAIL.to; }
function micDefCc(){ return (MICREQ.def && MICREQ.def.send_cc) ? MICREQ.def.send_cc.slice()
                                                              : MICMAIL.cc.slice(); }
function micTo(){ return MICREQ.to != null ? MICREQ.to : micDefTo(); }
function micCc(){ return MICREQ.cc != null ? MICREQ.cc : micDefCc(); }
/* is this send going somewhere other than the default? said on the screen, because a
   one-off that looks permanent and a permanent change that looks one-off are the same bug */
function micOneOff(){
  return MICREQ.to != null &&
    (MICREQ.to !== micDefTo() || micCc().join(',') !== micDefCc().join(','));
}
/* The setting. Not there yet is not an error — it falls back to the addresses it has
   always used, and the admin panel says so. */
function micLoadSettings(){
  return sb('micros_settings?id=eq.1&select=*')
    .then(function(r){ MICREQ.def = (r && r[0]) || null; MICREQ.defErr = null; })
    .catch(function(e){
      MICREQ.def = null;
      MICREQ.defErr = /PGRST205|does not exist|schema cache/i.test(e.message||'')
        ? 'notable' : e.message;
    });
}
/* "Aung" only while it is still going to Aung. Changed to somebody else, the screen
   has to say the address rather than keep using his name for whoever it is now. */
function micWho(){ return micTo() === MICMAIL.to ? MICMAIL.who : micTo(); }
function micCcList(s){
  return String(s||'').split(/[,;\s]+/).map(function(x){ return x.trim(); })
    .filter(function(x){ return x; });
}

/* ── writing the request down ───────────────────────────────────────────────────
   Called twice: once for "keep it for later" (sent falsy) and once the moment a send
   succeeds. The items are written from what is on the screen — the till name as edited,
   the cost and the price as they are TODAY — and never read back through the recipe
   again. That is the whole point of the table.

   The items are replaced rather than merged: a request is a list, and a dish unticked
   between one save and the next has to leave it. */
function micSaveRequest(sent, addr){
  var take = MICREQ.rows.filter(function(r){ return r.take; });
  var w = (typeof WHO !== 'undefined' && WHO && WHO.name) ? WHO : null;
  /* the addresses it ACTUALLY went to are handed in, not read back off the screen —
     by the time this runs the screen has already gone back to the default */
  var body = {
    menu_id: MICREQ.menuId, menu_name: micMenuName(),
    prefix: MICREQ.prefix || null, dish_count: take.length,
    send_to: addr ? addr.to : micTo(),
    send_cc: addr ? addr.cc : micCc(),
    updated_at: new Date().toISOString()
  };
  if (sent){
    body.sent_at = new Date().toISOString();
    body.sent_by = w ? (w.emp_id || null) : null;
    body.sent_by_name = w ? w.name : null;
  }
  if (!MICREQ.reqId && w) body.created_by_name = w.name;

  var head = MICREQ.reqId
    ? sb('micros_requests?id=eq.' + MICREQ.reqId, { method:'PATCH', body:body })
        .then(function(r){ return (r && r[0]) || { id: MICREQ.reqId }; })
    : sb('micros_requests', { method:'POST', body:body })
        .then(function(r){ return r && r[0]; });

  return head.then(function(row){
    if (!row || !row.id) throw new Error('the request was not written down');
    MICREQ.reqId = row.id;
    return sb('micros_request_items?request_id=eq.' + row.id,
              { method:'DELETE', prefer:'return=minimal' })
      .then(function(){
        if (!take.length) return null;
        return sb('micros_request_items', { method:'POST', prefer:'return=minimal',
          body: take.map(function(r, i){
            return { request_id: row.id, recipe_id: r.id, position: i,
                     name: r.name, section: r.section,
                     family_code: micFamCode(r.section),
                     till_name: r.micros || null,
                     cost: r.cost == null ? null : r.cost,
                     price: r.price == null ? null : r.price,
                     net_price: r.price == null ? null : micNet(r.price) };
          }) });
      })
      .then(function(){ return row; });
  });
}

/* Dubai, always — the database writes UTC and a request sent at 1am here would read as
   the day before on every screen in the kitchen. */
function micWhen(iso, short){
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  var o = { timeZone:'Asia/Dubai', day:'numeric', month:'short' };
  if (!short){ o.year = 'numeric'; o.hour = '2-digit'; o.minute = '2-digit'; o.hour12 = false; }
  try { return d.toLocaleString('en-GB', o); } catch(e){ return String(iso).slice(0,10); }
}

/* A whole menu comes back off the database and a real request is four new dishes. What
   has already gone to Aung on a SENT request starts unticked — a draft is not a send,
   so a dish sitting on an unfinished draft is still offered. */
function micApplyNew(){
  if (!MICREQ.onlyNew) return;
  var before = micSentBefore(MICREQ.menuId);
  MICREQ.rows.forEach(function(r){ if (before[r.id]) r.take = false; });
}
/* Starting one from nothing. Everything about the LAST request has to go, or the new
   one quietly inherits a draft id and overwrites it. */
function micReset(){
  MICREQ.reqId = null; MICREQ.sent = 0; MICREQ.confirm = false;
  MICREQ.search = ''; MICREQ.onlyNew = true; MICREQ.rows = []; MICREQ.ready = false;
  MICREQ.missing = [];
  /* back to the default address, always. A one-off is a one-off. */
  MICREQ.to = null; MICREQ.cc = null;
}
function micOpenBuilder(menuId){
  var run = MENUS.filter(function(m){ return m.running; })[0];
  MICREQ.menuId = menuId || MICREQ.menuId || (run ? run.id : (MENUS[0]||{}).id);
  MICREQ.today  = new Date().toISOString().slice(0,10);
  S.step = 'micros'; render(); window.scrollTo(0,0);
  return loadMicros(MICREQ.menuId).then(function(){
    micApplyNew();
    if (S.step === 'micros') render();
  });
}
/* Reopening a draft, or starting a new one off something already sent. Both put the
   SAME dishes and the SAME till names back on the screen; only one of them keeps the
   id, because writing over a request that has already gone would rewrite history. */
function micLoadFrom(req, keepId){
  micReset();
  MICREQ.reqId  = keepId ? req.id : null;
  MICREQ.prefix = req.prefix || '';
  MICREQ.onlyNew = false;                 /* he has said which dishes; do not re-untick them */
  /* deliberately NOT the addresses that request used — a new request starts at the
     default, whatever the last one happened to be sent to */
  MICREQ.menuId = req.menu_id;
  MICREQ.today  = new Date().toISOString().slice(0,10);
  S.step = 'micros'; render(); window.scrollTo(0,0);
  return loadMicros(MICREQ.menuId).then(function(){
    var want = {}; (req.items||[]).forEach(function(it){ if (it.recipe_id) want[it.recipe_id] = it; });
    var found = {};
    MICREQ.rows.forEach(function(r){
      var it = want[r.id];
      r.take = !!it;
      if (it) found[r.id] = 1;
      /* his wording, not the machine's — and marked as his, so changing the prefix
         afterwards does not quietly rewrite what he typed last time */
      if (it && it.till_name){ r.micros = it.till_name; r.edited = true; }
    });
    /* A dish taken off the menu since, or a recipe deleted, cannot be ticked — and
       nothing ticked with no word said reads as the button having done nothing. */
    MICREQ.missing = (req.items||[])
      .filter(function(it){ return !it.recipe_id || !found[it.recipe_id]; })
      .map(function(it){ return it.name; });
    if (S.step === 'micros') render();
  });
}

/* ── the list of requests: the door this module opens on now ── */
function micReqsInner(){
  var list = MICREQ.list || [];
  var drafts = list.filter(function(q){ return !q.sent_at; });
  var sent   = list.filter(function(q){ return q.sent_at; });
  var card = function(q){
    var draft = !q.sent_at;
    return '<div class="mreq'+(draft?' draft':'')+'">' +
      '<span class="mreqpill'+(draft?' draft':'')+'">'+(draft?'Draft':'Sent')+'</span>' +
      '<span class="mreqnm">'+esc(q.menu_name||'a menu')+
        '<span>'+q.dish_count+' dish'+(q.dish_count===1?'':'es')+
        (draft ? ' · started '+esc(micWhen(q.created_at))
               : ' · '+esc(micWhen(q.sent_at))+
                 (q.sent_by_name ? ' by '+esc(q.sent_by_name) : '')+
                 (q.send_to ? ' · to '+esc(q.send_to) : ''))+
        '</span></span>' +
      '<span class="mreqacts">' +
        (draft
          /* a draft has been nowhere, so there is nothing to think about before it goes */
          ? '<button class="okb" data-mdraft="'+q.id+'">Open it</button>' +
            '<button class="newr" data-mdel="'+q.id+'">Throw it away</button>'
          : '<button class="okb" data-mreq="'+q.id+'">Review it</button>' +
            '<button class="newr" data-mfrom="'+q.id+'">Start a new one from it</button>' +
            '<button class="newr" data-mdelask="'+q.id+'">Remove it</button>') +
      '</span>' +
      /* ── removing one that has already gone ──
         It asks first, and it says the one thing that is easy to forget: taking it off
         this list does not un-send the email. Aung still has it. The only thing being
         thrown away is our own record of it — which, for a test sent to yourself, is
         exactly what you want, and for a real one is not. */
      (!draft && MICREQ.del === q.id ?
        '<div class="mreqask"><b>Remove this from the list?</b>' +
          '<div class="micaskl">' + q.dish_count + ' dish' + (q.dish_count===1?'':'es') +
            ' on <b>' + esc(q.menu_name||'a menu') + '</b>, sent ' + esc(micWhen(q.sent_at)) +
            (q.send_to ? ' to <b>' + esc(q.send_to) + '</b>' : '') + '.<br>' +
            'The email still went — this only throws away our record of it, and it cannot ' +
            'be brought back.</div>' +
          '<div class="micaskb"><button class="okb" data-mdelyes="'+q.id+'">Yes — remove it</button>' +
            '<button class="newr" id="mdelno" style="margin:0">Keep it</button>' +
            '<span class="brn" id="mdelst"></span></div></div>' : '') +
      '</div>';
  };
  return '<div class="pane">' +
    '<div class="q">Micros requests</div>' +
    howto('micreqs', 'Every request that has gone to ' + esc(MICMAIL.who) + ', and every one still ' +
      'half made. Open a sent one and it shows exactly what went — the till name, the cost and the ' +
      'price as they were on the day, not as the recipe reads now. Nothing on that screen can be ' +
      'changed: it is the record.', 'What this screen is') +
    '<div class="onpaper">' +
    '<div class="micbar"><button class="okb" id="micnew" style="margin:0">Make a new request</button>' +
      (MENUS.length ? '' : '<span class="brn bad">No menus yet — make one first on Saved recipes.</span>') +
    '</div>' +

    (MICNOTAB ?
      '<div class="todo"><b>Requests are not being kept yet.</b> The two tables they live in are ' +
      'not in the database. Run <b>micros-requests-schema.sql</b> once in the Kitchen project and ' +
      'this screen starts filling by itself — ' +
      '<a href="https://supabase.com/dashboard/project/zrpglswalgjbtghudmhu/sql/new" target="_blank" ' +
      'rel="noopener">open the SQL editor</a>. Making and sending a request works either way; ' +
      'without them there is simply no record afterwards.</div>' : '') +
    (MICREQ.listErr ? '<div class="todo"><b>Could not read the requests.</b> '+
      esc(plain(MICREQ.listErr))+'</div>' : '') +
    (!MICREQ.listReady ? '<div class="tip">Reading what has been sent…</div>' : '') +

    /* Drafts first, and no heading over either group: the pill on the card already
       says which it is, and a "SENT" heading over a "SENT" pill says it twice. */
    drafts.map(card).join('') + sent.map(card).join('') +
    (MICREQ.listReady && !list.length && !MICNOTAB ?
      '<div class="mreqempty"><b>Nothing has gone from here yet.</b><br>' +
      'Make a request and it is kept: which menu, which dishes, what price was on each line, ' +
      'who sent it and when. From then on this screen answers “did that go?” without anybody ' +
      'opening Outlook.</div>' : '') +

    /* ── the admin panel: the ONLY place the default addresses change ──
       Folded away, because it is not what anybody came here for — and open it and it
       says, in words, that this is the permanent one. Editing the address on the send
       screen changes that send and nothing after it. */
    '<div class="mradm">' +
      /* deliberately NOT class `howtob` — the click that opens a How-this-works panel is
         handled first and returns, so a shared class swallowed this button entirely */
      '<button class="mradmb" id="micadm">Who requests go to ' +
        '<span class="hwc">' + (MICREQ.admin ? '⌃' : '⌄') + '</span></button>' +
      (MICREQ.admin ?
        '<div class="mradmx">' +
          '<div class="tip" style="margin:0 0 10px">This is the <b>default</b> — where every new ' +
          'request opens addressed to. Changing an address on the send screen changes ' +
          '<b>that one send</b> and nothing after it; this is the only place the default moves.</div>' +
          (MICREQ.defErr === 'notable' ?
            '<div class="todo"><b>The setting is not in the database yet.</b> Requests go to the ' +
            'addresses they have always gone to. Run <b>micros-settings-schema.sql</b> once and ' +
            'this panel starts working — ' +
            '<a href="https://supabase.com/dashboard/project/zrpglswalgjbtghudmhu/sql/new" ' +
            'target="_blank" rel="noopener">open the SQL editor</a>.</div>'
           : MICREQ.defErr ? '<div class="todo"><b>Could not read the setting.</b> ' +
            esc(plain(MICREQ.defErr)) + '</div>' : '') +
          '<div class="mrto">' +
            '<label for="admto">Goes to</label>' +
            '<input id="admto" value="'+esc(MICREQ.adminTo)+'"'+(MICREQ.defErr?' disabled':'')+'>' +
            '<label for="admcc">Copy to</label>' +
