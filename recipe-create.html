/* ───── the method reads as steps ─────
   A dessert method is five or six things done in order, and written as one paragraph the
   cook at the pass has to read the whole block to find where he is. So the steps are
   RECOGNISED rather than demanded: a line each is a step, and a plain paragraph is still
   a perfectly good answer — it simply counts as one. Nothing is imposed on how he writes.

   The text stored is the text he typed. No new field, no format to learn, nothing to
   migrate — the line breaks he already puts in ARE the steps. */
function methodSteps(text){
  return String(text || '').split(/\r?\n/)
    .map(function(l){ return l.replace(/^\s*(?:\d+\s*[.)\-–]|[-–•*])\s*/, '').trim(); })
    .filter(function(l){ return l.length; });
}
/* Only ever offered, never done behind his back: it puts each sentence on its own line
   and he reads it back. A program guessing where a step ends inside "50 to 55 grams" and
   silently rewriting a method is not a trade worth making. */
function proseToSteps(text){
  return String(text || '').trim()
    .replace(/([.!?])\s+(?=[A-Z(])/g, '$1\n')
    .split(/\n/).map(function(l){ return l.trim(); }).filter(Boolean).join('\n');
}
function stepsNote(v){
  var st = methodSteps(v);
  if (!st.length) return '';
  if (st.length === 1){
    var words = st[0].split(/\s+/).length;
    /* a short one-liner is genuinely one step — leave him alone */
    if (words < 32) return '<div class="stepn">Reads as <b>one step</b>.</div>';
    return '<div class="stepn">Reads as <b>one step</b> of ' + words + ' words. ' +
      'At the pass that is a paragraph to read through.' +
      '<button class="stepb" id="mksteps">Put each sentence on its own line</button>' +
      '<span class="stepw">You can change any of it afterwards.</span></div>';
  }
  return '<div class="stepn">Reads as <b>' + st.length + ' steps</b>.' +
    '<ol class="steplist">' + st.map(function(s){
      return '<li>' + esc(s.length > 96 ? s.slice(0,96) + '…' : s) + '</li>'; }).join('') + '</ol></div>';
}

/* one textarea grows to whatever is written in it — no scrollbar inside a box */
function grow(t){ if (!t) return; t.style.height='auto'; t.style.height=(t.scrollHeight+2)+'px'; }
/* Every box has to be re-measured whenever the type size or the width changes —
   turning a phone on its side, or picking the sheet up off the laptop and using it
   with a finger, makes the same words take more lines. Sized once at 15px and left
   alone, the last steps of a method were cut off with nothing on screen to say so. */
/* textarea only — the dish code is a one-line input and sizing it by scrollHeight
   would stretch it to nothing on some browsers and a tall empty box on others */
function growAll(){ document.querySelectorAll('textarea.mbox').forEach(grow); }

/* Nothing typed into these boxes may depend on `S.method` already existing. It used

   record. One line, in front of every write, so no route into this sheet can ever
   swallow a method again. */
function mth(){ if (!S.method) S.method = emptyMethod(); return S.method; }
function wireMethod(){
  MSEC.forEach(function(s){

    t.addEventListener('input', function(){

    });
  });
  /* the floor's fields carry a live length against what one A4 actually holds */
  FSEC.forEach(function(s){
    var t = $('m-'+s.k); if (!t) return;
    grow(t);
    t.addEventListener('input', function(){
      mth()[s.k] = this.value; grow(this);

/* ── the backdrop, taken to a true white ──────────────────────────────────────────
   The Food Bible lays a dish photograph straight onto the paper with no frame: the
   white the dish was shot on is made to take the colour of the sheet, so the plate
   appears to sit on the page. That only works if the backdrop really is white. The
   house shoot is not — measured off the files, the ground runs 233–250 and carries a
   blue cast (243,244,249) against warm paper (251,247,240). Near enough to look right
   in a folder, far enough to print as a cool grey panel behind every plate.

   So it is fixed here, once, when the photo comes in, rather than asked of anybody.

   Two things it must not do. It must not touch a photograph that has no seamless
   backdrop — a plate on a table, a pass, a fridge — so the ground is measured first
   and anything dark or busy is left completely alone. And it must not eat the white
   china, which is only a little darker than the backdrop behind it. Hence the ramp:
   nothing below the floor moves at all, the ground is carried to white, and in between
   it eases, so no edge appears where the correction stops.

   Returns true if it changed anything, because the person who loaded the photo should
   be told the app touched it. */
function levelGround(ctx, w, h){
  var d, p;
  try { d = ctx.getImageData(0, 0, w, h); p = d.data; }
  catch(e){ return false; }                 /* never let a colour fix break an upload */

  /* the ground, read off a one-pixel border — a seamless backdrop reaches every edge */
  var lum = [], i, x, y, o;
  var stepX = Math.max(1, Math.floor(w/120)), stepY = Math.max(1, Math.floor(h/120));
  for (x = 0; x < w; x += stepX){
    for (y of [1, h-2]){ o = (y*w + x)*4; lum.push(0.299*p[o] + 0.587*p[o+1] + 0.114*p[o+2]); }
  }
  for (y = 0; y < h; y += stepY){
    for (x of [1, w-2]){ o = (y*w + x)*4; lum.push(0.299*p[o] + 0.587*p[o+1] + 0.114*p[o+2]); }
  }
  if (lum.length < 40) return false;
  lum.sort(function(a,b){ return a-b; });
  var pct = function(q){ return lum[Math.min(lum.length-1, Math.floor(lum.length*q))]; };
  /* Read at the MIDDLE of the border, not the darkest tenth of it. These plates are lit
     with a soft shadow that reaches the edge of the frame, so the darkest tenth is the
     shadow, not the backdrop — judged on that, the desserts came out as "no backdrop"
     and were left grey. The median is the paper the dish was stood on. */
  var g50 = pct(0.50), g90 = pct(0.90);

  /* not a studio backdrop: too dark to be one, or too varied to be seamless. A
     photograph of the dining room reads 81 here and is left completely alone. */
  if (g50 < 205 || (g90 - g50) > 30) return false;
  /* already white enough that touching it would only add risk */
  if (g50 >= 252) return false;

  /* a fixed 34-wide ramp under the backdrop: wide enough that the correction fades in
     invisibly, narrow enough that it never reaches down into the food */
  var HI = g90, LO = Math.max(150, HI - 34);
  var span = HI - LO, t;
  for (i = 0; i < p.length; i += 4){
    var L = 0.299*p[i] + 0.587*p[i+1] + 0.114*p[i+2];
    if (L <= LO) continue;
    t = L >= HI ? 1 : (L - LO) / span;
    t = t * t * (3 - 2*t);                  /* smoothstep — no visible seam at the join */
    p[i]   += (255 - p[i])   * t;
    p[i+1] += (255 - p[i+1]) * t;
    p[i+2] += (255 - p[i+2]) * t;
  }
  ctx.putImageData(d, 0, 0);
  return true;
}

/* A kitchen photo off a phone is 4–8 MB. Shrunk to the long side of 1400px it is
   still sharper than any screen it will be read on, and small enough to save with
   the recipe. Never re-encoded twice — this runs once, when the photo comes in. */
function shrinkPhoto(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), im = new Image();
    im.onload = function(){
      URL.revokeObjectURL(url);
      var w = im.naturalWidth, h = im.naturalHeight, MAX = 1400;
      if (!w || !h) return rej(new Error('that image could not be read'));
      var sc = Math.min(1, MAX/Math.max(w,h));
      var c = document.createElement('canvas');
      c.width = Math.round(w*sc); c.height = Math.round(h*sc);
      var cx = c.getContext('2d', { willReadFrequently:true });
      cx.drawImage(im, 0, 0, c.width, c.height);
      /* before the encode, not after — the backdrop is corrected on the pixels the
         recipe will actually keep, and the photo is still only encoded once */
      var levelled = levelGround(cx, c.width, c.height);
      res({ u: c.toDataURL('image/jpeg', 0.75), n: file.name || 'photo', levelled: levelled });
    };
    im.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('that is not an image the app can open')); };
    im.src = url;
  });
}
function addPhotos(files){
  var list = [].slice.call(files).filter(function(f){ return /^image\//.test(f.type); });
  var note = $('pnote'); if (note) note.textContent = 'Adding '+list.length+' photo'+(list.length===1?'':'s')+'…';
  if (!list.length){
    if (note) note.textContent = 'That is not a photo — pick a picture off the phone or take one.';
    return;
  }
  var bad = [];
  Promise.all(list.map(function(f){
    return shrinkPhoto(f).catch(function(e){ bad.push(f.name); return null; });
  })).then(function(out){
    var ok = out.filter(Boolean), cleaned = 0;
    ok.forEach(function(p){
      if (p.levelled) cleaned++;
      /* the flag is for the sentence below, not for the recipe — only the photo and its
         name are kept, so nothing new lands in the saved record */
      S.photos.push({ u: p.u, n: p.n });
    });
    drawMethod();
    var n = $('pnote');
    if (n && bad.length) n.textContent = bad.length+' could not be read — '+bad.join(', ')+'. The rest are here.';
    else if (n) n.textContent = S.photos.length+' photo'+(S.photos.length===1?'':'s') +
      /* say it plainly: the app changed the picture, and this is what it did */
      (cleaned ? ' · backdrop taken to white on '+(cleaned===1?'one':cleaned) : '') +
      ' · Save to keep them';
  });
}

function foot(){
  if (S.step !== 'sheet') return;
  var t = totals();
  var mk   = (S.makesQty && S.makesQty > 0) ? S.makesQty : null;
  var each = mk ? t.total / mk : null;              /* per portion, or per kg / L / piece */
  var net  = S.price ? S.price/1.225 : null;
  var fc   = (net && each != null) ? each/net*100 : null;
  /* When a batch in this dish carries no cost, or an ingredient has no price on the
     stock take, every one of these figures is a FLOOR, not the number. It used to be
     printed in the same type as a finished one with the reason underneath, and 15.3%
     against a real 23.6% is the kind of figure a menu gets priced on. Say "at least"
     on the face of it, so the number can never be read as settled. */
  var short_ = !!(t.badBatch.length || t.noPrice || t.noProd || t.noQty);
  var least  = function(v){ return short_ ? '<span class="atleast">at least</span> ' + v : v; };
  var mu   = S.makesUnit || (S.kind==='main' ? 'portions' : 'kg');
  /* the one thing that must survive being collapsed: a number that is knowably short,
     or a batch with no "makes", is not something to hide behind a tap */
  var needsSaying = (mk==null) ? (S.kind==='batch' ? 'no “makes” yet' : 'no portions yet')
                  : t.badBatch.length ? t.badBatch.length + ' batch' + (t.badBatch.length===1?'':'es') + ' with no cost'
                  : t.noPrice ? t.noPrice + ' with no price'
                  : t.noProd ? t.noProd + ' without an ingredient'
                  : '';
  var mkIn = '<input class="pr" id="mk" inputmode="decimal" placeholder="—" style="width:56px" value="'+(S.makesQty==null?'':S.makesQty)+'">';
  var muSel = '<select class="mu" id="mu">' + ['kg','L','pcs'].map(function(u){
                return '<option value="'+u+'"'+(mu===u?' selected':'')+'>'+u+'</option>'; }).join('') + '</select>';
  /* ── out of the way while he works ──
     This bar is fixed to the bottom, and open it is two hundred pixels of the sheet
     he cannot see. A chef writing a recipe is reading the rows, not the food cost —
     so it sits as one slim line and opens when he wants it, which is when he is
     pricing rather than when he is typing.

     The line still carries the two numbers worth a glance, cost and food cost, so
     collapsing it never means losing sight of where the dish is. */
  var f = $('foot');
  f.classList.toggle('shut', !!S.footShut);
  if (S.footShut){
    f.innerHTML = '<div class="slim" id="footopen">' +
      '<span class="sv">'+(short_?'at least ':'')+fmt(t.total)+' <small>AED</small></span>' +
      (S.kind==='main'
        ? '<span class="sv">'+(fc==null?'—':(short_?'at least ':'')+fmt(fc,1)+'%')+' <small>FOOD COST</small></span>'
        : '<span class="sv">'+(each==null?'—':(short_?'at least ':'')+fmt(each))+' <small>PER '+esc(mu.replace('pcs','PIECE').toUpperCase())+'</small></span>') +
      (needsSaying ? '<span class="sflag">'+needsSaying+'</span>' : '') +
      '<span class="sopenb">Open the costing ▼</span></div>';   /* it opens downward now */
    padForFoot();
    drawAlg();
    return;
  }
  f.innerHTML = '<div class="in"><div class="grp">' +
    '<div><div class="l">Cost</div><div class="v">'+least(fmt(t.total))+' <small>AED</small></div></div>' +
    (S.kind==='main'
      ? '<div><div class="l">Makes</div><div class="v">'+mkIn+' <small>PORTIONS</small></div></div>' +
        '<div><div class="l">Each portion</div><div class="v">'+(each==null?'—':least(fmt(each)))+' <small>AED</small></div></div>' +
        '<div><div class="l">Menu price</div><div class="v"><input class="pr" id="pr" inputmode="decimal" placeholder="—" value="'+(S.price==null?'':S.price)+'"></div></div>' +
        '<div><div class="l">Food cost</div><div class="v">'+(fc==null?'—':least(fmt(fc,1)+'%'))+'</div></div>'
      : '<div><div class="l">Makes</div><div class="v">'+mkIn+' '+muSel+'</div></div>' +
        '<div><div class="l">Per '+mu.replace('pcs','piece')+'</div><div class="v">'+(each==null?'—':least(fmt(each)))+' <small>AED</small></div></div>') +
    '</div>' +
    (mk==null
      ? '<div class="todo">'+(S.kind==='batch'
          ? '<b>Say how much this batch makes.</b> Without it nothing can use it — a recipe that links this batch would have no cost for the line.'
          : '<b>Say how many portions this makes.</b> Until then there is no cost per portion and no food cost.')+'</div>'
      : '') +
    (t.badBatch.length
      ? '<div class="todo"><b>'+t.badBatch.map(esc).join(' and ')+' carr'+(t.badBatch.length===1?'ies':'y')+' no cost yet.</b> ' +
        'This total is lower than the real one until '+(t.badBatch.length===1?'that batch is':'those batches are')+' finished.</div>'
      : '') +
    (t.noPrice
      ? '<div class="todo"><b>'+t.noPrice+' ingredient'+(t.noPrice===1?' has':'s have')+' no price on the stock take.</b> ' +
        'This cost is lower than the real one until Aung prices them.</div>'
      : '') +
    (t.noProd || t.noQty
      ? '<div class="todo">'+[t.noProd?t.noProd+' without an ingredient':'', t.noQty?t.noQty+' without a quantity':'']

/* Fixed to the bottom means the last rows of the sheet live underneath it. Measure

/* re-render the footer without losing the cursor */
function liveInput(id, set){

/* ───────── events ───────── */
document.addEventListener('change', function(e){
  var t = e.target, i = t.dataset.i;
  if (i == null) return;
  var r = S.rows[+i];
  if (t.classList.contains('prod') && (t.value === '__add' || t.value === '__batch')){
    var act = t.value; t.value = r.code || '';        /* the dropdown is not the answer, it starts one */
    /* Open the form on the unit he already wrote. It defaulted to kg, so "0.5 L" met
       a form that said "sold by kg" and the litres were quietly re-read as grams. */
    if (act === '__add'){
      r.adding = true; r.adj = false;
      if (!r.addUnit) r.addUnit = soldByOf(r.unit || r.typedUnit);
      redrawRow(+i);
      var f = document.querySelector('[data-i="'+i+'"][data-f="anm"]'); if (f){ f.focus(); f.select(); }
    } else makeBatchFor(+i);
    return;
  }
  if (t.classList.contains('prod')){
    var wasStale = isStale(r), oldCode = r.code, oldName = itemOf(r) && itemOf(r).name;
    r.code = t.value || null;
    if (wasStale && r.code && r.code !== oldCode){
      SWAPS.push({ from:oldCode, fromName:oldName, to:r.code,

/* ───────── bringing in more than one file ─────────
   The à la carte folder is sixty workbooks and one of them — Risotto Bosco — holds
   five recipes on its own. One file at a time meant sixty trips through pick, read,
   review, create, and that is the difference between an afternoon and a week.

   Every file is read, and a file that cannot be read is NAMED. Silently dropping
   three of sixty and showing a confident total is how you find out in November that
   Rombo was never written. */
var READABLE = /\.(xlsx|xlsm|xls|csv|docx|pdf)$/i;

function readMany(fileList){
  var files = [].slice.call(fileList).filter(function(f){ return READABLE.test(f.name); });
  var skipped = [].slice.call(fileList).length - files.length;
  if (!files.length) return Promise.reject(new Error(
    skipped ? 'none of those ' + skipped + ' files is an Excel, Word or PDF file'
            : 'no files picked'));

  /* "Reading…" and nothing else is indistinguishable from a page that has died —
     which is exactly what it looked like. Say which file it is on, and once it has
     been going a while say that a big folder takes minutes, so waiting is a decision
     rather than a guess. The file name is also the one thing needed to find out
     WHICH workbook stopped it, if one ever does. */
  var st = $('brs'), done = 0, now = '', began = new Date().getTime();
  var say = function(){
    if (!st) return;
    st.className = 'brn';
    var slow = (new Date().getTime() - began) > 15000;
    st.textContent = 'Reading ' + done + ' of ' + files.length + (now ? ' — ' + now : '') + '…' +
      (slow ? '  (' + files.length + ' files takes a few minutes — leave it running)' : '');
  };
  say();

  /* Read them in small groups. Sixty spreadsheets opened at once on a laptop that is
     also running service is how a tab dies with no message at all. */
  var out = [], failed = [], i = 0;
  function step(){
    if (i >= files.length) return Promise.resolve();
    var group = files.slice(i, i + 4); i += 4;
    return Promise.all(group.map(function(f){
      now = f.name; say();
      try { console.log('[recipes import] reading', f.name); } catch(x){}
      return readAnyFile(f)
        .then(function(res){
          done++; say();
          var stem = f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim();
          (res.recipes||[]).forEach(function(r){
            if (!r.name) r.name = stem;
            r.how = res.how; r.file = f.name;
            out.push(r);
          });
          if (!(res.recipes||[]).length)
            failed.push({ name:f.name, why:'nothing in it looks like a recipe' });
        })
        .catch(function(e){ done++; say(); failed.push({ name:f.name, why:plain(e.message) });
          try { console.warn('[recipes import] could not read', f.name, e); } catch(x){} });
    })).then(step);
  }

  return step().then(function(){
    return { recipes:out, failed:failed, files:files.length, skipped:skipped,
             how:(out[0] && out[0].how) || 'the files' };
  });
}

function handlePicked(fileList){
  if (!fileList || !fileList.length) return;
  /* ── take a copy of the list, now, before anything is read ──
     The input is reset the instant this returns — `this.value=''` — so that picking
     the SAME file twice still fires. Resetting it empties the live FileList this
     argument points at, and every look at fileList[0] after the read is therefore a
     look at nothing.

     That is the bug that stopped a workbook importing all day. It only bit a single
     file holding MORE than one recipe — the ordinary case, a dish with its sub-recipes
     — because that path is the one that reads fileList[0].name to label the screen.
     It threw, the catch below read the same dead thing and threw again, and a thrown
     error inside a catch reaches nobody: no message, and "Reading 1 of 1" on screen
     for ever. It looked like a hang and it was never a hang.

     Every test I ran passed because a hand-built array does not empty itself. */
  var files = [].slice.call(fileList);
  if (!files.length) return;
  var many = files.length > 1;
  var st = $('brs');
  if (st){ st.className = 'brn'; st.textContent = 'Reading ' + (many ? files.length + ' files…' : files[0].name + '…'); }

  readMany(files).then(function(res){
    if (!res.recipes.length){
      throw new Error(res.failed.length
        ? 'none of those ' + res.files + ' files could be read. ' +
          res.failed.slice(0,3).map(function(f){ return f.name + ' — ' + f.why; }).join('; ') +
          (res.failed.length > 3 ? '; and ' + (res.failed.length-3) + ' more' : '')
        : 'nothing in that file looks like a recipe — I need a Quantity / Unit / Name list, ' +
          'like your Standard Recipe Form');
    }
    /* One recipe out of one file still goes straight to the sheet, exactly as before —
       nothing about the single-file way of working changes. */
    if (!many && res.recipes.length === 1 && !res.failed.length){
      useImported(res.recipes[0]);
    } else {
      res.fileName = many ? res.files + ' files' : files[0].name;
      S.found = res; S.fq = ''; S.step = 'found';
    }
    render(); window.scrollTo(0,0);
  }).catch(function(err){
    var s = $('brs');
    /* Name the file. "Cannot read properties of undefined" tells a chef nothing and
       tells whoever has to fix it nothing either — which of sixty workbooks was it? */
    var which = many ? 'one of those ' + files.length + ' files'
                     : '“' + files[0].name + '”';
    var msg = plain(err.message);
    if (/undefined|null|not a function|Cannot read/i.test(msg))
      msg = 'the app tripped over something in it (' + msg + '). Send me the file and ' +
            'I will make it read — nothing has been saved.';
    if (s){ s.className = 'brn bad'; s.textContent = 'Could not use ' + which + ' — ' + msg; }
    try { console.error('[recipes import]', files.map(function(f){ return f.name; }), err); } catch(x){}
  });
}

function toggleMic(){

  MIC = new SR();

  var settled = S.text;

      var t = ev.results[i][0].transcript;

    reflow();
  };
  MIC.onerror = function(ev){
    if (st){ st.className='brn bad';
      st.textContent = ev.error==='not-allowed' ? 'The microphone is blocked — allow it for this page.'
                                                : 'The microphone stopped — ' + ev.error; }
  };
  MIC.onend = function(){ MIC = null; var b2=$('mic'); if (b2){ b2.textContent='🎤 Say it'; b2.classList.remove('on'); }
    var s2=$('brs'); if (s2 && !/blocked|stopped/.test(s2.textContent)) s2.textContent='Stopped. Check what it heard before you make the sheet.'; };
  try { MIC.start(); } catch(e){}
  if (btn){ btn.textContent = '● Listening — tap to stop'; btn.classList.add('on'); }
  if (st){ st.className='brn'; st.textContent = 'Say them one at a time: "two hundred grams octopus".'; }
}

$('bmn').addEventListener('change', function(){
  var v = this.value;
  this.selectedIndex = 0;                    /* the closed control shows the summary, never a pick */
  if (!v) return;
  if (v === '__new'){ openNewMenu(); return; }
  if (v === '__all'){ MENUSALL = true; drawBarMenu(); return; }
  if (v === '__manage'){ openMenus(); return; }
  var at = (S.menus || []).indexOf(v);
  if (at > -1) S.menus.splice(at, 1); else (S.menus = S.menus || []).push(v);
  drawBarMenu(); drawSaveBar();
  var box = $('mnubox'); if (box) box.innerHTML = menuInner();
  persistMenus(at > -1 ? 'Taken off ' + menuName(v) + ' ✓' : 'On ' + menuName(v) + ' ✓');
});
$('bmnok').addEventListener('click', makeMenuFromBar);
$('bmncx').addEventListener('click', closeNewMenu);
$('bmnn').addEventListener('keydown', function(e){
  if (e.key === 'Enter'){ e.preventDefault(); makeMenuFromBar(); }
  if (e.key === 'Escape') closeNewMenu();
});
window.addEventListener('resize', fitBarMenu);

$('bsc').addEventListener('change', function(){
  S.section = this.value;
  this.className = 'bsec' + (S.section ? '' : ' none');
  if (!S.id) return;                       /* not saved yet — it goes with the recipe on Save */
  var sel = this;
  sb('recipes?id=eq.'+S.id, { method:'PATCH', prefer:'return=minimal',
      body:{ section:S.section||null, updated_at:new Date().toISOString() } })
    .then(function(){ flag(sel, S.section ? 'Moved to '+S.section+' ✓' : 'Section cleared ✓', false); })
    .catch(function(err){ flag(sel, 'Not changed — '+plain(err.message), true); });
});
/* a short note beside a control, so a one-tap change still says it landed */
function flag(el, msg, bad){
  var old = $('bflag'); if (old) old.remove();
  var s = document.createElement('span');
  s.id = 'bflag'; s.className = 'bflag' + (bad ? ' bad' : ''); s.textContent = msg;
  el.parentNode.insertBefore(s, el.nextSibling);
  if (!bad) setTimeout(function(){ var n=$('bflag'); if (n===s) n.remove(); }, 2600);
}
$('tosaved').addEventListener('click', function(){
  if (S.step === 'saved'){ S.step = S.back || 'type'; render(); return; }
  /* Saved recipes means the whole book, every time. Keeping the folder he was last in
     dropped him back inside "A la carte 2026 · Pasta" — one section of one menu, and if
     that section had emptied since, an empty screen. Back still walks the folders one
     layer at a time; this button always opens at the top. */
  S.fmenu = null; S.fsec = null; S.sq = '';
  S.back = S.step; S.step = 'saved'; render(); window.scrollTo(0,0);
  loadSaved().then(function(){ if (S.step==='saved') render(); });
});
$('tolist').addEventListener('click', function(){
  if (S.step === 'list'){ S.step = S.back || 'type'; render(); return; }
  /* opening the list on its own is not about any one batch */
  S.offer = null; S.find = null;
  S.back = S.step; S.step = 'list'; render(); window.scrollTo(0,0);
});
/* ── one step back, from anywhere ──
   Every screen in this module now knows the screen behind it, in ONE place. The label
   on the button and what the button does are read from the same answer, so a Back that
   says "to the recipe" cannot land somewhere else — the old version worked this out
   twice and only in the click.

   `null` means there is genuinely nowhere behind: the first screen, and the Micros
   request when it is opened as its own module, where the module's own bar goes back. */
var STEPNAME = { type:'main or batch', write:'the ingredients', sheet:'the recipe',
                 found:'the recipes found', bringall:'bringing them all in',
                 list:"Aung's list", saved:'Saved recipes', foh:'the floor’s half',
                 micros:'the Micros request', menus:'the menus', todo:'what needs finishing' };
/* Where Saved recipes and Aung's list go back to is whatever screen sent them there,
   held in S.back. Opening the Micros request from Saved recipes overwrites S.back with
   'saved' — so coming back off Micros landed on Saved recipes pointing at ITSELF, and
   Back stopped working. A step never goes back to itself: fall through to the recipe
   if there is one, then to the ingredients, then to the first screen. */
function notSelf(to){
  if (to && to !== S.step) return to;
  if (S.id || (S.rows||[]).length) return 'sheet';
  if (S.kind) return 'write';
  return 'type';
}
function backStep(){
  var s = S.step;
  if (s === 'list') return { to: notSelf(S.back) };
  /* opened as its own door there is nothing behind it — the module's bar goes back */
  if (s === 'todo') return S.back === 'todo' ? null : { to: notSelf(S.back) };
  /* Saved recipes is now folders, so Back comes out of them one layer at a time —
     out of the search first, then out of the section, then out of the menu, and only
     then off the screen. Backing straight out of an open folder loses your place. */
  if (s === 'saved'){
    if (S.sq)    return { to:'saved', clearSq:true,   name:'the folders' };
    if (S.fsec)  return { to:'saved', clearSec:true,  name:menuNameOf(S.fmenu) === 'A menu that is no longer there'
                                                            ? 'the sections' : menuNameOf(S.fmenu) };
    if (S.fmenu) return { to:'saved', clearMenu:true, name:'all the menus' };
    return { to: notSelf(S.back) };
  }
  /* inside a menu, Back is out of it to the list — not off the screen altogether */
  if (s === 'menus')   return MENUADM.open ? { to:'menus', openNull:true } : { to: notSelf(S.back) };
  if (s === 'found')   return { to:'type' };
  /* once they are created, going back to a screen offering to create them again
     is a trap — send him to the list of what is now saved instead */
  if (s === 'bringall') return S.planRan ? { to:'saved', clearPlan:true, setBack:'type' }
                                         : { to:'found' };
  if (s === 'foh')     return { to:'sheet' };
  if (s === 'micros')  return S.back === 'micros' ? null : { to: notSelf(S.back || 'saved') };
  /* Only if the recipe on the screen actually CAME out of that file. Backing out of a
     workbook, tapping Main recipes to start something of his own and pressing Back put
     him straight back on the file list — a loop with no way out, because a blank recipe
     he typed himself has nothing to do with a workbook he opened ten minutes ago. */
  if (s === 'write' && S.imported && S.found && S.found.recipes.length > 1) return { to:'found' };
  var o = ['type','write','sheet'], i = o.indexOf(s);
  /* This used to be guarded, because going back rebuilt the rows from the typed text and
     every ingredient picked by hand was lost. It does not any more: the sheet and the
     text are kept in step, and reflow() keeps a row that is already there rather than
     making a new one. Nothing is lost by stepping back, so nothing needs asking. */
  if (i > 0) return { to:o[i-1] };
  return null;
}
function drawBack(){
  var b = $('back'), w = $('backw'); if (!b) return;
  var t = backStep();
  b.classList.toggle('hide', !t);
  if (!t) return;
  var name = t.name ? t.name : t.openNull ? 'all menus' : (STEPNAME[t.to] || 'the last screen');
  if (w) w.textContent = 'Back to ' + name;
  b.title = 'Back to ' + name;
  b.setAttribute('aria-label', 'Back to ' + name);
}
function goBack(){
  var t = backStep(); if (!t) return;
  var move = function(){
    if (t.clearPlan) S.plan = null;
    if (t.setBack) S.back = t.setBack;
    if (t.openNull) MENUADM.open = null;
    if (t.clearSq)   S.sq = '';
    if (t.clearSec)  S.fsec = null;
    if (t.clearMenu){ S.fmenu = null; S.fsec = null; }
    S.step = t.to; render(); window.scrollTo(0,0);
  };
  if (t.guarded) guard(move); else move();
}
$('back').addEventListener('click', goBack);
$('back').addEventListener('keydown', function(e){
  if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); goBack(); }
});

/* Everything pinned to the top publishes its real height, and everything below sticks to
   the sum. Three bands, three numbers, none of them typed in.

   getBoundingClientRect, never offsetHeight: offsetHeight is a rounded integer, and a
   48.5px strip reporting 48 is enough for the column titles to creep under it. And the
   costing only counts while it is SHUT — opened it is in the flow, so it holds nothing. */
function fitBar(){
  var s = document.documentElement.style;
  var b = document.querySelector('.bar');
  if (b) s.setProperty('--barh', Math.ceil(b.getBoundingClientRect().height)+'px');
  var f = document.getElementById('foot');
  var shut = f && f.style.display !== 'none' && f.classList.contains('shut');
  s.setProperty('--costh', shut ? Math.ceil(f.getBoundingClientRect().height)+'px' : '0px');
  var fl = document.getElementById('flashes');
  s.setProperty('--msgh', fl && fl.children.length
    ? Math.ceil(fl.getBoundingClientRect().height)+'px' : '0px');
  var w = document.querySelector('.sheetwrap'), t = w && w.querySelector('table.sheet');
  if (w && t) w.classList.toggle('scrollx', t.scrollWidth > w.clientWidth + 1);
  fitBarMenu();
  growAll();
}
window.addEventListener('resize', fitBar);
window.addEventListener('orientationchange', fitBar);
/* Closing the tab is the one exit the app cannot draw a bar on. This is the browser's
   own question, not ours — it is the only thing standing between a shut lid and an
   afternoon of work. */
window.addEventListener('beforeunload', function(ev){
  /* Put it down BEFORE asking. The question alone was the whole safety net, and a
     question only helps if somebody is there to answer it: a chef writing on a phone
     gets a call, the browser drops the tab in the background, and nothing is asked at
     all — the sheet, the method and the floor's words are simply gone. Parked first, the
     worst case is he comes back to it in Unsaved work. */
  parkCurrent();
  if (!isDirty()) return;
  ev.preventDefault(); ev.returnValue = '';
});
/* beforeunload is the one that does NOT fire when a phone evicts a background tab —
   visibilitychange is. This is the one that actually saves the work on a phone. */
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'hidden') parkCurrent();
});
/* the serif and the sans arrive after the first paint — the same words measure
   differently once they land, so measure again when they do */
if (document.fonts && document.fonts.ready) document.fonts.ready.then(growAll);

/* ───────── does every number actually fit in its box? ─────────
   A clipped figure is worse than a missing one — "0.005" cut to "0.00" reads as
   a real number and is wrong. This was found by eye on a screenshot, twice too late,
   so it is a check now: run checkFit() in the console, or from a test, and it names
   every box whose text is wider than the box. Empty array = nothing is cut off.
   Run it at 1280 AND at 380 wide — the narrow rules shrink the boxes too. */
function checkFit(){
  var bad = [], cv = document.createElement('canvas').getContext('2d');
  function note(el, text, box, needs){
    if (needs - box > 1) bad.push({ what: el.tagName.toLowerCase() + (el.className ? '.'+el.className : ''),
                                    text: String(text).trim().slice(0,24),
                                    boxPx: Math.round(box), needsPx: Math.round(needs),
                                    cutPx: Math.round(needs - box) });
  }
  document.querySelectorAll('table.sheet input.cell, table.sheet td').forEach(function(el){
    if (el.tagName === 'TD' && el.children.length) return;              /* leaf cells only */
    note(el, el.value != null && el.value !== '' ? el.value : el.textContent, el.clientWidth, el.scrollWidth);
  });
  /* a select's scrollWidth is its WIDEST OPTION, not what shows — measure the
     selected text instead, or the check screams about every long ingredient name */
  document.querySelectorAll('table.sheet select').forEach(function(el){
    var o = el.options[el.selectedIndex]; if (!o) return;
    var cs = getComputedStyle(el);
    cv.font = cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily;
    var pad = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    note(el, o.text, el.clientWidth - pad, cv.measureText(o.text).width);  /* padding-right already holds the arrow */
  });
  return bad;
}
window.checkFit = checkFit;

/* The app around this page reloads itself when a new version is deployed. It cannot
   see inside this document, so it asks: is there work in here to lose?

   Deliberately WIDER than isDirty(). isDirty() answers "is there something to save",
   which needs rows on the sheet — but a chef part way through typing his ingredients
   has no rows yet and everything to lose. So typed text counts, a name counts, and a
   file being read counts. Being told a minute later that an update is ready is
   nothing; losing a half-typed recipe is the one thing this module must never do. */
window.__rcpDirty = function(){
  try {
    if (isDirty()) return true;
    /* Unsaved work does NOT count. It is on the machine and comes back after a reload,
       and this answer is what the shell's update guard asks before refreshing the app:
       saying yes here meant the app could never update again while anything sat in the
       list — which, now that the list survives, is for ever. Only what is on the screen
       and would actually be lost holds an update back. */
    if (String(S.text || '').trim()) return true;
    if (!S.id && String(S.name || '').trim()) return true;
    if (S.found || S.plan) return true;              /* mid-import, reviewing what was read */
    if (S.step === 'micros' && MICREQ.rows.some(function(r){ return r.edited; })) return true;
    return false;
  } catch(e){ return false; }
};

/* ── opened from the Recipes module ──
   `?id=` opens that recipe straight onto its sheet, `?new=1` starts a blank one, and
   `&embed=1` drops this page's own back-button chrome because the module around it
   already owns the navigation. Opened on its own, none of this fires and the page
   behaves exactly as before. */
var Q = new URLSearchParams(location.search);
if (Q.get('embed') === '1') document.documentElement.classList.add('embed');

render();
fitBar();
/* Your own ingredients come in before anything is drawn from the sheet, so a recipe
   opened by ?id= finds them already on the list and its lines keep their cost. */
/* `?micros=1` opens the Micros request as a module of its own — its own door on the
   Recipes page, not a button buried inside Saved recipes. It is the same screen and
   the same code; only the way in is different. The menu has to be read before it can
   open, so the screen says so rather than flashing an empty list. */
/* `?todo=1` opens what needs finishing as a door of its own, for the same reason the
   Micros request has one: a chef checking whether anything is half written should not
   have to go into Create new recipes, then into Saved recipes, to find out. */
var MICSOLO = Q.get('micros') === '1', TODOSOLO = Q.get('todo') === '1';
if (TODOSOLO){
  S.back = 'todo'; S.step = 'todo'; render();
  Promise.all([loadSaved(), loadBatches()]).then(function(){ if (S.step==='todo') render(); });
}
loadMenus().then(function(){
  if (MICSOLO){
    if (!MENUS.length){ flash('No menus yet — make one first on Saved recipes.', true); return; }
    var run = MENUS.filter(function(m){ return m.running; })[0];
    MICREQ.menuId = MICREQ.menuId || (run ? run.id : MENUS[0].id);
    MICREQ.today  = new Date().toISOString().slice(0,10);
    S.back = 'micros'; S.step = 'micros'; MICREQ.ready = false; render();
    loadMicros(MICREQ.menuId).then(function(){ if (S.step==='micros') render(); });
    return;
  }
  if (TODOSOLO) return;
  if (S.step==='sheet' || S.step==='saved') render();
  /* the bar's menu control is empty until the menus land — redraw it whatever step
     he is on, or a recipe started before the read finished never gets asked */
  drawBarMenu();
});
loadMine().then(function(){
  refreshOpts();
  if (S.step === 'sheet'){ rows(); foot(); }
  if (S.step === 'list') render();
});
loadBatches().then(function(){ if (S.step==='sheet'){ rows(); } foot(); });
/* what was half written last time is still half written. Read it back BEFORE the first
   screen is drawn, or the list is in hand and the panel is not on the page. */
loadPark();
if (parkedList().length) render();

/* Into the strip under the costing, never onto the body — appended to the body it was
   floating, and floating is what put it inside the costing bar. `.remove()` is still the
   contract: callers hold the node and take it away themselves. */
function flash(msg, bad){
  var m = document.createElement('div');
  m.className = 'openerr' + (bad ? ' bad' : '');
  var i = document.createElement('div');
  i.className = 'in'; i.textContent = msg;
  m.appendChild(i);
  (document.getElementById('flashes') || document.body).appendChild(m);
  fitBar();
  /* it has to go on its own, or the strip stays and the sheet keeps the space forever */
  setTimeout(function(){ if (m.parentNode){ m.remove(); fitBar(); } }, bad ? 9000 : 5000);
  return m;
}
if (Q.get('id')){
  var wait = flash('Opening the recipe…');
  openRecipe(Q.get('id'))
    .then(function(){ wait.remove(); render(); rows(); foot(); })
    .catch(function(e){
      wait.remove();
      flash('That recipe could not be opened — ' + e.message, true);
    });
} else if (Q.get('new') === '1'){
  S.step = 'type'; render();
}
</script>
