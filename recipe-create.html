var MIC = null;
function toggleMic(){
  var btn = $('mic'), st = $('brs');
  if (MIC){ MIC.stop(); return; }
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  MIC = new SR();
  MIC.lang = 'en-GB'; MIC.continuous = true; MIC.interimResults = true;
  var settled = S.text;
  MIC.onresult = function(ev){
    var live = '';
    for (var i = ev.resultIndex; i < ev.results.length; i++){
      var t = ev.results[i][0].transcript;
      if (ev.results[i].isFinal) settled = (settled ? settled.replace(/,\s*$/,'') + ',\n' : '') + t.trim();
      else live += t;
    }
    S.text = settled + (live ? (settled ? ',\n' : '') + live : '');
    var dp = $('dp'); if (dp) dp.value = S.text;
    reflow();
  };
  MIC.onerror = function(ev){
    if (st){ st.className='brn bad';
      st.textContent = ev.error==='not-allowed' ? 'The microphone is blocked — allow it for this page.'
                                                : 'The microphone stopped — ' + ev.error; }
  };
  MIC.onend = function(){ MIC = null; var b2=$('mic'); if (b2){ b2.textContent='🎤 Say it'; b2.classList.remove('on'); }
    var s2=$('brs'); if (s2 && !/blocked|stopped/.test(s2.textContent)) s2.textContent='Stopped. Check what it heard before you make the sheet.'; };
  try { MIC.start(); } catch(e){}
  if (btn){ btn.textContent = '● Listening — tap to stop'; btn.classList.add('on'); }
  if (st){ st.className='brn'; st.textContent = 'Say them one at a time: "two hundred grams octopus".'; }
}

$('bmn').addEventListener('change', function(){
  var v = this.value;
  this.selectedIndex = 0;                    /* the closed control shows the summary, never a pick */
  if (!v) return;
  if (v === '__new'){ openNewMenu(); return; }
  if (v === '__all'){ MENUSALL = true; drawBarMenu(); return; }
  if (v === '__manage'){ openMenus(); return; }
  var at = (S.menus || []).indexOf(v);
  if (at > -1) S.menus.splice(at, 1); else (S.menus = S.menus || []).push(v);
  drawBarMenu(); drawSaveBar();
  var box = $('mnubox'); if (box) box.innerHTML = menuInner();
  persistMenus(at > -1 ? 'Taken off ' + menuName(v) + ' ✓' : 'On ' + menuName(v) + ' ✓');
});
$('bmnok').addEventListener('click', makeMenuFromBar);
$('bmncx').addEventListener('click', closeNewMenu);
$('bmnn').addEventListener('keydown', function(e){
  if (e.key === 'Enter'){ e.preventDefault(); makeMenuFromBar(); }
  if (e.key === 'Escape') closeNewMenu();
});
window.addEventListener('resize', fitBarMenu);

$('bsc').addEventListener('change', function(){
  S.section = this.value;
  this.className = 'bsec' + (S.section ? '' : ' none');
  if (!S.id) return;                       /* not saved yet — it goes with the recipe on Save */
  var sel = this;
  sb('recipes?id=eq.'+S.id, { method:'PATCH', prefer:'return=minimal',
      body:{ section:S.section||null, updated_at:new Date().toISOString() } })
    .then(function(){ flag(sel, S.section ? 'Moved to '+S.section+' ✓' : 'Section cleared ✓', false); })
    .catch(function(err){ flag(sel, 'Not changed — '+plain(err.message), true); });
});
/* a short note beside a control, so a one-tap change still says it landed */
function flag(el, msg, bad){
  var old = $('bflag'); if (old) old.remove();
  var s = document.createElement('span');
  s.id = 'bflag'; s.className = 'bflag' + (bad ? ' bad' : ''); s.textContent = msg;
  el.parentNode.insertBefore(s, el.nextSibling);
  if (!bad) setTimeout(function(){ var n=$('bflag'); if (n===s) n.remove(); }, 2600);
}
$('tosaved').addEventListener('click', function(){
  if (S.step === 'saved'){ S.step = S.back || 'type'; render(); return; }
  /* Saved recipes means the whole book, every time. Keeping the folder he was last in
     dropped him back inside "A la carte 2026 · Pasta" — one section of one menu, and if
     that section had emptied since, an empty screen. Back still walks the folders one
     layer at a time; this button always opens at the top. */
  S.fmenu = null; S.fsec = null; S.sq = '';
  S.back = S.step; S.step = 'saved'; render(); window.scrollTo(0,0);
  loadSaved().then(function(){ if (S.step==='saved') render(); });
});
/* ── the whole book, one page ──
   Francesco asked for every question in one place rather than opening 34
   recipes and hoping none slipped past. That screen existed but had no way in,
   so it may as well not have.

   Gated on the same PIN the app already uses (2468, the schedule one) because
   one tap in there rewrites a word across every recipe that carries it. It is
   his screen and the chefs do not need it — their help is on the sheet already. */
$('tobook').addEventListener('click', function(){
  var p = prompt('The book check changes wording across every recipe.\nEnter the PIN to open it.');
  if (p === null) return;                          /* cancelled — say nothing */
  if (p.trim() !== '2468'){ flash('Wrong PIN — nothing opened.', true); return; }
  location.href = 'writing-review.html';
});
$('tolist').addEventListener('click', function(){
  if (S.step === 'list'){ S.step = S.back || 'type'; render(); return; }
  /* opening the list on its own is not about any one batch */
  S.offer = null; S.find = null;
  S.back = S.step; S.step = 'list'; render(); window.scrollTo(0,0);
});
/* ── one step back, from anywhere ──
   Every screen in this module now knows the screen behind it, in ONE place. The label
   on the button and what the button does are read from the same answer, so a Back that
   says "to the recipe" cannot land somewhere else — the old version worked this out
   twice and only in the click.

   `null` means there is genuinely nowhere behind: the first screen, and the Micros
   request when it is opened as its own module, where the module's own bar goes back. */
var STEPNAME = { type:'main or batch', write:'the ingredients', sheet:'the recipe',
                 found:'the recipes found', bringall:'bringing them all in',
                 list:"Aung's list", saved:'Saved recipes', foh:'the floor’s half',
                 micros:'the Micros request', menus:'the menus', todo:'what needs finishing',
                 micreqs:'the Micros requests', micpast:'the request' };
/* Where Saved recipes and Aung's list go back to is whatever screen sent them there,
   held in S.back. Opening the Micros request from Saved recipes overwrites S.back with
   'saved' — so coming back off Micros landed on Saved recipes pointing at ITSELF, and
   Back stopped working. A step never goes back to itself: fall through to the recipe
   if there is one, then to the ingredients, then to the first screen. */
function notSelf(to){
  if (to && to !== S.step) return to;
  if (S.id || (S.rows||[]).length) return 'sheet';
  if (S.kind) return 'write';
  return 'type';
}
function backStep(){
  var s = S.step;
  if (s === 'list') return { to: notSelf(S.back) };
  /* opened as its own door there is nothing behind it — the module's bar goes back */
  if (s === 'todo') return S.back === 'todo' ? null : { to: notSelf(S.back) };
  /* Saved recipes is now folders, so Back comes out of them one layer at a time —
     out of the search first, then out of the section, then out of the menu, and only
     then off the screen. Backing straight out of an open folder loses your place. */
  if (s === 'saved'){
    if (S.sq)    return { to:'saved', clearSq:true,   name:'the folders' };
    if (S.fsec)  return { to:'saved', clearSec:true,  name:menuNameOf(S.fmenu) === 'A menu that is no longer there'
                                                            ? 'the sections' : menuNameOf(S.fmenu) };
    if (S.fmenu) return { to:'saved', clearMenu:true, name:'all the menus' };
    return { to: notSelf(S.back) };
  }
  /* inside a menu, Back is out of it to the list — not off the screen altogether */
  if (s === 'menus')   return MENUADM.open ? { to:'menus', openNull:true } : { to: notSelf(S.back) };
  if (s === 'found')   return { to:'type' };
  /* once they are created, going back to a screen offering to create them again
     is a trap — send him to the list of what is now saved instead */
  if (s === 'bringall') return S.planRan ? { to:'saved', clearPlan:true, setBack:'type' }
                                         : { to:'found' };
  if (s === 'foh')     return { to:'sheet' };
  /* Building one and reviewing one both go back to the list of requests — that is the
     screen behind them whichever door was used to get in. The list itself is the front
     door when it is opened as its own module, and then the module's own bar goes back. */
  /* opened by tapping a dish name on a Micros screen, Back goes to the screen he was
     actually on — not down the type → ingredients → recipe chain */
  if (s === 'sheet' && S.micReturn) return { to:S.micReturn, clearMicReturn:true };
  if (s === 'micros')  return { to:'micreqs' };
  if (s === 'micpast') return { to:'micreqs' };
  if (s === 'micreqs') return S.back === 'micreqs' ? null : { to: notSelf(S.back || 'saved') };
  /* Only if the recipe on the screen actually CAME out of that file. Backing out of a
     workbook, tapping Main recipes to start something of his own and pressing Back put
     him straight back on the file list — a loop with no way out, because a blank recipe
     he typed himself has nothing to do with a workbook he opened ten minutes ago. */
  if (s === 'write' && S.imported && S.found && S.found.recipes.length > 1) return { to:'found' };
  var o = ['type','write','sheet'], i = o.indexOf(s);
  /* This used to be guarded, because going back rebuilt the rows from the typed text and
     every ingredient picked by hand was lost. It does not any more: the sheet and the
     text are kept in step, and reflow() keeps a row that is already there rather than
     making a new one. Nothing is lost by stepping back, so nothing needs asking. */
  if (i > 0) return { to:o[i-1] };
  return null;
}
function drawBack(){
  var b = $('back'), w = $('backw'); if (!b) return;
  var t = backStep();
  b.classList.toggle('hide', !t);
  if (!t) return;
  var name = t.name ? t.name : t.openNull ? 'all menus' : (STEPNAME[t.to] || 'the last screen');
  if (w) w.textContent = 'Back to ' + name;
  b.title = 'Back to ' + name;
  b.setAttribute('aria-label', 'Back to ' + name);
}
function goBack(){
  var t = backStep(); if (!t) return;
  var move = function(){
    if (t.clearPlan) S.plan = null;
    if (t.setBack) S.back = t.setBack;
    if (t.openNull) MENUADM.open = null;
    if (t.clearSq)   S.sq = '';
    if (t.clearSec)  S.fsec = null;
    if (t.clearMenu){ S.fmenu = null; S.fsec = null; }
    if (t.clearMicReturn) S.micReturn = null;
    /* coming back onto the requests, read them again — a draft kept a moment ago, or a
       request that has just gone, has to be on the list he lands on */
    if (t.to === 'micreqs'){
      MICREQ.open = null; MICREQ.del = null;
      micLoadList().then(function(){ if (S.step === 'micreqs') render(); });
    }
    S.step = t.to; render(); window.scrollTo(0,0);
  };
  if (t.guarded) guard(move); else move();
}
$('back').addEventListener('click', goBack);
$('back').addEventListener('keydown', function(e){
  if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); goBack(); }
});
/* the type badge is a button when a recipe is open, so it answers the keyboard like one */
$('bty').addEventListener('keydown', function(e){
  if (!canAskKind()) return;
  if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); if (S.kindAsk) closeKind(); else askKind(); }
});

/* Everything pinned to the top publishes its real height, and everything below sticks to
   the sum. Three bands, three numbers, none of them typed in.

   getBoundingClientRect, never offsetHeight: offsetHeight is a rounded integer, and a
   48.5px strip reporting 48 is enough for the column titles to creep under it. And the
   costing only counts while it is SHUT — opened it is in the flow, so it holds nothing. */
function fitBar(){
  var s = document.documentElement.style;
  var b = document.querySelector('.bar');
  if (b) s.setProperty('--barh', Math.ceil(b.getBoundingClientRect().height)+'px');
  var f = document.getElementById('foot');
  var shut = f && f.style.display !== 'none' && f.classList.contains('shut');
  s.setProperty('--costh', shut ? Math.ceil(f.getBoundingClientRect().height)+'px' : '0px');
  var fl = document.getElementById('flashes');
  s.setProperty('--msgh', fl && fl.children.length
    ? Math.ceil(fl.getBoundingClientRect().height)+'px' : '0px');
  var w = document.querySelector('.sheetwrap'), t = w && w.querySelector('table.sheet');
  if (w && t) w.classList.toggle('scrollx', t.scrollWidth > w.clientWidth + 1);
  fitBarMenu();
  growAll();
}
window.addEventListener('resize', fitBar);
window.addEventListener('orientationchange', fitBar);
/* Closing the tab is the one exit the app cannot draw a bar on. This is the browser's
   own question, not ours — it is the only thing standing between a shut lid and an
   afternoon of work. */
window.addEventListener('beforeunload', function(ev){
  /* Put it down BEFORE asking. The question alone was the whole safety net, and a
     question only helps if somebody is there to answer it: a chef writing on a phone
     gets a call, the browser drops the tab in the background, and nothing is asked at
     all — the sheet, the method and the floor's words are simply gone. Parked first, the
     worst case is he comes back to it in Unsaved work. */
  parkCurrent();
  if (!isDirty()) return;
  ev.preventDefault(); ev.returnValue = '';
});
/* beforeunload is the one that does NOT fire when a phone evicts a background tab —
   visibilitychange is. This is the one that actually saves the work on a phone. */
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'hidden') parkCurrent();
});
/* the serif and the sans arrive after the first paint — the same words measure
   differently once they land, so measure again when they do */
if (document.fonts && document.fonts.ready) document.fonts.ready.then(growAll);

/* ───────── does every number actually fit in its box? ─────────
   A clipped figure is worse than a missing one — "0.005" cut to "0.00" reads as
   a real number and is wrong. This was found by eye on a screenshot, twice too late,
   so it is a check now: run checkFit() in the console, or from a test, and it names
   every box whose text is wider than the box. Empty array = nothing is cut off.
   Run it at 1280 AND at 380 wide — the narrow rules shrink the boxes too. */
function checkFit(){
  var bad = [], cv = document.createElement('canvas').getContext('2d');
  function note(el, text, box, needs){
    if (needs - box > 1) bad.push({ what: el.tagName.toLowerCase() + (el.className ? '.'+el.className : ''),
                                    text: String(text).trim().slice(0,24),
                                    boxPx: Math.round(box), needsPx: Math.round(needs),
                                    cutPx: Math.round(needs - box) });
  }
  document.querySelectorAll('table.sheet input.cell, table.sheet td').forEach(function(el){
    if (el.tagName === 'TD' && el.children.length) return;              /* leaf cells only */
    note(el, el.value != null && el.value !== '' ? el.value : el.textContent, el.clientWidth, el.scrollWidth);
  });
  /* a select's scrollWidth is its WIDEST OPTION, not what shows — measure the
     selected text instead, or the check screams about every long ingredient name */
  document.querySelectorAll('table.sheet select').forEach(function(el){
    var o = el.options[el.selectedIndex]; if (!o) return;
    var cs = getComputedStyle(el);
    cv.font = cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily;
    var pad = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    note(el, o.text, el.clientWidth - pad, cv.measureText(o.text).width);  /* padding-right already holds the arrow */
  });
  return bad;
}
window.checkFit = checkFit;

/* The app around this page reloads itself when a new version is deployed. It cannot
   see inside this document, so it asks: is there work in here to lose?

   Deliberately WIDER than isDirty(). isDirty() answers "is there something to save",
   which needs rows on the sheet — but a chef part way through typing his ingredients
   has no rows yet and everything to lose. So typed text counts, a name counts, and a
   file being read counts. Being told a minute later that an update is ready is
   nothing; losing a half-typed recipe is the one thing this module must never do. */
window.__rcpDirty = function(){
  try {
    if (isDirty()) return true;
    /* Unsaved work does NOT count. It is on the machine and comes back after a reload,
       and this answer is what the shell's update guard asks before refreshing the app:
       saying yes here meant the app could never update again while anything sat in the
       list — which, now that the list survives, is for ever. Only what is on the screen
       and would actually be lost holds an update back. */
    if (String(S.text || '').trim()) return true;
    if (!S.id && String(S.name || '').trim()) return true;
    if (S.found || S.plan) return true;              /* mid-import, reviewing what was read */
    if (S.step === 'micros' && MICREQ.rows.some(function(r){ return r.edited; })) return true;
    return false;
  } catch(e){ return false; }
};

/* ── opened from the Recipes module ──
   `?id=` opens that recipe straight onto its sheet, `?new=1` starts a blank one, and
   `&embed=1` drops this page's own back-button chrome because the module around it
   already owns the navigation. Opened on its own, none of this fires and the page
   behaves exactly as before. */
var Q = new URLSearchParams(location.search);
if (Q.get('embed') === '1') document.documentElement.classList.add('embed');

render();
fitBar();
/* Your own ingredients come in before anything is drawn from the sheet, so a recipe
   opened by ?id= finds them already on the list and its lines keep their cost. */
/* `?micros=1` opens the Micros request as a module of its own — its own door on the
   Recipes page, not a button buried inside Saved recipes. It is the same screen and
   the same code; only the way in is different. The menu has to be read before it can
   open, so the screen says so rather than flashing an empty list. */
/* `?todo=1` opens what needs finishing as a door of its own, for the same reason the
   Micros request has one: a chef checking whether anything is half written should not
   have to go into Create new recipes, then into Saved recipes, to find out. */
var MICSOLO = Q.get('micros') === '1', TODOSOLO = Q.get('todo') === '1';
if (TODOSOLO){
  S.back = 'todo'; S.step = 'todo'; render();
  Promise.all([loadSaved(), loadBatches()]).then(function(){ if (S.step==='todo') render(); });
}
loadMenus().then(function(){
  if (MICSOLO){
    /* the door opens on the REQUESTS, not on a blank form. A chef coming here is as
       likely to be checking whether something went as making a new one — and the menus
       not being there yet is a reason to say so on the list, not to show nothing. */
    var run = MENUS.filter(function(m){ return m.running; })[0];
    MICREQ.menuId = MICREQ.menuId || (run ? run.id : (MENUS[0]||{}).id);
    MICREQ.today  = new Date().toISOString().slice(0,10);
    S.back = 'micreqs'; S.step = 'micreqs'; render();
    micLoadList().then(function(){ if (S.step==='micreqs') render(); });
    return;
  }
  if (TODOSOLO) return;
  if (S.step==='sheet' || S.step==='saved') render();
  /* the bar's menu control is empty until the menus land — redraw it whatever step
     he is on, or a recipe started before the read finished never gets asked */
  drawBarMenu();
});
loadMine().then(function(){
  refreshOpts();
  if (S.step === 'sheet'){ rows(); foot(); }
  if (S.step === 'list') render();
});
loadBatches().then(function(){ if (S.step==='sheet'){ rows(); } foot(); });
/* what was half written last time is still half written. Read it back BEFORE the first
   screen is drawn, or the list is in hand and the panel is not on the page. */
loadPark();
if (parkedList().length) render();

/* Into the strip under the costing, never onto the body — appended to the body it was
   floating, and floating is what put it inside the costing bar. `.remove()` is still the
   contract: callers hold the node and take it away themselves. */
/* the one banner the ▲ ▼ arrows reuse — see the [data-mv] branch */
var MVFLASH = null;
function flash(msg, bad){
  var m = document.createElement('div');
  m.className = 'openerr' + (bad ? ' bad' : '');
  var i = document.createElement('div');
  i.className = 'in'; i.textContent = msg;
  m.appendChild(i);
  (document.getElementById('flashes') || document.body).appendChild(m);
  fitBar();
  /* it has to go on its own, or the strip stays and the sheet keeps the space forever */
  setTimeout(function(){ if (m.parentNode){ m.remove(); fitBar(); } }, bad ? 9000 : 5000);
  return m;
}
/* The words the kitchen has already ruled on. Fired and forgotten on purpose:
   the table may not exist yet, and until it does the answers live on the
   device — so nothing here is allowed to hold up opening a recipe. */
if (window.WritingHelp) WritingHelp.loadTerms();

if (Q.get('id')){
  var wait = flash('Opening the recipe…');
  openRecipe(Q.get('id'))
    .then(function(){ wait.remove(); render(); rows(); foot(); })
    .catch(function(e){
      wait.remove();
      flash('That recipe could not be opened — ' + e.message, true);
    });
} else if (Q.get('new') === '1'){
  S.step = 'type'; render();
}
</script>
