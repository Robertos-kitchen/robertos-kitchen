function openRecipe(id){
  /* two requests, not a join — recipe_lines points at recipes twice (its own, and a linked batch) */
  return loadBatches().then(function(){ return Promise.all([
    sb('recipes?id=eq.'+id+'&select=*'),
    sb('recipe_lines?recipe_id=eq.'+id+'&select=*&order=position')
  ]).then(function(both){
    var rec = both[0] && both[0][0]; if (!rec) throw new Error('that recipe is no longer there');
    S.whole = true;          /* read straight off the record — the sheet holds all of it */
    S.id = rec.id; S.kind = rec.kind; S.name = rec.name || ''; S.section = rec.section || '';
    S.makesQty = rec.makes_qty; S.makesUnit = rec.makes_unit;
    S.price = rec.menu_price; S.text = '';
    S.method = normMethod(rec.method);
    S.photos = Array.isArray(rec.photos) ? rec.photos.filter(function(p){ return p && p.u; }) : [];
    S.bigPhoto = null;
    S.allergens = Array.isArray(rec.allergens) ? rec.allergens.slice() : [];

    var lines = both[1] || [];
    S.rows = lines.map(function(l){
      /* one saved line is one ingredient — read it whole, don't re-split it into words.
         The trailing #n is the internal tag that keeps two identical lines apart. */
      var clean = String(l.typed_text||'').replace(/#\d+$/,'');
      var q = parseQty(clean);
      var r = mkRow({ raw:clean, name:q.name || clean, qty:q.qty, unit:q.unit });
      r.raw = l.typed_text || r.raw;
      r.code = l.child_recipe_id ? ('R:'+l.child_recipe_id) : (l.stock_code || null);
      /* the item must still be reachable from this row's options, or the chef re-picks it */
      if (r.code && !itemOf(r)){
        var hit = pool().filter(function(i){ return i.code === r.code; })[0];
        if (hit) r.opts = [hit].concat(r.opts); else r.code = null;
      }
      r.qty = l.qty; r.unit = l.unit || null;
      r.adj = !!l.trim_on; r.yield = l.yield_pct==null?100:l.yield_pct; r.waste = l.waste_pct==null?0:l.waste_pct;
      if (r.code && !itemOf(r)) r.code = null;
      return r;
    });
    S.text = S.rows.map(function(r){ return r.raw; }).join(', ');
    S.step = 'sheet';
    /* the menus have to be in hand BEFORE the clean signature is taken, or they land
       a moment later and the sheet announces unsaved work he never did */
    return loadRecipeMenus(rec.id).then(function(){
      markClean();             /* just off the database — nothing to save yet */
    });
  }); });
}
var RETIRED = {};      /* codes that are no longer on the newest stock take */
var SWAPS = [];        /* old code -> new code, applied to every recipe at once */
function isStale(r){ return !!(r.code && RETIRED[r.code]); }
function freeOnPurpose(it){ return !!(it && it.mine && it.price === 0); }
function noPriceYet(it){ return !!(it && it.price === 0 && !it.mine); }

function mkRow(part){
  if (typeof part === 'string') part = { raw:part, name:part, qty:null, unit:null };
  var opts = search(part.name), loose = false;
  if (!opts.length){
    /* "Seabass Fillett sliced" is his wording, not Aung's — try the shorter phrase.
       These are suggestions only: a loose match is NEVER picked for you. */
    /* only real words — "LE Campaillou" must not fall back to "LE" and offer 34 lemons */
    var w = words(part.name).filter(function(x){ return x.length >= 3; });
    for (var n = w.length - 1; n >= 1 && !opts.length; n--){
      opts = search(w.slice(0, n).join(' '));
      if (!opts.length) opts = search(w.slice(w.length - n).join(' '));
    }
    loose = opts.length > 0;
  }
  var r = { raw:part.raw, word:part.name, opts:opts, loose:loose,
            code: (!loose && opts.length === 1) ? opts[0].code : null,   /* auto only when there's no choice to make */
            qty:part.qty, unit:null, yield:100, waste:0, adj:false };
  var it = itemOf(r);
  r.typedUnit = part.unit || null;      /* what he actually wrote, checked again once he picks */
  if (part.unit === '?'){               /* a tablespoon / a clove / a pinch is not a measurement */
    r.noMeasure = true; r.qty = null; r.unit = null;
  } else if (part.unit){                /* keep what the chef wrote if this item can be measured that way */
    if (!it){
      /* Nothing is picked yet, so there is nothing to check the unit against — and
         `unitsFor(null)` answers "g / kg" for everything, which is a guess, not a
         check. Throwing the unit away here is what turned "5 L water" into a bare 5
         while the sheet went on showing "g", and what later let "0.5 L" be re-read as
         0.5 ml once the ingredient was added. Keep exactly what he wrote. It is
         checked properly the moment an ingredient is picked, and only then. */
      r.unit = part.unit;
    } else {
      var allowed = unitsFor(it);
      r.unit = allowed.indexOf(part.unit) > -1 ? part.unit
             : (part.unit==='kg'&&allowed.indexOf('g')>-1) ? 'kg'
             : (part.unit==='L'&&allowed.indexOf('ml')>-1) ? 'L' : null;
      if (!r.unit){ r.mismatch = part.unit; r.qty = null; }   /* never reinterpret 2 pcs as 2 g */
    }
  } else if (part.qty != null && it && baseOf(it) !== 'pcs'){
    /* "1 lemon" — a bare count of something sold by weight. One gram is not what he meant. */
    r.bare = part.qty; r.qty = null;
  }
  /* the costing sheet gives Aung's own code — that is an exact match, not a guess */
  var h = S.hints && S.hints[part.raw];
  if (h){
    if (h.code){
      var exact = ING.filter(function(x){ return String(x.code) === String(h.code); })[0];
      if (!exact) r.goneCode = h.code;                 /* the file names a code Aung no longer lists */
      else if (!nameAgrees(part.name, exact.name)){
        /* codes get re-used. A code that now points at something else is the most
           dangerous kind of match, because it looks exact. Never take it. */
        r.codeMoved = { code:h.code, now:exact.name };
        r.opts = [exact].concat(r.opts.filter(function(o){ return o.code !== exact.code; }));
        r.code = null;
      } else {
        r.opts = [exact].concat(r.opts.filter(function(o){ return o.code !== exact.code; }));
        r.code = exact.code; r.loose = false; r.byCode = true;
        var al = unitsFor(exact);
        if (al.indexOf(r.unit) < 0) r.unit = defUnit(exact);
      }
    }
    if (h.isSub && !r.byCode){                          /* it is one of his own sub-recipes */
      r.wantBatch = true; r.code = null; r.mismatch = null;
      r.qty = part.qty; r.unit = part.unit || null;      /* keep what the file said */
    }
    if (h.waste){ r.adj = true; r.waste = h.waste; }
  }
  return r;
}
/* do the file's name and Aung's name for that code describe the same thing at all? */
function nameAgrees(a, b){
  var wb = words(b).map(stem);
  return words(a).map(stem).some(function(w){ return w.length > 2 && wb.indexOf(w) > -1; });
}
function itemOf(r){ return r.code ? r.opts.filter(function(o){ return o.code===r.code; })[0] : null; }
function badUnit(r){ var it = itemOf(r); return !!it && !basePrice(it); }
function rowCost(r){
  /* July is the list. Something that has left it has no price — we do not carry
     May's or June's figure forward, because a stale price is a wrong price. */
  if (isStale(r)) return null;
  var it = itemOf(r); if (!it || !r.qty) return null;
  var bp = basePrice(it); if (!bp) return null;
  var c = qtyInBase(r.qty, r.unit || defUnit(it)) * bp.v;
  return c / ((r.yield||100)/100) * (1 + (r.waste||0)/100);
}
/* the one sentence that shows what the two boxes actually did, live */
function ywSum(r){
  var raw = rowCostRaw(r), net = rowCost(r);
  /* the numbers only when there ARE numbers: "— AED becomes — AED" is worse than
     saying nothing, and a line pointing at an unfinished batch has no cost at all */
  if (raw == null || net == null) return 'This line carries no cost yet, so there is nothing to show for it.';
  return 'Here that is <b>' + fmt(raw) + ' AED</b> → <b>' + fmt(net) + ' AED</b>.';
}
/* What the line costs BEFORE yield and waste — the quantity that actually goes in the
   dish, at list price. Only used to show, side by side, what the two boxes did: they
   move the COST, never the quantity, and that was never said anywhere on screen. */
function rowCostRaw(r){
  if (isStale(r)) return null;
  var it = itemOf(r); if (!it || !r.qty) return null;
  var bp = basePrice(it); if (!bp) return null;
  return qtyInBase(r.qty, r.unit || defUnit(it)) * bp.v;
}
function totals(){
  var t=0, noProd=0, noQty=0, noPrice=0, badBatch=[];
  S.rows.forEach(function(r){
    if (!r.code){ noProd++; return; }
    var it = itemOf(r);
    if (it && it.myBatch && it.problem) badBatch.push(it.name);
    else if (noPriceYet(it)) noPrice++;
    if (!r.qty){ noQty++; return; }
    var c = rowCost(r); if (c!=null) t += c;
  });
  return { total:t, noProd:noProd, noQty:noQty, noPrice:noPrice, badBatch:badBatch };
}

/* ═════════ bringing a recipe in — Excel, Word, PDF, or spoken ═════════
   Every route ends in the same place: the words go in the box, you see the split,
   you pick the ingredients. A file fills the sheet; it never picks for you. */

var LIBS = {};
function lazy(src, check){                       /* only downloads when you actually use it */
  if (window[check]) return Promise.resolve(window[check]);
  if (LIBS[src]) return LIBS[src];
  LIBS[src] = new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = src;
    s.onload  = function(){ window[check] ? res(window[check]) : rej(new Error('the reader did not start')); };
    s.onerror = function(){ rej(new Error('could not load the reader for that kind of file')); };
    document.head.appendChild(s);
  });
  return LIBS[src];
}

/* GRM/ML/PCS are his words. A pinch is not a measurement — it gets no quantity. */
var UNITMAP = { grm:'g', gr:'g', g:'g', gm:'g', gram:'g', grams:'g', kg:'kg', kgs:'kg', kilo:'kg', kilogram:'kg',
                ml:'ml', mls:'ml', l:'L', ltr:'L', lt:'L', litre:'L', liter:'L',
                pcs:'pcs', pc:'pcs', piece:'pcs', pieces:'pcs', each:'pcs', ea:'pcs', nos:'pcs' };
function mapUnit(u){
  var k = String(u||'').toLowerCase().replace(/[^a-z]/g,'');
  return UNITMAP[k] || null;                     /* pinch, qb, to taste → nothing, on purpose */
}
function cell(v){ return String(v==null?'':v).replace(/\s+/g,' ').trim(); }
/* like cell(), but a line break inside the cell is content, not whitespace — a method
   is written as a list of steps in one merged cell and must come out as a list */
function mcell(v){
  return String(v==null?'':v).replace(/\r\n?/g,'\n').replace(/[ \t ]+/g,' ')
           .split('\n').map(function(x){ return x.trim(); }).join('\n')
           .replace(/\n{3,}/g,'\n\n').trim();
}
function isNum(v){ return v!=='' && v!=null && isFinite(String(v).replace(',','.')); }

var LABELROW = /standard recipe form|recipe name|outlet name|categor|prepared by/i;
/* "Quantity", "Qty" — and QANTITY, which is how the 2020 and 2022 templates spell it.
   That single missing U meant the quantity column was never found, so every line was
   skipped and about seventy real recipes came back as "nothing in it looks like a
   recipe". Written once, here, and used by both the row test and the column lookup. */
var QTYCOL = /^\s*q(?:ty|[a-z]*ity|uantit[a-z]*)\b/i;
function isHeaderRow(c){
  var j = c.join(' ').toLowerCase();
  return (/\bquantity\b|\bqty\b/.test(j) || c.some(function(x){ return QTYCOL.test(x); }))
      && /name of the item|ingredient|item|description/.test(j);
}
function findCol(c, re){ for (var i=0;i<c.length;i++) if (re.test(c[i])) return i; return -1; }
function labelVal(rows, re){                      /* "Nos of Serving:" … 3.41 */
  for (var r=0;r<rows.length;r++){
    var c = rows[r].map(cell), i = findCol(c, re);
    if (i < 0) continue;
    for (var k=i+1;k<c.length;k++) if (isNum(c[k])) return parseFloat(String(c[k]).replace(',','.'));
  }
  return null;
}
/* One sheet can hold several forms stacked on top of each other — split them first,
   or the next form's "Prepared by: Chef Andrea" arrives as an ingredient. */
function splitForms(rows){
  var hdr = [];
  rows.forEach(function(r,i){ if (isHeaderRow(r.map(cell))) hdr.push(i); });
  if (hdr.length <= 1) return [rows];
  return hdr.map(function(h,k){
    var start = k===0 ? 0 : h-1, floor = k===0 ? 0 : hdr[k-1]+1;
    while (start > floor && LABELROW.test(rows[start-1].map(cell).join(' '))) start--;
    var end = (k+1 < hdr.length)
      ? (function(){ var s = hdr[k+1]-1, f = h+1;
          while (s > f && LABELROW.test(rows[s-1].map(cell).join(' '))) s--;
          return s; })()
      : rows.length;
    return rows.slice(start, end);
  });
}

/* One Standard Recipe Form — as rows of cells. Works for Excel and for a Word table. */
function readForm(rows){
  var name='', cat='', hdr=-1, qi=0, ui=1, ni=2;
  for (var r=0; r<rows.length; r++){
    var c = rows[r].map(cell), joined = c.join(' ').toLowerCase();
    if (!name && /recipe name/.test(joined))  name = c.slice(c.findIndex(function(x){ return /recipe name/i.test(x); })+1).filter(Boolean)[0] || '';
    if (!cat  && /categor/.test(joined))      cat  = c.slice(c.findIndex(function(x){ return /categor/i.test(x); })+1).filter(Boolean)[0] || '';
    if (hdr<0 && isHeaderRow(c)){
      hdr = r;
      c.forEach(function(x,i){
        if (QTYCOL.test(x)) qi=i;
        else if (/^unit/i.test(x)) ui=i;
        else if (/name of the item|^ingredient|^item|^description/i.test(x)) ni=i;
      });
    }
  }
  if (hdr < 0) return null;

  /* The costing template carries far more: Aung's own code per line, an I/R column
     saying which lines are sub-recipes, wastage, servings and the selling price. */
  var h = rows[hdr].map(cell);
  var ci = findCol(h, /^code$/i), ri = findCol(h, /^i\s*\/\s*r$/i), wi = findCol(h, /^wastage/i);
  var costing = ci > -1 || ri > -1;
  if (costing){
    qi = findCol(h, /^qty$/i);
    if (qi < 0) qi = findCol(h, QTYCOL);            /* quantity, and their QANTITY */
    if (qi < 0) qi = findCol(h, /quantity/i);
    ui = findCol(h, /^unit/i);
    ni = findCol(h, /ingredient|name of the item/i);
  }

  /* The small sub-recipes — chives, pomegranate, mustard leaves — have no
     "Preparation Method" block at all. Their method is one sentence written in a
     column headed Method, on the ingredient's own row. It is still the chef's
     words and it was being thrown away. "Notes" is left alone: it is empty. */
  var mi = findCol(h, /^method$/i), mnotes = [];

  var lines=[], noUnit=[], hints={}, units={}, subs=[];
  for (var k=hdr+1; k<rows.length; k++){
    var c = rows[k].map(cell);
    if (/preparation method|^method\b/i.test(c.join(' '))) break;
    if (LABELROW.test(c.join(' ')) || isHeaderRow(c)) break;   /* the next form has started */
    /* before the ingredient check — a second line of the method sits on a row of its
       own with no ingredient beside it ("keep it ready for service") and was lost */
    if (mi > -1 && mcell(rows[k][mi])) mnotes.push(mcell(rows[k][mi]));
    var nm = cell(c[ni]); if (!nm) continue;
    var q = cell(c[qi]), u = mapUnit(c[ui]);
    var qty = isNum(q) ? String(q).replace(',','.') : null;
    if (qty && !u && !costing){ noUnit.push(nm); qty = null; }   /* never turn a pinch into a gram */
    if (costing && !qty) continue;                               /* the blank filler rows */
    var line = (qty ? qty + (u ? ' '+u : '') + ' ' : '') + nm;
    lines.push(line);
    if (costing){
      if (u) units[u] = (units[u]||0) + 1;
      var code = ci>-1 ? cell(c[ci]) : '', isSub = ri>-1 && /^r$/i.test(cell(c[ri]));
      var wst  = wi>-1 && isNum(cell(c[wi])) ? parseFloat(cell(c[wi])) : null;
      if (code || isSub || wst) hints[line] = { code:code||null, isSub:isSub, waste:wst };
      if (isSub) subs.push(nm);
    }
  }
  if (!lines.length) return null;

  /* The method, kept whole with his own headings — and kept as LINES.
     cell() flattens every run of whitespace to one space, which is right for an
     ingredient name and wrong for a method: one cell holds all twelve steps with
     newlines between them, and flattening them ran the whole thing into a single
     unreadable paragraph AND glued "Plating Method" onto the first step so the
     heading could not be found. mcell() tidies each line but keeps the breaks. */
  var method = '';
  for (var m=hdr; m<rows.length; m++){
    var j = rows[m].map(cell).join(' ');
    if (/preparation method/i.test(j)){
      method = rows.slice(m).map(function(rr){ return rr.map(mcell).filter(Boolean).join('\n'); })
                   .join('\n').replace(/^\s*preparation method\s*:?\s*/i,'')
                   .replace(/\n{3,}/g,'\n\n').trim();
      break;
    }
  }
  if (!method && mnotes.length) method = mnotes.join('\n');
  var kind = /sub[\s-]?recipe|prep|batch/i.test(cat) ? 'batch' : 'main';
  name = name.replace(/^\s*R\s*-\s*/i, '');    /* their "R - Pappa al pomodoro" is the same thing
                                                  the main recipe calls "Pappa al pomodoro" */
  var out = { name:name, cat:cat, lines:lines, method:method, noUnit:noUnit, kind:kind,
              hints:hints, subs:subs, costing:costing };
  if (costing){
    var serves = labelVal(rows, /nos of serving/i), pw = labelVal(rows, /portion weight/i);
    if (kind === 'batch'){
      var base = Object.keys(units).sort(function(a,b){ return units[b]-units[a]; })[0] || 'kg';
      if (serves){ out.makesQty = +(serves * (pw || 1)).toFixed(4); out.makesUnit = base; }
    } else if (serves){ out.makesQty = serves; out.makesUnit = 'portions'; }
    var sp = labelVal(rows, /suggested selling price/i);
    if (kind === 'main' && sp) out.price = sp;
  }
  return out;
}

/* ═════════ Antonio's sheets ═════════
   The bread and pastry recipes are not on the Standard Recipe Form at all — they are
   a baker's sheet, and they were coming back as "nothing in it looks like a recipe".
   Two shapes, both real, both here.

   ── the dough sheet ──
   "NAME OF RECIPE:" at the top, then a PREFERMENT block and a REFRESHEMENT block:
   the ingredient in one column and its grams in the next, with the procedure written
   as prose off to the right. Between the ingredients sit the settings a baker needs —
   final temperature, hours of maturation, baking — which are NOT ingredients but are
   the half of the recipe that makes it work, so they are kept as method rather than
   thrown away.

   "PREFERMENT" appears twice: once as the heading of its block, and once as an
   ingredient of the second block, being the dough made in the first. It is only an
   ingredient when it has a weight beside it. */
/* the settings that are part of how the dough is made, and belong in the method */
var BAKE_SET  = /^(final temp|temp\. final|storage temp|hours of maturation|resting time)\b/i;
/* the column headings of the form itself — they say nothing and belong nowhere */
var BAKE_HEAD = /^(total flour|recipe balancing|dough|q\.?ta|qty|grams|grammi|ø|%)$/i;
var BAKE_OVEN = /^(baking|precooking|regeneration|cottura)\b/i;
var BAKE_BLK  = /^(preferment|refreshement|refreshment)\b/i;
/* their numbers: 22,5 is twenty-two and a half, and 1OOO is a thousand typed with
   the letter O. A weight read as nothing is an ingredient silently dropped. */
function bakeQty(v){
  var s = cell(v).replace(/\s/g,'');
  if (!s) return null;
  if (/^[0-9OoIl.,+]+$/.test(s)) s = s.replace(/[Oo]/g,'0').replace(/[Il]/g,'1');
  s = s.replace(',', '.');
  var plus = s.split('+').map(parseFloat).filter(function(x){ return isFinite(x); });
  if (plus.length > 1) return plus.reduce(function(a,b){ return a+b; }, 0);   /* "50+75" */
  return isFinite(parseFloat(s)) ? parseFloat(s) : null;
}
function readBakeryForm(rows){
  var name = '', hdr = -1;
  for (var r=0; r<rows.length && hdr<0; r++){
    var c = rows[r].map(cell);
    for (var i=0;i<c.length;i++){
      if (/name of (the )?recipe|nome della ricetta/i.test(c[i])){
        name = c.slice(i+1).filter(Boolean)[0] || ''; hdr = r; break;
      }
    }
  }
  if (hdr < 0) return null;

  var lines = [], method = [], total = 0;
  for (var k=hdr+1; k<rows.length; k++){
    var c = rows[k].map(cell), mc = rows[k].map(mcell);
    var nm = c[1] || c[0];
    /* the procedure, wherever in the row it was written */
    mc.slice(2).forEach(function(x){ if (x && x.length > 25) method.push(x); });
    if (!nm || BAKE_HEAD.test(nm)) continue;
    if (BAKE_OVEN.test(nm)){
      var bits = c.slice(2).filter(function(x){ return x && x.length <= 25; });
      if (bits.length) method.push(nm + ': ' + bits.join(' · '));
      continue;
    }
    if (BAKE_SET.test(nm)){
      var v = c.slice(2).filter(Boolean)[0];
      if (v) method.push(nm + ': ' + v);
      continue;
    }
    var q = bakeQty(c[2]);
    if (q == null) continue;                    /* a blank line of the template */
    /* "PREFERMENT 3250" in the second block is the dough made in the first, used by
       weight. Its flour, water and yeast are already listed above, so counting it as
       an ingredient would buy the same flour twice and say the batch weighs half as
       much again as it does. The weight he actually uses is said in the method. */
    if (BAKE_BLK.test(nm)){
      if (q) method.push('Uses ' + q + ' g of the ' + nm.toLowerCase() + ' made above.');
      continue;
    }
    lines.push(q + ' g ' + nm);
    total += q;
  }
  if (!lines.length) return null;

  var out = { name:name, cat:'Sub recipe', kind:'batch', lines:lines,
              method: method.filter(function(x,i,a){ return a.indexOf(x) === i; }).join('\n'),
              noUnit:[], hints:{}, subs:[], costing:false };
  /* it makes what it weighs — so the cost per kilo is real rather than left blank */
  if (total > 0){ out.makesQty = +(total/1000).toFixed(4); out.makesUnit = 'kg'; }
  return out;
}

/* ── the INGREDIENTS / METHOD sheet ──
   The pastry ones. Ingredients are already written the way this app asks for them —
   "500 g almond flour" — with the method beside them. The lines in capitals with no
   weight ("FOR THE CRUSCO OIL", "MASCARPONE CREAM") are the parts of the dish, not
   ingredients; they are already repeated over in the method, so they are left there. */
function readIngMethodForm(rows){
  var hdr = -1, ii = -1, mi = -1;
  for (var r=0; r<rows.length && hdr<0; r++){
    var c = rows[r].map(cell), a = -1, b = -1;
    for (var i=0;i<c.length;i++){
      if (a<0 && /^ingredients?$/i.test(c[i])) a = i;
      if (b<0 && /^method$/i.test(c[i])) b = i;
    }
    if (a > -1 && b > -1){ hdr = r; ii = a; mi = b; }
  }
  if (hdr < 0) return null;

  var name = '';
  for (var t=0; t<hdr && !name; t++)
    name = rows[t].map(cell).filter(Boolean)[0] || '';
  if (/^recipe name$/i.test(name)) name = '';        /* the template's own placeholder */

  var lines = [], method = [];
  for (var k=hdr+1; k<rows.length; k++){
    var c = rows[k].map(cell), mc = rows[k].map(mcell);
    if (mc[mi]) method.push(mc[mi]);
    var v = c[ii];
    if (!v) continue;
    var hasNum = /\d/.test(v);
    var heading = !hasNum && (/^for the\b/i.test(v) || v === v.toUpperCase());
    if (heading) continue;                            /* a part of the dish, already in the method */
    lines.push(v);
  }
  if (!lines.length) return null;
  return { name:name, cat:'', kind:'main', lines:lines, method:method.join('\n'),
           noUnit:[], hints:{}, subs:[], costing:false };
}

/* Plain text (PDF, or a Word file with no table) — one ingredient per line */
function readText(text){
  var ls = String(text).split(/\r?\n/).map(function(x){ return x.replace(/\s+/g,' ').trim(); });
  var name='', cat='', lines=[], noUnit=[], started=false;
  var RE = /^(\d+(?:[.,]\d+)?)\s*([A-Za-z]{1,8})?\s+(.{2,})$/;
  ls.forEach(function(l){
    if (!l) return;
    var mn = l.match(/recipe name\s*:?\s*(.+)$/i);  if (mn){ name = mn[1].trim(); return; }
    var mc = l.match(/categor\w*\s*:?\s*(.+)$/i);   if (mc){ cat  = mc[1].trim(); return; }
    if (/preparation method|^method\b|^plating\b/i.test(l)) { started = true; return; }
    if (started) return;
    if (/^quantity\b/i.test(l)) return;
    var m = l.match(RE); if (!m) return;
    var u = mapUnit(m[2]);
    /* words that look like a unit but measure nothing — drop the word AND the quantity */
    if (!u && m[2] && /^(pinch|pinches|qb|tt|dash|drop|drops|sprig|sprigs|leaf|leaves|tsp|tbsp)$/i.test(m[2])){
      noUnit.push(m[3].trim()); lines.push(m[3].trim()); return;
    }
    var nm = (u ? m[3] : (m[2] ? m[2]+' '+m[3] : m[3])).trim();
    lines.push(m[1].replace(',','.') + (u ? ' '+u : '') + ' ' + nm);
  });
  return lines.length ? { name:name, cat:cat, lines:lines, method:'', noUnit:noUnit,
                          kind: /sub[\s-]?recipe|prep|batch/i.test(cat) ? 'batch' : 'main' } : null;
}

function fromExcel(buf){
  return lazy('lib/xlsx.full.min.js','XLSX').then(function(X){
    var wb = X.read(new Uint8Array(buf), { type:'array' }), out = [];
    /* Antonio's workbooks carry an ITA sheet beside the ENG one, and it is not a
       translation — it is whatever recipe the template was copied from, left behind.
       FOCACCIA's says PIZZA ROBERTO'S. Reading it would invent a recipe nobody wrote. */
    var hasEng = wb.SheetNames.some(function(x){ return /^eng$/i.test(x); });
    wb.SheetNames.forEach(function(n){
      if (hasEng && /^ita$/i.test(n)) return;
      var aoa = X.utils.sheet_to_json(wb.Sheets[n], { header:1, blankrows:false, defval:'' });
      var got = 0;
      splitForms(aoa).forEach(function(block, bi){
        var f = readForm(block);
        if (f){ f.name = f.name || (bi ? n+' '+(bi+1) : n); f.where = n; out.push(f); got++; }
      });
      /* not the Standard Recipe Form — try the two Antonio writes his breads and
         pastry on, before giving up on the sheet */
      if (!got){
        var g = readBakeryForm(aoa) || readIngMethodForm(aoa);
        /* "Sheet1" is not a name. Left empty, the file's own name is used instead —
           which is how "CRUSCO PEPPER MAIO" is called what the chef calls it. */
        if (g){ if (!g.name && !/^sheet\s*\d*$/i.test(n)) g.name = n; g.where = n; out.push(g); }
      }
    });
    return { recipes:out, how:'Excel' };
  });
}

/* .docx is a zip. Unpacked with the browser's own decompressor — no library. */
function unzipEntry(buf, want){
  var dv = new DataView(buf), u8 = new Uint8Array(buf), eocd = -1;
  for (var i = buf.byteLength - 22; i >= 0 && i > buf.byteLength - 66000; i--)
    if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  if (eocd < 0) throw new Error('that Word file could not be opened');
  var n = dv.getUint16(eocd+10, true), off = dv.getUint32(eocd+16, true), p = off, found = null;
  for (var e=0; e<n; e++){
    var nl = dv.getUint16(p+28, true), el = dv.getUint16(p+30, true), cl = dv.getUint16(p+32, true);
    var nm = new TextDecoder().decode(u8.subarray(p+46, p+46+nl));
    if (nm === want) found = { method: dv.getUint16(p+10, true),
                               csize:  dv.getUint32(p+20, true),
                               lo:     dv.getUint32(p+42, true) };
    p += 46 + nl + el + cl;
  }
  if (!found) throw new Error('there is no document inside that Word file');
  var l = found.lo, ln = dv.getUint16(l+26, true), le = dv.getUint16(l+28, true);
  var from = l + 30 + ln + le;
  /* exactly this entry — anything trailing makes the decompressor give up */
  var data = u8.subarray(from, found.csize ? from + found.csize : u8.length);
  if (found.method === 0) return Promise.resolve(new TextDecoder().decode(data));
  if (typeof DecompressionStream === 'undefined') throw new Error('this browser cannot open Word files');
  return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
}
function fromWord(buf){
  return unzipEntry(buf, 'word/document.xml').then(function(xml){
    var doc = new DOMParser().parseFromString(xml, 'application/xml');
    var txt = function(el){ return [].map.call(el.getElementsByTagName('w:t'), function(t){ return t.textContent; }).join(''); };
    var out = [];
    [].forEach.call(doc.getElementsByTagName('w:tbl'), function(tbl){
      var rows = [].map.call(tbl.getElementsByTagName('w:tr'), function(tr){
        return [].map.call(tr.getElementsByTagName('w:tc'), txt);
      });
      splitForms(rows).forEach(function(block){ var f = readForm(block); if (f) out.push(f); });
    });
    if (!out.length){
      var paras = [].map.call(doc.getElementsByTagName('w:p'), txt).join('\n');
      var f2 = readText(paras); if (f2) out.push(f2);
    }
    return { recipes:out, how:'Word' };
  });
}

function fromPdf(buf){
  return lazy('lib/pdf.min.js','pdfjsLib').then(function(P){
    try { P.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js'; } catch(e){}
    return P.getDocument({ data:new Uint8Array(buf) }).promise;
  }).then(function(doc){
    var pages = [];
    for (var i=1; i<=doc.numPages; i++) pages.push(i);
    return pages.reduce(function(chain, n){
      return chain.then(function(acc){
        return doc.getPage(n).then(function(pg){ return pg.getTextContent(); }).then(function(tc){
          var byLine = {};
          tc.items.forEach(function(it){
            var y = Math.round(it.transform[5]);
            (byLine[y] = byLine[y] || []).push({ x:it.transform[4], s:it.str });
          });
          var text = Object.keys(byLine).sort(function(a,b){ return b-a; }).map(function(y){
            return byLine[y].sort(function(a,b){ return a.x-b.x; }).map(function(o){ return o.s; }).join(' ');
          }).join('\n');
          return acc + text + '\n';
        });
      });
    }, Promise.resolve('')).then(function(all){
      if (all.replace(/\s/g,'').length < 40)
        throw new Error('there are no words inside that PDF — it is a picture of a page, not text. ' +
                        'Send the Excel or Word it came from, or say it out loud instead.');
      var f = readText(all);
      return { recipes: f ? [f] : [], how:'PDF' };
    });
  });
}

function readAnyFile(file){
  var n = (file.name||'').toLowerCase();
  return file.arrayBuffer().then(function(buf){
    if (/\.(xlsx|xlsm|xls|csv)$/.test(n)) return fromExcel(buf);
    if (/\.docx$/.test(n))                return fromWord(buf);
    if (/\.pdf$/.test(n))                 return fromPdf(buf);
    if (/\.doc$/.test(n))
      throw new Error('that is the old Word format. Open it in Word and Save As .docx, then bring it in.');
    throw new Error('that kind of file cannot be read — Excel, Word (.docx) or PDF');
  });
}

/* put a read recipe into the write screen, exactly as if it had been typed */
function useImported(f){
  S.kind    = f.kind || S.kind || 'main';
  S.name    = f.name || S.name;
  var sec   = SECTIONS.filter(function(s){ return new RegExp('^'+s.split(' ')[0], 'i').test(String(f.cat||'')); })[0];
  S.section = sec || S.section;
  S.hints   = f.hints || null;                   /* codes / sub-recipe flags / wastage, by line */
  S.text    = f.lines.join(',\n') + ',';         /* a comma per line — one line is one ingredient */
  S.method  = parseMethod(f.method || '');
  if (f.makesQty != null){ S.makesQty = f.makesQty; S.makesUnit = f.makesUnit; }
  if (f.price != null && S.kind === 'main') S.price = f.price;
  S.imported = { how:f.how, noUnit:f.noUnit||[], where:f.where||'',
                 costing:!!f.costing, subs:f.subs||[],
                 makes:(f.makesQty!=null ? f.makesQty+' '+f.makesUnit : null), price:f.price||null };
  /* Straight to the sheet. The screen in between asked him to check the split of a list
     the file had just written for him — a stop with no work in it, and the sheet IS the
     split, line for line. Back still goes there if he wants to retype the words. */
  S.rows = splitLine(S.text).map(function(p){ return mkRow(p); });
  S.lastRm = null;
  S.step = S.rows.length ? 'sheet' : 'write';
}

/* ═════════ bringing a whole workbook in at once ═════════
   One file is a dish and everything under it. Branzino.xlsx is 8 recipes. Opening
   them one at a time, and re-typing the links by hand, is the slowest thing in the
   module. This does the lot in one confirm.

   Names in a workbook do NOT match between the dish and its own sub-recipes — the
   dish says "Pickled red radish", the sub-recipe is called "Pickled Radish", and
   "Pomegranate" is spelt "Pomegrnate" on its own sheet. So the match is on a similar
   name, never an exact one, and it has to be sure of itself: a match only stands if
   it is clearly better than the runner-up, or nothing is linked and the line stays
   as the chef typed it. A wrong link is far worse than no link. */
/* the same plain words, but for this screen — "try Save again" is the wrong advice
   here, because there is no sheet in front of him and the fix is to run the file again */
function planPlain(msg){
  if (/Failed to fetch|NetworkError|network/i.test(msg)) return 'The Kitchen database could not be reached.';
  if (/recipes_name_unique|duplicate key/i.test(msg)) return 'Something else is already saved under that exact name.';
  return msg;
}
function nameWords(s){
  return String(s||'').toLowerCase().replace(/[^a-z0-9 ]+/g,' ').split(/\s+/)
    .filter(function(w){ return w.length > 1; });
}
/* how alike are two recipe names, 0 to 1, judged on the shorter of the two —
   "Artichokes" is inside "Artichokes sliced", and that is a match, not a near miss */
function simName(a, b){
  var A = nameWords(a), B = nameWords(b);
  if (!A.length || !B.length) return 0;
  var short = A.length <= B.length ? A : B, long = A.length <= B.length ? B : A;
  var used = {}, sum = 0;
  short.forEach(function(w){
    var best = 0, bi = -1;
    long.forEach(function(x, i){
      if (used[i]) return;
      var s = 0;
      if (w === x || stem(w) === stem(x)) s = 1;
      else if (w.length >= 4 && (x.indexOf(w) === 0 || w.indexOf(x) === 0)) s = 0.85;
      else if (w.length >= 5 && x.length >= 5 && dist(w, x) <= 1) s = 0.9;
      if (s > best){ best = s; bi = i; }
    });
    if (bi > -1){ used[bi] = 1; sum += best; }
  });
  return sum / short.length;
}
/* the one clear winner, or nothing at all */
/* How much of the LONGER name is accounted for. simName() divides by the shorter one,
   so "water" scores 1.00 against "Lemon water" — right for "did he mean this?", wrong
   for "these are the same thing". */
function covers(a, b){
  var A = nameWords(a), B = nameWords(b);
  if (!A.length || !B.length) return 0;
  var n = Math.max(A.length, B.length);
  return simName(a, b) * (Math.min(A.length, B.length) / n);
}
function bestMatch(name, list, nameOf){
  var scored = list.map(function(x, i){ return { i:i, s:simName(name, nameOf(x)) }; })
                   .sort(function(p,q){ return q.s - p.s; });
  if (!scored.length || scored[0].s < 0.75) return null;
  if (scored[1] && scored[0].s - scored[1].s < 0.15) return null;   /* two look alike — pick neither */
  return scored[0];
}

/* Work out, before anything is written, exactly what will be created and what will
   be linked to what. Nothing here touches the database. */
function planWorkbook(res){
  var recs = res.recipes.map(function(f, i){
    return { i:i, f:f, name:(f.name||'').trim(), kind:f.kind || 'main', file:f.file || null };
  }).filter(function(R){ return R.name; });

  /* Across sixty workbooks the same batch is in a dozen of them — Porcini stock is
     written into every dish that uses it. Taken at face value that is a dozen Porcini
     stocks in the database, each dish pointing at a different copy, and changing the
     recipe then changes it for one dish out of twelve.

     The first one wins, the rest are folded into it, and the screen says which files
     it was in so nobody wonders where the other eleven went. */
  var byName = {}, folded = [];
  recs = recs.filter(function(R){
    var k = R.kind + '|' + words(R.name).join(' ');
    if (!byName[k]){ byName[k] = R; R.alsoIn = []; return true; }
    var first = byName[k];
    if (R.file && first.alsoIn.indexOf(R.file) < 0) first.alsoIn.push(R.file);
    folded.push({ name:R.name, file:R.file, into:first.file });
    return false;
  });
  res.folded = folded;

  /* something already saved under a similar name is LINKED, never made a second time */
  var saved = (S.saved || []).filter(function(r){ return !r.archived; });
  recs.forEach(function(R){
    var m = bestMatch(R.name, saved, function(r){ return r.name; });
    R.existing = m ? saved[m.i] : null;
    /* build its rows now, with this file's own codes and sub-recipe flags, so the
       screen can show what it found before a single row is written */
    var keep = S.hints; S.hints = R.f.hints || null;
    R.rows = splitLine(R.f.lines.join(',\n') + ',').map(function(p){
      var r = mkRow(p); r.filed = { qty:p.qty, unit:p.unit };   /* what the file actually said */
      return r;
    });
    S.hints = keep;
    R.method = parseMethod(R.f.method || '');
    R.section = SECTIONS.filter(function(s){
      return new RegExp('^' + s.split(' ')[0], 'i').test(String(R.f.cat || '')); })[0] || null;
  });

  /* which rows of each recipe are actually another recipe in the same file */
  recs.forEach(function(R){
    R.links = [];
    var others = recs.filter(function(x){ return x !== R; });
    R.rows.forEach(function(r, k){
      var m = bestMatch(r.word, others, function(x){ return x.name; });
      /* simName() divides by the SHORTER name, so a name wholly inside a longer one
         scores a perfect 1. Within one workbook that was harmless. Across sixty it is
         not: the line "water" in Pasta dough matched the batch "Lemon water" at 1.00,
         and pasta would have been made with lemon water and nothing on screen to say
         so. A link has to fit BOTH ways round, or it is not the same thing. */
      if (m && covers(r.word, others[m.i].name) >= 0.75)
        R.links.push({ row:k, was:r.word, to:others[m.i], score:m.s });
    });
  });

  /* deepest first — a batch has to exist before the dish can point at it */
  var order = [], done = {};
  for (var pass = 0; pass < recs.length + 2 && order.length < recs.length; pass++){
    recs.forEach(function(R){
      if (done[R.i]) return;
      var waiting = R.links.some(function(l){ return !done[l.to.i]; });
      if (!waiting){ done[R.i] = 1; order.push(R); }
    });
  }
  recs.forEach(function(R){ if (!done[R.i]) order.push(R); });   /* a ring — still build it */
  return { file:res.fileName, how:res.how, recs:recs, order:order };
}

/* A recipe that is already saved is never written over — with one exception, and it
   is the one that matters. If a batch failed to go in last time, the dish was saved
   with that line EMPTY. Running the file again used to leave it empty for ever, so
   the message telling him to run it again was a lie. This fills in a line that has
   nothing picked, and only such a line: anything he has already chosen is untouched. */
function repairLinks(R, madeId){
  if (!R.links.length) return null;
  var id = R.existing.id;
  return sb('recipe_lines?recipe_id=eq.'+id+'&select=id,position,typed_text,stock_code,child_recipe_id')
    .then(function(ls){
      var jobs = [];
      (ls || []).forEach(function(l){
        if (l.stock_code || l.child_recipe_id) return;             /* already picked — leave it alone */
        var txt = String(l.typed_text || '').replace(/#\d+$/,'');
        var m = bestMatch(txt, R.links, function(x){ return x.was; });
        if (!m) return;
        var newId = madeId[R.links[m.i].to.i];
        if (!newId || newId === id) return;
        jobs.push({ line:l.id, to:newId, was:txt, name:R.links[m.i].to.name });
      });
      if (!jobs.length) return null;
      return Promise.all(jobs.map(function(j){
        return sb('recipe_lines?id=eq.'+j.line, { method:'PATCH', prefer:'return=minimal',
                    body:{ child_recipe_id:j.to, stock_code:null, stock_name:null } });
      })).then(function(){ R.fixed = jobs; drawPlan(); });
    })
    .catch(function(){ return null; });     /* a failed repair must not stop the rest going in */
}

/* Create them, deepest first, one after another. If one fails the rest still go in
   and the screen names exactly which one did not — a half-done import that says
   nothing is how you end up with a dish quietly missing its sauce. */
function runWorkbook(){
  var P = S.plan, madeId = {};
  var seq = Promise.resolve();
  P.order.forEach(function(R){
    seq = seq.then(function(){
      if (R.existing){
        madeId[R.i] = R.existing.id; R.done = 'already'; drawPlan();
        return repairLinks(R, madeId);      /* fill in only the lines that have nothing picked */
      }
      R.done = 'busy'; drawPlan();
      var head = {
        kind: R.kind, name: R.name, section: R.section,
        makes_qty: R.f.makesQty != null ? R.f.makesQty : null,
        makes_unit: R.f.makesQty != null ? R.f.makesUnit : (R.kind === 'main' ? 'portions' : null),
        menu_price: R.kind === 'main' && R.f.price != null ? R.f.price : null,
        method: R.method, photos: [], updated_at: new Date().toISOString()
      };
      return sb('recipes', { method:'POST', body:head }).then(function(out){
        var rec = out && out[0];
        if (!rec) throw new Error('the database did not return the recipe');
        madeId[R.i] = rec.id; R.newId = rec.id;
        R.links.forEach(function(l){
          var id = madeId[l.to.i]; if (!id) return;
          var r = R.rows[l.row], fl = r.filed || {};
          r.code = 'R:' + id;                          /* the line now points at the batch */
          /* the unit rules that just ran were about a STOCK item — "5 pcs" was dropped
             because the tin of radish Aung sells is priced by the kilo. This line is a
             batch of his own now, so what the file wrote is what it is. A pinch is still
             not a measurement, so that one stays blank. */
          if (fl.unit && fl.unit !== '?'){
            r.unit = fl.unit;
            if (r.qty == null && fl.qty != null) r.qty = fl.qty;
            r.mismatch = null; r.bare = null; r.noMeasure = false;
          }
        });
        if (!R.rows.length) return null;
        return sb('recipe_lines', { method:'POST', prefer:'return=minimal',
                                    body: linesFor(rec.id, R.rows) });
      }).then(function(){ R.done = 'made'; drawPlan(); })
        .catch(function(err){ R.done = 'failed'; R.why = planPlain(err.message); drawPlan(); });
    });
  });
  return seq.then(function(){
    return Promise.all([loadSaved(), loadBatches()]);
  }).then(function(){ S.planRan = true; drawPlan(); });
}
