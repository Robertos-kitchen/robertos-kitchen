/* The Kitchen app's own tokens (index.html :root). */
:root{
  --sabbia:#e1d3c2;--sabbia-light:#ede5d8;--sabbia-dark:#cfc0ad;--line:#e6dacb;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

button,input,textarea,select{font:inherit;color:inherit}

.app.wide{max-width:820px}

.top .sub{font-size:14px;color:var(--sabbia)}

@media (max-width:420px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.top h1{font-size:30px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

var PEND = {}, BUSY = false, PKEY = 'auditPending:' + (TOK ? (TOK.k || TOK.a) : '');
try { PEND = JSON.parse(ls(PKEY) || '{}') || {}; } catch(e){ PEND = {}; }
function keepPend(){ ls(PKEY, JSON.stringify(PEND)); }
function queue(key, action, payload){
  PEND[key] = { action: action, payload: payload };
  keepPend(); setStatus('saving'); flushSoon();
}
var flushT = null;
function flushSoon(ms){ clearTimeout(flushT); flushT = setTimeout(flush, ms == null ? 700 : ms); }
function flush(){
  if (BUSY) return flushSoon(500);
  var keys = Object.keys(PEND); if (!keys.length) { setStatus('saved'); return; }
  var k = keys[0], job = PEND[k]; BUSY = true;
  api(job.action, job.payload).then(function(res){
    BUSY = false;
    if (PEND[k] === job) { delete PEND[k]; keepPend(); }
    merge(job.action, res && res.row);
    flushSoon(0);
  }, function(e){
    BUSY = false;
    if (e.status && e.status < 500) { delete PEND[k]; keepPend(); toast(e.message, true); flushSoon(0); return; }
    setStatus('bad'); flushSoon(4000);
  });
}
window.addEventListener('online', function(){ flushSoon(0); });
function setStatus(s){
  var els = document.querySelectorAll('.saved');
  for (var i = 0; i < els.length; i++) {
    els[i].className = 'saved' + (s === 'bad' ? ' bad' : '');
    els[i].textContent = s === 'saving' ? t('saving') : s === 'bad' ? t('notSaved') : t('saved');
  }
}
function toast(m, bad){
  var el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.setAttribute('role', 'status');
    el.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:90px;max-width:92%;z-index:50;padding:12px 16px;border-radius:8px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.2)';
    document.body.appendChild(el); }
  el.textContent = m; el.style.background = bad ? '#8f1d12' : '#2a1a10'; el.style.color = '#fff'; el.hidden = false;
  clearTimeout(el._t); el._t = setTimeout(function(){ el.hidden = true; }, 3500);
}

/* Put a saved row back into D so every screen shows it. */
function merge(action, row){
  if (!row || !D) return;
  var list = action === 'score' ? D.scores : action === 'dish' ? D.dishes : action === 'flag' ? D.flags : action === 'text' ? D.texts : null;
  if (!list) return;
  var key = action === 'text' ? 'key' : action === 'score' ? 'code' : 'id';
  for (var i = 0; i < list.length; i++) if (list[i][key] === row[key]) {
    // Never overwrite a note the user is still typing (the queue holds the newer one).
    var keepNote = list[i]._local; list[i] = Object.assign(list[i], row); if (keepNote) list[i]._local = keepNote; return;
  }
  if (!row.removed) list.push(row);
}
function scoreRow(code){ for (var i = 0; i < D.scores.length; i++) if (D.scores[i].code === code) return D.scores[i]; var r = { code: code, photos: [] }; D.scores.push(r); return r; }
function textRow(key){ for (var i = 0; i < D.texts.length; i++) if (D.texts[i].key === key) return D.texts[i]; var r = { key: key, photos: [] }; D.texts.push(r); return r; }
function byId(list, id){ for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
function cat(area){ return D.catalog.filter(function(c){ return c.area === area; }).sort(function(a, b){ return a.position - b.position; }); }
/* Trend against the last visit, like for like: only items scored (not N/A) in BOTH visits.
   Nov 2022 scored 17 items in 3 areas; this audit can score 33 in 5, so comparing the two
   overall %s would compare different things. n = how many items the trend stands on. */
function like(area){
  if (!D.previous) return null;
  var old = {}; D.previous.scores.forEach(function(p){ if (p.score && !p.na) old[p.code] = p.score; });
  var a = 0, b = 0, n = 0;
  D.catalog.forEach(function(c){
    if (area && c.area !== area) return;
    var r = scoreRow(c.code);
    if (r.score && !r.na && old[c.code]) { a += r.score; b += old[c.code]; n++; }
  });
  if (!n) return null;
  var now = Math.round(a / (5 * n) * 100), then = Math.round(b / (5 * n) * 100);
  return { now: now, prev: then, diff: now - then, n: n };
}
function signed(x){ return (x >= 0 ? '+' : '') + x; }
function prevScore(code){ if (!D.previous) return null; for (var i = 0; i < D.previous.scores.length; i++) if (D.previous.scores[i].code === code) return D.previous.scores[i]; return null; }
function isDone(code){ var r = scoreRow(code); return !!(r.score || r.na); }
function areaStats(a){
  var items = cat(a), n = 0, s = 0, k = 0;
  items.forEach(function(c){ var r = scoreRow(c.code); if (r.score || r.na) n++; if (r.score) { s += r.score; k++; } });
  return { done: n, total: items.length, avg: k ? (s / k) : null, pct: k ? Math.round(s / (5 * k) * 100) : null };
}
function overallPct(){ var s = 0, k = 0; D.scores.forEach(function(r){ if (r.score && !r.na) { s += r.score; k++; } }); return k ? Math.round(s / (5 * k) * 100) : null; }

/* ── screens ────────────────────────────────────────────────────────────── */
function render(){
  if (!TOK) { root.innerHTML = topBar('<h1>Audit</h1>') + '<div class="body"><div class="msg err">' + t('badLink') + '</div></div>'; return; }
  if (!D) return;
  if (D.role === 'invite') { root.className = 'app'; root.innerHTML = vStart(); return; }
  if (D.role === 'invite_admin') { root.className = 'app wide'; root.innerHTML = vList(); return; }
  root.className = 'app' + (S.v === 'report' ? ' wide' : '');
  var h = '';
  if (S.v === 'home') h = vHome();
  else if (S.v === 'area') h = vArea();
  else if (S.v === 'item') h = vItem();
  else if (S.v === 'dishes') h = vDishes();
  else if (S.v === 'dish') h = vDish();
  else if (S.v === 'flag') h = vFlag();
  else if (S.v === 'final') h = vFinal();
  else if (S.v === 'thanks') h = vThanks();
  else if (S.v === 'report') h = vReport();
  // A photo landing must not throw the keyboard away mid-sentence: keep focus and caret.
  var a = document.activeElement, fid = a && a.id && root.contains(a) ? a.id : null, s0 = fid ? a.selectionStart : 0, s1 = fid ? a.selectionEnd : 0, y = window.scrollY;
  root.innerHTML = h;
  setStatus(Object.keys(PEND).length ? 'saving' : 'saved');
  autosize(); markMic();
  if (fid) { var el = document.getElementById(fid); if (el) { try { el.focus({ preventScroll: true }); el.setSelectionRange(s0, s1); } catch(e){} window.scrollTo(0, y); } }
}

function closedBanner(){
  if (ADMIN || D.visit.status !== 'sent') return '';
  return '<div class="msg info">' + t('closed') + '</div>';
}

function vHome(){
  var total = D.catalog.length, done = D.scores.filter(function(r){ return r.score || r.na; }).length;
  var pct = total ? Math.round(done / total * 100) : 0;
  var hello = isEnrico() ? t('hello') : (LANG === 'en' ? 'Hello ' : 'Ciao ') + esc(who());
  var when = isEnrico() ? esc(fmtDate(D.visit.visit_date, LANG)) : t('started') + ' ' + esc(dubaiTime(D.visit.created_at));
  var h = topBar(adminTabs() + '<h1>' + hello + '</h1><div class="sub">' + t('visit') + ' ' + when + ' · ' + t('autosave') + '</div>' +
    '<div class="bar"><div class="track"><div class="fill" style="width:' + pct + '%"></div></div><b>' + done + ' / ' + total + '</b></div>');
  h += '<div class="body">' + closedBanner() + '<div class="lbl">' + t('sections') + '</div>';
  var n = 0, current = null;
  ORDER.forEach(function(a){ if (a !== 'piatti' && current === null) { var st = areaStats(a); if (st.done < st.total) current = a; } });
  ORDER.forEach(function(a){
    n++;
    if (a === 'piatti') {
      var nd = D.dishes.length;
      h += '<button class="sec" data-act="go" data-to=\'{"v":"dishes"}\'><span class="dot' + (nd ? ' done' : '') + '">' + (nd ? nd : n) + '</span><span class="grow"><span class="t">' + t('piatti') + '</span><span class="s">' + t('piattiSub') + '</span></span></button>';
      return;
    }
    var st = areaStats(a), full = st.done === st.total, now = a === current && st.done > 0;
    var sub = st.done + '/' + st.total + (st.avg != null ? ' · ' + t('avg') + ' ' + st.avg.toFixed(1) : '') + (now ? ' · ' + t('inProgress') : '');
    var lf = like(a), pv = lf ? ' · ' + (lf.diff >= 0 ? '↑' : '↓') + ' vs ' + esc(D.previous.title.replace('Novembre', 'Nov')) : '';
    h += '<button class="sec' + (a === current ? ' now' : '') + '" data-act="area" data-a="' + a + '"><span class="dot' + (full ? ' done' : a === current ? ' go' : '') + '">' + (full ? '✓' : n) + '</span>' +
         '<span class="grow"><span class="t">' + areaName(a) + '</span><span class="s">' + sub + pv + '</span></span>' + (st.pct != null ? '<span class="sc">' + st.pct + '%</span>' : '') + '</button>';
  });

      h += '<div class="item"><div class="h"><span style="font-family:var(--display);font-size:17px;color:var(--vino)">' + esc(x.dish_name) + '</span><span><b>' + (x.score ? x.score + '/5' : '') + '</b> ' + (x.verdict ? '<span class="badge ' + x.verdict + '">' + { keep: 'Keep', fix: 'To fix', remove: 'Take off' }[x.verdict] + '</span>' : '') + '</span></div>' +
        enEdit('dish', x.id, x.note_en, x.note_it) + pics(x, 'dish', x.id) + '</div>';
    });
    h += '</div>';
  }
  var keeps = D.flags.filter(function(f){ return f.kind === 'keep'; });
  if (keeps.length) {
    h += '<div class="lbl">What ' + esc(who()) + ' liked</div><div class="card">';
    keeps.forEach(function(f){ h += '<div class="item"><div class="muted">' + esc(AREA_EN[f.area]) + (f.dish_name ? ' · ' + esc(f.dish_name) : '') + '</div>' + enEdit('flag', f.id, f.note_en, f.note_it) + pics(f, 'flag', f.id) + '</div>'; });
    h += '</div>';
  }

  h += '<div class="lbl">Every item</div>';
  AREAS.forEach(function(a){
    var s = areaStats(a);
    h += '<div class="card"><div class="item" style="background:var(--door)"><div class="h"><span style="font-family:var(--display);font-size:19px;color:var(--vino)">' + AREA_EN[a] + '</span><b>' + (s.pct == null ? '' : s.pct + '%') + '</b></div></div>';
    cat(a).forEach(function(c){
      var r = scoreRow(c.code);
      h += '<div class="item"><div class="h"><span>' + esc(c.label_en) + (r.verdict ? ' <span class="badge ' + r.verdict + '">' + { ok: 'OK', fix: 'To fix', urgent: 'Urgent' }[r.verdict] + '</span>' : '') + '</span><b>' + (r.na ? 'N/A' : (r.score ? r.score + '/5' : '—')) + '</b></div>' +
        (r.note_it || r.note_en ? enEdit('score', c.code, r.note_en, r.note_it) : '') + pics(r, 'score', c.code) + '</div>';
    });
    h += '</div>';
  });
  h += '<div style="height:12px"></div></div>';
  var to = D.recipients ? D.recipients.to : { name: 'Amin' };
  h += '<div class="foot" style="flex-wrap:wrap"><button class="big light" data-act="translate" style="flex:1 1 140px">Translate new notes</button><button class="big light" data-act="sendtest" style="flex:1 1 140px">Send me a test</button>' +
       '<button class="big vino" data-act="sendamin" id="aminbtn" style="flex:1 1 100%"' + (st === 'test' ? ' disabled' : '') + '>' + (st === 'sent' ? 'Email ' + esc(to.name) + ' again' : 'Email to ' + esc(to.name)) + '</button></div>';
  return h;
}
function enEdit(target, ref, en, it){
  return '<textarea class="en-edit" data-en="1" data-target="' + target + '" data-ref="' + esc(ref) + '" aria-label="English" placeholder="' + (it ? 'Not translated yet — press Translate new notes' : '') + '">' + esc(en || '') + '</textarea>' +
    (it ? '<div class="it" style="font-size:12.5px;color:var(--muted);font-style:italic">Original: ' + esc(it) + '</div>' : '');
}

/* ── behaviour ──────────────────────────────────────────────────────────── */
function autosize(){
  var ts = root.querySelectorAll('textarea');
  for (var i = 0; i < ts.length; i++) { ts[i].style.height = 'auto'; ts[i].style.height = Math.max(ts[i].scrollHeight + 2, ts[i].classList.contains('small') ? 52 : 44) + 'px'; }
}
function saveNote(el){
  var target = el.getAttribute('data-save'), ref = el.getAttribute('data-ref'), v = el.value;
  if (target === 'score') { var r = scoreRow(ref); r._local = v; queue('score:' + ref + ':note', 'score', { code: ref, note_it: v }); }
  else if (target === 'dish') { var d = byId(D.dishes, ref); if (d) d._local = v; queue('dish:' + ref + ':note', 'dish', { id: ref, note_it: v }); }
  else if (target === 'flag') { var f = byId(D.flags, ref); if (f) f._local = v; queue('flag:' + ref + ':note', 'flag', { id: ref, note_it: v }); }
  else if (target === 'text') { var x = textRow(ref); x._local = v; queue('text:' + ref, 'text', { key: ref, it: v }); }
}
/* When a save lands the server row is merged in, then anything still waiting in the queue
   is laid back on top, so a newer tap or word is never undone by an older reply. */
var _merge = merge;
merge = function(action, row){ _merge(action, row); applyPending(); };
function applyPending(){
  if (!D) return;
  [D.scores, D.dishes, D.flags, D.texts].forEach(function(l){ l.forEach(function(r){ delete r._local; }); });
  Object.keys(PEND).forEach(function(k){
    var j = PEND[k], p = j.payload, r = null;
    if (j.action === 'score') r = scoreRow(p.code);
    else if (j.action === 'dish') r = byId(D.dishes, p.id);
    else if (j.action === 'flag') r = byId(D.flags, p.id);
    else if (j.action === 'text') { textRow(p.key)._local = p.it; return; }
    else if (j.action === 'set') { ['en', 'owner', 'due'].forEach(function(c){ if (c in p) setLocal(p.target, p.ref, c === 'en' ? (p.target === 'text' ? 'en' : 'note_en') : c, p[c]); }); return; }
    if (!r) return;
    Object.keys(p).forEach(function(c){ if (c === 'note_it') r._local = p[c]; else if (c !== 'id' && c !== 'code') r[c] = p[c]; });
  });
}

root.addEventListener('input', function(e){
  var el = e.target;
  if (el.matches('textarea')) { el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px'; }
  if (el.matches('textarea[data-save]')) saveNote(el);
  else if (el.matches('textarea[data-en]')) {
    var tg = el.getAttribute('data-target'), rf = el.getAttribute('data-ref');
    setLocal(tg, rf, tg === 'text' ? 'en' : 'note_en', el.value);
    queue('en:' + tg + ':' + rf, 'set', { target: tg, ref: rf, en: el.value });
  } else if (el.id === 'aname') { S.name = el.value;
  } else if (el.id === 'pq') {
    S.q = el.value;
    var box = document.getElementById('pres'); if (box) box.innerHTML = presHtml(el.getAttribute('data-mode'));
  }
});
root.addEventListener('change', function(e){
  var el = e.target;
  if (el.matches('input[data-set]')) {
    var tg = el.getAttribute('data-target'), rf = el.getAttribute('data-ref'), k = el.getAttribute('data-set'), p = { target: tg, ref: rf };
    p[k] = el.value; setLocal(tg, rf, k, el.value);
    queue('set:' + tg + ':' + rf + ':' + k, 'set', p);
  }
});
function setLocal(target, ref, col, v){
  var r = target === 'score' ? scoreRow(ref) : target === 'text' ? textRow(ref) : byId(target === 'dish' ? D.dishes : D.flags, ref);
  if (r) r[col] = v;
}

root.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act');
  if (act === 'pq') return;
  if (act === 'lang') { LANG = b.getAttribute('data-l'); ls('auditLang', LANG); document.documentElement.lang = LANG; render(); return; }
  if (act === 'go') { e.preventDefault(); go(JSON.parse(b.getAttribute('data-to'))); return; }
  if (act === 'area') { go({ v: 'area', area: b.getAttribute('data-a') }); return; }
  if (act === 'item') { go({ v: 'item', code: b.getAttribute('data-code') }); return; }
  if (act === 'score') {
    var r = scoreRow(S.code), v = b.getAttribute('data-v');
    if (v === 'na') { r.na = !r.na; if (r.na) r.score = null; queue('score:' + S.code + ':s', 'score', { code: S.code, na: r.na }); }
    else { var n = +v; r.score = r.score === n && !r.na ? null : n; r.na = false; queue('score:' + S.code + ':s', 'score', { code: S.code, score: r.score }); }
    render(); return;
  }
  if (act === 'verdict') { var r2 = scoreRow(S.code), vv = b.getAttribute('data-v'); r2.verdict = r2.verdict === vv ? null : vv; queue('score:' + S.code + ':v', 'score', { code: S.code, verdict: r2.verdict }); render(); return; }
  if (act === 'nextitem') {
    var c = D.catalog.filter(function(x){ return x.code === S.code; })[0], items = cat(c.area), i = items.indexOf(c);
    if (i < items.length - 1) go({ v: 'item', code: items[i + 1].code }, true);
    else {
      var ai = AREAS.indexOf(c.area);
      go({ v: 'home' });
    }
    return;
  }
  if (act === 'mic') { toggleMic(b); return; }
  if (act === 'photo') { pickPhoto(b.getAttribute('data-target'), b.getAttribute('data-ref')); return; }
  if (act === 'pdel') { delPhoto(b.getAttribute('data-target'), b.getAttribute('data-ref'), b.getAttribute('data-path')); return; }
  if (act === 'dish') { go({ v: 'dish', id: b.getAttribute('data-id') }); return; }
  if (act === 'pickdish') { pickDish(b.getAttribute('data-mode'), b.getAttribute('data-id') || null, b.getAttribute('data-name')); return; }
  if (act === 'dscore') { var d = byId(D.dishes, S.id), n2 = +b.getAttribute('data-v'); d.score = d.score === n2 ? null : n2; queue('dish:' + d.id + ':s', 'dish', { id: d.id, score: d.score }); render(); return; }
  if (act === 'dverdict') { var d2 = byId(D.dishes, S.id), v2 = b.getAttribute('data-v'); d2.verdict = d2.verdict === v2 ? null : v2; queue('dish:' + d2.id + ':v', 'dish', { id: d2.id, verdict: d2.verdict }); render(); return; }
  if (act === 'ddel') { var d3 = byId(D.dishes, S.id); api('dish', { id: d3.id, remove: true }).then(function(){ D.dishes = D.dishes.filter(function(x){ return x.id !== d3.id; }); go({ v: 'dishes' }, true); }, function(er){ toast(er.message, true); }); return; }
  if (act === 'newflag') { S.q = ''; go({ v: 'flag' }); return; }
  // The file picker must open inside the tap (iPhone rule); the flag is created once a photo is chosen.
  if (act === 'flagphoto') { pickPhoto('flag', '__new'); return; }
  if (act === 'flagnote') { createFlag().then(function(f){ go({ v: 'flag', id: f.id }, true); }); return; }
  if (act === 'farea') { var f1 = byId(D.flags, S.id); f1.area = b.getAttribute('data-a'); queue('flag:' + f1.id + ':a', 'flag', { id: f1.id, area: f1.area }); render(); return; }
  if (act === 'fkind') { var f2 = byId(D.flags, S.id); f2.kind = b.getAttribute('data-v'); queue('flag:' + f2.id + ':k', 'flag', { id: f2.id, kind: f2.kind }); render(); return; }
  if (act === 'fpick') { S.picking = true; S.q = ''; render(); var q = document.getElementById('pq'); if (q) q.focus(); return; }
  if (act === 'fdel') { var f3 = byId(D.flags, S.id); api('flag', { id: f3.id, remove: true }).then(function(){ D.flags = D.flags.filter(function(x){ return x.id !== f3.id; }); go({ v: 'home' }, true); }, function(er){ toast(er.message, true); }); return; }
  if (act === 'submit') { submit(b); return; }
  if (act === 'begin') { begin(b); return; }
  if (act === 'resume') { var m = mine(); if (m && m.k) location.href = location.pathname + '?k=' + encodeURIComponent(m.k); return; }
  if (act === 'areana' || act === 'areaclear') {
    cat(b.getAttribute('data-a')).forEach(function(c){
      var r = scoreRow(c.code);
      if (act === 'areana' && !r.score && !r.na) { r.na = true; queue('score:' + c.code + ':s', 'score', { code: c.code, na: true }); }
      if (act === 'areaclear' && r.na) { r.na = false; queue('score:' + c.code + ':s', 'score', { code: c.code, na: false }); }
    });
    render(); return;
  }
  if (act === 'copy') { copyText(b.getAttribute('data-text')); return; }
  if (act === 'translate') { runTranslate(b); return; }
  if (act === 'sendtest') { sendReport(b, 'send_test'); return; }
  if (act === 'sendamin') { if (!b._sure) { b._sure = true; b.textContent = 'Tap again to email ' + (D.recipients ? D.recipients.to.name : 'Amin'); setTimeout(function(){ if (b.isConnected) { b._sure = false; render(); } }, 5000); return; } sendReport(b, 'send'); return; }
});

// One add at a time: the list stays on screen until the server answers, and Danilo's taps in
// that gap saved Burrata four times (21 Oct 2026). A dish already in this audit is opened, not added again.
var ADDING = null;
function createFlag(){
  if (ADDING) return ADDING;
  ADDING = api('flag', { area: 'piatto', kind: 'attention' }).then(function(res){ ADDING = null; D.flags.push(res.row); return res.row; }, function(er){ ADDING = null; toast(er.message, true); throw er; });
  return ADDING;
}
function pickDish(mode, id, name){
  name = (name || '').trim(); if (!name) return;
  if (mode === 'adddish') {
    if (ADDING) return;
    var same = D.dishes.filter(function(x){ return !x.removed && (id ? x.recipe_id === id : !x.recipe_id && low(x.dish_name || '') === low(name)); })[0];
    S.q = ''; S.picking = false;
    if (same) { go({ v: 'dish', id: same.id }); return; }
    root.querySelectorAll('[data-act="pickdish"]').forEach(function(x){ x.disabled = true; });
    ADDING = api('dish', { dish_name: name, recipe_id: id }).then(function(res){ ADDING = null; D.dishes.push(res.row); go({ v: 'dish', id: res.row.id }); }, function(er){ ADDING = null; toast(er.message, true); render(); });
    return;
  }
  S.q = ''; S.picking = false;
  var f = byId(D.flags, S.id); f.dish_name = name; f.recipe_id = id;
  queue('flag:' + f.id + ':d', 'flag', { id: f.id, dish_name: name, recipe_id: id }); render();
}
function submit(b){
  if (!b._sure) { b._sure = true; b.textContent = t('sendSure'); setTimeout(function(){ if (b.isConnected) { b._sure = false; b.textContent = t('send'); } }, 5000); return; }
  b.disabled = true; b.textContent = t('saving');
  waitSaved().then(function(){ return api('submit', { page: location.origin + location.pathname }); }).then(function(){ D.visit.status = D.visit.status === 'test' ? 'test' : 'submitted'; go({ v: 'thanks' }); }, function(er){ b.disabled = false; b._sure = false; b.textContent = t('send'); toast(er.message, true); });
}
function waitSaved(){
  return new Promise(function(res, rej){
    var n = 0; flushSoon(0);
    (function check(){ if (!Object.keys(PEND).length && !BUSY && !anyUploading()) return res(); if (++n > 120) return rej(new Error(t('notSaved'))); setTimeout(check, 250); })();
  });
}
function runTranslate(b){
  b.disabled = true; var old = b.textContent; b.textContent = 'Translating…';
  waitSaved().then(function(){ return api('translate'); }).then(function(r){ return reload().then(function(){ toast(r.translated ? r.translated + ' notes translated' : 'Everything is already in English'); }); })
    .catch(function(er){ toast(er.message, true); }).then(function(){ if (b.isConnected) { b.disabled = false; b.textContent = old; } });
}
function sendReport(b, action){
  b.disabled = true; b.textContent = 'Sending…';
  waitSaved().then(function(){ return api(action); }).then(function(r){
    toast('Sent to ' + r.to.join(', '));
    return reload();
  }).catch(function(er){ toast(er.message, true); render(); });
}
function copyText(s){
  var done = function(){ toast('Link copied'); };
  var show = function(){ toast(s); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(done, show);
  else show();
}

/* ── photos: resized on the phone (max 1600px) before upload ──────────── */
var UPLOADING = {};
function anyUploading(){ for (var k in UPLOADING) if (UPLOADING[k].length) return true; return false; }
var fileEl = document.getElementById('file'), PHOTO_FOR = null;
function pickPhoto(target, ref){ PHOTO_FOR = { target: target, ref: ref }; fileEl.value = ''; fileEl.click(); }
fileEl.addEventListener('change', function(){
  var files = Array.prototype.slice.call(fileEl.files || []), dest = PHOTO_FOR; if (!dest || !files.length) return;
  if (dest.ref === '__new') {
    createFlag().then(function(f){ PHOTO_FOR = { target: 'flag', ref: f.id }; go({ v: 'flag', id: f.id }, true); upload(files, PHOTO_FOR); });
    return;
  }
  upload(files, dest);
});
function upload(files, dest){
  var key = dest.target + ':' + dest.ref;
  files.forEach(function(file){
    UPLOADING[key] = (UPLOADING[key] || []).concat([1]); render();
    shrink(file).then(function(b64){ return api('photo', { target: dest.target, ref: dest.ref, data: b64 }); }).then(function(res){
      D.urls[res.path] = res.url;
      var row = dest.target === 'score' ? scoreRow(dest.ref) : dest.target === 'text' ? textRow(dest.ref) : byId(dest.target === 'dish' ? D.dishes : D.flags, dest.ref);
      if (row) row.photos = res.row.photos;
    }, function(){ toast(t('photoFail'), true); }).then(function(){ UPLOADING[key].pop(); render(); });
  });
}
function shrink(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var max = 1600, w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.82).split(',')[1]);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}
function delPhoto(target, ref, path){
  api('photo_del', { target: target, ref: ref, path: path }).then(function(res){
    var row = target === 'score' ? scoreRow(ref) : target === 'text' ? textRow(ref) : byId(target === 'dish' ? D.dishes : D.flags, ref);
    if (row) row.photos = res.row.photos; render();
  }, function(er){ toast(er.message, true); });
}

/* ── dictation: the iPhone's own speech recognition, Italian ──────────── */
var REC = null, REC_ID = null;
function low(s){ return String(s).toLowerCase().replace(/\s+/g, ' ').trim(); }
function stopMic(){ if (REC) { try { REC.stop(); } catch(e){} } }
function markMic(){
  if (!REC_ID) return;
  var b = root.querySelector('.mic[data-for="' + REC_ID + '"]');
  if (b && !b.classList.contains('live')) { b.classList.add('live'); b.querySelector('span').textContent = t('stop'); }
}
function toggleMic(btn){
  var id = btn.getAttribute('data-for'), ta = document.getElementById(id);
  if (REC && REC_ID === id) { stopMic(); return; }
  stopMic();
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast(t('noMic')); ta.focus(); return; }
  var rec = new SR(); REC = rec; REC_ID = id;
  // Listens in the language on screen (IT/EN at the top): an English speaker on an Italian listener
  // came out as half-English nonsense (Francesco's test, 15 Oct 2026).
  rec.lang = LANG === 'en' ? 'en-GB' : 'it-IT';
  rec.continuous = true; rec.interimResults = true;
  // The text is rebuilt from the whole result list on every event, never appended to. The iPhone
  // sends each "final" result as the whole sentence so far ("Sì", "Sì allora", "Sì allora tutto
  // bene"…), so appending each one saved Danilo's note as one phrase repeated ~30 times (21 Oct 2026).
  // A result that starts with what came before replaces it; anything else is a new piece.
  // If the list starts over after a final result, what was heard before is kept; an unfinished
  // guess that changes ("benne" → "bene") is replaced.
  var base = ta.value ? ta.value.replace(/\s+$/, '') + ' ' : '', kept = '', last = '', lastFinal = false;
  rec.onresult = function(ev){
    var heard = '', n = ev.results.length;
    for (var i = 0; i < n; i++) {
      var s = ev.results[i][0].transcript.replace(/\s+/g, ' ').trim();
      if (!s) continue;
      if (heard && low(s).indexOf(low(heard)) !== 0) heard += ' ' + s; else heard = s;
    }
    if (last && lastFinal && low(heard).indexOf(low(last)) !== 0) kept += last + ' ';
    last = heard; lastFinal = n > 0 && ev.results[n - 1].isFinal;
    var el = document.getElementById(id) || ta;
    el.value = (base + kept + heard).replace(/\s+$/, '') + ' ';
    el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px';
    saveNote(el);
  };
  rec.onerror = function(ev){ if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') toast(t('micBlocked'), true); };
  rec.onend = function(){
    if (REC === rec) { REC = null; REC_ID = null; }
    var b = document.querySelector('.mic.live'); if (b) { b.classList.remove('live'); b.querySelector('span').textContent = t('speak'); }
    var el = document.getElementById(id); if (el) { el.value = el.value.replace(/\s+$/, ''); saveNote(el); }
  };
  try { rec.start(); } catch(e){ toast(t('noMic')); return; }
  btn.classList.add('live'); btn.querySelector('span').textContent = t('stop');
}

/* ── start ──────────────────────────────────────────────────────────────── */
function reload(){
  return api('load').then(function(d){
    if (d.role === 'invite' || d.role === 'invite_admin') { D = d; render(); return; }
    // Keep anything typed but not yet saved.
    var local = {};
    if (D) { D.scores.forEach(function(r){ if (r._local != null) local['s:' + r.code] = r._local; }); D.texts.forEach(function(r){ if (r._local != null) local['t:' + r.key] = r._local; });
             D.dishes.forEach(function(r){ if (r._local != null) local['d:' + r.id] = r._local; }); D.flags.forEach(function(r){ if (r._local != null) local['f:' + r.id] = r._local; }); }
    D = d;
    D.scores.forEach(function(r){ if (local['s:' + r.code] != null) r._local = local['s:' + r.code]; });
    D.texts.forEach(function(r){ if (local['t:' + r.key] != null) r._local = local['t:' + r.key]; });
    D.dishes.forEach(function(r){ if (local['d:' + r.id] != null) r._local = local['d:' + r.id]; });
    D.flags.forEach(function(r){ if (local['f:' + r.id] != null) r._local = local['f:' + r.id]; });
    // Saves still waiting (also from an earlier visit to this page) win over what the server has.
    applyPending();
    render();
  });
}
if (!TOK) render();
else {
  document.documentElement.lang = LANG;
  try { history.replaceState(S, '', location.search); } catch(e){}
  reload().then(function(){ flushSoon(0); }, function(er){
    root.innerHTML = topBar('<h1>Audit</h1>') + '<div class="body"><div class="msg err">' + esc(er.status === 403 ? t('badLink') : (navigator.onLine ? er.message : t('offline'))) + '</div></div>';
  });
}
window.addEventListener('offline', function(){ toast(t('offline'), true); });
