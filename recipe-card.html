<meta charset="utf-8">
<!-- Opened straight from a phone this page laid itself out at 980px and the phone
     shrank the lot — which is not what a card you cook from should do, and the
     guided layout is described in its own text as "for a commis, first time, on a
     phone". Inside the app it was never wrong: the iframe sets the width. This is
     for the link a chef opens on his own phone. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen Recipe Card — three layouts</title>
<style>
/* Roberto's house palette — the project's own tokens, not invented here.
   Cormorant Garamond and DM Sans cannot be loaded on a hosted page, so the
   nearest honest stand-ins are used: Georgia for the display face, the system
   humanist sans for text. The real module keeps the brand faces. */
:root{
  --sabbia:#e1d3c2;--sabbia-light:#ede5d8;--sabbia-dark:#cfc0ad;
  --vino:#410207;--vino-mid:#5e0a10;--vino-light:#7a1218;
  --oliva:#4b5128;--oro:#ba9b02;--ink:#2a1a10;--cream:#f5ede0;
  --serif:Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
/* This is a brand surface: it commits to Sabbia and Vino in either OS theme,
   the way the app itself does on the pass. The tokens are held, not inverted. */
:root[data-theme="dark"],:root[data-theme="light"]{color-scheme:light}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--sabbia);font-family:var(--sans);color:var(--ink);
  -webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ═══ the front page — three doors, so nothing has to be hunted for ═══ */
/* ── THE ROOM, on the way in and nowhere else ──────────────────────────────────
   The Food Bible's device, the same one that is on New recipe: the venue full-bleed
   behind everything, held under a vino wash so it never competes with what you are
   reading. Fixed, so the screen moves over it.

   Two properties and nothing else — `--room` is the photograph, `--scrim` is how far
   the wash is carried so the heading reads off that particular room. The scrim is
   measured against the Cortina screen on New recipe, the one that was approved, never
   judged by eye. 1 is that wash exactly.

   Only on "All dishes". Open a card and the room is gone: a chef reading a method at
   the pass must not be reading it off a photograph. The dish list itself goes on paper
   for the same reason — the heading is what sits on the room. */
body.roomstep{background:#cdbba6;--scrim:1}
body.roomstep::before,body.roomstep::after{content:'';position:fixed;inset:0;z-index:0;
  pointer-events:none}
body.roomstep::before{background:var(--room) center/cover}
body.roomstep::after{background:linear-gradient(180deg,
  rgba(43,1,4,calc(.76*var(--scrim))) 0,
  rgba(43,1,4,calc(.52*var(--scrim))) 200px,
  rgba(43,1,4,calc(.38*var(--scrim))) 55%,
  rgba(43,1,4,calc(.62*var(--scrim))) 100%)}
body.roomstep>*{position:relative;z-index:1}
body.roomstep .eyebrow{color:#f2d3b8}
body.roomstep .lede{color:#fbf3e9}
body.roomstep .stand{color:rgba(251,243,233,.88)}
body.roomstep .stand b{color:#f7e6cf}
body.roomstep .onpaper{background:var(--sabbia);border-radius:10px;padding:6px 15px 18px;
  margin-top:22px;box-shadow:0 18px 40px -22px rgba(20,4,4,.8)}
body.roomstep .foot{margin-top:26px}
/* paper and ink on paper, never the room */
@media print{
  body.roomstep::before,body.roomstep::after{display:none}
  body.roomstep .onpaper{background:none;box-shadow:none;padding:0;margin-top:0}
}

.front{max-width:1080px;margin:0 auto;padding:44px 20px 80px}
.eyebrow{font-size:10.5px;letter-spacing:3.4px;text-transform:uppercase;color:var(--vino-light);margin-bottom:14px}
.lede{font-family:var(--serif);font-size:clamp(32px,6vw,50px);line-height:1.08;color:var(--vino);
  margin:0 0 18px;text-wrap:balance;font-weight:400}
.stand{font-size:15.5px;line-height:1.7;color:var(--ink);max-width:62ch;margin:0 0 8px}
.stand b{color:var(--vino)}
.doors{display:grid;gap:16px;margin-top:34px;grid-template-columns:1fr}
@media (min-width:820px){.doors{grid-template-columns:repeat(3,1fr)}}
.door{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--cream);
  border:1px solid var(--sabbia-dark);border-radius:9px;padding:22px 20px 20px;cursor:pointer;
  font-family:var(--sans);color:inherit;transition:border-color .15s,transform .15s}
.door:hover{border-color:var(--vino);transform:translateY(-2px)}
.door .k{font-size:10.5px;letter-spacing:2.6px;text-transform:uppercase;color:var(--oliva)}
.door .t{font-family:var(--serif);font-size:29px;line-height:1.1;color:var(--vino)}
.door .who{font-size:12.5px;letter-spacing:.3px;color:var(--vino-light);line-height:1.5}
.door .d{font-size:14px;line-height:1.65;color:var(--ink)}
.door .go{margin-top:auto;padding-top:14px;font-size:11px;letter-spacing:1.8px;
  text-transform:uppercase;font-weight:700;color:var(--vino)}
.foot{margin-top:38px;padding-top:20px;border-top:1px solid var(--sabbia-dark);
  font-size:13px;line-height:1.75;color:var(--vino-light);max-width:66ch}
.foot b{color:var(--vino)}

/* ═══ the menu, read from the database ═══ */
.load{background:var(--cream);border:1px solid var(--sabbia-dark);border-radius:8px;
  padding:20px 18px;font-size:14.5px;line-height:1.7;color:var(--vino-light);margin-top:28px}
.load.bad{border-color:var(--vino);color:var(--vino)}
/* This page used to drop its own way back to the list when embedded, on the
   assumption that the shell owned "which dish". The shell does not: it opens this
   page with no dish at all and keeps the frame alive, so hiding the button left a
   chef de partie locked on whatever he opened first, with no way to reach a second
   dish short of reloading the app. The button stays. */
.embed .top{padding-left:8px}
.stale{margin-top:20px;padding:11px 14px;border-left:3px solid var(--oro);background:rgba(186,155,2,.09);
  font-size:13px;line-height:1.6;color:var(--vino-light)}
.stale b{color:var(--vino)}
/* Search sits above the menu and sticks there, because scrolling three hundred dishes
   to get back to the box is the thing it was meant to save you. */
/* the menus, as tabs above the dishes — the first thing you choose, because it
   decides what "everything" even means on this page */
.mbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.mtab{display:inline-flex;align-items:center;gap:7px;font-family:var(--sans);font-size:13px;
  background:#fff;border:1px solid var(--sabbia-dark);border-radius:5px;color:var(--vino);
  padding:11px 15px;min-height:44px;cursor:pointer}
.mtab:hover{border-color:var(--vino)}
.mtab.on{background:var(--vino);border-color:var(--vino);color:var(--cream);font-weight:700}
.mtab .mrun{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;background:var(--oro);
  color:#2a1a10;border-radius:2px;padding:2px 5px}
.mnote{font-family:var(--sans);font-size:12.5px;color:#a3907a;line-height:1.5;margin-top:10px}
.dfind{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-top:26px;padding:12px 0;background:var(--sabbia)}
.dfind input{flex:1 1 240px;min-width:0;font-family:var(--sans);font-size:16px;padding:13px 14px;
  border:1px solid var(--sabbia-dark);border-radius:6px;background:#fff;color:inherit;outline:none}
.dfind input:focus{border-color:var(--vino)}
.dclr{font-family:var(--sans);font-size:12px;background:none;border:1px solid rgba(64,2,7,.3);
  border-radius:5px;color:var(--vino);padding:11px 13px;cursor:pointer;flex:0 0 auto}
.dclr:hover{background:var(--cream)}
.dcount{font-family:var(--sans);font-size:12px;color:#a3907a;flex:0 0 auto}
.moved{background:var(--vino);color:var(--cream);padding:12px 16px;font-size:13.5px;line-height:1.5;
  display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.moved b{color:var(--oro)}
.moved .btn{margin-left:auto;background:var(--cream);color:var(--vino);border:none;border-radius:4px;
  font-family:var(--sans);font-size:11px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700;
  padding:11px 16px;cursor:pointer;white-space:nowrap}
.dish .dsec{font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--oliva)}
.menu{margin-top:10px;display:flex;flex-direction:column}
.msec{font-size:10px;letter-spacing:2.8px;text-transform:uppercase;color:var(--oliva);
  margin:22px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--sabbia-dark)}
.msec:first-child{margin-top:0}
.dish{display:flex;align-items:baseline;gap:14px;width:100%;text-align:left;background:none;
  border:none;border-bottom:1px solid rgba(207,192,173,.6);padding:15px 4px;cursor:pointer;
  font-family:var(--sans);color:inherit;min-height:56px}
.dish:hover{background:var(--cream)}
.dish .dn{font-family:var(--serif);font-size:23px;color:var(--vino);line-height:1.15}
/* What is still missing, said on the row — so nobody opens a card expecting a method
   that was never written, and so the gaps are visible without hunting. */
.dish .dgap{font-size:11.5px;letter-spacing:.3px;color:#a3907a}
.dish .dgap.ok{color:var(--oliva)}
.dish .dgo{margin-left:auto;font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;
  font-weight:700;color:var(--vino);white-space:nowrap}

/* ═══ the bar inside a layout ═══ */
.top{background:var(--vino);color:var(--cream);position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:6px;padding:0 8px;overflow-x:auto}
.top .home{background:none;border:none;color:var(--cream);font-family:var(--sans);font-size:12px;
  letter-spacing:1.2px;padding:0 14px;height:52px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.top .sw{display:flex;gap:0;margin-left:auto;flex:0 0 auto}
.top .sw button{background:none;border:none;color:rgba(245,237,224,.6);font-family:var(--sans);
  font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600;padding:0 14px;height:52px;
  cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.top .sw button.on{color:var(--cream);border-bottom-color:var(--oro)}
.why{background:var(--sabbia-light);border-bottom:1px solid var(--sabbia-dark);
  padding:12px 18px;font-size:13px;color:var(--vino-light);line-height:1.6}
.why b{color:var(--vino)}
.why i{font-style:italic}

/* ═══ shared recipe furniture ═══ */
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 90px}
.hdr{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 18px}
.rname{font-family:var(--serif);font-size:clamp(30px,5.4vw,42px);line-height:1.05;color:var(--vino);text-wrap:balance}
.rsec{font-size:10.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--vino-light);padding-bottom:8px}
.meta{font-size:13px;color:var(--vino-light);margin-top:9px;line-height:1.6}
.rule{height:1px;background:var(--sabbia-dark);margin:18px 0}
.h{font-family:var(--serif);font-size:24px;color:var(--vino);margin:0 0 10px;text-wrap:balance}
.h .sm{font-family:var(--sans);font-size:10px;letter-spacing:2px;text-transform:uppercase;
  color:var(--vino-light);margin-left:10px;vertical-align:2px}
.card{background:var(--cream);border:1px solid var(--sabbia-dark);border-radius:8px;padding:20px 18px;margin-bottom:16px}
.photos{display:flex;gap:10px;overflow-x:auto;margin:16px 0 2px;padding-bottom:4px}
.ph{flex:0 0 auto;width:190px;height:130px;border-radius:6px;border:1px dashed var(--sabbia-dark);
  background:var(--sabbia-light);display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:11.5px;color:#a3907a;padding:10px;line-height:1.55}
.none{font-size:13px;color:#8a7a62;line-height:1.6}

.ing{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ing td{padding:12px 8px;border-bottom:1px solid var(--sabbia-dark);vertical-align:top;font-size:15.5px;line-height:1.45}
.ing tr:last-child td{border-bottom:none}
.ing .q{width:78px;text-align:right;font-weight:700;color:var(--vino);white-space:nowrap}
.ing .u{width:58px;font-size:12.5px;color:var(--vino-light);padding-top:15px}
.ing .u .miss{display:inline-block;font-size:10px;letter-spacing:.6px;color:var(--vino);
  background:rgba(65,2,7,.07);border:1px solid rgba(65,2,7,.3);border-radius:3px;
  padding:2px 5px;line-height:1.3;white-space:nowrap}
.ing tr.gap .n{color:var(--vino-light)}
.btag{display:inline-block;font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--oliva);
  border:1px solid rgba(75,81,40,.42);border-radius:3px;padding:2px 6px;margin-left:9px;vertical-align:1px;white-space:nowrap}
/* the chef's own words about a line — set apart from the ingredient name, on its own
   line so a long remark never pushes the name out of shape, and in the serif because it
   is him talking, not the app. This is what tells a cook that the second icing sugar is
   for dusting and not a mistake. */
.lnote2{display:block;font-family:var(--serif);
  font-size:13.5px;line-height:1.35;font-style:italic;color:var(--vino-light);margin-top:2px}
@media print{ .lnote2{color:#000} }
.ing tr.sub{cursor:pointer}
.ing tr.sub:hover .n{color:var(--vino)}
.caret{display:inline-block;color:var(--oliva);font-size:12px;width:15px}
.subpane{background:var(--sabbia-light);border-left:3px solid var(--oliva)}
.subpane td{padding:15px 16px 20px}

.step{display:flex;gap:14px;padding:9px 0;line-height:1.65;font-size:15.5px}
.step .no{flex:0 0 26px;font-variant-numeric:tabular-nums;color:var(--vino-light);font-size:12.5px;padding-top:3px;font-weight:700}
.btn{background:var(--vino);color:var(--cream);border:none;border-radius:4px;font-family:var(--sans);font-size:11px;
  letter-spacing:1.6px;text-transform:uppercase;font-weight:700;padding:0 18px;height:46px;cursor:pointer}
.btn.ghost{background:none;color:var(--vino);border:1.5px solid var(--sabbia-dark)}
.btn:disabled{opacity:.4;cursor:default}

.port{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin:18px 0 2px}
.port .lab{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--vino-light)}
.stp{display:flex;align-items:center;border:1.5px solid var(--sabbia-dark);border-radius:6px;background:#fff;overflow:hidden}
.stp button{width:48px;height:46px;border:none;background:none;font-size:21px;color:var(--vino);cursor:pointer;font-family:var(--sans);line-height:1}
.stp .v{min-width:60px;text-align:center;font-size:17px;font-weight:700;color:var(--vino);font-variant-numeric:tabular-nums}
/* Typed, not only tapped. Fifteen portions was fifteen taps of +, and half a batch and
   twenty and a half could not be asked for at all. */
.stp input.v{border:none;outline:none;background:none;font-family:var(--sans);width:74px;
  padding:0 4px;-moz-appearance:textfield}
.stp input.v::-webkit-outer-spin-button,.stp input.v::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stp input.v:focus{background:rgba(186,155,2,.12)}
.scaled{font-size:12.5px;color:var(--oliva)}
/* on paper, where it cannot be tapped away */
.pscale{margin:8px 0 4px;padding:8px 11px;border:1px solid var(--sabbia-dark);
  border-left:3px solid var(--oro);border-radius:0 4px 4px 0;font-size:12.5px;
  line-height:1.5;color:var(--ink);background:rgba(186,155,2,.10)}

/* ═════ the production sheet ═════ */
.phd{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;
  border-bottom:2px solid var(--vino);padding-bottom:12px;margin-bottom:16px}
.pdish{font-family:var(--serif);font-size:34px;line-height:1.05;color:var(--vino)}
.pdish small,.pfor small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:2.2px;
  text-transform:uppercase;color:var(--vino-light);margin-bottom:4px}
.pfor{text-align:right;font-family:var(--serif);font-size:29px;color:var(--vino);line-height:1}
.pfor span{font-size:15px}
.phero{display:flex;gap:20px;align-items:flex-start;margin-bottom:6px}
.pherotxt{flex:1 1 auto;min-width:0}
.pshero{flex:0 0 auto;width:196px}
.pshero img{width:100%;height:148px;object-fit:cover;border-radius:7px;display:block;border:1px solid var(--sabbia-dark)}
.pcap{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--vino-light);margin-top:5px;text-align:center}
@media(max-width:700px){ .phero{flex-wrap:wrap} .pshero{width:100%} }
.psumh{font-size:9.5px;letter-spacing:2.2px;text-transform:uppercase;font-weight:700;color:var(--vino-light);margin-bottom:7px}
table.psum{width:100%;border-collapse:collapse}
table.psum td{padding:9px 8px 9px 0;border-bottom:1px solid var(--sabbia-dark);vertical-align:middle}
table.psum tr:last-child td{border-bottom:none}
td.pn{font-family:var(--serif);font-size:18px;line-height:1.15}
td.pq2{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--vino);white-space:nowrap}
td.px{font-size:11.5px;color:var(--vino-light)}
.pinc{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--vino-light);cursor:pointer;white-space:nowrap}
.pinc input{width:17px;height:17px;accent-color:#410207}
.poff{font-size:11.5px;color:var(--vino-light);font-style:italic;margin-top:8px;opacity:.85}
/* where one recipe ends and the next begins — space, a heavy rule, and its own name */
.pblk{margin-top:38px;break-inside:avoid;page-break-inside:avoid}
.pcut{border-top:3px solid var(--vino)}
.pband{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:9px 0 12px;
  border-bottom:1px solid var(--sabbia-dark);margin-bottom:14px}
.pno{font-family:var(--sans);font-size:9.5px;letter-spacing:2.2px;text-transform:uppercase;font-weight:700;
  color:var(--cream);background:var(--vino);border-radius:3px;padding:4px 9px;white-space:nowrap}
.pbh{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;flex:1 1 auto}
.pbt{font-family:var(--serif);font-size:25px;color:var(--vino);line-height:1.1}
.pbt small{display:block;font-family:var(--sans);font-size:9.5px;letter-spacing:2px;
  text-transform:uppercase;color:var(--vino-light);margin-bottom:3px}
.pbm{font-size:12px;color:var(--vino-light);line-height:1.5;text-align:right}
.pbm b{color:var(--vino)}
.pmodes{display:flex;gap:7px;margin:0 0 12px;flex-wrap:wrap}
.pmodes button{font-family:var(--sans);font-size:11px;font-weight:600;padding:8px 12px;border-radius:5px;
  border:1px solid var(--sabbia-dark);background:transparent;color:var(--vino-light);cursor:pointer;text-align:left}
.pmodes button.on{border-color:var(--vino);background:rgba(65,2,7,.09);color:var(--vino)}
.pmodes small{display:block;font-weight:400;opacity:.85;font-size:10.5px;margin-top:2px}
/* ── the gutter between what you weigh and what you do ──
   26px and no rule put a wrapped ingredient name a few pixels from the method beside it.
   A chef checking "605 — of what?" must never have to work out which column he is reading,
   so the two are separated by a real gutter and a line down it, and the ingredient column
   is boxed on its own ground. */
.pcols{display:grid;grid-template-columns:minmax(250px,340px) 1fr;gap:0}
.pcols > div:first-child{padding-right:30px;border-right:1px solid var(--sabbia-dark)}
.pcols > div:last-child{padding-left:34px}
@media(max-width:820px){
  .pcols{grid-template-columns:1fr;gap:20px}
  .pcols > div:first-child{padding-right:0;border-right:none;border-bottom:1px solid var(--sabbia-dark);padding-bottom:16px}
  .pcols > div:last-child{padding-left:0}
}
/* a number and its ingredient are one thing: they sit on one band, middle-aligned, so a
   name that wraps to two lines still reads against its own figure and not the one below */
.pcols table.ing td{vertical-align:middle;padding:8px 6px}
.pcols table.ing tr:nth-child(odd) td{background:rgba(207,192,173,.22)}
.pcols table.ing td.q{padding-right:4px}
.pcols table.ing td.n{padding-left:2px}
.pch{font-size:9px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--vino-light);
  border-bottom:1px solid var(--sabbia-dark);padding-bottom:5px;margin-bottom:4px}
.pshot{margin-top:12px}
.pshot img{width:100%;max-width:228px;height:128px;object-fit:cover;border-radius:6px;display:block;
  border:1px solid var(--sabbia-dark)}

/* The dish and its batches are two different things and must never look alike:
   the dish is the serif name in Vino, the batches are smaller and carry the same
   olive mark they carry on the ingredient line. */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 15px;align-items:center}
.tabs button{flex:0 0 auto;background:var(--sabbia-light);border:1px solid var(--sabbia-dark);border-radius:5px;
  padding:0 15px;height:46px;font-family:var(--sans);font-size:13.5px;color:var(--vino);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--vino);color:var(--cream);border-color:var(--vino)}
.tabs .t-dish{font-family:var(--serif);font-size:19px;padding:0 18px}
.tabs .t-batch{border-style:dashed;border-color:rgba(75,81,40,.45);color:var(--oliva);background:none}
.tabs .t-batch.on{background:var(--oliva);color:var(--cream);border-style:solid;border-color:var(--oliva)}
.tsep{flex:0 0 auto;font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:#a3907a;padding:0 4px}
/* a batch that lives inside another batch says so on its own tab, or the strip reads
   as a flat list of things the dish is made of and the order they are made in is lost */
.tabs .t-batch .inside{display:block;font-size:9.5px;letter-spacing:.4px;text-transform:none;color:#a3907a;margin-top:1px}
.tabs .t-batch{line-height:1.15;padding-top:5px;padding-bottom:5px;text-align:left}
.tabs .t-batch.on .inside{color:rgba(245,237,224,.75)}
/* the opened batch is one batch, never the scaled dish — said where the numbers are */
.notscaled{margin:10px 0 4px;padding:9px 12px;border-left:3px solid var(--oro);
  background:rgba(186,155,2,.09);font-size:13px;line-height:1.55;color:var(--vino-light)}
.notscaled b{color:var(--vino)}
.kind{align-self:center;font-size:9.5px;letter-spacing:2px;text-transform:uppercase;font-weight:700;
  border-radius:3px;padding:5px 9px;white-space:nowrap;margin-bottom:5px}
.k-dish{background:var(--vino);color:var(--cream)}
.k-batch{background:none;color:var(--oliva);border:1px solid rgba(75,81,40,.5)}
.parent{display:block;background:none;border:none;font-family:var(--sans);font-size:13px;color:var(--vino-light);
  cursor:pointer;padding:6px 0 12px;text-align:left;min-height:40px}
.parent:hover{color:var(--vino)}
/* a batch line, marked the same on every screen */
.bline .n{border-left:3px solid var(--oliva);padding-left:11px;margin-left:-2px}
tr.sub[data-jump]{cursor:pointer}
tr.sub[data-jump]:hover td{background:var(--sabbia-light)}
.cols{display:block}

/* the station's photos and its steps */
.pstrip{margin:18px 0 0}
.frame{display:flex;flex-direction:column;justify-content:center;gap:6px;width:100%;max-width:300px;height:190px;
  border:1px dashed var(--sabbia-dark);border-radius:7px;background:var(--sabbia-light);cursor:pointer;
  font-family:var(--sans);text-align:center;padding:14px;transition:height .2s,max-width .2s}
.frame.big{max-width:100%;height:min(58vh,460px)}
.frame[disabled]{cursor:default;opacity:.85}
/* a real photo off the create screen — the plate, or the cut nobody can describe */
.pstrip{display:flex;gap:10px;flex-wrap:wrap}
.shot{position:relative;flex:0 0 auto;width:300px;max-width:100%;border:1px solid var(--sabbia-dark);
  border-radius:7px;overflow:hidden;padding:0;background:var(--sabbia-light);cursor:pointer;
  transition:width .2s}
/* Same as the Food Bible: `cover` cut the near and far rims off a phone photo, and the
   chef at the pass is looking at this to see what the plate should be. Fit the whole
   photograph in the band. */
.shot img{display:block;width:100%;height:190px;object-fit:contain;background:var(--cream)}
.shot.big{width:100%}
.shot.big img{height:auto;max-height:min(58vh,520px);object-fit:contain;background:var(--cream)}
.shot .fh{position:absolute;left:0;right:0;bottom:0;background:rgba(65,2,7,.72);color:var(--cream);
  font-size:11px;letter-spacing:.4px;padding:6px 8px}
img.ph{width:190px;height:130px;object-fit:cover;border-radius:6px;border:1px solid var(--sabbia-dark);flex:0 0 auto}
.frame .fl{font-family:var(--serif);font-size:19px;color:var(--vino)}
.frame .fh{font-size:11.5px;letter-spacing:.4px;color:#a3907a}
.sstep{display:flex;gap:14px;padding:11px 0;line-height:1.6;font-size:17px;border-bottom:1px solid rgba(207,192,173,.55)}
.sstep:last-child{border-bottom:none}
.sstep .no{flex:0 0 26px;font-variant-numeric:tabular-nums;color:var(--vino-light);font-size:12.5px;padding-top:4px;font-weight:700}

.tick{display:flex;gap:14px;padding:13px 12px;border-bottom:1px solid var(--sabbia-dark);cursor:pointer;
  line-height:1.55;font-size:17px;align-items:flex-start;min-height:50px;border-radius:4px}
.tick:hover{background:var(--sabbia-light)}
.tick .bx{flex:0 0 27px;height:27px;border:2px solid var(--sabbia-dark);border-radius:4px;margin-top:1px;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;background:#fff}
.tick.done .bx{background:var(--oliva);border-color:var(--oliva)}
.tick.done .tx{color:#9d8f7d;text-decoration:line-through;text-decoration-color:rgba(157,143,125,.5)}
.prog{font-size:12px;color:var(--vino-light);margin-left:auto;font-family:var(--sans)}

.gwrap{max-width:760px;margin:0 auto;padding:22px 18px 130px}
.gbar{height:4px;background:var(--sabbia-dark);border-radius:2px;overflow:hidden;margin-bottom:24px}
.gbar i{display:block;height:100%;background:var(--vino);transition:width .25s}
.gcount{font-size:10.5px;letter-spacing:2.6px;text-transform:uppercase;color:var(--vino-light);margin-bottom:15px}
.gtext{font-family:var(--serif);font-size:clamp(26px,5.2vw,34px);line-height:1.3;color:var(--ink);text-wrap:balance}
.gph{width:100%;height:200px;border-radius:7px;border:1px dashed var(--sabbia-dark);background:var(--sabbia-light);
  display:flex;align-items:center;justify-content:center;font-size:11.5px;color:#a3907a;margin-top:26px;text-align:center;padding:14px}
.gnav{position:fixed;left:0;right:0;bottom:0;background:var(--cream);border-top:1px solid var(--sabbia-dark);
  padding:12px 16px;display:flex;gap:10px;z-index:20}
.gnav .btn{flex:1;max-width:280px}

@media (min-width:1024px){
  .cols{display:grid;grid-template-columns:340px minmax(0,1fr);gap:28px;align-items:start}
  .cols .left{position:sticky;top:74px}
}
@media (pointer:coarse){
  .step{font-size:16.5px}
  .sstep{font-size:18px;padding:13px 0}
  .ing td{padding:15px 8px;font-size:16.5px}
  .tick{font-size:18px;min-height:58px}
}
/* the whole set is in the page, hidden, so nothing is rebuilt when he hits print */
#psheet{display:none}
.pblock{break-inside:avoid;page-break-inside:avoid;margin-bottom:26px}
/* the photo floats, so the block has to close around it or the next recipe rides up
   beside a picture that is not its own */
.pblock::after{content:"";display:table;clear:both}
.pkind{font-size:9px;letter-spacing:2.4px;text-transform:uppercase;color:#555;margin-bottom:3px}
.pname{font-family:var(--serif);font-size:27px;line-height:1.1;margin-bottom:3px}
.pmeta{font-size:11.5px;color:#444;margin-bottom:12px}
/* the picture on the folder page — beside the words, not instead of them, and sized so
   adding it never pushes a recipe onto a second sheet */
.pfoto{float:right;width:58mm;margin:0 0 10px 12mm;text-align:center}
.pfoto img{width:100%;height:40mm;object-fit:cover;display:block;border:1px solid #999}
.pfcap{display:block;font-size:8.5pt;letter-spacing:1.4px;text-transform:uppercase;color:#555;margin-top:4px}
@media(max-width:620px){ .pfoto{float:none;width:100%;margin:0 0 12px} .pfoto img{height:46mm} }

/* ── allergens ──
   Not a chip row. At the pass this is read at arm's length in a hurry, so it is one
   line of words with a rule beside it, and the batch each one came from sits under
   the word rather than in a tooltip nobody hovers with wet hands. */
.alg{display:flex;gap:14px;align-items:flex-start;margin:16px 0 0;padding:13px 15px;
  background:rgba(64,2,7,.05);border-left:3px solid var(--vino);border-radius:0 6px 6px 0}
.algl{flex:0 0 auto;font-size:9.5px;letter-spacing:2.2px;text-transform:uppercase;
  font-weight:700;color:var(--vino);padding-top:3px}
.algv{font-size:15px;line-height:1.55;color:var(--ink);display:flex;flex-wrap:wrap;gap:4px 16px}
.algi{font-weight:600}
.algs{display:block;font-size:10.5px;font-weight:400;letter-spacing:.2px;color:var(--vino-light)}
/* the one-line version of the same thing: paper only, never on screen */
.algall{display:none}
/* ── at the pass: the sentence, then the square ── */
.plating{margin:14px 0 0;padding:12px 15px;background:var(--cream);border:1px solid var(--sabbia-dark);
  border-left:3px solid var(--oliva);border-radius:0 7px 7px 0}
.plating .pl{display:block;font-size:9.5px;letter-spacing:2.2px;text-transform:uppercase;
  font-weight:700;color:var(--oliva);margin-bottom:5px}
.plating .plt{font-size:15px;line-height:1.6;color:var(--ink);white-space:pre-wrap}
/* ── once it is made: the batch's own line ──
   Olive, like plating, because it is the same kind of thing — an instruction about the
   food rather than a number to check in a glance. It is a rule beside words, not a chip
   row and not a square: it is read once, at the moment the batch is put away.
   `pre-wrap` because a chef writing three lines meant three lines. */
.storeb{margin:14px 0 0;padding:12px 15px;background:var(--cream);border:1px solid var(--sabbia-dark);
  border-left:3px solid var(--oliva);border-radius:0 7px 7px 0}
.stl{display:block;font-size:9.5px;letter-spacing:2.2px;text-transform:uppercase;
  font-weight:700;color:var(--oliva);margin-bottom:5px}
.stt{display:block;font-size:15px;line-height:1.6;color:var(--ink);white-space:pre-wrap}
/* on paper it is plain text under its own heading — a tint and a border cost ink and
   say nothing the heading has not already said */
.pstore{font-size:14px;line-height:1.6;color:var(--ink);white-space:pre-wrap}
.passq{display:flex;flex-wrap:wrap;margin:12px 0 0;border:1px solid var(--sabbia-dark);
  border-radius:7px;overflow:hidden;background:var(--cream)}
/* three equal boxes; on a phone they stack and the rule moves with them */
.pq{flex:1 1 0;padding:11px 14px;border-right:1px solid var(--sabbia-dark);min-width:132px}
.pq:last-child{border-right:none}
@media(max-width:560px){
  .passq{display:block}
  .pq{border-right:none;border-bottom:1px solid var(--sabbia-dark)}
  .pq:last-child{border-bottom:none}
}
.pqk{display:block;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--vino-light);
  font-weight:700;margin-bottom:4px}
.pqv{font-family:var(--serif);font-size:26px;line-height:1.05;color:var(--vino)}
.pqv small{font-family:var(--sans);font-size:11px;letter-spacing:1px;color:var(--vino-light)}
.pqv.sm{font-family:var(--sans);font-size:14.5px;font-weight:600;line-height:1.45;color:var(--ink)}
.pqv i{font-family:var(--sans);font-size:12px;font-style:italic;font-weight:400;color:var(--vino-light);opacity:.85}
.alg.none{background:none;border-left-color:var(--sabbia-dark)}
.alg.none .algv{display:block;font-size:12.5px;color:#8a7a62;font-weight:400}
.alg.none .algl{color:#8a7a62}
@media (max-width:520px){ .alg{display:block} .algl{display:block;margin-bottom:5px} }

@media print{
  @page{margin:14mm}
  /* Ask for the colour, then never depend on it: Chrome and Edge default
     "Background graphics" to OFF, and the allergen line is the one block on this
     card that must not quietly disappear. So in print it is rebuilt out of ink —
     black on white, boxed, bold — and comes out right whichever way that box is left. */
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .alg{background:none!important;border:2px solid #000;border-left:2px solid #000;
    border-radius:0;padding:8px 10px;margin:12px 0}
  .algl,.algi,.algv{color:#000!important}
  /* One line of allergens, then one line of where they come from. It was one block per
     allergen with the same batch names under each — four repeats of the same sentence,
     a third of the page, and the recipe fell onto a second sheet because of it. */
  .algv{font-size:11.5pt;display:block}
  .algi{display:inline;font-weight:700}
  .algi + .algi::before{content:" · ";font-weight:400}
  .algs{display:none}                      /* said once below instead of under each */
  .algall{display:none}                    /* the names are the answer; the where is on screen */
  .alg{padding:6px 9px;margin:9px 0}
  /* it sits under the recipe it belongs to, not over the top of it */
  .algfoot{margin-top:10px}
  .alg.none{border:1px dashed #000}
  .alg.none .algv,.alg.none .algl{color:#000!important}
  .top,.why,.gnav,.noprint,.stp,.port,.parent,.tabs,.frame{display:none!important}
  /* a real photo earns its ink on a section sheet; the empty placeholder does not */
  .shot{width:70mm!important;border:1px solid #999}
  .shot img{height:48mm}
  .shot .fh{display:none}
  body{background:#fff;color:#000}
  .wrap,.gwrap{max-width:none;padding:0}
  .card{background:none;border:none;border-bottom:1px solid #ccc;border-radius:0;padding:0 0 14px;margin-bottom:18px}
  .cols{display:block}.ph,.gph{display:none}
  .rname,.pname,.h{color:#000}
  .ing td{font-size:12pt;padding:6px 6px}
  .ing .q{color:#000}
  .sstep,.step{font-size:11.5pt;padding:5px 0}
  .bline .n{border-left:2px solid #000}
  .kind{border:1px solid #000;background:none!important;color:#000!important}
  /* same reason as the allergen box: background graphics default to OFF, and this is
     the line that stops somebody weighing a batch as if it were forty covers' worth */
  .notscaled{background:none!important;border:1px solid #000;border-left:1px solid #000;
    color:#000!important;font-size:10pt}
  .notscaled b{color:#000!important}
  /* the same reason again, and it matters more here: this is the line that says the
     numbers on the page are not the recipe. A tinted box prints as nothing. */
  .pscale{background:none!important;border:1.5px solid #000;border-left:1.5px solid #000;
    color:#000!important;font-size:10pt;font-weight:600}
  /* "Print this batch" prints the screen card itself, so this box goes to paper as it
     stands — and its cream tint does not, because background graphics default to off.
     A rule in black, same as every other box on this page. */
  .storeb{background:none!important;border:1px solid #000;border-left:1px solid #000;
    margin:9px 0;padding:6px 9px}
  .stl{color:#000!important}
  .stt{color:#000!important;font-size:11.5pt}
  .pstore{color:#000!important;font-size:11.5pt}
  /* ── the production sheet on paper ──
     Everything that separates one recipe from the next is a RULE, never a tint: a chef
     weighing the mousse sugar into the lady finger is the mistake this is here to stop,
     and background graphics default to off at the printer. */
  .pdish,.pfor,.pbt,td.pq2,.pbm b{color:#000!important}
  .psumh,.px,.pch,.pbm,.pbt small,.pdish small,.pfor small,.pcap{color:#333!important}
  .phd{border-bottom:1.5pt solid #000}
  .pblk{margin-top:11mm}
  .pcut{border-top:3pt solid #000}
  .pband{border-bottom:.5pt solid #666}
  .pno{background:none!important;color:#000!important;border:1.2pt solid #000;font-weight:700}
  .pmodes,.pinc{display:none!important}
  /* the gutter has to survive the printer: the tint behind the rows will not print, so the
     binding between a number and its name is carried by a rule under every row and a rule
     down the middle — both ink. */
  .pcols > div:first-child{border-right:.5pt solid #999;padding-right:8mm}
  .pcols > div:last-child{padding-left:9mm}
  .pcols table.ing tr:nth-child(odd) td{background:none!important}
  .pcols table.ing td{border-bottom:.5pt solid #bbb;padding:5px 5px}
  /* one recipe per page, for handing a page to each commis */
  body.perpage .pblk{break-before:page;page-break-before:always}
  body.perpage .pblk:first-of-type{break-before:auto;page-break-before:auto}
  /* one component, or the whole folder page */
  body.printall .pcur{display:none}
  body.printall #psheet{display:block}
}

    var i = kv.indexOf('='); if (i > 0) p[kv.slice(0,i)] = kv.slice(i+1);

  if (p.archived === 'is.false') rows = rows.filter(function(r){ return !r.archived; });

var R = null, SUBS = {}, MENU = [], loadErr = null, busy = false;

/* The method is four boxes of typed text on the create screen. A step is a line.

   chef left empty simply does not appear. */
function toSteps(m){
  var out = { mise:[], method:[], order:[], plating:[] };

}

function toLines(rows){

    .sort(function(a,b){ return (a.position||0) - (b.position||0); })
    .map(function(l){
      return { q:l.qty, u:l.unit, n:l.stock_name || l.typed_text || '(unnamed)',

function shape(rec, lines){

    allergens:rec.allergens || [], photos:rec.photos || [],

/* ── the card notices when the recipe moves underneath it ──
   A chef de partie opens a card at 4pm and works off it for two hours. In that time
   the exec chef can change the dish, or a batch inside it, and nothing on this screen
   said so — he would finish making yesterday's version off a page that looked current.

   Every component is watched, not just the dish: the thing most likely to be corrected
   is a batch, and a batch changing changes what he is standing there making.

   It does NOT redraw under his hands. Quantities changing mid-weigh is worse than
   knowing they are old. It says so, and waits to be told. */
var WATCH_MS = 90000, movedAt = null, movedWhat = null, watching = null;

         ', ' + d.toLocaleTimeString(undefined,{ hour:'2-digit', minute:'2-digit' });

function stampsOf(){
  var o = {};

  return o;
}
function tick(){
  if (view === 'home'){ freshen(); return; }
  if (!R || movedAt || document.hidden) return;
  var have = stampsOf(), ids = Object.keys(have);
  if (!ids.length) return;
  sb('recipes?id=in.(' + ids.join(',') + ')&select=id,name,updated_at')
    .then(function(rows){
      (rows||[]).forEach(function(r){
        if (movedAt || !have[r.id] || r.updated_at === have[r.id]) return;
        movedAt = r.updated_at; movedWhat = r.name;
      });
      if (movedAt) render();
    })
    .catch(function(){});            /* a dropped poll is not news — say nothing */
}
function watch(){
  if (watching) clearInterval(watching);

}
/* ── the front page notices a dish that was not there when it opened ──
   The list was read once, when this frame was first built, and never again — and the
   module around it keeps the frame alive for the whole session. So a dish written on
   the create screen at 17:40 was still missing from this page at 18:40 on the laptop
   that had the card open, and present on the laptop that opened it fresh
   (3 Sep 2026: Bavetta and Costata di Wagyu, Andrea's screen).
   A light probe — ids and stamps only — every WATCH_MS while the front page is showing,
   and again the moment the screen is reopened or the tab comes back. The full re-read
   happens only when a dish appeared, went, or moved. It never redraws under somebody
   typing in the search box: the next probe does it once they have stopped. */
var freshening = false, menuSig = '';
function listSig(rows){
  return (rows||[]).map(function(r){ return r.id + '@' + (r.updated_at||''); }).sort().join('|');
}
function freshen(){
  if (view !== 'home' || busy || freshening || document.hidden) return;
  freshening = true;

    .then(function(rows){

      return loadMenu().then(function(){

        if (el && /^(INPUT|TEXTAREA)$/.test(el.tagName)){ menuSig = ''; return; }

/* Coming back to the card is the moment he is about to act on it. A phone locked in

   looks again is the whole window in which he cooks the old one. */
document.addEventListener('visibilitychange', function(){ if (!document.hidden) tick(); });

/* Pull the dish and, in one more round trip, every batch inside it — including
   batches inside those batches. Two queries, not one per batch: a card opened at
   the pass on kitchen wifi cannot afford a waterfall. */
function loadRecipe(id){
  var dish = null;
  return Promise.all([
    sb('recipes?id=eq.' + id + '&select=*'),
    sb('recipe_lines?recipe_id=eq.' + id + '&select=*')
  ]).then(function(res){
    if (!res[0].length) throw new Error('that recipe is no longer there');
    dish = shape(res[0][0], res[1]);

  }).then(function(subs){
    R = dish; SUBS = subs;

function gather(ids, acc){

  var inList = '(' + ids.join(',') + ')';
  return Promise.all([
    sb('recipes?id=in.' + inList + '&select=*'),
    sb('recipe_lines?recipe_id=in.' + inList + '&select=*')
  ]).then(function(res){
    var byRecipe = {};
    res[1].forEach(function(l){ (byRecipe[l.recipe_id] = byRecipe[l.recipe_id] || []).push(l); });
    var next = [];
    res[0].forEach(function(rec){
      acc[rec.id] = shape(rec, byRecipe[rec.id] || []);

/* The menu list also says what each dish is still missing, and "no allergens" was
   worked out from the dish's OWN ticks alone. A dish whose allergens all come from
   its batches — which is most of them — was listed as having none, on the page a
   chef de partie uses to pick what to cook. So the same walk the card does is done
   here, once, off two extra reads. */
function loadMenu(){
  return Promise.all([
    sb('recipes?kind=eq.main&archived=is.false&select=id,name,section,menu_price,method,allergens,photos,updated_at&order=section,name'),
    sb('recipes?select=id,allergens'),
    sb('recipe_lines?select=recipe_id,child_recipe_id'),
    /* the menus, and what is on them. A dish carries its menus so the front page can
       be narrowed to one — a chef de partie on the Christmas section does not want
       three hundred à la carte dishes in the way. */
    sb('menus?venue_id=eq.robertos-difc&archived=is.false&active=is.true&select=id,name,running,position&order=position,name')
      .catch(function(){ return []; }),
    sb('recipe_menus?select=recipe_id,menu_id').catch(function(){ return []; })
  ]).then(function(res){
    MENUS = res[3] || [];
    menuSig = listSig(res[0]);
    var ON = {};
    (res[4]||[]).forEach(function(r){ (ON[r.recipe_id] = ON[r.recipe_id] || []).push(r.menu_id); });
    /* the menu that is running is what the page opens on; if nobody has said which,
       everything is shown rather than nothing */
    if (!MENUS.length) menuPick = '';
    else if (menuPick === null){
      var run = MENUS.filter(function(m){ return m.running; })[0];
      menuPick = run ? run.id : '';
    }
    var ALL = {}, LINKS = {};
    (res[1]||[]).forEach(function(r){ ALL[r.id] = r.allergens || []; });
    (res[2]||[]).forEach(function(l){
      if (l.child_recipe_id) (LINKS[l.recipe_id] = LINKS[l.recipe_id] || []).push(l.child_recipe_id);
    });

        (ALL[id] || []).forEach(function(k){ if (out.indexOf(k) < 0) out.push(k); });

var MS = [ {k:'mise',t:'Mise en place'}, {k:'method',t:'Method'}, {k:'order',t:'To order'}, {k:'plating',t:'Plating'} ];

function unit(u){
  var v = U[u] || (u||'').toLowerCase();
  return (v === 'l' || v === 'ltr' || v === 'lt') ? 'L' : v;
}
/* "Makes 1 portions" is the kind of thing that makes a chef stop trusting the page */
function amount(q, u){
  var t = String(u||'');
  if (q === 1 && /s$/i.test(t) && !/ss$/i.test(t)) t = t.replace(/s$/i,'');
  return (q == null ? '' : num(q)) + (t ? ' ' + t : '');

/* ── finding one dish among three hundred ──

   head at 4pm is the one you will type. */

var SYN = { branzino:['seabass'], seabass:['branzino'], ricciola:['amberjack','hamachi'],

  aubergine:['eggplant'], eggplant:['aubergine'], courgette:['zucchini'], zucchini:['courgette'],
  prawn:['shrimp','gambero','gamberi'], shrimp:['prawn','gambero','gamberi'],
  gambero:['prawn','shrimp'], gamberi:['prawn','shrimp'],

function stem(w){ return w.length>3 ? w.replace(/ies$/,'y').replace(/(es|s)$/,'') : w; }

function elsewhereNote(q){

  if (!found.length) return '';
  return '<div class="mnote noprint">' + found.slice(0,4).map(function(d){
    var names = (d.menus||[]).map(function(id){
      var m = MENUS.filter(function(x){ return x.id===id; })[0]; return m ? m.name : null;
    }).filter(Boolean);
    return '<b>' + esc(d.name) + '</b> is not on this menu — ' +

}
/* A name match always beats a section match, so searching "burrata" gives you the

function findDishes(qRaw, list){
  var qw = words(qRaw); if (!qw.length) return list.slice();
  var hits = [];

    if (f != null) rank = f;

/* Two decimals is right for 1.25 kg and catastrophic for 0.002 kg, which rounds to a

/* A batch line is named by the batch itself, never by what was typed to find it.

  if (l.sub && SUBS[l.sub]) return SUBS[l.sub].name;

  var exp = mode==='expand', jump = mode==='switch';

/* ── allergens ──
   Same fourteen, same keys, same words as the recipe sheet and the Food Bible page.

   there silently stopped meeting, and it failed by showing nothing, which reads as
   safe. The person plating is the last pair of eyes before a guest eats it, so this
   is on the station card, not only on the layout nobody chose. */
var ALLERGENS = [
  { k:'gluten',    t:'Gluten' },      { k:'crustacean', t:'Crustaceans' },
  { k:'egg',       t:'Egg' },         { k:'fish',       t:'Fish' },
  { k:'peanut',    t:'Peanuts' },     { k:'soy',        t:'Soya' },
  { k:'milk',      t:'Milk' },        { k:'nuts',       t:'Tree nuts' },
  { k:'celery',    t:'Celery' },      { k:'mustard',    t:'Mustard' },
  { k:'sesame',    t:'Sesame' },      { k:'sulphites',  t:'Sulphites' },

function algName(k){

/* What a component carries: its own ticks, plus everything every batch inside it
   carries — named by the batch, so it can be checked where it was actually ticked
   instead of sending someone hunting through five sheets.

   Walked ALL THE WAY DOWN, not one level. A stock inside a sauce inside a dish
   carries its allergens up to the dish, and stopping at the first level printed a
   short list that reads exactly like a complete one — the create sheet and the Food
   Bible both walked the whole chain and this card did not, so the same dish declared
   sulphites on the floor's page and not on the card of the person plating it. The
   batches are already loaded, however deep (`gather`), so there was never any
   missing data — only a walk that stopped early.

   to know what the batch inside it brings, and he is reading this card, not the dish. */

  var out = [];

  if (!c) return out;

  /* "at, inside via" names both ends: where it is ticked, and which batch on THIS
     card brings it in — so it can be checked in one open instead of five. */
  (c.lines || []).forEach(function(l){
    if (!l.sub || !SUBS[l.sub]) return;
    var via = SUBS[l.sub].name, seen = {};     /* per line, so a batch used twice still names both routes */
    (function walk(id, deep){
      if (!id || seen[id]) return;             /* a ring stops here */
      seen[id] = 1;

        add(k, deep ? s.name + ', inside ' + via : s.name);
      });
      (s.lines || []).forEach(function(x){ if (x.sub) walk(x.sub, true); });
    })(l.sub, false);

     it is inside the sauce — which listed it twice, "from the stock; from the stock,

     open the stock straight from the tabs. Keep the shortest route. */
  out.forEach(function(e){

/* ───── at the pass ─────

/* ───── once it is made ─────

/* ── paper ──

/* ═════════ "I want 12 tiramisu — what do I make?" ═════════

   its own method beside its own quantities, then how it goes together — and it prints as

        (nested.length
          ? '<div class="notscaled"><b>Made with ' + nested.map(function(l){ return esc(SUBS[l.sub].name); }).join(' and ') +
            '.</b> Those are their own recipes — this sheet does not work out how much of them to make.</div>' : '') +
      '</div>' +
      '<div><div class="pch">Method</div>' + stepsHTML(flat(s.method)) +
        /* the production sheet is exactly where this is read: it is the page in the hand
           of the person who has just made the batch and is about to put it away. It sits
           under that batch's own method, not in a list at the end of the sheet — three
           batches with three different shelf lives collected in one box is how the wrong
           one gets read. */
        (String(s.store || '').trim()
          ? '<div class="pch" style="margin-top:14px">Once it is made</div>' +
            '<div class="pstore">' + esc(String(s.store).trim()) + '</div>' : '') +
        ((s.photos || []).length
          ? '<div class="pshot"><img src="' + esc(s.photos[0].u || s.photos[0]) + '" alt="' + esc(s.name) + '">' +
            '<div class="pcap">' + esc(s.name) + '</div></div>' : '') +
      '</div>' +
    '</div></div>';
}
function viewProd(){
  var list = prodList();
  var on = list.filter(function(n){ return prodInc[n.k] !== false; });
  var ph = (R.photos || [])[0];
  var rows = list.map(function(n){
    return '<tr><td class="pn">' + esc(n.s.name) + '</td>' +
      '<td class="pq2">' + show(n.need,n.u).q + ' ' + show(n.need,n.u).u + '</td>' +
      '<td class="px">' + (n.frac == null ? 'no yield on this batch'
          : num(Math.round(n.frac*100)/100) + ' of a batch · one makes ' + show(n.s.makes.qty, n.s.makes.unit).q + ' ' + show(n.s.makes.qty, n.s.makes.unit).u) + '</td>' +
      '<td style="text-align:right"><label class="pinc noprint">' +

  }).join('');

  return '<div class="wrap">' +

      '<button class="btn ghost" id="prodback">&larr; Back to the recipe</button>' +
      '<label class="pinc"><input type="checkbox" id="prodper"' + (prodPer?' checked':'') + '> each recipe on its own page</label>' +

              '<div class="pcap">The finished plate</div></div>' : '') +

      on.map(function(n,i){ return prodBlock(n, i, on.length); }).join('') +
      '<div class="pblk"><div class="pcut"></div>' +

          '<div class="pbh"><div class="pbt"><small>Then put it together</small>' + esc(R.name) + '</div>' +

            : '') + '</div>' +

}

function printSheet(){
  var comps = compList();
  /* `photos` has to be on here, and was not — the same omission that once kept the plated
     dish off the station card. The folder sheet rebuilds the dish as a plain object, and
     anything left out of that object simply does not exist on the page. */
  /* `by` has to be on here for the same reason `photos` did: this block rebuilds the dish
     as a plain object, and anything left out of it does not exist on the printed page. */
  var all = [{k:'dish', c:{name:R.name, lines:R.lines, method:R.method, makes:R.makes, photos:R.photos, by:R.by}}]
    .concat(comps.slice(1).map(function(x){ return {k:x.k, c:SUBS[x.k], inside:x.inside}; }));
  return '<div id="psheet">' + all.map(function(a){
    var onDish = a.k==='dish', c = a.c;
    var used = R.lines.filter(function(l){ return l.sub===a.k; })[0];
    return '<div class="pblock">' +
      '<div class="pkind">'+(onDish?'The dish':'A batch of '+esc(R.name))+'</div>' +
      '<div class="pname">'+esc(c.name)+'</div>' +
      '<div class="pmeta">'+(onDish?esc(R.section)+' · ':'')+'Makes '+esc(amount(c.makes.qty, c.makes.unit))+
        (used?' · one portion takes '+show(used.q,used.u).q+' '+show(used.q,used.u).u
             : a.inside?' · goes into '+esc(a.inside):'') +
        /* On paper this matters more than it does on the screen: a sheet in the folder
           outlives the shift, and whoever picks it up in three months has no other way
           of knowing who to go and ask about it. */
        (c.by ? ' · written by '+esc(c.by) : '')+'</div>' +
      /* The sheet prints what he is looking at. It used to print ×1 whatever was on the
         screen, so a chef scaled to twenty portions, printed, and carried away the recipe
         for one — and nothing on either sheet said they were different.

         Only the part he actually scaled is scaled: the other blocks are one batch as
         written, which is the same rule the screen states. And a scaled sheet SAYS so, at
         the top, in words — a printed page outlives the moment it was printed, and a pile
         of quantities with nothing to say which dish they are for is how a recipe gets
         re-entered wrong months later. */
      (pmulOf(a.k) !== 1
        ? '<div class="pscale">Scaled &times;' + esc(niceNum(pmulOf(a.k))) + ' — ' +
          'every quantity below is multiplied. ' +
          /* plenty of recipes have never had their portions filled in, and "makes
             ______ portions" with a hole in it is worse than not saying it */
          (c.makes && c.makes.qty
            ? 'The recipe as written makes ' + esc(amount(c.makes.qty, c.makes.unit)) + '.'
            : 'These are not the quantities written on the recipe.') + '</div>'
        : '') +
      /* The folder sheet was built without photos at all — the dish and every batch printed
         as words only. It is the page that goes on the section board and into the folder
         somebody learns from, which is exactly where a picture of the finished thing earns
         its ink. Only a real one: a component with no photo prints nothing rather than an
         empty frame. */
      ((c.photos || []).length
        ? '<div class="pfoto"><img src="'+esc(c.photos[0].u || c.photos[0])+'" alt="'+esc(c.name)+'">' +
          '<span class="pfcap">'+(onDish ? 'The plated dish' : 'The finished batch')+'</span></div>'
        : '') +
      '<table class="ing">'+ingRows(c.lines,pmulOf(a.k),false)+'</table>' +
      stepsHTML(flat(c.method)) +
      (platingSteps(c.method).length
        ? '<div class="h" style="font-size:17px;margin:18px 0 6px">Plating</div>' +
          platingSteps(c.method).map(function(x,i){ return '<div class="sstep"><span class="no">'+(i+1)+'</span><span>'+esc(x)+'</span></div>'; }).join('')
        : '') +
      /* On a batch only, and after the steps, because it is what happens when the steps
         are finished. This is the sheet that gets taped up at the section and the one in
         the training folder — both outlive the shift, which is exactly when nobody is
         left to ask how long the thing keeps. */
      (!onDish && String(c.store || '').trim()
        ? '<div class="h" style="font-size:17px;margin:18px 0 6px">Once it is made</div>' +
          '<div class="pstore">' + esc(String(c.store).trim()) + '</div>'
        : '') +
      /* Allergens last on paper, and the names only. Under the dish name they were the
         first thing on the page and the biggest, ahead of the quantities somebody is
         standing there to read; and the sources repeated the same three batch names for
         every allergen. What a printed card has to carry is WHICH — the where is on the
         screen, where it is actually being checked. */
      '<div class="algfoot">' + algBar(a.k) + '</div>' +
    '</div>'; }).join('') + '</div>';
}

/* ── the photos, on the component they belong to ──
   The plated dish and the pickled radish are two different pictures, so the strip
   belongs to whichever component is open, not to the recipe as a whole. Tap one
   and it opens full width where it stands — nothing covers the steps. */
function photoStrip(c){
  var isOpen = (photoOpen === comp);
  var what = comp==='dish' ? 'The plated dish' : 'The finished batch';
  var ph = (c && c.photos) || [];
  if (!ph.length){
    return '<div class="pstrip">' +
      '<button class="frame" data-photo="'+comp+'" disabled>' +
        '<span class="fl">'+esc(what)+'</span>' +

      (i===0 ? '<span class="fh">'+(isOpen?'tap to make it small':'tap to see it big')+'</span>' : '') +
    '</button>'; }).join('') + '</div>';
}

/* ═══ C — guided ═══ */
var gComp='dish', gi=0;
function viewGuided(){
  var c = gComp==='dish' ? {name:R.name,lines:R.lines,method:R.method} : SUBS[gComp];
  var fl=flat(c.method), total=fl.length+1;
  if (gi>total-1) gi=total-1;

  }
  return '<div class="gwrap">' +
    '<div class="tabs noprint">'+compList().map(function(x){
      return '<button data-gcomp="'+x.k+'" class="'+(x.k===gComp?'on':'')+'">'+esc(x.n)+'</button>'; }).join('')+'</div>' +
    '<div class="gbar"><i style="width:'+Math.round((gi/(total-1))*100)+'%"></i></div>'+body+
    '<div class="gnav"><button class="btn ghost" id="gprev"'+(gi===0?' disabled':'')+'>Back</button>' +
      '<button class="btn" id="gnext"'+(gi===total-1?' disabled':'')+'>'+(gi===total-1?'Finished':'Next')+'</button></div>' +
  '</div>';
}

/* ═══ the three doors ═══ */
var VIEWS = [
  { k:'card', n:'A · The card', t:'The card', who:'For the wall, the folder, the section board',
    d:'One scroll, the way a recipe reads on paper, and it prints exactly as it looks. Tap a batch and it opens where it stands, so you never leave the dish to see what is in the dressing. “Cook for 4” rescales every quantity.',
    w:'<b>A — The card.</b> One scroll, the way a recipe reads on paper, and it prints exactly as it looks. Tap a batch line and it opens where it stands. <i>For the wall, the folder, and reading a dish whole.</i>',
    v:viewCard },
  { k:'station', n:'B · The station', t:'The station', who:'Chosen · for a chef de partie, mid-prep',
    d:'The batches are the top line, because a chef de partie makes one of these, not the dish. Ingredients stay on screen while the steps scroll, the photo belongs to whichever one is open, and a batch scales ×2, ×5, ×10.',
    w:'<b>B — The station. This is the one we build.</b> The batches are the top line, because a chef de partie makes <i>one</i> of these, not the dish. Ingredients stay on screen while the steps scroll, the photo belongs to whichever component is open, and a batch scales. <i>For the pass and the section, with a knife in your hand.</i>',
    v:viewStation },
  { k:'guided', n:'C · Guided', t:'Guided', who:'For a commis, first time, on a phone',
    d:'One step filling the screen, starting with what to get out. Big type, two buttons, no way to lose your place.',
    w:'<b>C — Guided.</b> One step, filling the screen, starting with what to get out. Big type, two buttons, no way to lose your place. <i>For a commis cooking it the first time.</i>',
    v:viewGuided },
];
var view = 'home', layout = 'station', mq = '', MENUS = [], menuPick = null;

/* ── the front page: the menu, as it stands in the database ──
   Not a list of layouts. A chef de partie opens this to find a dish, so the
   dishes are the page. What each one is still missing is said on its own row —
   an unfinished recipe is the normal state right now, not a fault. */
function viewHome(){
  var body;
  if (loadErr){
    body = '<div class="load bad"><b>The recipes could not be read.</b><br>' + esc(loadErr) +
      '<br><br>Nothing is lost — this card only reads. Try again in a moment.</div>';
  } else if (busy){
    body = '<div class="load">Reading the recipes…</div>';
  } else if (!MENU.length){
    body = '<div class="load"><b>No dishes saved yet.</b><br>' +
      'The moment a main recipe is saved on the create screen it appears here, ' +
      'with whatever has been written on it so far.</div>';
  } else {
    /* the menu filter comes first, then the search inside it — searching should not
       quietly reach into a menu he is not looking at */
    var pool = menuPick ? MENU.filter(function(d){ return (d.menus||[]).indexOf(menuPick) > -1; }) : MENU;
    var sec = '', shown = findDishes(mq, pool);
    var orphans = MENUS.length ? MENU.filter(function(d){ return !(d.menus||[]).length; }).length : 0;
    body =
      (MENUS.length > 0
        ? '<div class="mbar noprint">' +
            MENUS.map(function(m){
              return '<button class="mtab'+(menuPick===m.id?' on':'')+'" data-mtab="'+m.id+'">'+esc(m.name)+
                (m.running?'<span class="mrun">now</span>':'')+'</button>'; }).join('') +
            '<button class="mtab'+(menuPick===''?' on':'')+'" data-mtab="">Everything</button>' +
          '</div>' +
          /* a dish on no menu is invisible the moment a menu is picked, and silence
             about it is how a dish nobody can find stays lost */
          (orphans && menuPick
            ? '<div class="mnote noprint">'+orphans+' dish'+(orphans===1?' is':'es are')+' on no menu at all — ' +
              'tap <b>Everything</b> to see '+(orphans===1?'it':'them')+'. '+(orphans===1?'It needs':'They need')+
              ' putting on a menu from the create screen.</div>'
            : '')
        : '') +
      '<div class="dfind noprint"><input id="dq" value="'+esc(mq)+'" ' +
        'placeholder="search '+pool.length+' dishes — burrata, vitello, pasta…">' +
        (mq ? '<button class="dclr" id="dclr">Clear</button>' : '') +
        '<span class="dcount">'+(mq ? shown.length+' of '+pool.length : pool.length+' dish'+(pool.length===1?'':'es'))+
          (menuPick ? ' on this menu' : (MENUS.length ? ' — every menu' : ''))+'</span></div>' +
      (!mq && menuPick && !shown.length
        ? '<div class="load"><b>Nothing is on this menu yet.</b><br>' +
          'Open a dish on the create screen and tick this menu, and it appears here.</div>'
        : '') +
      (mq && !shown.length && menuPick ? elsewhereNote(mq) : '') +
      (mq && !shown.length
        ? '<div class="load"><b>No dish matches “'+esc(mq)+'” on this menu.</b><br>' +
          'Every word you type has to be in the name or the section, so fewer words find ' +
          'more — try just “vitello”. If it is not here at all, it has not been written ' +
          'on the create screen yet.</div>'
        : '') +
      '<div class="menu">' + shown.map(function(d){
      /* the section headings are the menu's own order. A search re-ranks the list by
         how well each name fits, so the headings would repeat and lie — while you are
         searching the section rides on the row instead. */
      var head = (!mq && d.section !== sec) ? (sec = d.section, '<div class="msec">' + esc(d.section || 'No section') + '</div>') : '';
      var gaps = [];
      if (!hasAny(d.method, ['mise','method','order','plating'])) gaps.push('no method');
      if (!(d.allAllergens || d.allergens || []).length) gaps.push('no allergens');
      if (!(d.photos || []).length) gaps.push('no photo');
      return head + '<button class="dish" data-open="' + d.id + '">' +
        '<span class="dn">' + esc(d.name) + '</span>' +
        (mq && d.section ? '<span class="dsec">' + esc(d.section) + '</span>' : '') +
        (gaps.length ? '<span class="dgap">' + esc(gaps.join(' · ')) + '</span>'
                     : '<span class="dgap ok">written</span>') +
        '<span class="dgo">Open &rarr;</span></button>';
    }).join('') + '</div>';
  }
  return '<div class="front">' +
    '<div class="eyebrow">Kitchen &nbsp;·&nbsp; recipe card</div>' +
    '<h1 class="lede">Every dish, as the kitchen wrote it.</h1>' +
    '<p class="stand">Nothing on these cards is typed here. Each one is read from the recipe ' +
      'saved on the <b>create screen</b> — change a batch once and every dish that uses it changes ' +
      'with it. <b>No cost appears anywhere.</b></p>' +
    (frozen && SNAP ? '<div class="stale">This link cannot reach the kitchen database, so it is ' +
      'showing the recipes <b>as they stood ' + esc(stamp()) + '</b>. Opened inside the app it is live.</div>' : '') +
    /* the heading is read off the room; a hundred and forty dishes are not */
    '<div class="onpaper">' + body +
      '<div class="foot">Blank photos and unticked allergens mean nobody has written them yet — ' +
        'that is the phase, not a fault. They fill in from the create screen, never from here.</div>' +
    '</div>' +
  '</div>';
}
/* say when the snapshot was taken, in words, not an ISO string */
function stamp(){
  if (!SNAP || !SNAP.at) return 'at build time';
  var d = new Date(SNAP.at);
  if (isNaN(d)) return 'at build time';
  return d.toLocaleDateString(undefined, { day:'numeric', month:'long' }) + ', ' +
         d.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
}
function hasAny(m, keys){
  return keys.some(function(k){ return String((m && m[k]) || '').trim(); });
}

/* NOT called open(). Two reasons, both learned the hard way: `open` is already a
   function on window, and the click handler below declares a local `var open` for the
   batch expander — a `var` hoists to the top of its whole function, so every click was
   reaching an undefined local instead of this, and nothing happened when a dish was
   tapped. Tested from the console it worked perfectly, because the console is a
   different scope. Never name a global after a browser built-in. */
function openDish(id, then){
  busy = true; loadErr = null; view = 'loading'; render();
  loadRecipe(id).then(function(){
    comp = 'dish'; gComp = 'dish'; gi = 0; mult = 1; portions = 1; photoOpen = null;
    prod = false; prodMode = {}; prodInc = {};      /* a new dish starts on its own recipe */
    movedAt = null; movedWhat = null;
    busy = false; view = layout; render(); window.scrollTo(0,0); watch();
    if (typeof then === 'function') then();
  }).catch(function(e){
    busy = false; loadErr = e.message; view = 'home'; render();
  });
}

function render(){
  var root = document.getElementById('root');
  /* the room stands behind the way in and nowhere else — see body.roomstep above */
  document.body.classList.toggle('roomstep', view === 'home');
  document.body.style.setProperty('--room', 'url(venue-murano.jpg)');
  if (view === 'loading'){ root.innerHTML = '<div class="front"><div class="load">Opening the recipe…</div></div>'; return; }
  if (view === 'home'){ root.innerHTML = viewHome(); return; }
  var cur = VIEWS.filter(function(v){ return v.k===view; })[0];
  root.innerHTML =
    '<div class="top"><button class="home" id="home">&larr; All dishes</button>' +
      '<div class="sw">'+VIEWS.map(function(v){
        return '<button data-v="'+v.k+'" class="'+(v.k===view?'on':'')+'">'+esc(v.n)+'</button>'; }).join('')+'</div></div>' +
    (movedAt
      ? '<div class="moved noprint"><b>' + esc(movedWhat || 'This recipe') + ' has been changed</b> — ' +
        esc(when(movedAt)) + '. What is on this card is the older one. ' +
        '<button class="btn" id="reopen">Show the new one</button></div>'
      : '') +
    /* The paragraph that used to sit here — "B — The station. This is the one we build" —
       was written while the three layouts were being chosen between. It is a note from the
       workshop, and it was being read by chefs at the pass. Gone. */
    (prod ? viewProd() : cur.v());
  wireScale();
}
/* the ticks: which recipes come onto the sheet, and whether each gets its own page */
document.addEventListener('change', function(e){
  var el = e.target;
  if (el && el.dataset && el.dataset.pinc !== undefined){
    prodInc[el.dataset.pinc] = el.checked; render(); return;
  }
  if (el && el.id === 'prodper'){
    prodPer = el.checked;
    document.body.classList.toggle('perpage', prodPer);
  }
});
/* The box is typed into, so it must never be redrawn under the fingers — every keystroke
   would put the caret back at the start and "20.5" would go in as "5.02". So the
   quantities are re-rendered on input and this box is left exactly as it is. */
function wireScale(){
  var i = document.getElementById('scaleq');
  if (!i) return;
  i.addEventListener('input', function(){
    var c = current() || {};
    var onD = comp === 'dish';
    var per = (onD && c.makes && c.makes.qty > 0) ? c.makes.qty : 1;
    var v = parseFloat(String(this.value).replace(',', '.'));
    if (!isFinite(v) || v <= 0) return;      /* mid-typing "." or "" — wait for a number */
    setScale(v, onD, per);
    redrawScaled();
  });
  /* leaving it empty or nonsense puts back what is actually being shown */
  i.addEventListener('blur', function(){
    var c = current() || {};
    var onD = comp === 'dish';
    var per = (onD && c.makes && c.makes.qty > 0) ? c.makes.qty : 1;
    var v = parseFloat(String(this.value).replace(',', '.'));
    if (!isFinite(v) || v <= 0){ this.value = niceNum(onD ? mult * per : mult); }
  });
}
/* just the numbers, not the page */
function redrawScaled(){
  var c = current() || {};
  var onD = comp === 'dish';
  var tbl = document.querySelector('.left table.ing') || document.querySelector('table.ing');
  if (tbl) tbl.innerHTML = ingRows(c.lines, mult, onD ? 'switch' : false);
  /* the print sheet is a separate copy of the recipe sitting in the page, and it is only
     built when the whole view renders. Typing in the box redrew the screen and left it
     behind — so the chef read ×20.5, pressed Print, and carried away ×1. */
  var ps = document.getElementById('psheet');
  if (ps) ps.outerHTML = printSheet();
  var note = document.querySelector('.port .scaled');
  var txt = mult !== 1
    ? 'every quantity is ×' + niceNum(mult) + (onD ? '  ·  a batch you open is still one batch' : '')
    : '';
  if (note) note.textContent = txt;
  else if (txt){
    var p = document.querySelector('.port');
    if (p){ var s = document.createElement('span'); s.className = 'scaled'; s.textContent = txt; p.appendChild(s); }
  }
}

/* The whole front page is redrawn on every keystroke, so the box that was typed into
   no longer exists by the time the next letter arrives — put the caret back or the
   second letter goes nowhere. */
document.addEventListener('input', function(e){
  if (!e.target || e.target.id !== 'dq') return;
  var at = e.target.selectionStart;
  mq = e.target.value; render();
  var n = document.getElementById('dq');
  if (n){ n.focus(); try{ n.setSelectionRange(at,at); }catch(_){} }
});

document.addEventListener('click', function(e){
  var t=e.target, b=t.closest?t.closest('button'):null;
  if (b && b.dataset.open){ openDish(b.dataset.open); return; }
  if (b && b.id==='dclr'){ mq=''; render(); var c=document.getElementById('dq'); if (c) c.focus(); return; }
  if (b && b.dataset.mtab !== undefined){ menuPick = b.dataset.mtab; render(); window.scrollTo(0,0); return; }
  if (b && b.id==='reopen'){ var keep = R && R.id; if (keep) openDish(keep); return; }
  /* the search survives going into a dish and coming back — you are usually opening
     two or three of the same five, and re-typing it every time is the annoyance */
  if (b && b.id==='home'){ view='home'; render(); window.scrollTo(0,0); freshen(); return; }
  if (b && b.dataset.v){ view=layout=b.dataset.v; render(); window.scrollTo(0,0); return; }

  if (b && b.dataset.p){ portions=Math.max(1,Math.min(50,portions+(+b.dataset.p))); render(); return; }
  if (b && b.id==='print'){ window.print(); return; }
  if (b && b.dataset.print){
    document.body.classList.toggle('printall', b.dataset.print==='all');
    window.print();
    return;
  }
  var row=t.closest?t.closest('tr.sub'):null;
  if (row && view==='card'){
    var pane=document.getElementById('sp-'+row.dataset.i), car=row.querySelector('.caret');
    if (pane){ var wasOpen=pane.style.display!=='none'; pane.style.display=wasOpen?'none':'';
      if (car) car.innerHTML = wasOpen ? '&#9654;' : '&#9660;'; }
    return;
  }
  if (b && b.dataset.comp){ comp=b.dataset.comp; mult=1; photoOpen=null; render(); window.scrollTo(0,0); return; }
  var jr = t.closest?t.closest('tr[data-jump]'):null;
  if (jr){ comp=jr.dataset.jump; mult=1; photoOpen=null; render(); window.scrollTo(0,0); return; }
  /* ── into and out of the production sheet ── */
  if (b && b.id === 'toprod'){ prod = true; render(); window.scrollTo(0,0); return; }
  if (b && b.id === 'prodback'){ prod = false; render(); window.scrollTo(0,0); return; }
  if (b && b.id === 'prodprint'){ document.body.classList.remove('printall'); window.print(); return; }
  var pm = t.closest ? t.closest('[data-pm]') : null;
  if (pm){ prodMode[pm.dataset.pk] = pm.dataset.pm; render(); return; }
  /* − and + still work with a thumb, and they step in the units he is looking at: on a
     dish that is one portion, on a batch one batch. Below 1 they go in halves, so half a
     batch is reachable by tapping and not only by typing. */
  if (b && b.dataset.m){
    var dir = +b.dataset.m;
    var cNow = current() || {};
    var onD = comp === 'dish';
    var per = (onD && cNow.makes && cNow.makes.qty > 0) ? cNow.makes.qty : 1;
    var cur = onD ? mult * per : mult;
    var stepBy = (cur <= 1 && dir < 0) || (cur < 1 && dir > 0) ? 0.5 : 1;
    var next = Math.round((cur + dir * stepBy) * 1000) / 1000;
    setScale(next, onD, per);
    render(); return;
  }
  if (b && b.dataset.photo){ photoOpen = (photoOpen===b.dataset.photo) ? null : b.dataset.photo; render(); return; }

  if (b && b.dataset.gcomp){ gComp=b.dataset.gcomp; gi=0; render(); window.scrollTo(0,0); return; }
  if (b && b.id==='gnext'){ gi++; render(); window.scrollTo(0,0); return; }
  if (b && b.id==='gprev'){ gi=Math.max(0,gi-1); render(); window.scrollTo(0,0); return; }
});

/* ── opened from the Recipes module ──
   `?id=` goes straight to that dish's station card; `&embed=1` drops the "All dishes"
   button because the module around it already owns that. Opened on its own, neither
   fires and the page still starts on the menu. */
var Q = new URLSearchParams(location.search);
/* ?printall=1 opens on the folder page — the dish and every batch, the thing that goes on
   the section board. A link of its own, the same as ?make= for the production sheet, so it
   can be bookmarked or sent to a printer without walking through the card. */
if (Q.get('printall') === '1') document.body.classList.add('printall');
if (Q.get('embed') === '1') document.documentElement.classList.add('embed');

busy = true; render();
loadMenu()
  .then(function(){
    busy = false; watch();
    /* ?make=12 opens straight onto the production sheet for twelve. It is how the sheet
       gets a link of its own — bookmarked at the section, sent to the pastry chef, or
       opened and printed without walking through the card first. */
    var make = parseFloat(String(Q.get('make') || '').replace(',', '.'));
    if (Q.get('id')){
      openDish(Q.get('id'), function(){
        if (isFinite(make) && make > 0){
          setScale(make, true, (R.makes && R.makes.qty > 0) ? R.makes.qty : 1);
          if (prodList().length) prod = true;
          render();
        }
      });
    } else render();
  })
  .catch(function(e){ busy = false; loadErr = e.message; render(); });
</script>
