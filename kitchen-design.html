<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kitchen Design · Roberto's Kitchen</title>
<script src="dev-guard.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="kd-shim.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');
:root{--vino:#410207;--sabbia:#e1d3c2;--ink:#2a1a10;--cream:#f5ede0;--ground:#efe7db;--card:#fffaf2;--line:#dccdb9;--muted:#5f4c3d;--oro:#ba9b02;--err:#8f1d12;--err-bg:#fbe9e6;--ok:#2f5d1e;
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'DM Sans',-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px}
button,input,textarea,select{font-family:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 0 48px}
.bar{background:var(--vino);color:var(--cream);padding:14px 16px;display:flex;align-items:center;gap:12px}
.bar h1{margin:0;font:600 24px var(--serif);flex:1}
.bar a{color:var(--cream);font-size:14px;text-decoration:none;border:1px solid rgba(245,237,224,.5);border-radius:8px;padding:8px 12px}
.pad{padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.card .t{flex:1;min-width:200px}
.card .n{font:600 21px var(--serif)}
.card .m{font-size:13px;color:var(--muted);margin-top:2px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--vino);background:#fff;color:var(--vino);font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.pri{background:var(--vino);color:var(--cream)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:16px}
.msg{margin:10px 0;font-size:14px}.msg.err{color:var(--err);background:var(--err-bg);padding:8px 10px;border-radius:8px}.msg.ok{color:var(--ok)}
.hint{color:var(--muted);font-size:14px;margin:0 0 14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><h1>Kitchen Design</h1><a href="index.html">Home</a></div>
  <div class="pad">
    <p class="hint">Each project keeps its own plan, saved versions, accepted issues and requests. The equipment bank is shared by all projects.</p>
    <div id="list"><p class="hint">Loading…</p></div>
    <div id="newBox" style="display:none" class="card" style="display:none">
      <div style="width:100%">
        <b>New project</b>
        <label for="npName">Name</label><input id="npName" placeholder="For example: Dubai test kitchen">
        <label for="npPlace">Place</label><input id="npPlace" placeholder="City">
        <label for="npFrom">Start from</label><select id="npFrom"><option value="">A blank plan</option></select>
        <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" id="npGo">Create project</button><button class="btn" id="npNo">Cancel</button></div>
        <div id="npMsg" class="msg"></div>
      </div>
    </div>
    <button class="btn pri" id="newBtn">New project</button>
  </div>
</div>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  var projects=[];
  function fmt(t){try{return new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'Asia/Dubai'})}catch(e){return ''}}
  function render(){
    var l=$('list');
    if(!projects.length){l.innerHTML='<p class="hint">No project yet.</p>';return}
    l.innerHTML=projects.map(function(p){
      return '<div class="card"><div class="t"><div class="n">'+esc(p.name)+'</div><div class="m">'+esc(p.place||'')+(p.place?' · ':'')+'last changed '+fmt(p.updated_at)+'</div>'+(p.notes?'<div class="m">'+esc(p.notes)+'</div>':'')+'</div><a class="btn pri" href="kitchen-design-plan.html?p='+encodeURIComponent(p.id)+'">Open</a></div>';
    }).join('');
    $('npFrom').innerHTML='<option value="">A blank plan</option>'+projects.map(function(p){return '<option value="'+esc(p.id)+'">A copy of: '+esc(p.name)+'</option>'}).join('');
  }
  function load(){
    KD.rpc('kd_projects_list',{}).then(function(r){
      if(r.error){$('list').innerHTML='<p class="msg err">Could not load the projects ('+esc(r.error.message||r.error.code||'error')+').</p>';return}
      projects=r.data||[];render();
    });
  }
  $('newBtn').onclick=function(){$('newBox').style.display='flex';$('newBtn').style.display='none';$('npName').focus()};
  $('npNo').onclick=function(){$('newBox').style.display='none';$('newBtn').style.display=''};
  $('npGo').onclick=function(){
    var name=$('npName').value.trim(),from=$('npFrom').value,m=$('npMsg');
    if(name.length<2){m.className='msg err';m.textContent='Give the project a name.';return}
    m.className='msg';m.textContent='Creating…';$('npGo').disabled=true;
    KD.rpc('kd_project_create',{p_name:name,p_place:$('npPlace').value.trim()}).then(function(r){
      if(r.error||!r.data)throw (r.error||new Error('not created'));
      var id=r.data.id;
      if(!from)return id;
      return KD.rpc('kd_doc_get',{p_project:from,p_coll:'plans',p_id:'main'}).then(function(q){
        if(q.error)throw q.error;
        if(!q.data)return id;
        var d=Object.assign({},q.data.data,{rev:1,at:Date.now()});
        return KD.rpc('kd_doc_put',{p_project:id,p_coll:'plans',p_id:'main',p_data:d}).then(function(w){if(w.error)throw w.error;return id});
      });
    }).then(function(id){location.href='kitchen-design-plan.html?p='+encodeURIComponent(id)}).catch(function(e){
      $('npGo').disabled=false;m.className='msg err';m.textContent=(window.DEV_READ_ONLY?'Writes are locked on the test site. ':'')+'Could not create the project ('+(e&&e.message||'error')+').';
    });
  };
  load();
})();
</script>
</body>
</html>
